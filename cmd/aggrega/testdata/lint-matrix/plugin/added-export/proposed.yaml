apiVersion: aggrega.ai/v1alpha1
kind: Plugin
metadata:
  name: partner/custom-renderer
  version: 1.0.0
  description: A partner-authored rendering plugin.
spec:
  pluginType: provider
  abiVersion: v1alpha1
  targets:
    - helm
  runtime:
    maxMemoryPages: 256
    timeoutMs: 3000
  exports:
    - name: render_node
      operates: emit
      scope: own
    - name: link_publish
      operates: patch
      scope: host
