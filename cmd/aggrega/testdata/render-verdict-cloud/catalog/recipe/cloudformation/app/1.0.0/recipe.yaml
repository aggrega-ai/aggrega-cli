apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: app
  version: 1.0.0
spec:
  capability: cloudformation
  implements: acme/compute/app:1.0.0
  artifacts:
    template.yaml: |
      Resources:
        {{ capitalizedWords .context.instance_id }}:
          Type: AWS::RDS::DBInstance
          Properties:
            Engine: postgres
            StorageEncrypted: {{ .infra.storage_encrypted }}
