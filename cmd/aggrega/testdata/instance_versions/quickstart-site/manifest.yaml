# Maps the server type at the version the Compose Recipe implements, as the
# quickstart's own Manifest maps it.
apiVersion: aggrega.ai/v1beta1
kind: Manifest
metadata:
  name: quickstart-site-compose
  version: "1.0.0"
spec:
  mappings:
    components:
      type:
        core/compute/server:1.0.0: compose/server:1.0.0
