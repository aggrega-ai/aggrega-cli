# The Compose realization of example/model:1.0.0, written for that version alone.
apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: model
  version: "1.0.0"
spec:
  capability: compose
  implements: example/model:1.0.0
  provides:
    host: "{{ .context.instance_id }}"
  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    containers:
      main:
        image: registry.example.invalid/model:1.0.0
