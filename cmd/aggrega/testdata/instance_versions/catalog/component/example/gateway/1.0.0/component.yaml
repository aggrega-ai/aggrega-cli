# A gateway reaching models through one socket. At this version each connection
# on the socket carries a slot named credential.
apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: example/gateway
  version: "1.0.0"
  labels:
    component.aggrega.ai/type: server
spec:
  usesSchema:
    models:
      selector: "component.aggrega.ai/category=model"
      featuresSchema:
        credential:
          description: The attachment a connection to a model carries.
  schema:
    provides:
      host: { type: string, required: true }
