apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: example-unrelated-recipe
  version: "1.0.0"
spec:
  capability: helm
  implements: example/something-else
  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    replicas: 1
    containers:
      main:
        image: something-else:latest
        ports:
          web: 9090
