apiVersion: aggrega.ai/v1alpha1
kind: Manifest
metadata:
  name: per-provider-only-manifest
  version: "1.0.0"
spec:
  # core/compute/api-server has NO flat entry, so nothing outranks the
  # per-provider entry below and resolution reaches it. Guards the direction a
  # corpus of newly-refused input cannot see: narrowing when a flat mapping
  # wins must not narrow when there is no flat mapping to win.
  mappings:
    components:
      type:
        core/compute/web-ui: helm-web-ui-synthesized-with-artifacts:1.0.0
        core/datastore/postgres: helm-postgres-synthesized-with-artifacts:1.0.0
    features:
      type:
        core/k8s-dns-resolver: k8s-dns-patcher:1.0.0
    helm:
      components:
        type:
          core/compute/api-server: helm-api-server-synthesized-with-artifacts:1.0.0
