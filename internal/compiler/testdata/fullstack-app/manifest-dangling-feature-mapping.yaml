apiVersion: aggrega.ai/v1alpha1
kind: Manifest
metadata:
  name: dangling-feature-mapping-manifest
  version: "1.0.0"
spec:
  # The Feature analogue of manifest-dangling-component-mapping.yaml:
  # core/k8s-dns-resolver maps to a FeatureRecipe that is NOT in this catalog,
  # so the feature join owes the same verdict as the component join.
  mappings:
    components:
      type:
        core/compute/api-server: helm-api-server-synthesized-with-artifacts:1.0.0
        core/compute/web-ui: helm-web-ui-synthesized-with-artifacts:1.0.0
        core/datastore/postgres: helm-postgres-synthesized-with-artifacts:1.0.0
    features:
      type:
        core/k8s-dns-resolver: k8s-dns-patcher-absent-from-catalog:1.0.0
