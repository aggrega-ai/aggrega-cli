apiVersion: v1
kind: Service
metadata:
  name: data-zdmain-db-db
  namespace: database-zone
  labels:
    aggrega.ai/aggregate-name: fullstack-app
    aggrega.ai/compiler-version: 0.1.0
    aggrega.ai/component-id: data-zdmain-db
    aggrega.ai/environment: production
    aggrega.ai/provider: helm
    aggrega.ai/provider-version: 1.0.0
    app: data-zdmain-db
    app.kubernetes.io/name: data-zdmain-db
  annotations:
    aggrega.ai/boundary-path: data-ns
    aggrega.ai/recipe-uri: helm-postgres-synthesized-with-artifacts:1.0.0
spec:
  type: ClusterIP
  selector:
    app: data-zdmain-db
  ports:
    - name: db
      port: 5432
      targetPort: db
