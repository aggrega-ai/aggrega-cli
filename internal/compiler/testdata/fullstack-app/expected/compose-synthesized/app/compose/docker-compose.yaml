services:
  api:
    image: api-server:latest
    environment:
      PORT: "8080"
    labels:
      aggrega.ai/aggregate-name: fullstack-app-compose-synthesized
      aggrega.ai/boundary-path: app
      aggrega.ai/compiler-version: 0.1.0
      aggrega.ai/component-id: api
      aggrega.ai/environment: production
      aggrega.ai/recipe-uri: compose-api-synthesized:1.0.0
    networks:
      - dist_app_compose
    depends_on:
      - db
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: app
    labels:
      aggrega.ai/aggregate-name: fullstack-app-compose-synthesized
      aggrega.ai/boundary-path: app
      aggrega.ai/compiler-version: 0.1.0
      aggrega.ai/component-id: db
      aggrega.ai/environment: production
      aggrega.ai/recipe-uri: compose-db-synthesized:1.0.0
    networks:
      - dist_app_compose
networks:
  dist_app_compose: {}
