apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: backend-zone
  labels:
    app: backend
    aggrega.ai/aggregate-name: fullstack-app
    aggrega.ai/compiler-version: 0.1.0
    aggrega.ai/component-id: backend
    aggrega.ai/environment: production
    aggrega.ai/provider: helm
    app.kubernetes.io/name: backend
  annotations:
    aggrega.ai/boundary-path: backend-ns
    aggrega.ai/recipe-uri: "helm-api-server-sourced-with-artifacts:1.0.0"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: api-server:latest
          ports:
            - containerPort: 8082
          env:
            - name: PORT
              value: "8082"
