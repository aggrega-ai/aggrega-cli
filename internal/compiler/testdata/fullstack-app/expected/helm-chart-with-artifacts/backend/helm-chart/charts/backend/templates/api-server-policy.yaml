apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  labels:
    aggrega.ai/aggregate-name: fullstack-app
    aggrega.ai/compiler-version: 0.1.0
    aggrega.ai/component-id: backend
    aggrega.ai/environment: production
    app.kubernetes.io/name: backend
  annotations:
    aggrega.ai/boundary-path: backend-ns
    aggrega.ai/recipe-uri: helm-api-server-chart-with-artifacts:1.0.0
  name: backend-pdb
  namespace: {{ .Release.Namespace }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: backend
