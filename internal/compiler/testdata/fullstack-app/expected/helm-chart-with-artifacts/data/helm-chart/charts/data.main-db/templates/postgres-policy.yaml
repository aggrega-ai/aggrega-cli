apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  labels:
    aggrega.ai/aggregate-name: fullstack-app
    aggrega.ai/boundary-path: data-ns
    aggrega.ai/compiler-version: 0.1.0
    aggrega.ai/component-id: data.main-db
    aggrega.ai/environment: production
    aggrega.ai/recipe-uri: helm-postgres-chart-with-artifacts:1.0.0
    app.kubernetes.io/name: data.main-db
  name: data.main-db-pdb
  namespace: {{ .Release.Namespace }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: data.main-db
