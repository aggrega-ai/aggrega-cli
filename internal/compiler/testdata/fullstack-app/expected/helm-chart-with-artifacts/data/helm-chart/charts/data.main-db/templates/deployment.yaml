apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
        - name: {{ .Release.Name }}
          image: {{ .Values.image }}
          {{- with .Values.ports }}
          ports:
            {{- range . }}
            - containerPort: {{ (split ":" .)._1 }}
            {{- end }}
          {{- end }}
          {{- with .Values.environment }}
          env:
            {{- range $k, $v := . }}
            - name: {{ $k }}
              value: "{{ $v }}"
            {{- end }}
          {{- end }}
