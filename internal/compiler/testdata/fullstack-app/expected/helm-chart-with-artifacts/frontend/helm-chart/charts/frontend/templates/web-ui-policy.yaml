apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  labels:
    aggrega.ai/aggregate-name: fullstack-app
    aggrega.ai/boundary-path: frontend-ns
    aggrega.ai/compiler-version: 0.1.0
    aggrega.ai/component-id: frontend
    aggrega.ai/environment: production
    aggrega.ai/recipe-uri: helm-web-ui-chart-with-artifacts:1.0.0
    app.kubernetes.io/name: frontend
  name: frontend-pdb
  namespace: {{ .Release.Namespace }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: frontend
