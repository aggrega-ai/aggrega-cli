services:
  overlays:
    image: busybox:latest
    labels:
      aggrega.ai/aggregate-name: fullstack-app-compose-with-artifacts
      aggrega.ai/boundary-path: compose-app
      aggrega.ai/compiler-version: 0.1.0
      aggrega.ai/component-id: overlays
      aggrega.ai/environment: production
      aggrega.ai/provider: compose
      aggrega.ai/provider-version: 1.0.0
      aggrega.ai/recipe-uri: compose-raw-fragments-with-artifacts:1.0.0
    networks:
      - dist-zscompose-app-zscompose
volumes:
  app-overlays-cache:
    driver: local
  app-overlays-data:
    driver: local
networks:
  dist-zscompose-app-zscompose: {}
