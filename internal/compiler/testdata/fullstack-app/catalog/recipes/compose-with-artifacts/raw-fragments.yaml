apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: compose-raw-fragments-with-artifacts
  version: "1.0.0"
spec:
  capability: compose
  implements: core/raw/manifest
  # This Recipe is the artifacts-ALONGSIDE case: a workload and an
  # artifacts: block in one Recipe, so the fixture covers a node whose
  # output is the sum of two input kinds. The artifact emits a raw compose
  # fragment for declarative volume topology; the workload is what makes this
  # case distinct from an artifacts-only one, not a requirement the artifact
  # imposes. It declares no network: the assembled file's networks are the
  # ones the compose provider derives, and a fragment's own networks: entry
  # halts the build.
  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    containers:
      placeholder:
        image: busybox:latest
  artifacts:
    volume-overlay.yaml: |
      volumes:
        {{ .values.name }}-data:
          driver: local
        {{ .values.name }}-cache:
          driver: local
