apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: compose-raw-fragments-with-artifacts
  version: "1.0.0"
spec:
  capability: compose
  implements: core/raw/manifest
  # This Recipe is the artifacts-ALONGSIDE case: a workload and an
  # artifacts: block in one Recipe, so the fixture covers a node whose
  # output is the sum of two input kinds. The artifacts emit raw compose
  # fragments for declarative network and volume topology; the workload
  # is what makes this case distinct from an artifacts-only one, not a
  # requirement the artifacts impose.
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    containers:
      placeholder:
        image: busybox:latest
  artifacts:
    network-overlay.yaml: |
      networks:
        {{ .values.name }}-front:
          driver: bridge
        {{ .values.name }}-back:
          driver: bridge
    volume-overlay.yaml: |
      volumes:
        {{ .values.name }}-data:
          driver: local
        {{ .values.name }}-cache:
          driver: local
