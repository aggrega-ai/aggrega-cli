apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: helm-web-ui-sourced
  version: "1.0.0"
spec:
  capability: helm
  implements: core/compute/web-ui
  source: ./charts/web-ui
  provides:
    # The chart's own Service is named after the release name, so the address a
    # consumer dials is built from the name this target renders that chart under
    # rather than from the node's identity. The two are written in different
    # alphabets and differ for an identity carrying an underscore or a capital.
    host: "{{ .context.rendered_name }}.svc.cluster.local"
    service_port: "{{ optional .infra `port` 3000 }}"
  locals:
    primary_compute: web
  valuesMapping: |
    {
      "image": "web-ui:latest",
      "replicas": {{ optional .infra `replicas` 1 }},
      "ports": ["{{ optional .infra `port` 3000 }}:{{ optional .infra `port` 3000 }}"],
      "environment": {
        "PORT": "{{ optional .infra `port` 3000 }}"
        {{- if .context.inject.env.API_HOST }},
        "API_HOST": "{{ .context.inject.env.API_HOST }}"
        {{- end }}
        {{- if .context.inject.env.API_PORT }},
        "API_PORT": "{{ .context.inject.env.API_PORT }}"
        {{- end }}
      }
    }
