apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: helm-postgres-sourced
  version: "1.0.0"
spec:
  target: helm
  implements: core/datastore/postgres
  source: ./charts/postgres
  provides:
    host: "{{ .context.instance_id }}.svc.cluster.local"
    service_port: "5432"
  locals:
    primary_compute: postgres
  valuesMapping: |
    {
      "image": "postgres:15",
      "replicas": {{ optional .infra `replicas` 1 }},
      "ports": ["5432:5432"]
    }
