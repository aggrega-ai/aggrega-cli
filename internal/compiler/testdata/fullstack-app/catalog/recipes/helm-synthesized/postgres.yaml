apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: helm-postgres-synthesized
  version: "1.0.0"
spec:
  capability: helm
  implements: core/datastore/postgres
  provides:
    host: "{{ .context.instance_id }}.svc.cluster.local"
    service_port: "5432"
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    replicas: {{ optional .infra `replicas` 1 }}
    containers:
      main:
        image: postgres:15
        ports:
          db: 5432
        variables:
          POSTGRES_DB: "{{ .values.database_name }}"
    services:
      db:
        type: ClusterIP
        ports:
          db: 5432
