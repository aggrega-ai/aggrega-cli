apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: helm-web-ui-synthesized
  version: "1.0.0"
spec:
  capability: helm
  implements: core/compute/web-ui
  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    replicas: {{ optional .infra `replicas` 1 }}
    containers:
      main:
        image: web-ui:latest
        ports:
          web: {{ optional .infra `port` 3000 }}
        variables:
          PORT: "{{ optional .infra `port` 3000 }}"
          {{- range $k, $v := .context.inject.env }}
          {{ $k }}: "{{ $v }}"
          {{- end }}
    services:
      web:
        type: ClusterIP
        ports:
          web: {{ optional .infra `port` 3000 }}
