apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: helm-api-server-chart-sourced
  version: "1.0.0"
spec:
  provider: helm-chart
  implements: core/server/api-server
  source: ./charts/api-server
  provides:
    host: "{{ .context.instance_id }}.svc.cluster.local"
    service_port: "{{ .infra.port | default 8080 }}"
  locals:
    primary_compute: api
  valuesMapping: |
    {
      "image": "api-server:latest",
      "replicas": {{ .infra.replicas | default 1 }},
      "ports": ["{{ .infra.port | default 8080 }}:{{ .infra.port | default 8080 }}"],
      "environment": {
        "PORT": "{{ .infra.port | default 8080 }}"
      }
    }
