apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: helm-api-server-sourced-with-artifacts
  version: "1.0.0"
spec:
  capability: helm
  implements: core/compute/api-server
  source: ./charts/api-server
  provides:
    # The chart's own Service is named after the release name, so the address a
    # consumer dials is built from the name this target renders that chart under
    # rather than from the node's identity. The two are written in different
    # alphabets and differ for an identity carrying an underscore or a capital.
    host: "{{ .context.rendered_name }}.svc.cluster.local"
    service_port: "{{ optional .infra `port` 8080 }}"
  locals:
    primary_compute: api
  valuesMapping: |
    {
      "image": "api-server:latest",
      "replicas": {{ optional .infra `replicas` 1 }},
      "ports": ["{{ optional .infra `port` 8080 }}:{{ optional .infra `port` 8080 }}"],
      "environment": {
        "PORT": "{{ optional .infra `port` 8080 }}"
      }
    }
  artifacts:
    app-config.yaml: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: {{ .context.instance_id }}-app-config
      data:
        SERVICE: {{ .context.instance_id }}
        ENV: production
