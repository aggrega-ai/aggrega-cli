apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: helm-postgres-sourced-with-artifacts
  version: "1.0.0"
spec:
  capability: helm
  implements: core/datastore/postgres
  source: ./charts/postgres
  provides:
    # The chart's own Service is named after the release name, so the address a
    # consumer dials is built from the name this target renders that chart under
    # rather than from the node's identity. The two are written in different
    # alphabets and differ for an identity carrying an underscore or a capital.
    host: "{{ .context.rendered_name }}.svc.cluster.local"
    service_port: "5432"
  locals:
    primary_compute: postgres
  valuesMapping: |
    {
      "image": "postgres:15",
      "replicas": {{ optional .infra `replicas` 1 }},
      "ports": ["5432:5432"]
    }
  artifacts:
    db-init.yaml: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: {{ .context.instance_id }}-init
      data:
        DATABASE: {{ .values.database_name }}
