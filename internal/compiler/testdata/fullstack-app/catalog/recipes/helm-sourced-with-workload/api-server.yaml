apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: helm-api-server-sourced-with-workload
  version: "1.0.0"
  description: >
    The api-server rendered by both of the helm provider's node-scoped paths at
    once: a vendored chart supplies the base file set, and a Workload alongside it
    is synthesized into further manifests. The two outputs are added together, so
    this node's declared input kinds are sourced AND synthesized — which is what
    makes it the shape a per-kind reading of the node has to get right.
spec:
  capability: helm
  implements: core/compute/api-server
  source: ./charts/api-server
  provides:
    # This node emits two differently named sets of resources, and the published
    # address names the one a consumer dials: the vendored chart's own Service,
    # named after the release name this target renders that chart under. The
    # manifests synthesized from the workload beside it are named after the
    # node's identity instead, which is what `.context.instance_id` carries —
    # so the two names are both correct and neither stands in for the other.
    host: "{{ .context.rendered_name }}.svc.cluster.local"
    service_port: "{{ optional .infra `port` 8080 }}"
  locals:
    primary_compute: api
  valuesMapping: |
    {
      "image": "api-server:latest",
      "replicas": {{ optional .infra `replicas` 1 }},
      "ports": ["{{ optional .infra `port` 8080 }}:{{ optional .infra `port` 8080 }}"],
      "environment": {
        "PORT": "{{ optional .infra `port` 8080 }}"
      }
    }
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    replicas: {{ optional .infra `replicas` 1 }}
    containers:
      sidecar:
        image: api-sidecar:latest
        ports:
          admin: 9090
