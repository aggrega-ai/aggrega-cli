apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: helm-web-ui-chart-with-artifacts
  version: "1.0.0"
spec:
  provider: helm-chart
  implements: core/server/web-ui
  source: ./charts/web-ui
  artifacts:
    web-ui-policy.yaml:
      $import: ./extras/web-ui-policy.yaml
  provides:
    host: "{{ .context.instance_id }}.svc.cluster.local"
    service_port: "{{ .infra.port }}"
  locals:
    primary_compute: web
  valuesMapping: |
    {
      "image": "web-ui:latest",
      "replicas": {{ .infra.replicas | default 1 }},
      "ports": ["{{ .infra.port }}:{{ .infra.port }}"],
      "environment": {
        "PORT": "{{ .infra.port }}"
        {{- if .context.inject.env.API_HOST }},
        "API_HOST": "{{ .context.inject.env.API_HOST }}"
        {{- end }}
        {{- if .context.inject.env.API_PORT }},
        "API_PORT": "{{ .context.inject.env.API_PORT }}"
        {{- end }}
      }
    }
