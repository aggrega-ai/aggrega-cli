apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: helm-postgres-chart-with-artifacts
  version: "1.0.0"
spec:
  provider: helm-chart
  implements: core/datastore/postgres
  source: ./charts/postgres
  artifacts:
    postgres-policy.yaml:
      $import: ./extras/postgres-policy.yaml
  provides:
    host: "{{ .context.instance_id }}.svc.cluster.local"
    service_port: "5432"
  locals:
    primary_compute: postgres
  valuesMapping: |
    {
      "image": "postgres:15",
      "replicas": {{ optional .infra `replicas` 1 }},
      "ports": ["5432:5432"]
    }
