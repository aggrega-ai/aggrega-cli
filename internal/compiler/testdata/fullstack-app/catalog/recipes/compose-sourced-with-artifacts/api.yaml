apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: compose-api-sourced-with-artifacts
  version: "1.0.0"
spec:
  capability: compose
  implements: core/compute/api-server
  source: ./sources/api.yaml
  provides:
    host: "{{ .context.instance_id }}"
    service_port: "{{ optional .infra `port` 8080 }}"
  valuesMapping: |
    {
      "services": {
        "api": {
          "environment": {
            "PORT": "{{ optional .infra `port` 8080 }}"
            {{- range $k, $v := .context.inject.env }},
            "{{ $k }}": "{{ $v }}"
            {{- end }}
          }
        }
      }
    }
