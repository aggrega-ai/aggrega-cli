apiVersion: aggrega.ai/v1alpha1
kind: Provider
metadata:
  name: helm
  version: "1.0.0"
spec:
  # workloadSchema documents how the aggrega.ai/v1alpha1 Workload kind
  # translates to helm output. Today the field acts as a presence flag
  # (non-empty = Workload synthesis supported); the body is a placeholder
  # JSON Schema that becomes executable input to Wasm translators in a
  # future iteration.
  workloadSchema: |
    type: object
    additionalProperties: true
