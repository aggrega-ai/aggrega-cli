apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/compute/web-ui
  version: "1.0.0"
  labels:
    component.aggrega.ai/type: "server"
spec:
  inject: ["env"]
  usesSchema:
    apis:
      selector: "component.aggrega.ai/type=server"
      inject: ["env"]
  schema:
    infra:
      port: { type: integer, default: 3000 }
      replicas: { type: integer, default: 1 }
