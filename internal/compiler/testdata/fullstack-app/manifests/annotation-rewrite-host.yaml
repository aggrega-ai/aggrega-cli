apiVersion: aggrega.ai/v1alpha1
kind: Manifest
metadata:
  name: annotation-rewrite-host-manifest
  version: "1.0.0"
spec:
  mappings:
    components:
      type:
        core/compute/api-server: helm-api-server-synthesized:1.0.0
        core/compute/web-ui: helm-web-ui-synthesized:1.0.0
        core/datastore/postgres: helm-postgres-synthesized:1.0.0
    features:
      type:
        feature.myco/rewrite-host: rewrite-host-patcher:1.0.0
      annotations:
        feature.myco/rewrite-host:
          feature: "feature.myco/rewrite-host"
          maps:
            infra:
              - upstream
