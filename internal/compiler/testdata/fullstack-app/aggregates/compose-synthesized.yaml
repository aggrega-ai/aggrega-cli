apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: fullstack-app-compose-synthesized
  version: "1.0.0"
spec:
  components:
    api:
      type: core/compute/api-server
      uses:
        databases:
          - db
    db:
      type: core/datastore/postgres
      values:
        database_name: app
