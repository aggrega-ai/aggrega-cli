apiVersion: aggrega.ai/v1alpha1
kind: Aggregate
metadata:
  name: fullstack-app-annotation-aggregate-override
  version: "1.0.0"
spec:
  subsystems:
    data:
      annotations:
        db-pool: "shared-db"
      components:
        reader:
          type: core/server/web-ui
        writer:
          type: core/server/web-ui
        admin:
          type: core/server/web-ui
          annotations:
            db-pool: "admin-db"
