apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: fullstack-app-annotation-aggregate-override
  version: "1.0.0"
spec:
  subsystems:
    data:
      components:
        reader:
          type: core/compute/web-ui
          features:
            db-pool:
              type: feature.myco/db-pool
              values:
                db_name: "shared-db"
        writer:
          type: core/compute/web-ui
          features:
            db-pool:
              type: feature.myco/db-pool
              values:
                db_name: "shared-db"
        admin:
          type: core/compute/web-ui
          features:
            db-pool:
              type: feature.myco/db-pool
              values:
                db_name: "admin-db"
