apiVersion: aggrega.ai/v1alpha1
kind: Release
metadata:
  name: annotation-cross-side-explicit
  environment: test
  version: "1.0.0"
spec:
  aggregate: ../aggregates/annotation-cross-side-explicit.yaml
  manifest: ../manifests/annotation-cross-side.yaml
  boundaries:
    db-ns:
      directory: ./dist/db
      annotations:
        aggrega.ai/namespace: "db-zone"
      components:
        dbclient:
          features:
            db-pool:
              type: feature.myco/db-pool
              infra:
                pool_size: 20
