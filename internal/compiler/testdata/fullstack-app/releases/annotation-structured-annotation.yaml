apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: annotation-structured-annotation
  environment: test
  version: "1.0.0"
spec:
  aggregate: ../aggregates/annotation-structured.yaml
  manifest: ../manifests/annotation-structured.yaml
  boundaries:
    db-ns:
      directory: ./dist/db
      annotations:
        aggrega.ai/namespace: "db-zone"
      components:
        dbclient:
          annotations:
            feature.myco/db-pool:
              pool_size: 20
              max_connections: 100
