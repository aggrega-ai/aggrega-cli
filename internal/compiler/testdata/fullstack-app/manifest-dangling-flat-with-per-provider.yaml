apiVersion: aggrega.ai/v1alpha1
kind: Manifest
metadata:
  name: dangling-flat-with-per-provider-manifest
  version: "1.0.0"
spec:
  # core/compute/api-server is mapped twice on purpose: the flat entry names a
  # Recipe that is NOT in this catalog, and the per-provider entry below names
  # one that is. A flat mapping wins on existence, so the flat entry is the
  # author's answer for this type and its unresolvable value is a fault to
  # report — never a reason to fall back to another mapping shape.
  mappings:
    components:
      type:
        core/compute/api-server: helm-api-server-absent-from-catalog:1.0.0
        core/compute/web-ui: helm-web-ui-synthesized-with-artifacts:1.0.0
        core/datastore/postgres: helm-postgres-synthesized-with-artifacts:1.0.0
    features:
      type:
        core/k8s-dns-resolver: k8s-dns-patcher:1.0.0
    helm:
      components:
        type:
          core/compute/api-server: helm-api-server-synthesized-with-artifacts:1.0.0
