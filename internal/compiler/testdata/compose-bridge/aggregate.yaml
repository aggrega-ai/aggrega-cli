apiVersion: aggrega.ai/v1alpha1
kind: Aggregate
metadata:
  name: compose-bridge-app
  version: "1.0.0"
spec:
  components:
    api:
      type: core/api
      uses:
        backend:
          primary:
            target: db
            inject:
              env:
                - in: DB_HOST
                  from: host
          secondary:
            target: cache
            inject:
              env:
                - in: CACHE_HOST
                  from: host
    db:
      type: core/db
    cache:
      type: core/db
