apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: api-recipe
  version: "1.0.0"
spec:
  target: compose
  implements: core/api
  provides:
    host: "{{ .context.instance_id }}"
    port: 8080
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    containers:
      main:
        image: api:1.0
        variables:
          {{- range $k, $v := .context.inject.env }}
          {{ $k }}: "{{ $v }}"
          {{- end }}
        ports:
          p: 8080
    services:
      api:
        type: ClusterIP
        ports:
          p: 8080
