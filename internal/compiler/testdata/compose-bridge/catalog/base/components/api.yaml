apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/api
  version: "1.0.0"
  labels:
    component.aggrega.ai/type: "server"
spec:
  inject: ["env"]
  usesSchema:
    backend:
      selector: "component.aggrega.ai/type=stateful-server"
      inject: ["env"]
  schema: |
    values: { port?: int | *8080 }
    provides: { host: string, port: int }
