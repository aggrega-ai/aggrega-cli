apiVersion: aggrega.ai/v1alpha1
kind: Release
metadata:
  name: compose-bridge-release
  environment: local
  version: "1.0.0"
spec:
  aggregate: compose-bridge-app
  manifest: compose-bridge-manifest
  boundaries:
    cluster:
      directory: ./dist/cluster
      features:
        # Attach the bridge; the listen ports and the consumer rewrites are
        # derived from the cross-network uses edges. portBase defaults to 10000,
        # which the db/cache port collision (both 5432) falls back to.
        bridge:
          type: core/compose-bridge:1.0.0
      boundaries:
        services-net:
          directory: "{{ .parent_boundary.directory }}"
          annotations:
            aggrega.ai/namespace: "services"
          components:
            api: {}
        data-net:
          directory: "{{ .parent_boundary.directory }}"
          annotations:
            aggrega.ai/namespace: "data"
          components:
            db: {}
            cache: {}
