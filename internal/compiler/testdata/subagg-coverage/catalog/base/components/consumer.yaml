apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: cov/consumer
  version: "1.0.0"
  labels:
    component.aggrega.ai/type: "server"
spec:
  inject: ["env"]
  usesSchema:
    databases:
      required: true
      selector: "component.aggrega.ai/type=stateful-server"
      inject: ["env"]
      infraSchema:
        pool_size: { type: integer, minimum: 1, maximum: 100, default: 10 }
    caches:
      required: false
      selector: "component.aggrega.ai/type=resource"
      infraSchema:
        pool_size: { type: integer, minimum: 1, maximum: 50, default: 5 }
  featuresSchema:
    # Black-Box slot: the empty inject allowlist reserves delivery to the Recipe,
    # so any authored inject block on a fill of this slot is out of shape.
    root_password:
      inject: []
    # The counterpart to the slot above: an allowlist naming a mechanism, so a
    # fill delivering through env is in shape for it. Both slots exist so a fill
    # arriving from a broader scope can be shown accepted here and rejected
    # above, which is what separates reading the allowlist from rejecting every
    # fill that reaches a declared slot.
    api_token:
      inject: ["env"]
  schema:
    provides:
      host: { type: string, required: true }
