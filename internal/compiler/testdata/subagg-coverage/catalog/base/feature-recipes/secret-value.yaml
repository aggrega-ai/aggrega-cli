apiVersion: aggrega.ai/v1alpha1
kind: FeatureRecipe
metadata:
  name: cov-secret-value-fr
  version: "1.0.0"
spec:
  capability: compose
  implements: cov/secret-value
  # The key the fixtures' attachments deliver with `from: value`: an inject entry
  # on an attachment reads a key its FeatureRecipe publishes.
  provides:
    value: cov-secret-value
