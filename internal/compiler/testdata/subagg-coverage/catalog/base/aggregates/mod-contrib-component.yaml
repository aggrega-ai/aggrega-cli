apiVersion: aggrega.ai/v1alpha1
kind: Aggregate
metadata:
  name: cov-mod-contrib-component
  version: "1.0.0"
spec:
  components:
    consumer:
      type: cov/consumer
      uses:
        databases:
          main:
            target: store
      features:
        modfeat:
          type: cov/secret-value
          uses:
            bogus-module-socket:
              link:
                target: store
    store:
      type: cov/store
