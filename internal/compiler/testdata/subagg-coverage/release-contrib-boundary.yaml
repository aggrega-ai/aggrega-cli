apiVersion: aggrega.ai/v1alpha1
kind: Release
metadata:
  name: cov-release-contrib-boundary
  environment: local
  version: "1.0.0"
spec:
  aggregate: cov-app-contrib-plain
  manifest: cov-manifest
  boundaries:
    cluster:
      directory: ./dist/cluster
      features:
        bndfeat:
          type: cov/secret-value
          uses:
            bogus-boundary-socket:
              link:
                target: store
      components:
        consumer: {}
        store: {}
