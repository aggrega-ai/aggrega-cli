apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: cov-app-cascade-slot-permitted
  version: "1.0.0"
spec:
  subsystems:
    svc:
      features:
        # The positive counterpart to the subsystem-scope fixture beside this
        # one. Same shape of authoring — one attachment declared at the subsystem
        # scope, cascading onto both components — and the same delivery
        # mechanism. What differs is the slot it lands on: under `cov/consumer`
        # the name `api_token` binds a slot whose allowlist names `env`, so this
        # delivery is in shape for it and the build proceeds. Under `cov/store`,
        # which declares no featuresSchema, it is a free attachment.
        #
        # It exists so a passing build of the rejecting fixture cannot be
        # explained by the rule rejecting every contributed fill that reaches a
        # declared slot: this one reaches a declared slot and is accepted.
        api_token:
          type: cov/secret-value
          inject:
            env:
              - in: TOKEN
                from: value
      components:
        consumer:
          type: cov/consumer
          uses:
            databases:
              main:
                target: store
        store:
          type: cov/store
