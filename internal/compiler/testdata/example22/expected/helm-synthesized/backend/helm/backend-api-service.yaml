apiVersion: v1
kind: Service
metadata:
    name: backend-api
    namespace: backend-zone
    labels:
        aggrega.ai/aggregate-name: example22-app
        aggrega.ai/boundary-path: backend-ns
        aggrega.ai/compiler-version: 0.1.0
        aggrega.ai/component-id: backend
        aggrega.ai/environment: production
        aggrega.ai/recipe-uri: helm-api-server-synthesized:1.0.0
        app: backend
        app.kubernetes.io/name: backend
spec:
    type: ClusterIP
    selector:
        app: backend
    ports:
        - name: web
          port: 8082
          targetPort: web
