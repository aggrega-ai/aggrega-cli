apiVersion: apps/v1
kind: Deployment
metadata:
    name: frontend
    namespace: frontend-zone
    labels:
        aggrega.ai/aggregate-name: example22-app
        aggrega.ai/boundary-path: frontend-ns
        aggrega.ai/compiler-version: 0.1.0
        aggrega.ai/component-id: frontend
        aggrega.ai/environment: production
        aggrega.ai/recipe-uri: helm-web-ui-synthesized:1.0.0
        app: frontend
        app.kubernetes.io/name: frontend
spec:
    replicas: 2
    selector:
        matchLabels:
            app: frontend
    template:
        metadata:
            name: ""
            labels:
                aggrega.ai/aggregate-name: example22-app
                aggrega.ai/boundary-path: frontend-ns
                aggrega.ai/compiler-version: 0.1.0
                aggrega.ai/component-id: frontend
                aggrega.ai/environment: production
                aggrega.ai/recipe-uri: helm-web-ui-synthesized:1.0.0
                app: frontend
                app.kubernetes.io/name: frontend
        spec:
            containers:
                - name: main
                  image: web-ui:latest
                  ports:
                    - name: web
                      containerPort: 3003
                  env:
                    - name: PORT
                      value: "3003"
                    - name: API_HOST
                      value: backend.backend-zone.svc
                    - name: API_PORT
                      value: "8082"
