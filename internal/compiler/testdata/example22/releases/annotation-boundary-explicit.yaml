apiVersion: aggrega.ai/v1alpha1
kind: Release
metadata:
  name: annotation-boundary-explicit
  environment: test
  version: "1.0.0"
spec:
  aggregate: ../aggregates/annotation-release-side
  manifest: ../manifests/annotation-rewrite-host
  boundaries:
    web-ns:
      directory: ./dist/web
      annotations:
        aggrega.ai/namespace: "web-zone"
      components:
        app1:
          features:
            feature.myco/rewrite-host:
              type: feature.myco/rewrite-host
              infra:
                upstream: "myhost.example.com"
        app2:
          features:
            feature.myco/rewrite-host:
              type: feature.myco/rewrite-host
              infra:
                upstream: "myhost.example.com"
