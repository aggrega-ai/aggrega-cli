apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: helm-postgres-sourced-with-artifacts
  version: "1.0.0"
spec:
  provider: helm
  implements: core/database/postgres
  source: ./charts/postgres
  provides:
    host: "{{ .context.instance_id }}.svc.cluster.local"
    service_port: "5432"
  locals:
    primary_compute: postgres
  valuesMapping: |
    {
      "image": "postgres:15",
      "replicas": {{ .infra.replicas | default 1 }},
      "ports": ["5432:5432"]
    }
  artifacts:
    db-init.yaml: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: {{ .context.instance_id }}-init
      data:
        DATABASE: {{ .values.database_name }}
