{{- if .Values.ports }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Release.Name }}
  ports:
    {{- range $i, $p := .Values.ports }}
    - name: port-{{ $i }}
      port: {{ (split ":" $p)._0 }}
      targetPort: {{ (split ":" $p)._1 }}
    {{- end }}
{{- end }}
