apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: compose-api-synthesized
  version: "1.0.0"
spec:
  provider: compose
  implements: core/server/api-server
  provides:
    host: "{{ .context.instance_id }}"
    service_port: "{{ .values.port }}"
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    replicas: {{ .infra.replicas | default 1 }}
    containers:
      main:
        image: api-server:latest
        ports:
          web: {{ .values.port }}
        variables:
          PORT: "{{ .values.port }}"
          {{- range $k, $v := .context.inject.env }}
          {{ $k }}: "{{ $v }}"
          {{- end }}
    services:
      api:
        type: ClusterIP
        ports:
          web: {{ .values.port }}
