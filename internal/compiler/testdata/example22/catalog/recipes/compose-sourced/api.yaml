apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: compose-api-sourced
  version: "1.0.0"
spec:
  provider: compose
  implements: core/server/api-server
  source: ./sources/api.yaml
  provides:
    host: "{{ .context.instance_id }}"
    service_port: "{{ .values.port }}"
  valuesMapping: |
    {
      "services": {
        "api": {
          "environment": {
            "PORT": "{{ .values.port }}"
            {{- range $k, $v := .context.inject.env }},
            "{{ $k }}": "{{ $v }}"
            {{- end }}
          }
        }
      }
    }
