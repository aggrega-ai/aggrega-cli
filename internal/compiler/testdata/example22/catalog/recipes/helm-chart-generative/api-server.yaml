apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: ops/helm-api-server-chart-generative
  version: "1.0.0"
spec:
  provider: helm-chart
  implements: core/server/api-server
  provides:
    host: "{{ .context.instance_id }}.svc.cluster.local"
    service_port: "{{ .values.port }}"
  locals:
    primary_compute: api
  valuesMapping: |
    {
      "image": "api-server:latest",
      "replicas": {{ .infra.replicas | default 1 }},
      "ports": ["{{ .values.port }}:{{ .values.port }}"],
      "environment": {
        "PORT": "{{ .values.port }}"
      }
    }
