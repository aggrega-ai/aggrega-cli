apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: ops/helm-api-server-generative
  version: "1.0.0"
spec:
  provider: helm
  implements: core/server/api-server
  provides:
    host: "{{ .context.instance_id }}.svc.cluster.local"
    service_port: "{{ .values.port }}"
  locals:
    primary_compute: api
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    replicas: {{ .infra.replicas | default 1 }}
    containers:
      api-server:
        image: api-server:latest
        variables:
          PORT: "{{ .values.port }}"
        ports:
          web: {{ .values.port }}
    services:
      api:
        type: ClusterIP
        ports:
          web: {{ .values.port }}
