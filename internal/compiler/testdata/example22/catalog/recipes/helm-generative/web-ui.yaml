apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: ops/helm-web-ui-generative
  version: "1.0.0"
spec:
  provider: helm
  implements: core/server/web-ui
  provides:
    host: "{{ .context.instance_id }}.svc.cluster.local"
    service_port: "{{ .values.port }}"
  locals:
    primary_compute: web
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    replicas: {{ .infra.replicas | default 1 }}
    containers:
      web-ui:
        image: web-ui:latest
        variables:
          PORT: "{{ .values.port }}"
          {{- if .context.inject.env.API_HOST }}
          API_HOST: "{{ .context.inject.env.API_HOST }}"
          {{- end }}
          {{- if .context.inject.env.API_PORT }}
          API_PORT: "{{ .context.inject.env.API_PORT }}"
          {{- end }}
        ports:
          web: {{ .values.port }}
    services:
      ui:
        type: ClusterIP
        ports:
          web: {{ .values.port }}
