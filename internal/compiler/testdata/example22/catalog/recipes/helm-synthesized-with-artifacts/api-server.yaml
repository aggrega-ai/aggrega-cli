apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: helm-api-server-synthesized-with-artifacts
  version: "1.0.0"
spec:
  provider: helm
  implements: core/server/api-server
  provides:
    host: "{{ .context.instance_id }}.svc.cluster.local"
    service_port: "{{ .values.port }}"
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    replicas: {{ .infra.replicas | default 1 }}
    containers:
      main:
        image: api-server:latest
        ports:
          web: {{ .values.port }}
        variables:
          PORT: "{{ .values.port }}"
    services:
      api:
        type: ClusterIP
        ports:
          web: {{ .values.port }}
  artifacts:
    app-config.yaml: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: {{ .context.instance_id }}-app-config
      data:
        SERVICE: {{ .context.instance_id }}
        PORT: "{{ .values.port }}"
