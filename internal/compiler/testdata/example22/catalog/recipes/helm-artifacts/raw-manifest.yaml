apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: helm-raw-manifest-artifacts
  version: "1.0.0"
spec:
  provider: helm-raw
  implements: core/raw/manifest
  artifacts:
    configmap.yaml: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: {{ .values.name }}
      data:
        ENV: production
        BOUNDARY: {{ .context.instance_id }}
    namespace.yaml: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: {{ .context.instance_id }}-ns
