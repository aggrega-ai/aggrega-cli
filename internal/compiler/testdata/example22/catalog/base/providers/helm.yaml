apiVersion: aggrega.ai/v1alpha1
kind: Provider
metadata:
  name: helm
  version: "1.0.0"
spec:
  # baseSchema validates the valuesMapping output for sourceless (generative) mode.
  # The helm provider generates flat Deployment + optional Service from this dict.
  # Authored as JSON Schema 2020-12 (compact-form YAML accepted).
  baseSchema: |
    type: object
    properties:
      image: { type: string }
      replicas: { type: integer, default: 1 }
      ports:
        type: array
        items: { type: string }
      environment:
        type: object
        additionalProperties:
          oneOf:
            - { type: string }
            - { type: integer }
    required: [image]
    additionalProperties: true
  # workloadSchema documents how the aggrega.ai/v1alpha1 Workload kind
  # translates to helm output. Today the field acts as a presence flag
  # (non-empty = Workload synthesis supported); the body is a placeholder
  # JSON Schema that becomes executable input to Wasm translators in a
  # future iteration.
  workloadSchema: |
    type: object
    additionalProperties: true
