apiVersion: aggrega.ai/v1beta1
kind: Plugin
metadata:
  name: helm-chart
  version: 1.0.0
  pluginType: provider
spec:
  abiVersion: v1beta1
  provider:
    capabilities:
      - helm-chart
  # BOTH exports: render_node copies each sourced sub-chart into a file set;
  # assemble_boundary nests the dispatch group's sub-charts under an umbrella
  # chart. The dual-export signal routes the helm-chart provider to the
  # assembler adapter.
  exports:
    - name: render_node
    - name: assemble_boundary
  runtime:
    maxMemoryPages: 4096
    # Generous per-call cap so guest runtime initialization completes even where
    # the host runs the Wasm engine without native code generation (a sandboxed
    # environment that denies executable memory falls back to slow interpretation).
    timeoutMs: 300000
