apiVersion: aggrega.ai/v1beta1
kind: Plugin
metadata:
  name: secret-injector
  version: "1.0.0"
  pluginType: pipeline-step
  description: Patch the consuming workload to reference a secret named by an earlier producer step.
spec:
  abiVersion: v1alpha1
  pipelineStep:
    capabilities:
      - helm-chart
