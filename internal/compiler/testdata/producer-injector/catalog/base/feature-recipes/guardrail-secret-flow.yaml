apiVersion: aggrega.ai/v1alpha1
kind: FeatureRecipe
metadata:
  name: guardrail-secret-flow
  version: "1.0.0"
spec:
  capability: helm
  implements: "feature.myco/guardrail"
  # An artifacts: entry makes this FeatureRecipe resource-generating, so its
  # pipeline runs. Its own output renders under features/guardrail/; the
  # pipeline chains a producer to two cross-entity injector steps below.
  artifacts:
    guardrail-config.yaml: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: guardrail-config
      data:
        label: "{{ .values.label }}"
  pipeline:
    # The producer emits a secret-reference document into its own set and
    # returns the secret's name as an addressable output.
    - id: ref
      plugin: frp_step/secret-ref-producer:1.0.0
      function: step
    # The injector reads the producer's output through the inter-step channel
    # and patches the host workload to reference the secret.
    - id: inject
      plugin: frp_step/secret-injector:1.0.0
      function: step
      with: |
        secretName: "{{ .steps.ref.outputs.secretName }}"
    # The sidecar-injector appends a companion container to the host workload.
    - id: sidecar
      plugin: frp_step/sidecar-injector:1.0.0
      function: step
