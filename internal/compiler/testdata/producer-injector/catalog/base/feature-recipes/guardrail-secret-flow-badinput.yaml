apiVersion: aggrega.ai/v1alpha1
kind: FeatureRecipe
metadata:
  name: guardrail-secret-flow-badinput
  version: "1.0.0"
spec:
  capability: helm
  implements: "feature.myco/guardrail"
  artifacts:
    guardrail-config.yaml: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: guardrail-config
      data:
        label: "{{ .values.label }}"
  pipeline:
    # The injector's step export declares a typed input requiring a string
    # secretName; this step supplies an integer, so the host halts the build on
    # the input-contract violation before the guest runs.
    - id: inject
      plugin: pipeline-step/secret-injector:1.0.0
      function: step
      with: |
        secretName: 123
