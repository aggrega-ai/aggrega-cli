apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: guardrail-secret-flow-badoutput
  version: "1.0.0"
spec:
  capability: helm
  implements: "feature.myco/guardrail"
  artifacts:
    guardrail-config.yaml: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: guardrail-config
      data:
        label: "{{ .values.label }}"
  pipeline:
    # This producer's step export declares a typed output requiring a string
    # secretName, but the guest returns a number, so the host halts the build on
    # the output-contract violation after the guest runs.
    - id: ref
      plugin: pipeline-step/secret-ref-producer-badoutput:1.0.0
      function: step
