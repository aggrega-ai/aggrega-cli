apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/asserted
  version: "1.0.0"
  labels:
    component.aggrega.ai/type: "server"
spec:
  schema:
    values:
      tier: { type: string, default: "gold" }
    provides:
      host: { type: string, required: true }
  assertions:
    tier-must-be-gold: '{{ if ne .values.tier "gold" }}{{ fail (printf "tier must be gold, got %q" .values.tier) }}{{ end }}'
