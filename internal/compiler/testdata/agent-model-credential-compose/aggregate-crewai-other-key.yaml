apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: crewai-agent-other-key
  version: "1.0.0"
spec:
  components:
    # The Aggregate attaches the credential under a key other than the variable
    # the agent receives it as; the Release supplies its origin.
    agent:
      type: core/ai-agent/crewai
      values:
        role: researcher
        goal: answer from the support plans
        backstory: knows every support plan
        allow_delegation: false
        log_level: INFO
      uses:
        model:
          gpt:
            target: gpt
            features:
              credential:
                type: core/secret-value
                values:
                  key: MODEL_KEY
    gpt:
      type: core/ai-model/openai
      values:
        model: gpt-4o-mini
