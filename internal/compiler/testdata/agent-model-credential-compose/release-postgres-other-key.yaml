apiVersion: aggrega.ai/v1alpha1
kind: Release
metadata:
  name: postgres-release-other-key
  environment: development
  version: "1.0.0"
spec:
  aggregate: postgres-database-other-key
  manifest: postgres-compose
  components:
    # The origin of the password the Aggregate attaches, delivered under the key
    # the Aggregate names.
    db:
      features:
        password:
          type: core/secret-value
          infra:
            origin: aggregate-other-password
