apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: gamma-recipe
  version: "1.0.0"
spec:
  capability: compose
  implements: core/gamma
  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    containers:
      main:
        image: gamma:1.0
  # An artifacts: fragment declaring a top-level volume the other contributors
  # at this assembly path also declare. The body is what decides whether the
  # shared name is a conflict or the one entry both authors asked for.
  artifacts:
    "shared-volume.yaml": |
      volumes:
        shared-data:
          driver: local
          driver_opts:
            device: /srv/shared
