apiVersion: aggrega.ai/v1alpha1
kind: Plugin
metadata:
  name: compose
  version: 1.0.0
  pluginType: provider
  description: Renders the documents of a component whose Recipe declares the compose capability, and folds a dispatch group's documents into one.
spec:
  abiVersion: v1alpha1
  provider:
    capabilities:
      - compose
  exports:
    - name: render_node
    - name: assemble_boundary
  runtime:
    maxMemoryPages: 4096
    timeoutMs: 300000
