apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: sens/mapped
  version: "1.0.0"
  labels:
    component.aggrega.ai/type: "server"
spec:
  schema:
    values:
      # Public, and the paired control on every assertion about this node: an
      # advisory naming it would be reporting a declaration nobody wrote.
      appName: { type: string }
      # Declared at the leaf. Its Recipe declares a valuesMapping, so the keys
      # the target receives are the mapping's own and this declaration reaches
      # none of them.
      dbPassword: { type: string, sensitive: true }
    provides:
      host: { type: string, required: true }
