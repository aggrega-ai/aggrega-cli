apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: refusal-credential-inject-mapping-compose
  version: "1.0.0"
  description: Its inject mapping refuses, quoting the leaf the Feature declares.
spec:
  capability: compose
  implements: feature.test/refusal-credential
  provides:
    key: "{{ .values.key }}"
  injectMapping: '{{ fail (printf "the credential origin %s must name a secret resource" .values.origin) }}'
