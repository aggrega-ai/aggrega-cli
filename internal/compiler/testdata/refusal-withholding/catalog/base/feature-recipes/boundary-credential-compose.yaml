apiVersion: aggrega.ai/v1alpha1
kind: FeatureRecipe
metadata:
  name: refusal-boundary-credential-compose
  version: "1.0.0"
  description: A boundary-scope locals entry refuses, quoting the infra leaf the Feature declares.
spec:
  capability: compose
  implements: feature.test/refusal-boundary-credential
  executionScope: boundary
  locals:
    origin: '{{ fail (printf "the boundary credential origin %s must name a secret resource" .infra.origin) }}'
  artifacts:
    boundary-note.txt: "{{ .locals.origin }}"
