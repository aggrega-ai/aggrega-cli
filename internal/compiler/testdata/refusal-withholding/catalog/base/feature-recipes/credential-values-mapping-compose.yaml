apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: refusal-credential-values-mapping-compose
  version: "1.0.0"
  description: Its values mapping refuses, quoting the leaf the Feature declares.
spec:
  capability: compose
  implements: feature.test/refusal-credential
  provides:
    key: "{{ .values.key }}"
  # A values mapping is admitted only beside a source. This one names the
  # directory the FeatureRecipe sits in, and the render refuses before reading it.
  source: ./
  valuesMapping: '{{ fail (printf "the credential origin %s must name a secret resource" .values.origin) }}'
