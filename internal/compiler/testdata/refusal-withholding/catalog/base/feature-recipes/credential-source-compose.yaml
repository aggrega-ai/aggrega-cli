apiVersion: aggrega.ai/v1alpha1
kind: FeatureRecipe
metadata:
  name: refusal-credential-source-compose
  version: "1.0.0"
  description: Its source template refuses, quoting the leaf the Feature declares.
spec:
  capability: compose
  implements: feature.test/refusal-credential
  provides:
    key: "{{ .values.key }}"
  source: '{{ fail (printf "the credential origin %s must name a secret resource" .values.origin) }}'
