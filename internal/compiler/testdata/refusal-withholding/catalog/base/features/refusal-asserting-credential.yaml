apiVersion: aggrega.ai/v1beta1
kind: Feature
metadata:
  name: feature.test/refusal-asserting-credential
  version: "1.0.0"
spec:
  # Refuses every attachment, quoting the leaf the Feature itself declares, so the
  # text of a Feature's own assertion is judged against a declared value.
  assertions:
    origin-names-a-resource: |
      {{- fail (printf "the credential origin %s must name a secret resource" .values.origin) -}}
  schema:
    values:
      origin: { type: string, sensitive: true }
      key: { type: string }
    provides:
      key: { type: string, required: true }
