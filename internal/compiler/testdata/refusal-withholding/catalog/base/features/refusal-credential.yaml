apiVersion: aggrega.ai/v1beta1
kind: Feature
metadata:
  name: feature.test/refusal-credential
  version: "1.0.0"
spec:
  schema:
    values:
      # origin is the declared half; key is a locator and is left unmarked, so a
      # refusal quoting it is judged against a value nobody declared.
      origin: { type: string, sensitive: true }
      key: { type: string }
    provides:
      key: { type: string, required: true }
