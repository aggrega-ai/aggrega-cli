apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: refusal-artifacts-recipe
  version: "1.0.0"
  description: An artifact template refuses, quoting the declared-sensitive leaf.
spec:
  capability: compose
  implements: core/refusal-guarded
  artifacts:
    note.txt: '{{ fail (printf "the admin password %s must be supplied as a reference" .values.adminPassword) }}'
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    containers:
      main:
        image: guarded:1.0
