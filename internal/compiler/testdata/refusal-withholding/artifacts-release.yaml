# A node's artifact template refuses.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: refusal-artifacts-release
  environment: local
  version: "1.0.0"
spec:
  aggregate: ./guarded-app.yaml
  manifest: ./artifacts-manifest.yaml
  boundaries:
    main:
      directory: ./dist/main
      components:
        guarded: {}
