apiVersion: aggrega.ai/v1alpha1
kind: FeatureRecipe
metadata:
  name: guardrail-host-patcher
  version: "1.0.0"
spec:
  capability: helm
  implements: "feature.myco/guardrail"
  # An artifacts: entry makes this FeatureRecipe resource-generating, so its
  # pipeline runs. Its own output renders under features/guardrail/; the
  # pipeline's work is the cross-entity /host PATCH below.
  artifacts:
    guardrail-config.yaml: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: guardrail-config
      data:
        label: "{{ .values.label }}"
  pipeline:
    - id: inject_into_host
      plugin: pipeline-step/host-patch:1.0.0
      function: step
