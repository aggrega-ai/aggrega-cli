apiVersion: aggrega.ai/v1alpha1
kind: Provider
metadata:
  name: helm-chart
  version: "1.0.0"
spec:
  baseSchema: |
    type: object
    properties:
      image: { type: string }
      replicas: { type: integer, default: 1 }
      ports:
        type: array
        items: { type: string }
      environment:
        type: object
        additionalProperties: true
    additionalProperties: true
