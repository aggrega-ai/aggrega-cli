apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: withhold-gateway-recipe
  version: "1.0.0"
spec:
  capability: compose
  implements: withhold/gateway
  provides:
    host: "{{ .context.instance_id }}"
  # The rendered workload carries two declared-sensitive values — the node's
  # own, and the credential its attachment delivers — so a withholding that
  # reached the graph the render reads would change these bytes.
  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    containers:
      main:
        image: gateway:1.0
        variables:
          REGION: '{{ .values.region }}'
          ADMIN_TOKEN: '{{ .values.admin_token }}'
          DB_SECRET: '{{ index .context.inject.env "DB_SECRET" }}'
