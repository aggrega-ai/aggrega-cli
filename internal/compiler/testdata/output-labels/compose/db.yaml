apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: compose-db-synthesized
  version: "1.0.0"
spec:
  capability: compose
  implements: core/datastore/postgres
  outputLabels:
    hosting: self-hosted
    example.io/team: platform
  provides:
    host: "{{ .context.instance_id }}"
    service_port: "5432"
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    replicas: {{ optional .infra `replicas` 1 }}
    containers:
      main:
        image: postgres:15
        ports:
          db: 5432
        variables:
          POSTGRES_DB: "{{ .values.database_name }}"
    services:
      db:
        type: ClusterIP
        ports:
          db: 5432
