apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: helm-postgres-synthesized-with-artifacts
  version: "1.0.0"
spec:
  capability: helm
  implements: core/datastore/postgres
  outputLabels:
    hosting: self-hosted
    example.io/team: platform
  outputComponentLabels:
    - component.aggrega.ai/type
  provides:
    host: "{{ .context.instance_id }}.svc.cluster.local"
    service_port: "5432"
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    replicas: {{ optional .infra `replicas` 1 }}
    runtimeClassName: nvidia
    containers:
      main:
        image: postgres:15
        ports:
          db: 5432
        variables:
          POSTGRES_DB: "{{ .values.database_name }}"
        resources:
          limits:
            cpu: "2"
            memory: 8Gi
            nvidia.com/gpu: "1"
          requests:
            nvidia.com/gpu: "1"
    services:
      db:
        type: ClusterIP
        ports:
          db: 5432
  artifacts:
    db-init.yaml: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: {{ .context.instance_id }}-init
      data:
        DATABASE: {{ .values.database_name }}
