apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: cw-secret-ref-helm
  version: "1.0.0"
  description: >
    Helm realization of feature.cw/secret-ref that renders no resource of its own;
    it publishes the origin as the resource name and the key as its data key.
spec:
  capability: helm
  implements: feature.cw/secret-ref
  provides:
    name: "{{ .values.origin }}"
    key: "{{ .values.key }}"
