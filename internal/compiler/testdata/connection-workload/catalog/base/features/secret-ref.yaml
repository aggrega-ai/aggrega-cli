apiVersion: aggrega.ai/v1alpha1
kind: Feature
metadata:
  name: feature.cw/secret-ref
  version: "1.0.0"
  description: A referenceable credential publishing the name of the resource holding it and the data key within it.
  labels:
    feature.aggrega.ai/kind: secret
spec:
  schema:
    values:
      origin: { type: string, sensitive: true }
      key: { type: string }
    provides:
      name: { type: string, required: true }
      key: { type: string, required: true }
