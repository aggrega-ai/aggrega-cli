apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}
spec:
  serviceName: {{ .Release.Name }}
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
        - name: server
          image: example/store:1
          volumeMounts:
            - name: data
              mountPath: /var/lib/store
            - name: config
              mountPath: /etc/store
              readOnly: true
            - name: scratch
              mountPath: /tmp/store
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-config
        - name: scratch
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
