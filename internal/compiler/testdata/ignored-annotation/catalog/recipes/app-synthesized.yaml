apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata: { name: annapp-synthesized, version: "1.0.0" }
spec:
  capability: helm
  implements: core/annapp
  provides:
    host: "{{ .context.instance_id }}"
  # A Workload and nothing else, so this node's one declared input kind is the
  # synthesised kind — which the target's claim DOES cover for the annotation this
  # corpus authors. It is the host that has to stay quiet.
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    containers:
      main:
        image: annapp:1.0
        ports:
          p: 8080
