#
# The component crossing carries the artifacts: the node's own Recipe declares
# artifacts and nothing else, so its whole output is imported artifact documents.
# The boundary authors a platform annotation the target reads only where it builds
# the manifest itself, so the annotation reaches nothing here.
apiVersion: aggrega.ai/v1alpha1
kind: Release
metadata:
  name: ann-release-component-artifacts
  environment: local
  version: "1.0.0"
spec:
  aggregate: ./aggregate-component-artifacts.yaml
  manifest: ./manifest-component-artifacts.yaml
  boundaries:
    app-ns:
      directory: ./dist/app
      annotations:
        aggrega.ai/namespace: "app-zone"
      components:
        app: {}
