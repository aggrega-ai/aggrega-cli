apiVersion: aggrega.ai/v1beta1
kind: Feature
metadata:
  name: feature.mark/db-credential
  version: "1.0.0"
  labels:
    feature.aggrega.ai/kind: secret
spec:
  schema:
    values:
      # A locator, public on purpose.
      secretName: { type: string }
      # Declared on the OBJECT. The attachment authors a value beneath it, so
      # this is where the attachment-side marking has to climb from the leaf to
      # the declaration rather than match the leaf's own path.
      vault:
        type: object
        sensitive: true
        properties:
          token: { type: string }
          path: { type: string }
    provides:
      name: { type: string, required: true }
      password: { type: string, required: true, sensitive: true }
