apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: arm-two-deployment
  version: "1.0.0"
  description: >
    A datastore and two applications that read its host through an injection.
spec:
  components:
    store:
      type: example/datastore/store
    app:
      type: example/compute/consumer
      uses:
        database:
          primary:
            target: store
            inject:
              env:
                - in: DB_HOST
                  from: host
    reports:
      type: example/compute/consumer
      uses:
        database:
          primary:
            target: store
            inject:
              env:
                - in: DB_HOST
                  from: host
