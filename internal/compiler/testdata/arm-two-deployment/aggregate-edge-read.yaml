apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: arm-two-deployment
  version: "1.0.0"
  description: >
    A datastore and an application whose Recipe reads the datastore's values
    directly off its connection; the connection injects nothing.
spec:
  components:
    store:
      type: example/datastore/store
    app:
      type: example/compute/consumer
      uses:
        database:
          primary:
            target: store
