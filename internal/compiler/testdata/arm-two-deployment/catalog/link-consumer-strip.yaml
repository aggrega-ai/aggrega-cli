apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: arm-link-consumer-strip
  version: 1.0.0
  description: >
    An application that strips the brackets off the host it reads off its
    connection before writing it, which changes the value rather than copying it.
spec:
  capability: arm
  implements: example/compute/consumer:1.0.0
  locals:
    symbol: '{{ capitalizedWords .context.instance_id }}'
  artifacts:
    consumer.yaml: |
      resources:
        {{ .locals.symbol }}:
          type: Microsoft.App/containerApps
          apiVersion: "2024-03-01"
          name: "{{ .context.instance_id }}"
          location: "[resourceGroup().location]"
          properties:
            settings:
              databaseHost: "{{ trimSuffix "]" (trimPrefix "[" .context.uses.primary.provides.host) }}"
