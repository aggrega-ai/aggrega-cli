apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: arm-link-consumer-read
  version: 1.0.0
  description: >
    An application that reads the datastore's host and port directly off its
    connection, each written whole into a setting. The host is an expression;
    the port is literal text.
spec:
  capability: arm
  implements: example/compute/consumer:1.0.0
  locals:
    symbol: '{{ capitalizedWords .context.instance_id }}'
  artifacts:
    consumer.yaml: |
      resources:
        {{ .locals.symbol }}:
          type: Microsoft.App/containerApps
          apiVersion: "2024-03-01"
          name: "{{ .context.instance_id }}"
          location: "[resourceGroup().location]"
          properties:
            settings:
              databaseHost: "{{ .context.uses.primary.provides.host }}"
              databasePort: "{{ .context.uses.primary.provides.port }}"
