apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: arm-link-store-secret
  version: 1.0.0
  description: >
    A datastore whose provides host is an expression reading a secret with a
    list function, which another deployment's read would store in its history.
spec:
  capability: arm
  implements: example/datastore/store:1.0.0
  locals:
    symbol: '{{ .values.symbol }}'
  provides:
    host: "[listKeys('{{ .locals.symbol }}', '2024-08-01').primaryKey]"
    port: "5432"
  artifacts:
    store.yaml: |
      resources:
        {{ .locals.symbol }}:
          type: Microsoft.DBforPostgreSQL/flexibleServers
          apiVersion: "2024-08-01"
          name: "{{ .context.instance_id }}"
          location: "[resourceGroup().location]"
          sku:
            name: "{{ .infra.sku }}"
          properties:
            version: "16"
