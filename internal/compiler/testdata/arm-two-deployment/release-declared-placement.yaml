apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: arm-two-deployment
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate.yaml
  manifest: ./manifest.yaml
  boundaries:
    data:
      directory: ./dist/data
      annotations:
        aggrega.ai/azure-subscription: "11111111-1111-1111-1111-111111111111"
        aggrega.ai/azure-resource-group: "orders-data"
      components:
        store: {}
    web:
      directory: ./dist/web
      components:
        app: {}
