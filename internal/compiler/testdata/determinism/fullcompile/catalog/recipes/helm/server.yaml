apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: server-recipe
  version: "1.0.0"
spec:
  capability: helm
  implements: core/server
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    replicas: {{ optional .infra `replicas` 1 }}
    containers:
      server:
        image: test-server:latest
        ports:
          web: {{ optional .infra `port` 8080 }}
    services:
      svc:
        type: ClusterIP
        ports:
          web: {{ optional .infra `port` 8080 }}
