apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: arm-gateway-key
  version: "1.0.0"
spec:
  components:
    gateway:
      type: core/gateway/azure-api-management
      values:
        model: gpt-4o-mini
      features:
        provider_key:
          type: core/referenced-secret
          values:
            origin: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-secrets/providers/Microsoft.KeyVault/vaults/kv-models/secrets/openai-key
