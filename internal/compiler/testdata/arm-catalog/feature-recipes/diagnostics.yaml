apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: arm-diagnostics
  version: 1.0.0
  description: >
    The diagnostics setting of one attached component, written as an ARM
    fragment that assembles into the same template as its host. Its symbolic name
    carries the host and the attachment's name together.
spec:
  capability: arm
  implements: example/diagnostics:1.0.0
  locals:
    symbol: '{{ capitalizedWords (printf "%s %s" .context.instance_id .attachment_name) }}'
  artifacts:
    diagnostics.yaml: |
      resources:
        {{ .locals.symbol }}:
          type: Microsoft.Insights/diagnosticSettings
          apiVersion: "2021-05-01-preview"
          name: "{{ .attachment_name }}"
          properties:
            retentionDays: {{ .values.retention_days }}
      outputs:
        setting:
          type: string
          value: "[reference('{{ .locals.symbol }}', '2021-05-01-preview').name]"
