apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: arm-consumer
  version: 1.0.0
  description: >
    An application written as an ARM fragment. It writes the delivered database
    host whole into one of its settings.
spec:
  capability: arm
  implements: example/compute/consumer:1.0.0
  locals:
    symbol: '{{ capitalizedWords .context.instance_id }}'
  artifacts:
    consumer.yaml: |
      {{- $env := optional (default dict .context.inject) "env" dict -}}
      resources:
        {{ .locals.symbol }}:
          type: Microsoft.App/containerApps
          apiVersion: "2024-03-01"
          name: "{{ .context.instance_id }}"
          location: "[resourceGroup().location]"
          properties:
            settings:
              databaseHost: "{{ $env.DB_HOST }}"
