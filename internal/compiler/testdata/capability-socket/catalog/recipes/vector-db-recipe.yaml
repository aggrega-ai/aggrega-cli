apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: vector-db-recipe
  version: "1.0.0"
spec:
  capability: compose
  implements: core/datastore/vector-db
  provides:
    host: "{{ .context.instance_id }}"
    port: 6333
  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    containers:
      main:
        image: vector-db:1
        ports:
          p: 6333
    services:
      db:
        type: ClusterIP
        ports:
          p: 6333
