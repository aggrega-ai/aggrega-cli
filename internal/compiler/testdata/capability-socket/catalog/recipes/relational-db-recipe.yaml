apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: relational-db-recipe
  version: "1.0.0"
spec:
  capability: compose
  implements: core/datastore/relational-db
  provides:
    host: "{{ .context.instance_id }}"
    port: 5432
  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    containers:
      main:
        image: relational-db:1
        ports:
          p: 5432
    services:
      db:
        type: ClusterIP
        ports:
          p: 5432
