apiVersion: aggrega.ai/v1alpha1
kind: Plugin
metadata:
  name: helm-chart-renderer
  version: 1.0.0
  description: Wasm rendering engine for the helm-chart provider.
spec:
  # Content-addressed reference to the embedded helm-chart provider artifact; the
  # plugin-resolution cascade's embed tier serves these exact bytes, so the
  # build resolves the guest with no sidecar, cache, or lockfile.
  plugin: oci://hub.aggrega.ai/plugins/helmchart-provider@sha256:054ceee78160b5d17d1ff4e5422cf5b47ea3af748864f309532a2812a3ccbf04
  pluginType: provider
  abiVersion: v1alpha1
  compatibleProviders:
    - helm-chart
  # BOTH exports: render_node copies each sourced sub-chart into a file set;
  # assemble_boundary merges the dispatch group's sub-charts into a single
  # umbrella Chart.yaml + values.yaml. The dual-export signal routes the
  # helm-chart provider to the assembler adapter.
  exports:
    - name: render_node
    - name: assemble_boundary
  runtime:
    maxMemoryPages: 4096
    # Generous per-call cap so guest runtime initialization completes even where
    # the host runs the Wasm engine without native code generation (a sandboxed
    # environment that denies executable memory falls back to slow interpretation).
    timeoutMs: 300000
