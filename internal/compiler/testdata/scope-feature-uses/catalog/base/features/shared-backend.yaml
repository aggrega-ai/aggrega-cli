apiVersion: aggrega.ai/v1alpha1
kind: Feature
metadata:
  name: core/shared-backend
  version: "1.0.0"
spec:
  # A pure-wiring feature: it carries no values and renders no resource of
  # its own (no FeatureRecipe). Its sole job is to contribute a `uses` edge
  # to every component in the scope it is attached to, so a shared backend
  # dependency is declared once at the scope rather than on each component.
  interoperability:
    conflictsWith: []
