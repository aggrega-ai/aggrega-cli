apiVersion: aggrega.ai/v1alpha1
kind: Aggregate
metadata:
  name: scope-feature-uses-app
  version: "1.0.0"
spec:
  components:
    db:
      type: core/db
  subsystems:
    tier:
      # A subsystem-wide feature carrying a `uses` edge. The feature is the
      # vehicle: every component in `tier` (here, api) gains a backend edge to
      # the shared db and is injected db's `host` provides as DB_HOST. The uses
      # is authored once at the subsystem, not on api itself.
      features:
        shared_backend:
          type: core/shared-backend
          uses:
            backend:
              primary:
                target: db
                inject:
                  env:
                    - in: DB_HOST
                      from: host
      components:
        api:
          type: core/api
