# The control for the two-boundary helm variant: one boundary, one attachment,
# so the expected file set for a single contributor is readable on its own.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: bs-helm-one-boundary
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-helm-one-zone.yaml
  manifest: ./manifest.yaml
  boundaries:
    zone-a:
      directory: ./dist/app
      features:
        audit:
          type: feature.bs/helm-a
      components:
        app-a: {}
