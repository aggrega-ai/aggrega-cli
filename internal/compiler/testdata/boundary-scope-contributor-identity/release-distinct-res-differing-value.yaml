# The sibling of the identical-value variant: the two renders publish the same
# entry name with different values.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: bs-distinct-res-differing-value
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-cfn-two-zones.yaml
  manifest: ./manifest.yaml
  boundaries:
    zone-a:
      directory: ./dist/stack
      features:
        audit:
          type: feature.bs/distinct-res-varying
      components:
        store-a: {}
    zone-b:
      directory: ./dist/stack
      features:
        audit:
          type: feature.bs/distinct-res-varying
      components:
        store-b: {}
