apiVersion: aggrega.ai/v1alpha1
kind: FeatureRecipe
metadata:
  name: bs-distinct-res-cfn
  version: "1.0.0"
spec:
  capability: cloudformation
  implements: feature.bs/distinct-res
  # A boundary-scope attachment whose stack resource name says which boundary it
  # rendered for, so two boundaries attaching it under one instance name author
  # two distinct resource names and the resource comparison has nothing to
  # report. What they DO share is the entry name they publish, which is where the
  # Output name is built.
  #
  # The boundary name reaches the logical id with its separators dropped, because
  # a CloudFormation logical id admits only letters and digits and this provider
  # emits the id exactly as authored. The boundary names this fixture declares
  # carry a hyphen deliberately — that is ordinary input — so the id is built from
  # them rather than being the name itself.
  executionScope: boundary
  artifacts:
    audit-fragment.yaml: |
      Resources:
        AuditTrail{{ .boundary.boundary_name | replace "-" "" }}:
          Type: AWS::SQS::Queue
          Properties:
            MessageRetentionPeriod: "120"
      provides:
        endpoint: "shared-endpoint-value"
