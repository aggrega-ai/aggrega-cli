# The same two-boundary, one-instance-name shape, with a FeatureRecipe whose
# published value names the boundary it rendered for — so the two contributors'
# fragments differ.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: bs-differing-bodies
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-cfn-two-zones.yaml
  manifest: ./manifest.yaml
  boundaries:
    zone-a:
      directory: ./dist/stack
      features:
        audit:
          type: feature.bs/varying
      components:
        store-a: {}
    zone-b:
      directory: ./dist/stack
      features:
        audit:
          type: feature.bs/varying
      components:
        store-b: {}
