apiVersion: aggrega.ai/v1alpha1
kind: Aggregate
metadata:
  name: bs-cfn-two-zones
  version: "1.0.0"
  description: >
    Two components, one per zone, so each zone holds a component that carries the
    zone's boundary-level attachment reference and the boundary-scope render runs
    once per zone.
spec:
  components:
    store-a:
      type: core/bs-host
      values:
        resource_id: "StoreAQueue"
        endpoint_value: "store-a-endpoint"
    store-b:
      type: core/bs-host
      values:
        resource_id: "StoreBQueue"
        endpoint_value: "store-b-endpoint"
