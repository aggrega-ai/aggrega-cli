apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: flowise-as-exported
  environment: development
  version: "1.0.0"
spec:
  aggregate: flowise-as-exported
  manifest: flowise-compose
  boundaries:
    main:
      directory: ./dist/flowise-as-exported
      components:
        model:
          infra:
            endpoint: http://litellm:4000/v1
        chat:
          infra:
            image: flowiseai/flowise:3.1.3
            owner_email: owner@example.com
          features:
            owner_password:
              type: core/secret-value
              infra:
                origin: "${FLOWISE_OWNER_PASSWORD}"
