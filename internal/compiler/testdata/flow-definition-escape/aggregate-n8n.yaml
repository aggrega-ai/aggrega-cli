apiVersion: aggrega.ai/v1alpha1
kind: Aggregate
metadata:
  name: n8n-escaped
  version: "1.0.0"
spec:
  components:
    model:
      type: core/ai-model/openai-compatible
      values:
        provider_name: litellm
        model: gpt-4o
    automation:
      type: core/ai-agent/n8n
      values:
        workflow_id: support-reply
        # The definition is the platform's export, with every opening double brace
        # written as the template action that prints one. The whole Aggregate is read
        # as a template, this comment included, so no comment here spells the braces
        # out.
        flow_definition: |
          {
            "name": "Support reply",
            "nodes": [
              {
                "parameters": {
                  "assignments": {
                    "assignments": [
                      {
                        "id": "6f1c2d1e-3b4a-4c5d-8e9f-0a1b2c3d4e5f",
                        "name": "reply",
                        "value": "={{"{{"}} $json.body.message }} for {{"{{"}} $env.SUPPORT_TEAM }}",
                        "type": "string"
                      },
                      {
                        "id": "7a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d",
                        "name": "flags",
                        "value": "={{"{{"}} { urgent: $json.body.priority > 2 } }}",
                        "type": "object"
                      }
                    ]
                  },
                  "options": {}
                },
                "id": "0d6c9a3e-1f2b-4c3d-9e8f-7a6b5c4d3e2f",
                "name": "Set reply",
                "type": "n8n-nodes-base.set",
                "typeVersion": 3.4,
                "position": [460, 300]
              },
              {
                "parameters": {
                  "jsCode": "const template = '{{"{{"}}{greeting}}}, {{"{{"}}name}}';\nreturn [{ json: { template, reply: $('Set reply').item.json.reply } }];"
                },
                "id": "1e7d0b4f-2a3c-4d4e-8f9a-8b7c6d5e4f3a",
                "name": "Shape reply",
                "type": "n8n-nodes-base.code",
                "typeVersion": 2,
                "position": [680, 300]
              }
            ],
            "connections": {
              "Set reply": {
                "main": [
                  [
                    {
                      "node": "Shape reply",
                      "type": "main",
                      "index": 0
                    }
                  ]
                ]
              }
            },
            "settings": {
              "executionOrder": "v1"
            }
          }
      uses:
        model:
          llm:
            target: model
