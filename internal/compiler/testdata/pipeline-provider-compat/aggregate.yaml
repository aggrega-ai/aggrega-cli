apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: pipeline-provider-compat
  version: "1.0.0"
spec:
  # A sub-module contributes a component, so this workspace carries a component
  # no root document declares. That component's Recipe carries a pipeline too, so
  # a pipeline reading built from the root document alone would enumerate the
  # root's steps and silently miss this one's.
  aggregates:
    data:
      type: db-module
  components:
    api:
      type: core/server
      features:
        request-guard:
          type: feature.example/request-guard
          values:
            label: "guarded"
    # A second component in the same boundary as api. It is here so the boundary
    # that carries an attachment holds more than one component: an attachment
    # written on the boundary reaches both, so a count taken over one boundary and
    # one component could not tell a reading that asks about the boundary's
    # attachment once from one that asks about it per component.
    #
    # It carries no attachment of its own and its Recipe declares no pipeline. The
    # step plugin every pipeline here names emits files under fixed names, so a
    # second pipeline writing into this boundary would collide on the output path
    # rather than exercising anything. What this component contributes is the
    # second appearance of the boundary's own attachment, which is the whole point
    # of it.
    cache:
      type: core/store
