apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  # Named after the release, so two releases of this chart write two definitions
  # and the one name they share is the Gizmo's.
  name: {{ .Release.Name }}-gizmos.example.com
spec:
  group: example.com
  names:
    kind: Gizmo
    plural: gizmos
  scope: Cluster
  versions:
    - name: v1
      served: true
      storage: true
