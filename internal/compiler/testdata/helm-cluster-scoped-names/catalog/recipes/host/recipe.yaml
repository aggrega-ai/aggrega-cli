apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: cluster-scoped-host
  version: "1.0.0"
spec:
  capability: helm
  implements: core/probe/host
  provides:
    host: "{{ .context.instance_id }}"
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    containers:
      main:
        image: host:1.0
        ports:
          p: 8080
