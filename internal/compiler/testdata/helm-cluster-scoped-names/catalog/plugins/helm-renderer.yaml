apiVersion: aggrega.ai/v1beta1
kind: Plugin
metadata:
  name: helm
  version: 1.0.0
  pluginType: provider
  description: Provider plugin serving the helm capability.
spec:
  abiVersion: v1alpha1
  provider:
    capabilities:
      - helm
    # The namespace annotation's support claim, matching what the published helm
    # provider declares, so each component's namespace is compared against a real
    # claim rather than read as uncovered.
    wellKnownAnnotations:
      - key: aggrega.ai/namespace
        purpose: Kubernetes namespace the boundary's resources render into.
        defaultBehavior: No namespace field is injected; resources inherit the apply-time context namespace.
        scope:
          - sourced
          - synthesized
    contract:
      inputKinds:
        sourced: true
        synthesized: true
        artifactsStandalone: true
      boundaryAssembly: none
      reusableInstance: true
      omits: true
  exports:
    - name: render_node
  runtime:
    maxMemoryPages: 4096
    # Generous per-call cap so guest runtime initialization completes even where
    # the host runs the Wasm engine without native code generation (a sandboxed
    # environment that denies executable memory falls back to slow interpretation).
    timeoutMs: 300000
