apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: marked-store-recipe
  version: "1.0.0"
spec:
  capability: compose
  implements: core/marked-store
  provides:
    host: "{{ .context.instance_id }}"
  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    containers:
      main:
        image: store:1.0
        ports:
          p: 5432
    services:
      store:
        type: ClusterIP
        ports:
          p: 5432
