apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: marked-consumer-recipe
  version: "1.0.0"
spec:
  capability: compose
  implements: core/marked-consumer
  provides:
    host: "{{ .context.instance_id }}"
  # The workload reads every leaf of both connections' configuration, so the
  # rendered document carries each one and the display's re-render of it has a
  # position for each.
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    containers:
      main:
        image: consumer:1.0
        variables:
          CONN_ENDPOINT: '{{ with optional .context.uses "main" "" }}{{ with .values }}{{ .endpoint }}{{ end }}{{ end }}'
          CONN_TOKEN: '{{ with optional .context.uses "main" "" }}{{ with .values }}{{ .token }}{{ end }}{{ end }}'
          CONN_SEED: '{{ with optional .context.uses "main" "" }}{{ with .values }}{{ .seed }}{{ end }}{{ end }}'
          CONN_POOL: '{{ with optional .context.uses "main" "" }}{{ with .infra }}{{ .pool_size }}{{ end }}{{ end }}'
          CONN_API_KEY: '{{ with optional .context.uses "main" "" }}{{ with .infra }}{{ .api_key }}{{ end }}{{ end }}'
          CONTROL_TOKEN: '{{ with optional .context.uses "control" "" }}{{ with .values }}{{ .token }}{{ end }}{{ end }}'
        ports:
          p: 8080
    services:
      app:
        type: ClusterIP
        ports:
          p: 8080
