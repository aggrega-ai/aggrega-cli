apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/verbatim-store
  version: "1.0.0"
  labels:
    component.aggrega.ai/type: "resource"
spec:
  schema:
    values:
      retention_seconds:
        type: string
        default: "60"
        description: How long the store keeps a message before it expires.
