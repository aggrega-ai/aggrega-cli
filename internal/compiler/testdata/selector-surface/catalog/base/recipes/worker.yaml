apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: worker-recipe
  version: "1.0.0"
spec:
  capability: helm
  implements: core/worker
  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    replicas: {{ optional .infra `replicas` 1 }}
    containers:
      worker:
        image: worker:latest
        ports:
          http: {{ optional .infra `port` 8080 }}
    services:
      svc:
        type: ClusterIP
        ports:
          http: {{ optional .infra `port` 8080 }}
