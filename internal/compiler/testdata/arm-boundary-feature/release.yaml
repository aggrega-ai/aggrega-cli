apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: arm-boundary-feature
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate.yaml
  manifest: ./manifest.yaml
  boundaries:
    stack:
      directory: ./dist/stack
      features:
        settings:
          type: example/shared-settings
      components:
        alpha: {}
        beta: {}
    edge:
      directory: ./dist/edge
      features:
        settings:
          type: example/shared-settings
      components:
        gamma: {}
