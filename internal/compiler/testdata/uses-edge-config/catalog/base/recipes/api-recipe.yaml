apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: api-recipe
  version: "1.0.0"
spec:
  capability: compose
  implements: core/api
  provides:
    host: "{{ .context.instance_id }}"
    port: 8080
  # The workload reads connection-scoped per-edge config from the topology pipe:
  # developer `values` and operator `infra` on the `databases` edge (alias "main"),
  # and operator `infra` on the Release-wired `caches` edge (alias "primary"). A
  # Release may leave either socket unwired, so each alias is read through
  # `optional`, which tests for the key before reading it. The nested `with`
  # guards keep rendering clean when an edge or pillar is absent (the fields are
  # omitempty in the enriched edge).
  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    containers:
      main:
        image: api:1.0
        variables:
          DB_PROTOCOL: '{{ with optional .context.uses "main" "" }}{{ with .values }}{{ .protocol }}{{ end }}{{ end }}'
          DB_STATEMENT_CACHE: '{{ with optional .context.uses "main" "" }}{{ with .values }}{{ .statement_cache }}{{ end }}{{ end }}'
          DB_POOL_SIZE: '{{ with optional .context.uses "main" "" }}{{ with .infra }}{{ .pool_size }}{{ end }}{{ end }}'
          DB_TLS_MODE: '{{ with optional .context.uses "main" "" }}{{ with .infra }}{{ .tls_mode }}{{ end }}{{ end }}'
          CACHE_POOL: '{{ with optional .context.uses "primary" "" }}{{ with .infra }}{{ .pool_size }}{{ end }}{{ end }}'
        ports:
          p: 8080
    services:
      api:
        type: ClusterIP
        ports:
          p: 8080
