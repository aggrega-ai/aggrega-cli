apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: cloudformation-name-clash
  version: "1.0.0"
  description: >
    Two MariaDB databases whose instance names differ only in which separator
    they use. A CloudFormation resource name admits neither separator, so both
    instances name their resource identically — the case the build has to refuse
    rather than emit one resource where two databases were declared.
spec:
  components:
    payments-db:
      type: core/datastore/mariadb
      values:
        database: payments
      features:
        root_password:
          type: core/generated-secret
    payments_db:
      type: core/datastore/mariadb
      values:
        database: paymentsalt
      features:
        root_password:
          type: core/generated-secret
