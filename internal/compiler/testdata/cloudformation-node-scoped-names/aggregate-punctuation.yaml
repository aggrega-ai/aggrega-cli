apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: cloudformation-punctuation
  version: "1.0.0"
  description: >
    Three MariaDB databases whose instance names differ only in punctuation.
    They assemble into one CloudFormation stack, so each database's resource
    name has to survive alongside the other two: the three names collapse onto
    each other under any transform that simply drops the punctuation.
spec:
  components:
    aaa-db:
      type: core/datastore/mariadb
      values:
        database: aaadb
      features:
        root_password:
          type: core/generated-secret
    payments-db:
      type: core/datastore/mariadb
      values:
        database: payments
      features:
        root_password:
          type: core/generated-secret
    paymentsdb:
      type: core/datastore/mariadb
      values:
        database: paymentsflat
      features:
        root_password:
          type: core/generated-secret
