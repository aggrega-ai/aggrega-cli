apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: feature-matrix-helm-synth
  environment: production
  version: "1.0.0"
spec:
  aggregate: ../aggregate.yaml
  manifest: feature-matrix-manifest-helm-synthesized
  boundaries:
    app:
      directory: ./dist/app
      annotations:
        aggrega.ai/namespace: "feature-matrix"
      syncWave: 1
      components:
        api:
          infra:
            replicas: 2
        db:
          infra:
            replicas: 1
