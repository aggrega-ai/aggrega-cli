apiVersion: aggrega.ai/v1alpha1
kind: Release
metadata:
  name: feature-matrix-compose-bridge
  environment: production
  version: "1.0.0"
spec:
  aggregate: ../aggregate.yaml
  manifest: feature-matrix-manifest-compose-sourced-with-bridge
  boundaries:
    cluster:
      directory: ./dist/cluster
      features:
        bridge:
          type: core/compose-bridge:1.0.0
      boundaries:
        services-net:
          directory: "{{ .parent_boundary.directory }}"
          annotations:
            aggrega.ai/namespace: "services"
          components:
            api:
              infra:
                replicas: 1
        data-net:
          directory: "{{ .parent_boundary.directory }}"
          annotations:
            aggrega.ai/namespace: "data"
          components:
            db:
              infra:
                replicas: 1
