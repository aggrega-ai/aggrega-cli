apiVersion: aggrega.ai/v1alpha1
kind: Release
metadata:
  name: feature-matrix-helm-sourced-art
  environment: production
  version: "1.0.0"
spec:
  aggregate: ../aggregate.yaml
  manifest: feature-matrix-manifest-helm-sourced-with-artifacts
  boundaries:
    app:
      directory: ./dist/app
      annotations:
        aggrega.ai/namespace: "feature-matrix"
      syncWave: 2
      components:
        api:
          infra:
            replicas: 2
        db:
          infra:
            replicas: 1
