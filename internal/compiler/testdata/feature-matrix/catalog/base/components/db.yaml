apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/database/mariadb
  version: "1.0.0"
  labels:
    component.aggrega.ai/type: "stateful-server"
spec:
  schema: |
    values: { database?: string | *"app", port?: int | *3306 }
    provides: { host: string, port: string }
  secretsSchema:
    root_password:
      inject: []
    db_password:
      inject: ["env", "file"]
