apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: feature-matrix-api-helm-sourced-art
  version: "1.0.0"
spec:
  provider: helm
  implements: core/server
  source: ./charts/api
  provides:
    host: "{{ .context.instance_id }}.svc.cluster.local"
    service_port: "{{ optional .infra `port` 8080 }}"
  valuesMapping: |
    {
      "image": "api-server:1.0.0",
      "replicas": {{ optional .infra `replicas` 1 }},
      "ports": ["{{ optional .infra `port` 8080 }}:{{ optional .infra `port` 8080 }}"],
      "environment": {
        "PORT": "{{ optional .infra `port` 8080 }}"
        {{- if .context.inject.env.DB_HOST }},
        "DB_HOST": "{{ .context.inject.env.DB_HOST }}"
        {{- end }}
        {{- if .context.inject.env.DB_PORT }},
        "DB_PORT": "{{ .context.inject.env.DB_PORT }}"
        {{- end }}
      }
    }
  artifacts:
    servicemonitor.yaml: |
      apiVersion: monitoring.coreos.com/v1
      kind: ServiceMonitor
      metadata:
        name: {{ .context.instance_id }}-metrics
      spec:
        selector:
          matchLabels:
            app: {{ .context.instance_id }}
        endpoints:
          - port: web
            path: /metrics
            interval: 30s
