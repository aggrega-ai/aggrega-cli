apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: feature-matrix-api-blackbox-violation
  version: "1.0.0"
spec:
  capability: helm
  implements: core/server
  provides:
    host: "{{ .context.instance_id }}.svc.cluster.local"
    service_port: "{{ optional .infra `port` 8080 }}"
  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    replicas: 1
    containers:
      main:
        image: api-server:1.0.0
        ports:
          web: {{ optional .infra `port` 8080 }}
    services:
      web:
        type: ClusterIP
        ports:
          web: {{ optional .infra `port` 8080 }}
