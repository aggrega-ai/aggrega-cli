apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: feature-matrix-db-blackbox-violation
  version: "1.0.0"
spec:
  target: helm
  implements: core/datastore/mariadb
  provides:
    host: "{{ .context.instance_id }}.svc.cluster.local"
    port: "{{ optional .infra `port` 3306 }}"
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    replicas: 1
    containers:
      main:
        image: mariadb:11
        ports:
          db: {{ optional .infra `port` 3306 }}
        variables:
          MARIADB_DATABASE: "{{ .values.database }}"
        secrets:
          ROOT_PASSWORD:
            from: root_password
            as: env
    services:
      db:
        type: ClusterIP
        ports:
          db: {{ optional .infra `port` 3306 }}
