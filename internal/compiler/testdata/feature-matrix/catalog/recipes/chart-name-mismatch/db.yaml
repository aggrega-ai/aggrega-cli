apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: feature-matrix-db-chart-name-mismatch
  version: "1.0.0"
spec:
  capability: helm-chart
  implements: core/datastore/mariadb
  source: ./charts/db
  provides:
    host: "{{ .context.instance_id }}.svc.cluster.local"
    port: "{{ optional .infra `port` 3306 }}"
  valuesMapping: |
    {
      "image": "mariadb:11",
      "replicas": {{ optional .infra `replicas` 1 }}
    }
