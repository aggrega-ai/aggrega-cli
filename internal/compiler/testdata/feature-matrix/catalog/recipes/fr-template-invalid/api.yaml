apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: feature-matrix-api-fr-invalid
  version: "1.0.0"
spec:
  provider: compose
  implements: core/server
  provides:
    host: "{{ .context.instance_id }}"
    service_port: "{{ .values.port }}"
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    replicas: 1
    containers:
      main:
        image: api-server:1.0.0
        ports:
          web: {{ .values.port }}
    services:
      api:
        type: ClusterIP
        ports:
          web: {{ .values.port }}
