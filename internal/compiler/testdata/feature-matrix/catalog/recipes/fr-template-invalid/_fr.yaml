apiVersion: aggrega.ai/v1alpha1
kind: FeatureRecipe
metadata:
  name: invalid-boundary-fr
  version: "1.0.0"
spec:
  target: compose
  implements: core/invalid-boundary-fr:1.0.0
  executionScope: boundary
  # source paired with valuesMapping so the FeatureRecipe passes the
  # valuesMapping-requires-source load rule and reaches the boundary-scope
  # template-field validation this fixture exercises.
  source: ./placeholder

  # Invalid: an executionScope:boundary FR template MUST NOT reference
  # per-component-only fields (.context.*, .workload.*, .secret_name,
  # .inject, .inject_raw). The reference below to .context.instance_id
  # should trigger ErrFRTemplateInvalidField at FR validation time.
  valuesMapping: |
    services:
      placeholder:
        environment:
          INSTANCE: "{{ .context.instance_id }}"
