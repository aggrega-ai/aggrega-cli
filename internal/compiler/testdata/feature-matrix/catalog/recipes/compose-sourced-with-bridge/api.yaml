apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: feature-matrix-api-compose-bridge
  version: "1.0.0"
spec:
  target: compose
  implements: core/server
  source: ./sources/api.yaml
  provides:
    host: "{{ .context.instance_id }}"
    service_port: "{{ optional .infra `port` 8080 }}"
  valuesMapping: |
    {
      "services": {
        "api": {
          "environment": {
            "PORT": "{{ optional .infra `port` 8080 }}"
            {{- if .context.inject.env.DB_HOST }},
            "DB_HOST": "{{ .context.inject.env.DB_HOST }}"
            {{- end }}
            {{- if .context.inject.env.DB_PORT }},
            "DB_PORT": "{{ .context.inject.env.DB_PORT }}"
            {{- end }}
          }
        }
      }
    }
