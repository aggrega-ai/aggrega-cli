apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: feature-matrix-db-helm-sourced-art-collision
  version: "1.0.0"
spec:
  provider: helm
  implements: core/database/mariadb
  provides:
    host: "{{ .context.instance_id }}.svc.cluster.local"
    port: "{{ .infra.port | default 3306 }}"
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    replicas: {{ .infra.replicas | default 1 }}
    containers:
      main:
        image: mariadb:11
        ports:
          db: {{ .infra.port | default 3306 }}
        variables:
          MARIADB_DATABASE: "{{ .values.database }}"
    services:
      db:
        type: ClusterIP
        ports:
          db: {{ .infra.port | default 3306 }}
