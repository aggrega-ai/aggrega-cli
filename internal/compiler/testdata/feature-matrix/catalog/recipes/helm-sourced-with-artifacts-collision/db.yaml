apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: feature-matrix-db-helm-sourced-art-collision
  version: "1.0.0"
spec:
  capability: helm
  implements: core/datastore/mariadb
  provides:
    host: "{{ .context.instance_id }}.svc.cluster.local"
    port: "{{ optional .infra `port` 3306 }}"
  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    replicas: {{ optional .infra `replicas` 1 }}
    containers:
      main:
        image: mariadb:11
        ports:
          db: {{ optional .infra `port` 3306 }}
        variables:
          MARIADB_DATABASE: "{{ .values.database }}"
    services:
      db:
        type: ClusterIP
        ports:
          db: {{ optional .infra `port` 3306 }}
