apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: feature-matrix-api-helm-sourced-art-collision
  version: "1.0.0"
spec:
  capability: helm
  implements: core/server
  source: ./charts/api
  provides:
    host: "{{ .context.instance_id }}.svc.cluster.local"
    service_port: "{{ optional .infra `port` 8080 }}"
  valuesMapping: |
    {
      "image": "api-server:1.0.0",
      "replicas": {{ optional .infra `replicas` 1 }},
      "ports": ["{{ optional .infra `port` 8080 }}:{{ optional .infra `port` 8080 }}"]
    }
  artifacts:
    api-deployment-feature-matrix-api.yaml: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: collision-target
      data:
        note: "this artifact's filename collides with the chart-rendered deployment"
