apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-server
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: web-server
  template:
    metadata:
      labels:
        app: web-server
    spec:
      containers:
        - name: server
          image: example/web:1
          ports:
            - name: http
              containerPort: 8080
