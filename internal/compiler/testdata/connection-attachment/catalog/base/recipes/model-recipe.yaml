apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: conn-model-recipe
  version: "1.0.0"
spec:
  capability: compose
  implements: conn/model
  provides:
    host: "{{ .context.instance_id }}"
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    containers:
      main:
        image: model:1.0
