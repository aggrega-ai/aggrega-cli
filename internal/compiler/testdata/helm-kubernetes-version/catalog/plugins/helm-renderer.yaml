apiVersion: aggrega.ai/v1alpha1
kind: Plugin
metadata:
  name: helm
  version: 1.0.0
  pluginType: provider
  description: Provider plugin serving the helm capability.
spec:
  abiVersion: v1alpha1
  provider:
    capabilities:
      - helm
    # The support claim for the key this fixture sets: the helm provider reads it
    # when it renders a chart from source, so the build compares the annotation
    # against a real claim rather than reading it as uncovered.
    wellKnownAnnotations:
      - key: aggrega.ai/kubernetes-version
        purpose: Kubernetes version a chart rendered from source is rendered for, read by its templates as .Capabilities.KubeVersion.
        defaultBehavior: The version helm template of the same helm release renders for.
        scope:
          - sourced
    contract:
      inputKinds:
        sourced: true
        synthesized: true
        artifactsStandalone: true
      boundaryAssembly: none
      reusableInstance: true
      omits: true
  exports:
    - name: render_node
  runtime:
    maxMemoryPages: 4096
    # Generous per-call cap so guest runtime initialization completes even where
    # the host runs the Wasm engine without native code generation (a sandboxed
    # environment that denies executable memory falls back to slow interpretation).
    timeoutMs: 300000
