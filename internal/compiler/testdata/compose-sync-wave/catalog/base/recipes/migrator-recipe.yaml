apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: migrator-recipe
  version: "1.0.0"
spec:
  capability: compose
  implements: core/migrator
  # No health: block, so the synthesized service declares no healthcheck. That
  # is the case a wave-derived dependency cannot gate on health.
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    containers:
      main:
        image: migrator:1.0
        command: ["/bin/migrate"]
