apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: arm-no-resources
  version: 1.0.0
  description: >
    A fragment that declares a parameter and no resource, so there is nothing for
    provenance to describe.
spec:
  capability: arm
  implements: example/resource/plain:1.0.0
  artifacts:
    fragment.yaml: |
      parameters:
        location:
          type: string
          defaultValue: "[resourceGroup().location]"
