apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: server-recipe
  version: "1.0.0"
spec:
  provider: helm
  implements: core/server
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    replicas: {{ optional .infra `replicas` 1 }}
    containers:
      server:
        image: test-server:latest
        ports:
          web: {{ optional .infra `port` 8080 }}
    services:
      svc:
        type: ClusterIP
        ports:
          web: {{ optional .infra `port` 8080 }}
  pipeline:
    - id: annotate_and_emit
      plugin: frp-step-patch-rust.wasm
      function: step
      with: |
        marker: pipeline-render-test
