apiVersion: aggrega.ai/v1alpha1
kind: Plugin
metadata:
  name: compose-renderer
  version: 1.0.0
  description: Wasm rendering engine for the compose provider.
spec:
  # Content-addressed reference to the embedded compose provider artifact; the
  # plugin-resolution cascade's embed tier serves these exact bytes, so the
  # build resolves the guest with no sidecar, cache, or lockfile.
  plugin: oci://hub.aggrega.ai/plugins/compose-provider@sha256:573c77bbc3c99cea31c39562f6c484c4b655dd0460dc4e9741d6043e56c9dedf
  pluginType: provider
  abiVersion: v1alpha1
  compatibleProviders:
    - compose
  # BOTH exports: render_node drives per-node render/synthesis; assemble_boundary
  # drives the per-dispatch-group merge into a single docker-compose.yaml. The
  # dual-export signal routes the compose provider to the assembler adapter.
  exports:
    - name: render_node
    - name: assemble_boundary
  runtime:
    maxMemoryPages: 4096
    # Generous per-call cap so guest runtime initialization completes even where
    # the host runs the Wasm engine without native code generation (a sandboxed
    # environment that denies executable memory falls back to slow interpretation).
    timeoutMs: 300000
