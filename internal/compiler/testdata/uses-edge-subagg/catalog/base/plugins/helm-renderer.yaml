apiVersion: aggrega.ai/v1alpha1
kind: Plugin
metadata:
  name: helm-renderer
  version: 1.0.0
  description: Wasm rendering engine for the helm provider.
spec:
  # Content-addressed reference to the embedded helm provider artifact; the
  # plugin-resolution cascade's embed tier serves these exact bytes, so the
  # build resolves the guest with no sidecar, cache, or lockfile.
  plugin: oci://hub.aggrega.ai/plugins/helm-provider@sha256:733cc4441c5fa57a82ebc91fabfcee76671bbeb0fd7574f547a815e2018beabb
  pluginType: provider
  abiVersion: v1alpha1
  compatibleProviders:
    - helm
  exports:
    - name: render_node
  runtime:
    maxMemoryPages: 4096
    # Generous per-call cap so guest runtime initialization completes even where
    # the host runs the Wasm engine without native code generation (a sandboxed
    # environment that denies executable memory falls back to slow interpretation).
    timeoutMs: 300000
