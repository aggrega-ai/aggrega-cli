apiVersion: aggrega.ai/v1alpha1
kind: Aggregate
metadata:
  name: scopefeat-submodule
  version: "1.0.0"
spec:
  subsystems:
    data:
      components:
        store3:
          type: core/db
    tier:
      # A subsystem-wide feature inside the sub-aggregate, carrying a uses edge
      # to a sub-aggregate-root sibling. It cascades onto the sub-aggregate's own
      # components beneath this subsystem, read from the sub-aggregate's document.
      features:
        shared:
          type: core/sidecar
          uses:
            peer:
              link:
                target: store3
      components:
        svc:
          type: core/api
