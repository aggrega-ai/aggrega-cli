apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: badsocket-submodule
  version: "1.0.0"
spec:
  components:
    # `bad` authors two edges from the same component so one graph carries both
    # declaration values. `databases` is declared by the core/api usesSchema, so
    # its edge is marked declared and its selector is evaluated as before.
    # `nonexistent` is not declared anywhere, so its edge is marked ad-hoc and
    # there is no selector to evaluate. The target exists in both cases, so the
    # dangling sweep stays quiet and the marker is what the build is being read
    # for — on a flattened sub-aggregate component, which is where the socket
    # guards previously had a coverage gap.
    bad:
      type: core/api
      uses:
        databases:
          main:
            target: store2
        nonexistent:
          x:
            target: store2
    store2:
      type: core/db
