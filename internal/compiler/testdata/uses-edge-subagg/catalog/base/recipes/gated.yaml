apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata: { name: gated-recipe, version: "1.0.0" }
spec:
  provider: compose
  implements: core/gated
  provides:
    host: "{{ .context.instance_id }}"
    port: 8080
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    containers:
      main:
        image: gated:1.0
        ports:
          p: 8080
    services:
      gated:
        type: ClusterIP
        ports:
          p: 8080
