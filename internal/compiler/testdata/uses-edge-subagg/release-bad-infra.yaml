apiVersion: aggrega.ai/v1alpha1
kind: Release
metadata:
  name: subagg-release-bad-infra
  environment: local
  version: "1.0.0"
spec:
  aggregate: subagg-app
  manifest: subagg-manifest
  boundaries:
    cluster:
      directory: ./dist/cluster
      components:
        # data.consumer is the flattened node ID of the sub-aggregate's
        # `consumer` component. pool_size 999 exceeds the socket infraSchema
        # maximum (100): if Step-1 per-edge conformance covers sub-aggregate
        # components, this halts; if it skips them, the build succeeds and the
        # non-conforming infra flows unvalidated.
        data.consumer:
          uses:
            databases:
              main:
                infra:
                  pool_size: 999
        data.store: {}
