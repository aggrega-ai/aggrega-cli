apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: store-recipe
  version: "1.0.0"
spec:
  capability: cloudformation
  implements: core/store
  # A template declaring a template-wide Description, which no merge can fold, and
  # a template-wide Transform, which the stack builds from every contributor's,
  # alongside a Metadata block, which is name-keyed and folds like any other. The
  # build must carry the Metadata and the Transform — no other contributor declares
  # serverless content for AWS::LanguageExtensions to change — and name the
  # Description out of band rather than adopt one contributor's answer.
  artifacts:
    template.yaml: |
      Description: The application data store and the policy that fronts it.
      Transform: AWS::LanguageExtensions
      Metadata:
        StoreDocumentation:
          Purpose: the bucket the application reads its catalog from
      Resources:
        StoreBucket:
          Type: AWS::S3::Bucket
