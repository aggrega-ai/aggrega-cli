apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: arm-scope-link-consumer
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-link.yaml
  manifest: ./manifest-link.yaml
  boundaries:
    data:
      directory: ./dist/data
      components:
        store: {}
    web:
      directory: ./dist/web
      annotations:
        aggrega.ai/azure-deployment-scope: subscription
        aggrega.ai/azure-resource-group: orders-web
      components:
        app: {}
