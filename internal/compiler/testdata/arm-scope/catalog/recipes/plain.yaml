apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: arm-scope-plain
  version: 1.0.0
  description: >
    A storage account written as a fragment of a resource group template, with
    the template parameter its sku reads.
spec:
  capability: arm
  implements: example/resource/plain:1.0.0
  artifacts:
    plain.yaml: |
      parameters:
        {{ .values.param }}:
          type: string
          defaultValue: "{{ .values.tier }}"
      resources:
        {{ .values.symbol }}:
          type: Microsoft.Storage/storageAccounts
          apiVersion: "2023-05-01"
          name: "{{ .context.instance_id }}"
          location: "[resourceGroup().location]"
          kind: StorageV2
          sku:
            name: "[parameters('{{ .values.param }}')]"
