apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: arm-scope-link
  version: "1.0.0"
  description: >
    A datastore and an application that reads its host through an injection,
    for a Release to place in two boundaries deployed at different scopes.
spec:
  components:
    store:
      type: example/datastore/store
    app:
      type: example/compute/consumer
      uses:
        database:
          primary:
            target: store
            inject:
              env:
                - in: DB_HOST
                  from: host
