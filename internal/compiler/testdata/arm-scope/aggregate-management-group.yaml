apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: arm-scope-management-group
  version: "1.0.0"
  description: >
    A policy definition declared by a template deployed to a management group,
    a resource group declared by a template deployed to a subscription, and a
    storage account written for a resource group.
spec:
  components:
    policy:
      type: example/scope/policy
    group:
      type: example/scope/group
    store:
      type: example/resource/plain
      values:
        symbol: Store
        tier: Standard_LRS
