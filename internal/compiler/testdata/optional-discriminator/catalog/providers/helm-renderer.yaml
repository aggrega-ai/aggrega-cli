apiVersion: aggrega.ai/v1alpha1
kind: Plugin
metadata:
  name: provider/helm
  version: 1.0.0
  description: Wasm rendering engine for the helm provider.
spec:
  pluginType: provider
  abiVersion: v1alpha1
  targets:
    - helm
  exports:
    - name: render_node
  runtime:
    maxMemoryPages: 4096
    # Generous per-call cap so guest runtime initialization completes even where
    # the host runs the Wasm engine without native code generation (a sandboxed
    # environment that denies executable memory falls back to slow interpretation).
    timeoutMs: 300000
