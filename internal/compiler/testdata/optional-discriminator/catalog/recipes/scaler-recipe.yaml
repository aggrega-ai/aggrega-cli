apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: scaler-recipe
  version: "1.0.0"
spec:
  capability: compose
  implements: local/scaler
  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    containers:
      main:
        image: scaler:1.0
        variables:
          REPLICA_COUNT: "{{ optional .infra `replicas` 1 }}"
