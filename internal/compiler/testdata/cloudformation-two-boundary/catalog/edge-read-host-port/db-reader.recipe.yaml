# One of the alternative db-reader Recipes under this fixture's catalog directory,
# each in its own subdirectory because they share one Recipe identity
# (cloudformation/db-reader:1.0.0). A build loads exactly one of them in place of
# the catalog's own db-reader Recipe.
#
# This variant reads the database host and port directly off the connection,
# each as a whole property value. The port is plain text, so it is written
# back as the value itself and no export is published for it.

apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: db-reader
  version: 1.0.0
  description: >
    The fixture's application reading the database host and port directly off its connection.
  maintainers:
    - name: "Massimiliano Ferrero"
      email: "m.ferrero@cognitio.it"
spec:
  capability: cloudformation
  implements: example/compute/db-reader:1.0.0

  locals:
    logical_id: '{{ capitalizedWords .context.instance_id }}'

  artifacts:
    template.yaml: |
      Resources:
        {{ .locals.logical_id }}:
          Type: AWS::SSM::Parameter
          Properties:
            Name: "{{ .values.parameter_name }}"
            Type: String
            Tier: "{{ .infra.tier }}"
            Value: {{ .context.uses.primary.provides.host }}
        {{ .locals.logical_id }}Port:
          Type: AWS::SSM::Parameter
          Properties:
            Name: "{{ .values.parameter_name }}-port"
            Type: String
            Tier: "{{ .infra.tier }}"
            Value: {{ .context.uses.primary.provides.port }}
