# Copies the database host it reads directly off the connection onto the
# component's inject pipe, which the build accepts.
apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: direct-host
  version: "1.0.0"
  description: >
    Copies the database host read off the connection onto the inject pipe.
spec:
  capability: cloudformation
  implements: example/direct-host:1.0.0
  injectMapping: |
    {"env": {"DIRECT_HOST": "{{ .context.uses.primary.provides.host }}"}}
