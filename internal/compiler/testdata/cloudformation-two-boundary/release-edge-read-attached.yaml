# The database in one stack and, in another, the application whose attachment's
# inject mapping reads the database host directly off the connection.
apiVersion: aggrega.ai/v1alpha1
kind: Release
metadata:
  name: cloudformation-two-boundary
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-edge-read-attached.yaml
  manifest: ./manifest-edge-read-attached.yaml
  boundaries:
    stack-a:
      directory: ./dist/stack-a
      components:
        db:
          infra:
            engine_version: "11.4"
            storage:
              size: 100Gi
              type: gp3
            ha:
              enabled: false
              read_replicas: 0
    stack-b:
      directory: ./dist/stack-b
      components:
        app-b: {}
