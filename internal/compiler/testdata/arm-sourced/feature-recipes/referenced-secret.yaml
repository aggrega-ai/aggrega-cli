apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: arm-referenced-secret
  version: 1.0.0
  description: >
    Names a secret held outside the template and publishes the locator, as
    written, for a consumer to point at. It emits nothing of its own, so the
    credential never passes through a rendered artifact.
spec:
  capability: arm
  implements: core/referenced-secret:1.0.0

  # origin is read from whichever pillar carries it, values where the developer
  # wrote it and infra where the operator did. values is read only through
  # optional, so a key present in values never shadows the one in infra.
  provides:
    name: '{{ optional .values "origin" (optional .infra "origin" "") }}'
    key: "{{ .values.key }}"
