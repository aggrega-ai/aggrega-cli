apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-drop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-drop
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-drop
    spec:
      containers:
        - name: server
          image: example/drop:1
          ports:
            - name: http
              containerPort: 8080
