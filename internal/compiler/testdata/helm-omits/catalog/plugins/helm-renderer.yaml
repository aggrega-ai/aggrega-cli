apiVersion: aggrega.ai/v1beta1
kind: Plugin
metadata:
  name: helm
  version: 1.0.0
  pluginType: provider
  description: Provider plugin serving the helm capability.
spec:
  abiVersion: v1alpha1
  provider:
    capabilities:
      - helm
    # The contract the helm provider declares, omits included: this corpus turns
    # on the provider leaving documents out, and the claim here is compared with
    # the one the provider itself reports when it loads.
    contract:
      inputKinds:
        sourced: true
        synthesized: true
        artifactsStandalone: true
      boundaryAssembly: none
      reusableInstance: true
      omits: true
  exports:
    - name: render_node
  runtime:
    maxMemoryPages: 4096
    # Generous per-call cap so guest runtime initialization completes even where
    # the host runs the Wasm engine without native code generation (a sandboxed
    # environment that denies executable memory falls back to slow interpretation).
    timeoutMs: 300000
