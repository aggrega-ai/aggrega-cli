apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: app-recipe
  version: "1.0.0"
spec:
  capability: compose
  implements: core/app
  provides:
    host: "{{ .context.instance_id }}"
  # Every declared-sensitive datum reaches the rendered artifact in the clear:
  # the component's own values leaf, the nested one, and the delivery key the
  # attachment's inject mapping fills from a sensitive provides key. That is
  # the point of the fixture — the artifact is the deployable and is never
  # redacted, so the boundary test can assert the real values here and the
  # placeholder in the trace.
  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    containers:
      main:
        image: app:1.0
        variables:
          APP_NAME: '{{ .values.appName }}'
          APP_DB_PASSWORD: '{{ .values.dbPassword }}'
          APP_ADMIN_TOKEN: '{{ .values.tuning.adminToken }}'
          APP_POOL_SIZE: '{{ .values.tuning.poolSize }}'
          DATABASE_PASSWORD: '{{ .context.inject.env.DATABASE_PASSWORD }}'
          DATABASE_NAME: '{{ .context.inject.env.DATABASE_NAME }}'
        ports:
          p: 8080
    services:
      app:
        type: ClusterIP
        ports:
          p: 8080
