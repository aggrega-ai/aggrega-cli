apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: own-declarations-recipe
  version: "1.0.0"
  description: >
    Reads the credential attached to the component itself, and the component's
    own provides, into its workload: a declared values leaf beside an undeclared
    one, a declared provides key of the attachment beside an undeclared one, and
    a provides key the component declares sensitive beside one it leaves
    undeclared. The workload reads no declared leaf of the component's own
    values, so nothing else it reads is declared. Every value reaches the
    rendered artifact in the clear — the artifact is the deployable and is never
    redacted.
spec:
  capability: compose
  implements: core/own-declarations
  provides:
    session: "sess-{{ .values.sessionToken }}"
    host: "{{ .context.instance_id }}"
  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    containers:
      main:
        image: own:1.0
        variables:
          APP_NAME: '{{ .values.appName }}'
          OWN_PASSWORD: '{{ .features.credentials.values.literalPassword }}'
          OWN_LOCATOR: '{{ .features.credentials.values.secretName }}'
          OWN_PROVIDED: '{{ .features.credentials.provides.password }}'
          OWN_NAME: '{{ .features.credentials.provides.name }}'
          SESSION: '{{ .provides.session }}'
          HOST: '{{ .provides.host }}'
        ports:
          p: 8080
    services:
      app:
        type: ClusterIP
        ports:
          p: 8080
