apiVersion: aggrega.ai/v1beta1
kind: Feature
metadata:
  name: feature.test/db-credential
  version: "1.0.0"
spec:
  schema:
    values:
      # secretName is a locator — the public half of a referenced credential —
      # and is deliberately left unmarked. literalPassword is the by-value half
      # and is declared. Both live on the same attachment, so a display that
      # hid everything on a sensitive attachment would wrongly hide the locator.
      secretName: { type: string }
      literalPassword: { type: string, sensitive: true }
    provides:
      # The delivery-key taint follows a `from:` naming one of these. `name` is
      # a public locator; `password` is the secret.
      name: { type: string, required: true }
      password: { type: string, required: true, sensitive: true }
