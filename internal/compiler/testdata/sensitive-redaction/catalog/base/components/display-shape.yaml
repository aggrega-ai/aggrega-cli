apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/display-shape
  version: "1.0.0"
  labels:
    component.aggrega.ai/type: "server"
spec:
  # One declared leaf beside an undeclared sibling. The Recipe bound to this type
  # interpolates the declared one inside surrounding literal text, so the display
  # re-render has to place the replacement text at exactly that position and leave
  # the characters around it alone.
  schema:
    values:
      appName: { type: string }
      dbPassword: { type: string, sensitive: true }
    provides:
      host: { type: string, required: true }
