apiVersion: aggrega.ai/v1alpha1
kind: Aggregate
metadata:
  name: governance-wire-no-marked-delivery
  version: "1.0.0"
spec:
  components:
    app:
      type: gov/app
      values:
        appName: demo
      features:
        credentials:
          type: feature.gov/db-credential
          # literalPassword is retained deliberately, and it is what this
          # variant isolates. The Feature declares that leaf sensitive, so
          # authoring a value at it puts a declared-sensitive datum in the
          # attachment's own payload — the authored-leaf route — while the
          # delivery route below carries none. A policy denying on either
          # route therefore still denies here, and NAMES the authored leaf
          # rather than a delivery key, which is what shows the two routes
          # are distinguished rather than folded together.
          values:
            secretName: db-creds
            literalPassword: by-value-plaintext
          inject:
            env:
              # The ONE difference from aggregate-both.yaml: this delivery key
              # fills from the public locator `name` rather than from the
              # declared-sensitive `password`, so no delivery key is marked. The
              # delivery key's own name is left unchanged on purpose — moving it
              # too would put two variables between the two documents and the
              # switch in which route a verdict names would no longer isolate
              # the cause.
              - in: DATABASE_PASSWORD
                from: name
        metrics:
          type: feature.gov/telemetry
          values:
            endpoint: "http://collector:4318"
