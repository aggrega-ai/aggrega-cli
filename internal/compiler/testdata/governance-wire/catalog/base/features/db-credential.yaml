apiVersion: aggrega.ai/v1alpha1
kind: Feature
metadata:
  name: feature.gov/db-credential
  version: "1.0.0"
  labels:
    # The family label the standard library marks a credential Feature with. A
    # policy reproduces the credential judgement from this label alone.
    feature.aggrega.ai/kind: secret
    # A label of the catalog author's own invention. Nothing in the compiler
    # knows this key exists, so a policy that reads it back proves the labels
    # crossed the socket boundary unfiltered.
    governance.example/rotation: quarterly
spec:
  schema:
    values:
      # secretName is a locator — the public half of a referenced credential —
      # and is deliberately unmarked. literalPassword is the by-value half.
      secretName: { type: string }
      literalPassword: { type: string, sensitive: true }
    provides:
      # A delivery key filling from `password` inherits the marking; one
      # filling from `name` does not.
      name: { type: string, required: true }
      password: { type: string, required: true, sensitive: true }
