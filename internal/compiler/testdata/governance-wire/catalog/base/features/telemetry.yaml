apiVersion: aggrega.ai/v1beta1
kind: Feature
metadata:
  name: feature.gov/telemetry
  version: "1.0.0"
  labels:
    # Deliberately carries NO feature.aggrega.ai/kind label, so a labels-only
    # credential rule has something it must not fire on. The reserved key's
    # value set is constrained by the Feature envelope schema, so a second
    # family value is not available to declare here.
    governance.example/tier: observability
    governance.example/rotation: never
  annotations:
    # Carries the same annotation key the credential Feature declares, with a
    # COMPLETED review rather than an outstanding one, so a rule keyed on the
    # outstanding value has an attachment in the same build that it must not
    # fire on. A rule firing on the key's mere presence would fail that.
    governance.example/review-ticket: OPS-4417
spec:
  schema:
    values:
      endpoint: { type: string }
    provides:
      endpoint_url: { type: string, required: true }
