apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: gov-db-credential-compose
  version: "1.0.0"
  description: >
    Compose implementation of feature.gov/db-credential. It renders no resource
    of its own; its whole job is to fulfil the Feature's provides contract so
    the attachment's inject mapping has something to deliver.
spec:
  capability: compose
  implements: feature.gov/db-credential
  provides:
    name: "{{ .values.secretName }}"
    password: "s3cr3t-from-feature"
