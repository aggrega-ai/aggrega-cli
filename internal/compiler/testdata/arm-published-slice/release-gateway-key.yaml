apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: arm-gateway-key
  environment: production
  version: "1.0.0"
spec:
  aggregate: ./aggregate-gateway-key.yaml
  manifest: ./manifest.yaml
  boundaries:
    stack:
      directory: ./dist/stack
      components:
        gateway:
          infra:
            api_management_name: apim-models
            api_path: models/chat
            backend_url: https://models.openai.azure.com/openai/v1
            backend_authentication: provider_key
