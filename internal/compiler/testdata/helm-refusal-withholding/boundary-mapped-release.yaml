# A boundary-scope feature's values mapping writes the declared infra leaf into a chart value its schema refuses.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: helm-refusal-boundary-mapped-release
  environment: local
  version: "1.0.0"
spec:
  aggregate: ./holder-app.yaml
  manifest: ./boundary-mapped-manifest.yaml
  boundaries:
    main:
      directory: ./dist/main
      features:
        audit:
          type: feature.test/helm-refusal-boundary-credential
          infra:
            origin: helm-refusal-secret-plaintext
            key: helm-refusal-note-plaintext
      components:
        holder: {}
