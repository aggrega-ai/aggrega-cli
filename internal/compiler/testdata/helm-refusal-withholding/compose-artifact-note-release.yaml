# A compose fragment carries the undeclared value where its YAML breaks.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: helm-refusal-compose-artifact-note-release
  environment: local
  version: "1.0.0"
spec:
  aggregate: ./vault-app.yaml
  manifest: ./compose-artifact-note-manifest.yaml
  boundaries:
    main:
      directory: ./dist/main
      components:
        vault: {}
