# The chart refuses, quoting the value the Component declares sensitive.
apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: helm-refusal-quoting-release
  environment: local
  version: "1.0.0"
spec:
  aggregate: ./vault-app.yaml
  manifest: ./quoting-manifest.yaml
  boundaries:
    main:
      directory: ./dist/main
      components:
        vault: {}
