apiVersion: aggrega.ai/v1beta1
kind: FeatureRecipe
metadata:
  name: helm-refusal-fr-mapped
  version: "1.0.0"
  description: Its values mapping writes the leaf the Feature declares sensitive into a chart value its values schema refuses.
spec:
  capability: helm
  implements: feature.test/helm-refusal-credential
  source: ./chart
  valuesMapping: |
    auth:
      password: "{{ .values.origin }}"
