apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: helm-refusal-workload-recipe
  version: "1.0.0"
  description: The workload template writes the value the Component declares sensitive into a resource quantity the guest refuses.
spec:
  capability: helm
  implements: core/helm-refusal-vault
  workload: |
    apiVersion: aggrega.ai/v1beta1
    kind: Workload
    containers:
      main:
        image: vault:1.0
        resources:
          limits:
            cpu: '{{ .values.adminPassword }}'
