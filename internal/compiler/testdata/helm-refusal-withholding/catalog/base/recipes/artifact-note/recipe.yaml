apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: helm-refusal-artifact-note-recipe
  version: "1.0.0"
  description: An artifact template writes the value nobody declared where its output stops being YAML.
spec:
  capability: helm
  implements: core/helm-refusal-vault
  artifacts:
    cm.yaml: |
      reference: *{{ .values.adminNote }}
