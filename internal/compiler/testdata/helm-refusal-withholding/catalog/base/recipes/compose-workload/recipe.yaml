apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: helm-refusal-compose-workload-recipe
  version: "1.0.0"
  description: The workload template writes the value the Component declares sensitive into a resource quantity the compose guest refuses.
spec:
  capability: compose
  implements: core/helm-refusal-vault
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    containers:
      main:
        image: vault:1.0
        resources:
          limits:
            memory: '{{ .values.adminPassword }}'
