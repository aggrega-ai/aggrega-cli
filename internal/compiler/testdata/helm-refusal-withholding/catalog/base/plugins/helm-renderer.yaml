apiVersion: aggrega.ai/v1alpha1
kind: Plugin
metadata:
  name: helm
  version: 1.0.0
  pluginType: provider
spec:
  abiVersion: v1alpha1
  provider:
    capabilities:
      - helm
    contract:
      inputKinds:
        sourced: true
        synthesized: true
        artifactsStandalone: true
      boundaryAssembly: none
      reusableInstance: true
      omits: true
  exports:
    - name: render_node
  runtime:
    maxMemoryPages: 4096
    # Generous per-call cap so guest runtime initialization completes even where
    # the host runs the Wasm engine without native code generation.
    timeoutMs: 300000
