apiVersion: aggrega.ai/v1alpha1
kind: Feature
metadata:
  name: feature.test/helm-refusal-boundary-credential
  version: "1.0.0"
spec:
  # Attached to a boundary, where the Release writes its infra, so both leaves are
  # infra ones: origin is the declared half; key is left unmarked, so a refusal
  # quoting it is judged against a value nobody declared.
  schema:
    infra:
      origin: { type: string, sensitive: true }
      key: { type: string }
