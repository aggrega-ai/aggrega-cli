# A values mapping writes the declared value into a chart value its schema refuses.
apiVersion: aggrega.ai/v1alpha1
kind: Release
metadata:
  name: helm-refusal-mapped-release
  environment: local
  version: "1.0.0"
spec:
  aggregate: ./vault-app.yaml
  manifest: ./mapped-manifest.yaml
  boundaries:
    main:
      directory: ./dist/main
      components:
        vault: {}
