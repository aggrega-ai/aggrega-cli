apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: arm-consumer-tags
  version: 1.0.0
  description: >
    An application that writes the delivered database host into a tag, where ARM does not evaluate a resource's runtime state.
spec:
  capability: arm
  implements: example/compute/consumer:1.0.0
  locals:
    symbol: '{{ capitalizedWords .context.instance_id }}'
  artifacts:
    consumer.yaml: |
      {{- $env := optional (default dict .context.inject) "env" dict -}}
      resources:
        {{ .locals.symbol }}:
          type: Microsoft.App/containerApps
          apiVersion: "2024-03-01"
          name: "{{ .context.instance_id }}"
          location: "[resourceGroup().location]"
          tags:
            endpoint: "{{ $env.DB_HOST }}"
          properties:
            settings:
              databaseHost: "static"
