apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: arm-consumer-compose
  version: 1.0.0
  description: >
    An application that writes the delivered database host inside literal text, which the provider writes as a format() expression.
spec:
  capability: arm
  implements: example/compute/consumer:1.0.0
  locals:
    symbol: '{{ capitalizedWords .context.instance_id }}'
  artifacts:
    consumer.yaml: |
      {{- $env := optional (default dict .context.inject) "env" dict -}}
      resources:
        {{ .locals.symbol }}:
          type: Microsoft.App/containerApps
          apiVersion: "2024-03-01"
          name: "{{ .context.instance_id }}"
          location: "[resourceGroup().location]"

          properties:
            settings:
              connection: "postgres://{{ $env.DB_HOST }}:5432"
