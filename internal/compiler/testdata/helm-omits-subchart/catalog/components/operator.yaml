apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/omits/operator
  version: "1.0.0"
  labels:
    component.aggrega.ai/type: "server"
spec:
  schema:
    infra:
      # Which subchart's copy of the twice-shipped definition to leave out; unset
      # leaves neither out. The Release writes it and the Recipe's omits entry
      # reads it.
      leave_out_from: { type: string }
