apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/web
  version: "1.0.0"
  labels:
    component.aggrega.ai/type: "server"
spec:
  # A socket whose connections each carry one attachment of their own, so a row
  # can attach one of the two Features on a connection entry rather than on a
  # block of the component's.
  usesSchema:
    peers:
      selector: "component.aggrega.ai/type=server"
      featuresSchema:
        token: {}
  schema:
    infra:
      port: { type: integer, default: 8080 }
