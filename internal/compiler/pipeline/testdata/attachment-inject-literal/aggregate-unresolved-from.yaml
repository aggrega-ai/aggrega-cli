apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: aggregate-unresolved-from
  version: "1.0.0"
spec:
  components:
    api:
      type: core/api
      features:
        token:
          type: core/token
          inject:
            env:
              # A key the attachment's FeatureRecipe does not publish (it
              # publishes name), and its FeatureRecipe reads no entry itself.
              - in: TOKEN_NAME
                from: nmae
