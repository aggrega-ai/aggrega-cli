apiVersion: aggrega.ai/v1alpha1
kind: Aggregate
metadata:
  name: aggregate-reference
  version: "1.0.0"
spec:
  components:
    api:
      type: core/api
      features:
        token:
          type: core/token
          inject:
            env:
              # The literal case's reference, alone: it builds and reaches the
              # component.
              - in: TOKEN_NAME
                from: name
