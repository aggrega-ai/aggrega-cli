apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: hybrid-cutover-helmchart
  version: "1.0.0"
spec:
  components:
    web:
      type: core/web
      uses:
        backends:
          - api
    api:
      type: core/api
      uses:
        stores:
          - db
    db:
      type: core/db
