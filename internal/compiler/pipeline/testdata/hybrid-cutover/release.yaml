apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: hybrid-cutover-release
  environment: testing
  version: "1.0.0"
spec:
  aggregate: ./aggregate.yaml
  manifest: ./manifest.yaml
  boundaries:
