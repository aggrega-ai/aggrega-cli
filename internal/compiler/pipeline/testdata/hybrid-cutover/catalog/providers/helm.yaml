apiVersion: aggrega.ai/v1alpha1
kind: Provider
metadata:
  name: helm
  version: "1.0.0"
spec:
  # Bind the helm provider to its Wasm rendering engine so the hybrid dispatch
  # routes this provider through the wasmengine adapter. plugin names the Plugin
  # entity below as a bare catalog identity.
  plugin: provider/helm:1.0.0
  workloadSchema: |
    type: object
    additionalProperties: true
