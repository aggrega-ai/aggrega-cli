apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/datastore
  version: "1.0.0"
  labels:
    component.aggrega.ai/type: "stateful-server"
spec:
  schema:
    infra:
      port: { type: integer, default: 5432 }
      replicas: { type: integer, default: 1 }
    provides:
      host: { type: string, required: true }
      port: { type: string, required: true }
