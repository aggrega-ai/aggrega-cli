apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/websvc
  version: "1.0.0"
  labels:
    component.aggrega.ai/type: "server"
spec:
  schema:
    infra:
      port: { type: integer, default: 8080 }
      replicas: { type: integer, default: 1 }
    provides:
      host: { type: string, required: true }
      service_port: { type: string, required: true }
