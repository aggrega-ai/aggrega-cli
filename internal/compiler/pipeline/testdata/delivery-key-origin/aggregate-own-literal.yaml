apiVersion: aggrega.ai/v1alpha1
kind: Aggregate
metadata:
  name: aggregate-own-literal
  version: "1.0.0"
spec:
  components:
    db:
      type: core/db
    api:
      type: core/api
      uses:
        backend:
          primary:
            target: db
            inject:
              env:
                - in: DB_HOST
                  value: literal-value
                - in: DB_PORT
                  from: port
