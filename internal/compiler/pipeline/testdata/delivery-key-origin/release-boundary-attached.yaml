apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: delivery-key-origin-release
  environment: local
  version: "1.0.0"
spec:
  aggregate: aggregate-boundary-attached
  manifest: delivery-key-origin-manifest
  boundaries:
    cluster:
      directory: ./dist/cluster
      features:
        shared_backend:
          type: core/shared-backend
          uses:
            backend:
              primary:
                target: db
                inject:
                  env:
                    - in: DB_HOST
                      from: hosst
      components:
        api: {}
        db: {}
