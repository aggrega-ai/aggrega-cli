apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: aggregate-attachment-contributed
  version: "1.0.0"
spec:
  components:
    db:
      type: core/db
    api:
      type: core/api
      features:
        shared_backend:
          type: core/shared-backend
          uses:
            backend:
              primary:
                target: db
                inject:
                  env:
                    - in: DB_HOST
                      from: hosst
