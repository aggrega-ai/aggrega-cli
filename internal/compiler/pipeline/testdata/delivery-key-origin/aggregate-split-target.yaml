apiVersion: aggrega.ai/v1alpha1
kind: Aggregate
metadata:
  name: aggregate-split-target
  version: "1.0.0"
spec:
  components:
    db:
      type: core/db
    db2:
      type: core/db
    api:
      type: core/api
      uses:
        backend:
          primary:
            target: db
            inject:
              env:
                - in: OWN_HOST
                  from: host
      features:
        sb_one:
          type: core/shared-backend
          uses:
            backend:
              primary:
                target: db2
                inject:
                  env:
                    - in: ONE_HOST
                      from: host
