apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: aggregate-scope-contributed
  version: "1.0.0"
spec:
  subsystems:
    data:
      components:
        db:
          type: core/db
    tier:
      features:
        shared_backend:
          type: core/shared-backend
          uses:
            backend:
              primary:
                target: db
                inject:
                  env:
                    - in: DB_HOST
                      from: hosst
      components:
        api:
          type: core/api
