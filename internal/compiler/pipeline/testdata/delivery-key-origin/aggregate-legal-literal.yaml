apiVersion: aggrega.ai/v1alpha1
kind: Aggregate
metadata:
  name: aggregate-legal-literal
  version: "1.0.0"
spec:
  components:
    db:
      type: core/db
    api:
      type: core/api
      features:
        shared_backend:
          type: core/shared-backend
          uses:
            backend:
              primary:
                target: db
                inject:
                  env:
                    # A literal. It is not a provides key of core/db and must not
                    # be resolved as one: the string is deliberately spelled like
                    # a mistyped key so that a rule reading the resolved form,
                    # where a literal and a reference share one slot, would refuse
                    # it.
                    - in: DB_HOST
                      value: hosst
                    # A reference on the same connection, so the case proves the
                    # rule still reads references rather than skipping the
                    # connection wholesale.
                    - in: DB_PORT
                      from: port
