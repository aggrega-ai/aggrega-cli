apiVersion: v1
kind: Service
metadata:
    name: frontend-web
    namespace: frontend-zone
    labels:
        aggrega.ai/aggregate-name: fullstack-app
        aggrega.ai/boundary-path: frontend-ns
        aggrega.ai/compiler-version: 0.1.0
        aggrega.ai/component-id: frontend
        aggrega.ai/environment: production
        aggrega.ai/recipe-uri: helm-web-ui-synthesized-with-artifacts:1.0.0
        app: frontend
        app.kubernetes.io/name: frontend
spec:
    type: ClusterIP
    selector:
        app: frontend
    ports:
        - name: web
          port: 3003
          targetPort: web
