apiVersion: aggrega.ai/v1alpha1
kind: Release
metadata:
  name: well-known-bucket-release
  environment: local
  version: "1.0.0"
spec:
  aggregate: well-known-bucket-app
  manifest: well-known-bucket-manifest
  boundaries:
    zone:
      directory: ./dist/zone
      components:
        rsub: {}
        rsub-operated:
          annotations:
            aggrega.ai/namespace: "from-release"
        rcomp: {}
        rcomp-operated:
          annotations:
            aggrega.ai/namespace: "from-release"
        plain: {}
      aggregates:
        mod:
          components:
            msub: {}
            msub-operated:
              annotations:
                aggrega.ai/namespace: "from-release"
            mcomp: {}
            mcomp-operated:
              annotations:
                aggrega.ai/namespace: "from-release"
