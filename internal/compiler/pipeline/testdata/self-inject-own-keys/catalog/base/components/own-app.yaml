apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/own-app
  version: "1.0.0"
  labels:
    component.aggrega.ai/type: "server"
spec:
  inject: ["env", "ssm_param"]
  schema:
    values:
      role: { type: string, required: true }
      goal: { type: string, required: true }
    provides:
      host: { type: string, required: true }
