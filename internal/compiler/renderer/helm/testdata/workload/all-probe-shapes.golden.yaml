apiVersion: apps/v1
kind: Deployment
metadata:
    name: api
    labels:
        aggrega.ai/aggregate-name: test-agg
        aggrega.ai/boundary-path: default
        aggrega.ai/compiler-version: test
        aggrega.ai/component-id: api
        aggrega.ai/environment: test-env
        app: api
        app.kubernetes.io/name: api
spec:
    replicas: 1
    selector:
        matchLabels:
            app: api
    template:
        metadata:
            name: ""
            labels:
                aggrega.ai/aggregate-name: test-agg
                aggrega.ai/boundary-path: default
                aggrega.ai/compiler-version: test
                aggrega.ai/component-id: api
                aggrega.ai/environment: test-env
                app: api
                app.kubernetes.io/name: api
        spec:
            containers:
                - name: main
                  image: app:1.0
                  ports:
                    - name: web
                      containerPort: 8080
                  livenessProbe:
                    tcpSocket:
                        port: 8080
                  readinessProbe:
                    httpGet:
                        path: /healthz
                        port: web
                    timeoutSeconds: 5
                  startupProbe:
                    exec:
                        command:
                            - /bin/check.sh
apiVersion: v1
kind: Service
metadata:
    name: api-api
    labels:
        aggrega.ai/aggregate-name: test-agg
        aggrega.ai/boundary-path: default
        aggrega.ai/compiler-version: test
        aggrega.ai/component-id: api
        aggrega.ai/environment: test-env
        app: api
        app.kubernetes.io/name: api
spec:
    type: ClusterIP
    selector:
        app: api
    ports:
        - name: web
          port: 8080
          targetPort: web
