apiVersion: apps/v1
kind: Deployment
metadata:
    name: api-server
    labels:
        aggrega.ai/aggregate-name: test-agg
        aggrega.ai/boundary-path: default
        aggrega.ai/compiler-version: test
        aggrega.ai/component-id: api-server
        aggrega.ai/environment: test-env
        app: api-server
        app.kubernetes.io/name: api-server
spec:
    replicas: 1
    selector:
        matchLabels:
            app: api-server
    template:
        metadata:
            name: ""
            labels:
                aggrega.ai/aggregate-name: test-agg
                aggrega.ai/boundary-path: default
                aggrega.ai/compiler-version: test
                aggrega.ai/component-id: api-server
                aggrega.ai/environment: test-env
                app: api-server
                app.kubernetes.io/name: api-server
        spec:
            containers:
                - name: main
                  image: app:1.0
                  ports:
                    - name: web
                      containerPort: 8080
apiVersion: v1
kind: Service
metadata:
    name: api-server-api
    labels:
        aggrega.ai/aggregate-name: test-agg
        aggrega.ai/boundary-path: default
        aggrega.ai/compiler-version: test
        aggrega.ai/component-id: api-server
        aggrega.ai/environment: test-env
        app: api-server
        app.kubernetes.io/name: api-server
spec:
    type: ClusterIP
    selector:
        app: api-server
    ports:
        - name: web
          port: 8080
          targetPort: web
