services:
    store:
        image: store:1.0
        volumes:
            - type: bind
              source: app-config
              target: /etc/config
              read_only: true
            - type: bind
              source: app-creds
              target: /run/secrets/creds
              read_only: true
            - type: volume
              source: store-data
              target: /var/data
            - type: volume
              source: store-session
              target: /var/session
        tmpfs:
            - /tmp/scratch
volumes:
    store-data: {}
    store-session: {}
