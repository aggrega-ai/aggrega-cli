services:
  store:
    image: store:1.0
    labels:
      aggrega.ai/aggregate-name: test-agg
      aggrega.ai/boundary-path: default
      aggrega.ai/compiler-version: test
      aggrega.ai/component-id: store
      aggrega.ai/environment: test-env
    volumes:
      - type: bind
        source: app-config
        target: /etc/config
        read_only: true
      - type: bind
        source: app-creds
        target: /run/secrets/creds
        read_only: true
      - type: volume
        source: store-data
        target: /var/data
      - type: volume
        source: store-session
        target: /var/session
    tmpfs:
      - /tmp/scratch
volumes:
  store-data: {}
  store-session: {}
