apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: core/ai-model/metrics-disagreement
  version: 1.0.0
  description: >
    States that its metrics are served with no credential while declaring the
    provides key its instances publish to say whether their metrics need one,
    so the metrics-credential-annotation-matches-provides rule has something to
    report.
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: ai-model
  annotations:
    observability.aggrega.ai/metrics-credential: none
spec:
  schema:
    values:
      port:
        type: integer
    provides:
      metrics_endpoint:
        type: string
      metrics_credential_required:
        type: boolean
