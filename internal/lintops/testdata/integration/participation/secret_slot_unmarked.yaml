apiVersion: aggrega.ai/v1alpha1
kind: Component
metadata:
  name: core/datastore/secret-slot-unmarked
  version: 1.0.0
  labels:
    component.aggrega.ai/type: server
    component.aggrega.ai/category: datastore
spec:
  featuresSchema:
    # Pins the fill to a secret-kind Feature but declares no sensitive marker,
    # which is what the advisory reports.
    credentials:
      selector: "feature.aggrega.ai/kind=secret"
      inject:
        - env
    # A slot that pins the same kind AND declares the marker, so the fixture
    # also carries the silent half.
    admin-credentials:
      selector: "feature.aggrega.ai/kind=secret"
      sensitive: true
      inject:
        - env
    # A slot with no kind constraint, which the advisory does not concern.
    telemetry:
      selector: "feature.aggrega.ai/kind=observability"
  schema:
    values:
      host:
        type: string
