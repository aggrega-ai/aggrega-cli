apiVersion: aggrega.ai/v1alpha1
kind: Plugin
metadata:
  name: helm
  version: 1.0.0
  pluginType: provider
  description: The built-in helm provider rendering plugin.
spec:
  abiVersion: v1alpha1
  capabilities:
    - helm
  runtime:
    maxMemoryPages: 256
    timeoutMs: 3000
  exports:
    - name: render_node
      operates: emit
      scope: own
