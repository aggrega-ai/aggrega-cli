apiVersion: aggrega.ai/v1beta1
kind: Plugin
metadata:
  name: custom-renderer
  version: 1.0.0
  pluginType: provider
  description: A partner-authored rendering plugin.
spec:
  abiVersion: v1beta1
  provider:
    capabilities:
      - helm
  runtime:
    maxMemoryPages: 256
    timeoutMs: 3000
  exports:
    - name: render_node
      operates: emit
      scope: own
  commands:
    - name: render
      description: Render the aggregate to manifests.
      flags:
        - name: output
          type: string
          default: "yaml"
          shorthand: o
          description: Output format.
