AWSTemplateFormatVersion: "2010-09-09"
Parameters:
  Env:
    Type: String
    Default: prod
Resources:
  OrdersDb:
    Type: AWS::RDS::DBInstance
    Properties:
      Engine: postgres
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: "20"
      DBName:
        Fn::Sub: "${Env}orders"
      DBSubnetGroupName:
        Fn::ImportValue: shared-db-subnets
      VPCSecurityGroups:
        - Fn::ImportValue: shared-db-security-group
        - Ref: Env
