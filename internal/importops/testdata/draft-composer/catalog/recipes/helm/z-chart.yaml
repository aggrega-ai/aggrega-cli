apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: z-chart
  version: "1.0.0"
spec:
  capability: helm
  implements: example/z
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    containers:
      main:
        image: z-chart:1.0.0
        ports:
          web: {{ optional .infra `port` 8080 }}
    services:
      svc:
        type: ClusterIP
        ports:
          web: {{ optional .infra `port` 8080 }}
