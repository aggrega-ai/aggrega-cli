services:
  chat:
    image: ghcr.io/example/chat:2.0.1
    ports:
      - "8080:8080"
    models:
      - llm
  search:
    image: ghcr.io/example/search:0.9.0
    ports:
      - "8081:8081"
    models:
      embedder:
        endpoint_var: AI_MODEL_URL
        model_var: AI_MODEL_NAME

models:
  llm:
    model: ai/smollm2
  embedder:
    model: ai/mxbai-embed-large
