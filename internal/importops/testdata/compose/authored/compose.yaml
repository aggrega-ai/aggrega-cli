# An authored Compose application: a shop API backed by PostgreSQL and Redis.
# The two values under the API's environment named PAYMENT_API_KEY and
# WELCOME_BANNER are planted key-shaped needles, not secrets.
name: shop
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: shop
      POSTGRES_DB: shop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  cache:
    image: redis:7.4
    ports:
      - "6379:6379"
  api:
    image: ghcr.io/example/shop-api:1.4.2
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      DATABASE_HOST: db
      CACHE_URL: redis://cache:6379/0
      PAYMENT_API_KEY: sk-planted-key-shaped-needle-8d21f0
      WELCOME_BANNER: planted-banner-needle-6b47e2
      UPSTREAM_TOKEN: ${UPSTREAM_TOKEN}
    command: ["serve", "--port", "8080"]
volumes:
  pgdata: {}
