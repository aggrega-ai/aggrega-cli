  - path: aggregate.yaml
    content: |
      apiVersion: aggrega.ai/v1beta1
      kind: Aggregate
      metadata:
        name: imported/multiple-documents-qna
        version: 0.1.0
        description: Draft Aggregate imported from a source in the flowise format.
      spec:
        components:
          pinecone-0:
            type: imported/component/pinecone
            uses:
              openaiembeddings-0:
                openaiembeddings-0:
                  target: openaiembeddings-0
          openaiembeddings-0:
            type: imported/ai-model/openaiembeddings
          pinecone-1:
            type: imported/component/pinecone
            uses:
              openaiembeddings-1:
                openaiembeddings-1:
                  target: openaiembeddings-1
          openaiembeddings-1:
            type: imported/ai-model/openaiembeddings
          buffermemory-0:
            type: imported/component/buffermemory
          retrievertool-2:
            type: imported/ai-tool/retrievertool
            uses:
              pinecone-0:
                pinecone-0:
                  target: pinecone-0
          retrievertool-1:
            type: imported/ai-tool/retrievertool
            uses:
              pinecone-1:
                pinecone-1:
                  target: pinecone-1
          chatopenai-0:
            type: imported/ai-model/chatopenai
          toolagent-0:
            type: imported/ai-tool/toolagent
            uses:
              buffermemory-0:
                buffermemory-0:
                  target: buffermemory-0
              chatopenai-0:
                chatopenai-0:
                  target: chatopenai-0
              retrievertool-1:
                retrievertool-1:
                  target: retrievertool-1
              retrievertool-2:
                retrievertool-2:
                  target: retrievertool-2
