    content: |
      apiVersion: aggrega.ai/v1beta1
      kind: Component
      metadata:
        name: imported/component/pinecone
        version: 0.1.0
        labels:
          component.aggrega.ai/type: resource
      spec:
        featuresSchema:
          credential:
            required: true
            inject: []
            description: Credential slot inferred from the source node; the recipe controls delivery.
        schema:
          values:
            type: object
            properties:
              fetchK: { type: string }
              lambda: { type: string }
              pineconeIndex: { type: string }
              pineconeMetadataFilter: { type: string }
              pineconeNamespace: { type: string }
              searchType: { type: string }
