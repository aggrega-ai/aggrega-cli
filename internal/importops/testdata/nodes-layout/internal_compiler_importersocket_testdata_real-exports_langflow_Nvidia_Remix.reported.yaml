  - path: components/imported-ai-agent-agent.yaml
    content: |
      apiVersion: aggrega.ai/v1beta1
      kind: Component
      metadata:
        name: imported/ai-agent/agent
        version: 0.1.0
        labels:
          component.aggrega.ai/type: server
          component.aggrega.ai/category: ai-agent
      spec:
        featuresSchema:
          api_key:
            required: true
            inject: []
            description: Credential slot inferred from the source node; the recipe controls delivery.
        schema:
          values:
            type: object
            properties:
              add_current_date_tool: { type: string }
              agent_description: { type: string }
              agent_llm: { type: string }
              code: { type: string }
              format_instructions: { type: string }
              handle_parsing_errors: { type: string }
              input_value: { type: string }
              max_iterations: { type: string }
              max_retries: { type: string }
              max_tokens: { type: string }
              model_kwargs: { type: string }
              model_name: { type: string }
              n_messages: { type: string }
              openai_api_base: { type: string }
              output_schema: { type: string }
              seed: { type: string }
              system_prompt: { type: string }
              temperature: { type: string }
              timeout: { type: string }
              tools: { type: string }
              verbose: { type: string }
            additionalProperties: false
