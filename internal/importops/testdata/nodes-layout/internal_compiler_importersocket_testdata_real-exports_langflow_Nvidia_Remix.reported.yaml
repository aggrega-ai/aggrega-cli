        name: imported/ai-tool/mcptools
        version: 0.1.0
        labels:
          component.aggrega.ai/type: function
          component.aggrega.ai/category: ai-tool
      spec:
        schema:
          values:
            type: object
            properties:
              code: { type: string }
              mcp_server: { type: string }
              tool: { type: string }
              tool_placeholder: { type: string }
              tools_metadata: { type: string }
            additionalProperties: false
  - path: aggregate.yaml
    content: |
      apiVersion: aggrega.ai/v1beta1
      kind: Aggregate
      metadata:
        name: imported/flow
        version: 0.1.0
        description: Draft Aggregate imported from a source in the langflow format.
      spec:
        components:
          chatinput-8xmju:
            type: imported/ai-model/chatinput
          chatoutput-o3obj:
            type: imported/ai-model/chatoutput
            uses:
              agent-9don7:
                agent-9don7:
                  target: agent-9don7
          agent-9don7:
            type: imported/ai-agent/agent
            uses:
              chatinput-8xmju:
                chatinput-8xmju:
                  target: chatinput-8xmju
              faiss-uz8o4:
                faiss-uz8o4:
                  target: faiss-uz8o4
              mcptools-behvj:
                mcptools-behvj:
                  target: mcptools-behvj
              prompt-prjbv:
                prompt-prjbv:
                  target: prompt-prjbv
          prompt-prjbv:
            type: imported/component/prompt
          remixdocumentation-deiws:
            type: imported/component/remixdocumentation
          embeddingmodel-x6uru:
            type: imported/ai-model/embeddingmodel
          faiss-uz8o4:
            type: imported/component/faiss
            uses:
              embeddingmodel-x6uru:
                embeddingmodel-x6uru:
                  target: embeddingmodel-x6uru
              remixdocumentation-deiws:
                remixdocumentation-deiws:
                  target: remixdocumentation-deiws
          mcptools-behvj:
            type: imported/ai-tool/mcptools
