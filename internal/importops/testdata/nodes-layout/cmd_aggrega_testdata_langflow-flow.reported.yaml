documents:
  - path: components/imported-ai-model-openaimodel.yaml
    content: |
      apiVersion: aggrega.ai/v1beta1
      kind: Component
      metadata:
        name: imported/ai-model/openaimodel
        version: 0.1.0
        labels:
          component.aggrega.ai/type: resource
          component.aggrega.ai/category: ai-model
      spec: {}
  - path: components/imported-ai-model-chatoutput.yaml
    content: |
      apiVersion: aggrega.ai/v1beta1
      kind: Component
      metadata:
        name: imported/ai-model/chatoutput
        version: 0.1.0
        labels:
          component.aggrega.ai/type: resource
          component.aggrega.ai/category: ai-model
      spec: {}
  - path: aggregate.yaml
    content: |
      apiVersion: aggrega.ai/v1beta1
      kind: Aggregate
      metadata:
        name: imported/sample-flow
        version: 0.1.0
        description: Draft Aggregate imported from a source in the langflow format.
      spec:
        components:
          openaimodel-abc12:
            type: imported/ai-model/openaimodel
          chatoutput-def34:
            type: imported/ai-model/chatoutput
            uses:
              openaimodel-abc12:
                openaimodel-abc12:
                  target: openaimodel-abc12
  - path: release.yaml
    content: |
      apiVersion: aggrega.ai/v1beta1
      kind: Release
      metadata:
        name: imported/sample-flow
        # environment is a drafted default, since no source names the environment this Release deploys to; change it to name the one it deploys to.
        environment: development
        version: 0.1.0
        description: Draft Release imported from a source in the langflow format.
      spec:
        aggregate: imported/sample-flow
        # manifest: left empty, since the import was given no target; an import given a target drafts the Manifest and names it here.
        manifest: ""
        components:
          openaimodel-abc12: {}
          chatoutput-def34: {}
