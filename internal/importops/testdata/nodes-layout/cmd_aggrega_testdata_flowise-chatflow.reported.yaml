documents:
  - path: components/imported-ai-model-chatopenai.yaml
    content: |
      apiVersion: aggrega.ai/v1beta1
      kind: Component
      metadata:
        name: imported/ai-model/chatopenai
        version: 0.1.0
        labels:
          component.aggrega.ai/type: resource
          component.aggrega.ai/category: ai-model
      spec:
        schema:
          values:
            type: object
            properties:
              modelName: { type: string }
            additionalProperties: false
  - path: components/imported-component-conversationchain.yaml
    content: |
      apiVersion: aggrega.ai/v1beta1
      kind: Component
      metadata:
        name: imported/component/conversationchain
        version: 0.1.0
        labels:
          component.aggrega.ai/type: resource
      spec: {}
  - path: aggregate.yaml
    content: |
      apiVersion: aggrega.ai/v1beta1
      kind: Aggregate
      metadata:
        name: imported/flowise-chatflow
        version: 0.1.0
        description: Draft Aggregate imported from a source in the flowise format.
      spec:
        components:
          chatopenai-0:
            type: imported/ai-model/chatopenai
          conversationchain-0:
            type: imported/component/conversationchain
            uses:
              chatopenai-0:
                chatopenai-0:
                  target: chatopenai-0
  - path: release.yaml
    content: |
      apiVersion: aggrega.ai/v1beta1
      kind: Release
      metadata:
        name: imported/flowise-chatflow
        # environment is a drafted default, since no source names the environment this Release deploys to; change it to name the one it deploys to.
        environment: development
        version: 0.1.0
        description: Draft Release imported from a source in the flowise format.
      spec:
        aggregate: imported/flowise-chatflow
        # manifest: left empty, since the import was given no target; an import given a target drafts the Manifest and names it here.
        manifest: ""
        components:
          chatopenai-0: {}
          conversationchain-0: {}
