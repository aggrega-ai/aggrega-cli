documents:
  - path: components/imported-ai-agent-startagentflow.yaml
    content: |
      apiVersion: aggrega.ai/v1beta1
      kind: Component
      metadata:
        name: imported/ai-agent/startagentflow
        version: 0.1.0
        labels:
          component.aggrega.ai/type: server
          component.aggrega.ai/category: ai-agent
      spec:
        schema:
          values:
            type: object
            properties:
              formDescription: { type: string }
              formInputTypes: { type: string }
              formTitle: { type: string }
              startInputType: { type: string }
              startState: { type: string }
            additionalProperties: false
  - path: components/imported-ai-agent-conditionagentagentflow.yaml
