    content: |
      apiVersion: aggrega.ai/v1beta1
      kind: Component
      metadata:
        name: imported/ai-agent/agentagentflow
        version: 0.1.0
        labels:
          component.aggrega.ai/type: server
          component.aggrega.ai/category: ai-agent
      spec:
        schema:
          values:
            type: object
            properties:
              agentEnableMemory: { type: string }
              agentKnowledgeDocumentStores: { type: string }
              agentMemoryType: { type: string }
              agentMessages: { type: string }
              agentModel: { type: string }
              agentModelConfig: { type: string }
              agentReturnResponseAs: { type: string }
              agentTools: { type: string }
              agentUpdateState: { type: string }
              agentUserMessage: { type: string }
            additionalProperties: false
  - path: aggregate.yaml
    content: |
      apiVersion: aggrega.ai/v1beta1
      kind: Aggregate
      metadata:
        name: imported/agents-handoff
        version: 0.1.0
        description: Draft Aggregate imported from a source in the flowise format.
      spec:
        components:
          startagentflow-0:
            type: imported/ai-agent/startagentflow
          conditionagentagentflow-0:
            type: imported/ai-agent/conditionagentagentflow
            uses:
              startagentflow-0:
                startagentflow-0:
                  target: startagentflow-0
          agentagentflow-0:
            type: imported/ai-agent/agentagentflow
            uses:
              conditionagentagentflow-0:
                conditionagentagentflow-0:
                  target: conditionagentagentflow-0
          agentagentflow-1:
            type: imported/ai-agent/agentagentflow
            uses:
              conditionagentagentflow-0:
                conditionagentagentflow-0:
                  target: conditionagentagentflow-0
          agentagentflow-2:
            type: imported/ai-agent/agentagentflow
            uses:
              conditionagentagentflow-0:
                conditionagentagentflow-0:
                  target: conditionagentagentflow-0
  - path: release.yaml
    content: |
      apiVersion: aggrega.ai/v1beta1
      kind: Release
      metadata:
        name: imported/agents-handoff
        # environment is a drafted default, since no source names the environment this Release deploys to; change it to name the one it deploys to.
        environment: development
        version: 0.1.0
        description: Draft Release imported from a source in the flowise format.
      spec:
        aggregate: imported/agents-handoff
        # manifest: left empty, since the import was given no target; an import given a target drafts the Manifest and names it here.
        manifest: ""
        components:
          startagentflow-0: {}
          conditionagentagentflow-0: {}
          agentagentflow-0: {}
          agentagentflow-1: {}
          agentagentflow-2: {}
