documents:
  - path: components/imported-ai-model-chatinput.yaml
    content: |
      apiVersion: aggrega.ai/v1beta1
      kind: Component
      metadata:
        name: imported/ai-model/chatinput
        version: 0.1.0
        labels:
          component.aggrega.ai/type: resource
          component.aggrega.ai/category: ai-model
      spec:
        schema:
          values:
            type: object
            properties:
              code: { type: string }
              files: { type: string }
              input_value: { type: string }
              sender: { type: string }
              sender_name: { type: string }
              session_id: { type: string }
              should_store_message: { type: string }
            additionalProperties: false
  - path: components/imported-component-prompt.yaml
    content: |
      apiVersion: aggrega.ai/v1beta1
      kind: Component
      metadata:
        name: imported/component/prompt
        version: 0.1.0
        labels:
          component.aggrega.ai/type: resource
      spec:
        schema:
          values:
            type: object
            properties:
              code: { type: string }
              template: { type: string }
              tool_placeholder: { type: string }
            additionalProperties: false
  - path: components/imported-ai-model-chatoutput.yaml
    content: |
      apiVersion: aggrega.ai/v1beta1
      kind: Component
      metadata:
        name: imported/ai-model/chatoutput
        version: 0.1.0
        labels:
          component.aggrega.ai/type: resource
          component.aggrega.ai/category: ai-model
      spec:
        schema:
          values:
            type: object
            properties:
              code: { type: string }
              data_template: { type: string }
              input_value: { type: string }
              sender: { type: string }
              sender_name: { type: string }
              session_id: { type: string }
              should_store_message: { type: string }
            additionalProperties: false
  - path: components/imported-ai-model-languagemodelcomponent.yaml
    content: |
      apiVersion: aggrega.ai/v1beta1
      kind: Component
      metadata:
        name: imported/ai-model/languagemodelcomponent
        version: 0.1.0
        labels:
          component.aggrega.ai/type: resource
          component.aggrega.ai/category: ai-model
      spec:
        featuresSchema:
          api_key:
            required: true
            inject: []
            description: Credential slot inferred from the source node; the recipe controls delivery.
        schema:
          values:
            type: object
            properties:
              code: { type: string }
              input_value: { type: string }
              model_name: { type: string }
              provider: { type: string }
              stream: { type: string }
              system_message: { type: string }
              temperature: { type: string }
            additionalProperties: false
  - path: aggregate.yaml
    content: |
      apiVersion: aggrega.ai/v1beta1
      kind: Aggregate
      metadata:
        name: imported/flow
        version: 0.1.0
        description: Draft Aggregate imported from a source in the langflow format.
      spec:
        components:
          chatinput-szjnt:
            type: imported/ai-model/chatinput
          prompt-toh5d:
            type: imported/component/prompt
          chatoutput-8zwwb:
            type: imported/ai-model/chatoutput
            uses:
              languagemodelcomponent-kboja:
                languagemodelcomponent-kboja:
                  target: languagemodelcomponent-kboja
          languagemodelcomponent-kboja:
            type: imported/ai-model/languagemodelcomponent
            uses:
              chatinput-szjnt:
                chatinput-szjnt:
                  target: chatinput-szjnt
              prompt-toh5d:
                prompt-toh5d:
                  target: prompt-toh5d
