documents:
  - path: components/imported-ai-model-chatopenai.yaml
    content: |
      apiVersion: aggrega.ai/v1alpha1
      kind: Component
      metadata:
        name: imported/ai-model/chatopenai
        version: 0.1.0
        labels:
          component.aggrega.ai/type: resource
          component.aggrega.ai/category: ai-model
      spec:
        featuresSchema:
          credential:
            required: true
            inject: []
            description: Credential slot inferred from the source node; the recipe controls delivery.
        schema:
          values:
            type: object
            properties:
              modelName: { type: string }
              temperature: { type: string }
            additionalProperties: false
  - path: components/imported-ai-tool-httprequest.yaml
    content: |
      apiVersion: aggrega.ai/v1alpha1
      kind: Component
      metadata:
        name: imported/ai-tool/httprequest
        version: 0.1.0
        labels:
          component.aggrega.ai/type: function
          component.aggrega.ai/category: ai-tool
      spec:
        schema:
          values:
            type: object
            properties:
              method: { type: string }
              url: { type: string }
            additionalProperties: false
  - path: aggregate.yaml
    content: |
      apiVersion: aggrega.ai/v1alpha1
      kind: Aggregate
      metadata:
        name: imported/flow
        version: 0.1.0
        description: Draft Aggregate imported from a source in the flowise format.
      spec:
        components:
          chatopenai-0:
            type: imported/ai-model/chatopenai
          httprequest-0:
            type: imported/ai-tool/httprequest
            uses:
              chatopenai-0:
                link:
                  target: chatopenai-0
