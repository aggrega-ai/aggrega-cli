documents:
  - path: components/imported-ai-model-anthropicmodel.yaml
    content: |
      apiVersion: aggrega.ai/v1beta1
      kind: Component
      metadata:
        name: imported/ai-model/anthropicmodel
        version: 0.1.0
        labels:
          component.aggrega.ai/type: resource
          component.aggrega.ai/category: ai-model
      spec:
        featuresSchema:
          api_key:
            required: true
            inject: []
            description: Credential slot inferred from the source node; the recipe controls delivery.
        schema:
          values:
            type: object
            properties:
              model: { type: string }
            additionalProperties: false
  - path: aggregate.yaml
    content: |
      apiVersion: aggrega.ai/v1beta1
      kind: Aggregate
      metadata:
        name: imported/langflow-flow-b
        version: 0.1.0
        description: Draft Aggregate imported from a source in the langflow format.
      spec:
        components:
          anthropicmodel-z9:
            type: imported/ai-model/anthropicmodel
  - path: release.yaml
    content: |
      apiVersion: aggrega.ai/v1beta1
      kind: Release
      metadata:
        name: imported/langflow-flow-b
        # environment is a drafted default, since no source names the environment this Release deploys to; change it to name the one it deploys to.
        environment: development
        version: 0.1.0
        description: Draft Release imported from a source in the langflow format.
      spec:
        aggregate: imported/langflow-flow-b
        # manifest: left empty, since the import was given no target; an import given a target drafts the Manifest and names it here.
        manifest: ""
        components:
          anthropicmodel-z9: {}
