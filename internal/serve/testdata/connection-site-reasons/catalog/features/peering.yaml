apiVersion: aggrega.ai/v1alpha1
kind: Feature
metadata:
  name: feature.conn/peering
  version: "1.0.0"
spec:
  # A pure-wiring Feature whose dependency block may draw through a socket the
  # gateway Component declares too.
  usesSchema:
    peer:
      selector: "component.aggrega.ai/category=model"
    logs:
      selector: "component.aggrega.ai/category=sink"
