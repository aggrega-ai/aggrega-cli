apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: tier4-required-attachment-slot
  version: "1.0.0"
spec:
  components:
    unbound:
      type: example/slotted-db
      features:
        root_password:
          type: example/pw
          values:
            origin: pw-value
    # Binds the required slot but also dictates delivery on a Black-Box slot
    # whose empty allowlist reserves delivery to the Recipe.
    bound:
      type: example/slotted-db
      features:
        root_password:
          type: example/pw
          values:
            origin: pw-value
          inject:
            env:
              - in: ROOT_PW
                from: value
