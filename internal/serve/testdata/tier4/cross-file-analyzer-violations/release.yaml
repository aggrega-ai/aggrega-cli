apiVersion: aggrega.ai/v1alpha1
kind: Release
metadata:
  name: tier4-cross-file-analyzer-violations-release
  environment: test
  version: "1.0.0"
spec:
  aggregate: ./aggregate.yaml
  manifest: ./manifest.yaml
  boundaries:
    main:
      directory: ./dist/main
      components:
        root-target: {}
      # The module is placed by routing it, which puts every component it
      # contributes in this boundary. Naming `sub` under `components` would name
      # a component id nothing carries: the module contributes `sub.sub-target`,
      # and the module's own name is not a component.
      aggregates:
        sub: {}
