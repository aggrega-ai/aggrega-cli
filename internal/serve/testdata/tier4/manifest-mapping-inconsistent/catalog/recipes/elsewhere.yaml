apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: example-elsewhere-recipe
  version: "1.0.0"
spec:
  capability: helm
  implements: example/somewhere-else
  workload: |
    apiVersion: aggrega.ai/v1alpha1
    kind: Workload
    replicas: 1
    containers:
      main:
        image: elsewhere:latest
        ports:
          web: 8080
