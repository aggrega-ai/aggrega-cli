apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: renamed-logical-id
  version: 1.0.0
spec:
  capability: cloudformation
  implements: core/datastore/acme-sql:1.0.0

  locals:
    logical_id: 'Graph{{ capitalizedWords .context.instance_id }}'

  provides: {}

  artifacts:
    template.yaml: |
      Resources:
        {{ .locals.logical_id }}:
          Type: AWS::Neptune::DBCluster
          Properties:
            Port: {{ .infra.port }}
