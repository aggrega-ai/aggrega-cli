apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: acme-product
  version: 1.0.0
spec:
  capability: arm
  implements: core/compute/acme-app:1.0.0

  locals:
    image: ghcr.io/acme/product:1.4.2
    port: "8080"

  provides:
    endpoint: "{{ .infra.endpoint }}"

  artifacts:
    product.yaml: |
      resources: {}
      outputs:
        image:
          type: string
          value: {{ toJson .locals.image }}
        tag:
          type: string
          value: {{ toJson .infra.image_tag }}
