apiVersion: v1
kind: ConfigMap
metadata:
  name: rbac-config
data:
  key: value
---
{{- if .Values.rbac.create -}}
# Permission to approve CertificateRequests
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cert-approver
rules:
  - apiGroups: ["cert-manager.io"]
    resources: ["signers"]
    verbs: ["approve"]
{{- end }}
---
{{- if .Values.rbac.create -}}
# Permission to review CertificateRequests
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cert-reviewer
rules:
  - apiGroups: ["cert-manager.io"]
    resources: ["certificaterequests"]
    verbs: ["get", "list", "watch"]
{{- end }}
