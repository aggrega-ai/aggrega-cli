AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Resources:
  Writer:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageUri: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/writer:1.0
    Connectors:
      ToTable:
        Properties:
          Destination:
            Id: Table
          Permissions: [Read, Write]
  Reader:
    Type: AWS::Serverless::Function
    DependsOn: ReaderConnector
    Properties:
      PackageType: Image
      ImageUri: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/reader:1.0
  ReaderConnector:
    Type: AWS::Serverless::Connector
    Properties:
      Source:
        Id: Reader
      Destination:
        - Id: Table
        - Id: Queue
      Permissions: [Read]
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
  Queue:
    Type: AWS::SQS::Queue
