apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: imported/flow
  # environment is a drafted default, since no source names the environment this Release deploys to; change it to name the one it deploys to.
  environment: development
  version: 0.1.0
  description: Draft Release imported from a source in the cloudformation format.
spec:
  aggregate: imported/flow
  # manifest: left empty, since the import was given no target; an import given a target drafts the Manifest and names it here.
  manifest: ""
  components:
    events:
      infra:
        overrides:
          ClientSubnets: ["subnet-0a1b2c3d", "subnet-4e5f6a7b", "subnet-8c9d0e1f"]
          InstanceType: "kafka.m5.large"
          KafkaVersion: "3.6.0"
          NumberOfBrokerNodes: 3
    # Properties the source writes and the draft does not place: Properties.PackageType.
    consumer:
      infra:
        image: "123456789012.dkr.ecr.us-east-1.amazonaws.com/consumer:1.0.0"
        overrides:
          Role: "arn:aws:iam::123456789012:role/consumer"
