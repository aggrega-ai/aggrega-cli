apiVersion: aggrega.ai/v1beta1
kind: Component
metadata:
  name: imported/component/aws-serverless-api
  version: 0.1.0
  description: "Draft Component of the resource type AWS::Serverless::Api, imported from a source in the cloudformation format."
  labels:
    component.aggrega.ai/type: resource
    component.aggrega.ai/hosting: managed
spec:
  schema:
    infra:
      type: object
      properties:
        # override: every writable property no other rule places, each under the vendor's own name
        overrides:
          type: object
          description: "Writable settings of AWS::Serverless::Api, each under the vendor's own name, which the Recipe passes to the resource as written; its header lists the names it reads."
          additionalProperties: true
      additionalProperties: false
    provides:
      type: object
      properties:
        # read back: published under provides
        # The source writing the resource gives no description of id.
        id: { type: string }
      additionalProperties: false
