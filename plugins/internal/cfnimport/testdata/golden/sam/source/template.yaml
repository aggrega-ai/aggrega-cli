AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: An orders API on AWS SAM.
Globals:
  Function:
    Timeout: 20
    AutoPublishAlias: live
Resources:
  OrdersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./src
      Handler: app.handler
      Runtime: python3.12
      Role: arn:aws:iam::123456789012:role/orders-function
      Environment:
        Variables:
          TABLE_NAME: !Ref OrdersTable
          STAGE: prod
      Events:
        Create:
          Type: HttpApi
          Properties:
            ApiId: !Ref OrdersHttpApi
            Path: /orders
            Method: post
  ImageFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageUri: 123456789012.dkr.ecr.us-east-1.amazonaws.com/orders-report:2.0.1
      Role: arn:aws:iam::123456789012:role/orders-function
  OrdersTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      PrimaryKey:
        Name: id
        Type: String
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5
  OrdersHttpApi:
    Type: AWS::Serverless::HttpApi
  AdminApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
