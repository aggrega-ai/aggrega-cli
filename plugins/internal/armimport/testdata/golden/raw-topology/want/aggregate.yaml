# Sources read: main.json, main.parameters.json.
# Parameters the draft carries nowhere: environmentName, serverName.
# Substrate the source creates, left to the operator: vnet-core (Microsoft.Network/virtualNetworks).
apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: imported/flow
  version: 0.1.0
  description: Draft Aggregate imported from a source in the arm format.
spec:
  components:
    flexibleservers:
      type: core/datastore/postgres
      values:
        user: "pgadmin"
        database: "appdb"
    web:
      type: core/compute/server
      uses:
        flexibleservers:
          flexibleservers:
            target: flexibleservers
            inject:
              env:
                - in: "DB_HOST"
                  from: host
