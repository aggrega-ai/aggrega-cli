# Sources read: main.json.
# Outputs of the source:
#   - clusterId: carried by the instance cluster, provides key outputs_resource_id_value
apiVersion: aggrega.ai/v1beta1
kind: Aggregate
metadata:
  name: imported/flow
  version: 0.1.0
  description: Draft Aggregate imported from a source in the arm format.
spec:
  components:
    cluster:
      type: imported/bigdata/microsoft-kusto-clusters
    ingest:
      type: core/compute/worker
      uses:
        cluster:
          cluster:
            target: cluster
            inject:
              env:
                - in: "CLUSTER_ID"
                  from: outputs_resource_id_value
