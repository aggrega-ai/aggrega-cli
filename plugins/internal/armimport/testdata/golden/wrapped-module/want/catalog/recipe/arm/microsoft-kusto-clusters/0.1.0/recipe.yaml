apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: microsoft-kusto-clusters
  version: 0.1.0
  description: "Draft Recipe realizing imported/bigdata/microsoft-kusto-clusters on arm that sources the published module oci://mcr.microsoft.com/bicep/avm/res/kusto/cluster whole, imported from a source in the arm format."
spec:
  # This Recipe realizes imported/bigdata/microsoft-kusto-clusters by sourcing the published module oci://mcr.microsoft.com/bicep/avm/res/kusto/cluster whole; no vendor schema was read. It reads the keys below, each with its type and its rule; any other key under infra.overrides halts the build naming it.
  # infra.overrides.location: string; override: writable, set under infra.overrides in the vendor's spelling
  # The source writing the resource gives no description of location.
  # infra.overrides.name: string; override: writable, set under infra.overrides in the vendor's spelling
  # The source writing the resource gives no description of name.
  # infra.overrides.sku: string; override: writable, set under infra.overrides in the vendor's spelling
  # The source writing the resource gives no description of sku.
  # The arm provider fetches the published module, nests its template as one nested template named by locals.symbol, and binds the parameters valuesMapping writes; a parameter it leaves out takes the module's own default.
  capability: arm
  implements: imported/bigdata/microsoft-kusto-clusters:0.1.0
  source:
    kind: bicep-module-oci
    url: oci://mcr.microsoft.com/bicep/avm/res/kusto/cluster
    version: 0.11.1
  locals:
    # The nested template's symbolic name: the instance's name in capitalized words, letters and digits alone, so two instances in one template declare two nested templates.
    symbol: "{{ capitalizedWords .context.instance_id }}"
  assertions:
    # Halts naming any key under infra.overrides this Recipe does not read.
    overrides_this_recipe_reads: |
      {{- $o := optional .infra "overrides" dict -}}
      {{- range $k, $v := $o -}}
      {{- if not (has $k (list "location" "name" "sku")) -}}
      {{- fail (printf "infra.overrides.%s is not a setting this Recipe reads: it reads %s from infra.overrides; remove infra.overrides.%s from the Release" $k "location, name and sku" $k) -}}
      {{- end -}}
      {{- end -}}
  valuesMapping: |
    {{- if (hasKey (optional .infra "overrides" dict) "location") }}
    location: {{ toJson (index .infra "overrides" "location") }}
    {{- end }}
    {{- if (hasKey (optional .infra "overrides" dict) "name") }}
    name: {{ toJson (index .infra "overrides" "name") }}
    {{- end }}
    {{- if (hasKey (optional .infra "overrides" dict) "sku") }}
    sku: {{ toJson (index .infra "overrides" "sku") }}
    {{- end }}
    enableTelemetry: false
