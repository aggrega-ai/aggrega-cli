apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: imported/flow
  # environment is a drafted default, since no source names the environment this Release deploys to; change it to name the one it deploys to.
  environment: development
  version: 0.1.0
  description: Draft Release imported from a source in the arm format.
spec:
  aggregate: imported/flow
  # manifest: left empty, since the import was given no target; an import given a target drafts the Manifest and names it here.
  manifest: ""
  components:
    server:
      infra:
        engine_version: "16"
        overrides:
          # From the template parameter location, its literal default.
          location: "westeurope"
          # Left for the Release, since the source cannot supply it: infra.overrides.delegated_subnet_id, the pointer to the resource subnet (Microsoft.Network/virtualNetworks/subnets), which the draft leaves to the operator and the source names as "[resourceId('Microsoft.Network/virtualNetworks/subnets', 'vnet-core', 'snet-db')]"; the catalog Recipe takes the resource's literal identifier: write it
          delegated_subnet_id: ""
      features:
        password:
          type: core/referenced-secret
          infra:
            # Left for the Release, since the source cannot supply it: the resource ID of the Azure Key Vault secret holding the template parameter administratorPassword, /subscriptions/<subscription>/resourceGroups/<group>/providers/Microsoft.KeyVault/vaults/<vault>/secrets/<secret>; the value the template parameter administratorPassword receives goes into that secret.
            origin: ""
    insights:
      infra:
        overrides:
          # From the template parameter location, its literal default.
          location: "westeurope"
          application_type: "web"
          # Left for the Release, since the source cannot supply it: infra.overrides.workspace_id, the pointer to the resource workspace (Microsoft.OperationalInsights/workspaces), which the draft leaves to the operator and the source names as "[resourceId('Microsoft.OperationalInsights/workspaces', 'log-shared')]"; the catalog Recipe takes the resource's literal identifier: write it
          workspace_id: ""
    workbook:
      infra:
        overrides:
          kind: "shared"
          category: "workbook"
          displayName: "Orders"
          serializedData: "{}"
          sourceId: "[resourceId('Microsoft.OperationalInsights/workspaces', 'log-shared')]"
        # From the template parameter location, its literal default.
        location: "westeurope"
