services:
  multi:
    image: http-probe:1.0
    labels:
      aggrega.ai/aggregate-name: test-agg
      aggrega.ai/boundary-path: default
      aggrega.ai/compiler-version: test
      aggrega.ai/component-id: multi
      aggrega.ai/environment: test-env
    healthcheck:
      test:
        - CMD-SHELL
        - curl -f http://localhost:8080/healthz || exit 1
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
  multi--exec-side:
    image: exec-probe:1.0
    labels:
      aggrega.ai/aggregate-name: test-agg
      aggrega.ai/boundary-path: default
      aggrega.ai/compiler-version: test
      aggrega.ai/component-id: multi
      aggrega.ai/environment: test-env
    network_mode: service:multi
    healthcheck:
      test:
        - CMD
        - check.sh
        - --ready
  multi--tcp-side:
    image: tcp-probe:1.0
    labels:
      aggrega.ai/aggregate-name: test-agg
      aggrega.ai/boundary-path: default
      aggrega.ai/compiler-version: test
      aggrega.ai/component-id: multi
      aggrega.ai/environment: test-env
    network_mode: service:multi
    healthcheck:
      test:
        - CMD-SHELL
        - nc -z localhost 50051
