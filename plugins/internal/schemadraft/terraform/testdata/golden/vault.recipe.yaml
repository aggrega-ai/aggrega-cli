apiVersion: aggrega.ai/v1beta1
kind: Recipe
metadata:
  name: vault-store
  version: 0.1.0
spec:
  # module/main.tf.json beside this Recipe declares the resource as a Terraform module, with one variable for each key above and one output for each attribute the provides below publish; valuesMapping sets each variable whose key holds a value, and a variable left unset stays null, leaving its argument unset.
  # A pull admits this Recipe once aggrega pin has recorded the digest of module/main.tf.json in the entity.lock beside it: run aggrega pin on this Recipe after drafting it and after each change to the module.
  capability: terraform
  implements: imported/component/vault-store:0.1.0
  source: ./module
  provides:
    # Each value is the module's output of that name, which the root configuration resolves where it declares the module; the String Pipe pipes it as written into a consumer's context.
    arn: "${module.{{ .context.instance_id }}.arn}"
    endpoint: "${module.{{ .context.instance_id }}.endpoint}"
  valuesMapping: |
    name: {{ toJson (index .values "name") | replace "${" "$${" }}
    {{- if (hasKey (optional .infra "overrides" dict) "capacity") }}
    capacity: {{ toJson (index .infra "overrides" "capacity") | replace "${" "$${" }}
    {{- end }}
    {{- if not (hasKey (optional (default dict .context.inject) "env" dict) (index .features "password" "values" "key")) }}
    {{- fail "the attachment on the featuresSchema slot password delivers no value on the env inject mechanism under the key its values name, and the module variable password takes the value delivered there: attach to the slot password a secret Feature delivering its value on env, such as core/secret-value" }}
    {{- end }}
    password: {{ toJson (index (optional (default dict .context.inject) "env" dict) (index .features "password" "values" "key")) }}
    retention: {{ $out1 := list }}{{ range $item1 := (index .infra "retention") }}{{ $in2 := $item1 }}{{ $out2 := dict }}{{ if hasKey $in2 "archive" }}{{ $in3 := (index $in2 "archive") }}{{ $out3 := dict }}{{ if hasKey $in3 "target" }}{{ $_ := set $out3 "target" (index $in3 "target") }}{{ end }}{{ $_ := set $out2 "archive" $out3 }}{{ end }}{{ if hasKey $in2 "days" }}{{ $_ := set $out2 "days" (index $in2 "days") }}{{ end }}{{ $out1 = append $out1 $out2 }}{{ end }}{{ toJson $out1 | replace "${" "$${" }}
    {{- if (hasKey (optional .infra "overrides" dict) "window") }}
    window: {{ toJson (index .infra "overrides" "window") | replace "${" "$${" }}
    {{- end }}
