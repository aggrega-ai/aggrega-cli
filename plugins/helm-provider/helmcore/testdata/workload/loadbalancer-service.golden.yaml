apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    aggrega.ai/aggregate-name: test-agg
    aggrega.ai/compiler-version: test
    aggrega.ai/component-id: gateway
    aggrega.ai/environment: test-env
    app: gateway
    app.kubernetes.io/name: gateway
  annotations:
    aggrega.ai/boundary-path: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      name: ""
      labels:
        aggrega.ai/aggregate-name: test-agg
        aggrega.ai/compiler-version: test
        aggrega.ai/component-id: gateway
        aggrega.ai/environment: test-env
        app: gateway
        app.kubernetes.io/name: gateway
    spec:
      containers:
        - name: main
          image: gateway:1.0
          ports:
            - name: https
              containerPort: 8443
apiVersion: v1
kind: Service
metadata:
  name: gateway-public
  labels:
    aggrega.ai/aggregate-name: test-agg
    aggrega.ai/compiler-version: test
    aggrega.ai/component-id: gateway
    aggrega.ai/environment: test-env
    app: gateway
    app.kubernetes.io/name: gateway
  annotations:
    aggrega.ai/boundary-path: default
spec:
  type: LoadBalancer
  selector:
    app: gateway
  ports:
    - name: https
      port: 443
      targetPort: https
