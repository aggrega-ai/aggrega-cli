[package]
name = "rego-governance"
version = "0.1.0"
edition = "2021"
description = "Aggrega governance Wasm plugin: evaluate operator-authored Rego with an embedded Rego engine."
license = "Apache-2.0"
publish = false

# This crate is a self-contained workspace root. It carries an embedded Rego
# evaluator, so it resolves its dependency tree and its toolchain on its own
# rather than inheriting either from a surrounding workspace. Nothing above this
# directory declares a workspace, and the explicit table below keeps that true if
# something ever does.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
# The part of a governance plugin that is the same whichever policy language it
# evaluates: payload reading, the rendered-artifact projection, and the
# decision-key-to-severity translation contract. Shared with the other governance
# guests so an operator's translation settings mean the same thing in each.
governancecore = { path = "../governancecore" }
# The plugin ABI surface: the descriptor encoder, the shared severity vocabulary,
# and the generated wire types. Reusing the generated types single-sources the
# wire shape with every other guest instead of restating it locally.
aggrega-pdk-rust = { path = "../../../aggrega-pdk/rust" }
# The render-facet input types are defined in the ABI codec crate and are not
# re-exported by the plugin development kit, so the codec crate is depended on
# directly for those.
aggrega-abi = { path = "../../../aggrega-abi/rust" }
extism-pdk = "1.4"
serde = { version = "1", features = ["derive"] }
# raw_value matches the ABI crate: the settings and artifact-tree fields are
# carried verbatim as raw JSON.
serde_json = { version = "1", features = ["raw_value"] }
# Parses a rendered artifact the host handed over unparsed. YAML is a superset of
# JSON, so one parser covers both formats the host leaves to the guest.
serde_yaml = "0.9"
# Error type shared with the ABI surface: the export macros wrap anyhow::Error
# and the Rego engine returns anyhow::Result, so an evaluation failure
# propagates through the export boundary unchanged.
anyhow = "1"
# Embedded Rego evaluator. Pure-Rust and evaluated entirely in-guest, so the
# host runs no policy engine and carries no policy-language logic.
#
# The engine's default feature set, less `http`. That feature registers
# `http.send` as a builtin that evaluates to undefined rather than making a
# request, so a rule whose body calls it never holds and the policy reaches no
# decision without saying so. Left out, `http.send` is a builtin this engine does
# not implement: a policy calling it fails evaluation naming the function, the
# same way any other unimplemented builtin does, and the build stops instead of
# passing. The guest has no network either way.
#
# The list is the engine's own `default` (`full-opa`, `arc`, `rvm`) with
# `full-opa` spelled out minus `http`. A feature a later engine release adds to
# its defaults is not picked up here until it is listed; the builtins it would
# have registered fail loudly in the meantime rather than allowing.
#
# The same list appears in the plugin kit's two Rego example guests. That is
# deliberate: each of the three is a workspace root of its own, in its own
# repository, so no shared dependency table can hold the list for all of them.
# Change the three together.
regorus = { version = "0.10.1", default-features = false, features = [
    "arc",
    "base64",
    "base64url",
    "cache",
    "coverage",
    "glob",
    "graph",
    "hex",
    "jsonschema",
    "net",
    "opa-runtime",
    "regex",
    "rvm",
    "semver",
    "std",
    "time",
    "urlquery",
    "uuid",
    "yaml",
] }
# Reads a bundled policy archive an operator attached: the archive arrives
# base64-encoded because the source wire carries text, so it is decoded, then
# decompressed, then read as a tar archive. Pure-Rust backends only, so the
# guest compiles to WebAssembly with no native library.
base64 = "0.22"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4", default-features = false }

[profile.release]
# Optimise for size: the embedded evaluator dominates the artifact. Whole-program
# link-time optimisation with a single codegen unit lets dead code across the
# dependency tree be discarded; aborting on panic and stripping symbols removes
# the unwinding machinery and the symbol table, neither of which the guest needs.
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
