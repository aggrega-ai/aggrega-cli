#
# The toolchain this guest is compiled with. It is one exact release, never a
# moving one such as stable: the compiler's own code reaches the guest's bytes, so
# the same source builds to the same module only under the same toolchain, and the
# embedded-plugin build refuses to compile this guest with any other. It sits on
# the plugin development kit's own Rust floor, which this guest builds against and
# which nothing else in its dependency tree raises. rustup reads this file from the
# working directory, which is why the embedded-plugin build enters a crate's
# directory before invoking cargo. Moving it changes every byte of the guest, so it
# moves deliberately, in the change that prepares a release.
#
# The targets are every one this crate is compiled for, so a toolchain installed
# from this file alone builds all of them: wasm32-wasip1 for the guest the binary
# embeds and the release publishes, and wasm32-unknown-unknown for the copy the
# Go tests build from this directory and load. The host target, which builds and
# runs the crate's own tests, comes with every toolchain and is not listed.
[toolchain]
channel = "1.85.1"
targets = ["wasm32-wasip1", "wasm32-unknown-unknown"]
