# GoReleaser configuration for the aggrega CLI.
#
# Run via scripts/release.sh, which verifies the tree and tag and then
# drives `goreleaser release --skip=publish --clean`: artifacts land in
# dist/ and nothing is published. Publishing (pushing the tag, creating
# a release) is always the operator's explicit action.
#
# The stamped version string is v-less ({{ .Version }} is the git tag
# with the leading v stripped), homogeneous with the version form
# catalog entities use. The build is CGo-free and cross-compiles
# cleanly; -trimpath and the pinned mod_timestamp keep builds
# reproducible from the same commit.

version: 2

project_name: aggrega

builds:
  - id: aggrega
    main: ./cmd/aggrega
    binary: aggrega
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .ShortCommit }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

nfpms:
  - id: packages
    package_name: aggrega
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    vendor: Cognitio S.r.l.
    maintainer: Massimiliano Ferrero <m.ferrero@cognitio.it>
    description: Deterministic ahead-of-time compiler for cloud-native deployment artifacts.
    license: Apache-2.0
    bindir: /usr/bin
    formats:
      - deb
      - rpm

checksum:
  name_template: checksums.txt

# Ad-hoc tagless snapshot builds (`goreleaser release --snapshot`)
# stamp the dev form: base version plus build metadata carrying the
# commit, e.g. 0.1.2-dev+abc123f.
snapshot:
  version_template: "{{ .Version }}-dev+{{ .ShortCommit }}"

changelog:
  disable: true

# Never publish from this configuration: no GitHub release, no upload.
# scripts/release.sh additionally passes --skip=publish.
release:
  disable: true
