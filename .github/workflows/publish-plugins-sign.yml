name: Publish and sign core plugins

# Tag-driven publisher for the core provider/linter plugins that are embedded in
# the aggrega binary. On a release tag it works in two phases within one job.
#
# The PREP phase has no external side effects: it checks that every build script
# stamping a version takes it from the one shared recipe, builds the binary and
# its embedded guests (plus the light no-embed binary for the release), asserts
# host/guest ABI self-consistency, builds the Windows and macOS binaries for the
# release, packs the desktop extension package, and generates the core Plugin catalog
# entities. None of these pushes, publishes or releases anything. Only when
# every prep step is green does the PUBLISH phase run: it builds and pushes the tooling image, publishes each plugin with its
# guest to the registry, and creates the GitHub release with the downloadable
# binaries and the extension package. Everything the publish phase signs is
# signed keyless via the GitHub Actions OIDC identity against the public
# Sigstore instance (Fulcio + Rekor).
#
# Two more jobs run after that one and prove the Windows and macOS binaries on
# GitHub-hosted machines of each platform: windows-smoke on a Windows runner, and
# macos-smoke on an Apple silicon (darwin/arm64) and an Intel (darwin/amd64)
# macOS runner. Each runs every binary's version report, the protocol handshake
# over standard input and output, a validate, pull and build of a worked example
# whose result it compares byte for byte with the result this workflow's build
# machine produced, and the tests that prove each platform split behaves on that
# platform, all through one script. They need nothing the build needs — no
# sibling repository, no toolchain, no secret — because the prep phase stages
# everything each runs as one workflow artifact per target. They publish
# nothing, so a dry run is how Windows and macOS are proved before a real
# release; on a release tag they run after the release step, so a failure there
# marks the run failed but does not stop that release.
#
# The prep-then-publish split is load-bearing. Nothing with an external side
# effect runs until every validation has passed, so a failure in the ABI check or
# in catalog generation can never strand an already-pushed tooling image or a
# half-published plugin set. The Wasm guests are reproducible build outputs, not
# tracked files, so they are absent from a fresh checkout: the build MUST run
# before catalog generation (which reads each guest's self-reported descriptor)
# and before the publish (which needs the guest's compiled module).
#
# This workflow NEVER creates or pushes a git tag. Deciding the version and
# cutting the tag is a human action; this workflow publishes the OCI artifacts and
# attaches the built binaries and the extension package to the GitHub release
# for the already-pushed tag.
#
# Before anything is built, the job checks that the registry accepts the stored
# credential: one authenticated GET /v2/, which pushes nothing and opens no
# upload session. The check runs on every run, a dry run included, so a manual
# dry run is also how to prove that the stored credential matches the registry.
#
# The manual-dispatch entry defaults to a dry run. After the credential check it
# builds, packs the extension package, generates the entities, and prints what
# it would push, publish, sign and release, doing none of it; the Windows and
# macOS smoke jobs then run in full.
#
# Settings, by name:
#   variables  CLI_PUBLISH_REGISTRY      the registry to publish to, as its host
#              REGISTRY_USERNAME         the registry username
#              AGGREGA_RUNNER            the runner label (optional, a hosted
#                                        runner by default)
#              CLI_PUBLISH_OVERLAY_DIR   the per-plugin overlay directory
#                                        (optional, aggrega-hub/plugin-overlays
#                                        by default)
#              CLI_PUBLISH_HUB_REF       the aggrega-hub ref the overlays are
#                                        read at (optional, main by default)
#   secrets    REGISTRY_PASSWORD         the registry password
#              SUBMODULE_APP_CLIENT_ID   the organization App that reads the
#              SUBMODULE_APP_PRIVATE_KEY private sibling repositories

on:
  # A release tag is the trigger and the human gate: a person decides the version
  # and pushes the tag. The pattern matches a vMAJOR.MINOR.PATCH tag; a
  # pre-release suffix is intentionally excluded from automatic publishing. The
  # git tag is v-prefixed; the build stamps a v-less version onto the binary,
  # image, and plugins.
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Check the stored registry credential, build, pack the extension package, generate the entities, and print the publish plan without pushing the image, publishing, signing, or creating a release."
        required: false
        default: true
        type: boolean
      tag:
        description: "The release tag (vMAJOR.MINOR.PATCH) to build and publish on a manual run; required for a real manual publish, ignored on a tag push (which uses the pushed tag)."
        required: false
        default: ""
        type: string

# Keyless signing via the GitHub Actions OIDC identity. The workflow mints a
# short-lived identity token from the Actions runtime and signs against the
# public Sigstore instance (Fulcio + Rekor); no offline key is stored. The
# artifacts publish to the public hub, so recording them in the public
# transparency log is expected, not a leak. id-token:write lets the job mint the
# OIDC token. contents:write lets the publish phase create the GitHub release and
# upload the built binaries as release assets on this repository; it grants no
# other git write (the workflow still never creates or pushes a tag).
permissions:
  contents: write
  id-token: write

jobs:
  publish-sign:
    # Configurable runner label. Building the embedded guests is heavy; point the
    # AGGREGA_RUNNER repository variable at a self-hosted label to run the
    # build off metered hosted minutes. The default hosted runner is unlikely to
    # complete the guest build within the free-tier budget — if the build proves
    # infeasible on a hosted runner, provision a self-hosted one rather than
    # splitting the build across jobs (the guests, the image, and the publish all
    # need the one build's outputs on the same workspace).
    runs-on: ${{ vars.AGGREGA_RUNNER || 'ubuntu-latest' }}

    # The commit the Windows and the macOS smoke inputs were staged from, which
    # the windows-smoke and macos-smoke jobs check out: on a dispatch naming a
    # tag the tree here is moved onto that tag, so the commit the run was
    # launched at may not be it.
    outputs:
      smoke_commit: ${{ steps.windows-smoke-inputs.outputs.commit }}
      macos_smoke_commit: ${{ steps.macos-smoke-inputs.outputs.commit }}

    env:
      # Destination registry host. A repository variable the operator sets once;
      # the placeholder default names a host that never resolves, so an unset
      # variable fails the credential check, which names the variable.
      REGISTRY: ${{ vars.CLI_PUBLISH_REGISTRY || 'registry.invalid' }}
      # Registry credentials — needed on EVERY job because the registry is
      # authenticated on push AND pull. Read via the environment (not
      # interpolated into a run script) to avoid expression injection. The
      # username feeds `aggrega login` and `docker login`; the password is read
      # by login from AGGREGA_REGISTRY_PASSWORD.
      REGISTRY_USERNAME: ${{ vars.REGISTRY_USERNAME }}
      AGGREGA_REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      # Public-good Sigstore endpoints for keyless signing. The binary already
      # defaults to these; they are named here so the direct `aggrega sign`
      # calls state the trust roots explicitly.
      FULCIO_URL: https://fulcio.sigstore.dev
      REKOR_URL: https://rekor.sigstore.dev
      # Authored per-plugin overlay directory that catalog generation merges with
      # each guest's machine-derived contract fields. This is a REQUIRED input: the
      # overlays supply the OCI identity, runtime limits, and provider block that
      # the guests deliberately do not carry, and the generate step halts, naming
      # the guest, when one has no overlay. Each overlay's plugin identity must
      # name a guest present in the decompressed guest set below (the publish
      # pairs them by that identity). The overlays live in the aggrega-hub sibling
      # checkout.
      OVERLAY_DIR: ${{ vars.CLI_PUBLISH_OVERLAY_DIR || 'aggrega-hub/plugin-overlays' }}
      # aggrega-hub carries no CLI-side version pin, so it is always checked out at
      # HUB_REF (operator-overridable via a repository variable). The schemas, abi,
      # and pdk siblings are NOT configured here: the CLI's own go.mod is the single
      # source for their versions, and the resolve step below reads those require
      # lines and checks each sibling out at exactly its pinned tag. An unpinned
      # sibling (still on the local-replace placeholder) fails the resolve loudly —
      # the release must pin every sibling before publishing.
      HUB_REF: ${{ vars.CLI_PUBLISH_HUB_REF || 'main' }}
      # Dispatch inputs surfaced as env so run scripts read them from the
      # environment rather than interpolating expressions into shell.
      EVENT_NAME: ${{ github.event_name }}
      DISPATCH_DRY_RUN: ${{ inputs.dry_run }}
      # The release tag requested by a manual dispatch (empty on a tag push).
      # Surfaced as env so the effective tag is resolved from the environment,
      # never interpolated into a script body.
      DISPATCH_TAG: ${{ inputs.tag }}
      # The pushed ref name (the tag on a push event). Surfaced as env for the
      # tag-equals-version assertion; never interpolated into a script body.
      REF_NAME: ${{ github.ref_name }}

    steps:
      # =====================================================================
      # PREP PHASE — no external side effects. Build, validate, and generate.
      # A failure anywhere below halts the run before the PUBLISH phase, so no
      # image, plugin, or release is ever produced from an unvalidated build.
      # =====================================================================

      - name: Mint org app token for private-sibling access
        # The sibling repositories are private; a GitHub App installation token
        # scoped to the org grants the checkout read access to all of them.
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SUBMODULE_APP_CLIENT_ID }}
          private-key: ${{ secrets.SUBMODULE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Check out the CLI with full history and tags
        # This workflow runs in the CLI repository; check it out into aggrega-cli/
        # so its build driver and manifests sit under that path. Full history and
        # tags are fetched so the build stamps the release version from the tag.
        # The CLI cannot build alone: its module resolves the sibling modules
        # through parent-relative replace directives (../aggrega-schemas,
        # ../aggrega-pdk/go, ../aggrega-abi/go), so the sibling repositories are
        # checked out beside it below.
        uses: actions/checkout@v5
        with:
          path: aggrega-cli
          fetch-depth: 0
          fetch-tags: true

      - name: Check the stored registry credential
        # One GET /v2/ with the stored credential, before anything is built;
        # anything but 200 fails, naming the settings to check and reporting only
        # the HTTP status. An empty password or username is refused before any
        # request. It runs on a dry run too, which makes a manual dry run the
        # check that the stored credential matches the registry. It stays ahead
        # of the step that moves the tree onto the release tag, so a dispatch
        # naming an earlier tag still runs this script from the launched ref.
        env:
          REGISTRY_USERNAME: ${{ vars.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          aggrega-cli/.github/scripts/registry-gate.sh credential \
            --registry-url "https://$REGISTRY" \
            --registry-setting CLI_PUBLISH_REGISTRY \
            --username-setting REGISTRY_USERNAME \
            --password-setting REGISTRY_PASSWORD

      - name: Require a tag for a real manual publish
        # A real manual publish (a dispatch that is not a dry run) targets a past
        # release tag, so it MUST name one. Fail fast here, before any build or
        # push, when the tag input is empty. A manual dry run needs no tag: it
        # builds the checked-out CLI tree as-is and prints the plan.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == false && inputs.tag == '' }}
        run: |
          set -euo pipefail
          echo "publish-plugins: a manual publish requires the tag input (vMAJOR.MINOR.PATCH)" >&2
          exit 2

      - name: Pin the CLI tree to the release tag
        # Move the CLI tree onto the release tag before building so the build's
        # `git describe` stamps the released version, and so the sibling pins are
        # read from the tag's go.mod. On a manual dispatch that supplies a tag
        # input the run targets a past release. The effective tag is the pushed
        # tag (push) or the tag input (dispatch). A manual dry run with no tag
        # input skips this and builds the checked-out tree as-is.
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.tag != '') }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            TAG="$REF_NAME"
          else
            TAG="$DISPATCH_TAG"
          fi
          git -C aggrega-cli fetch --force --tags origin
          git -C aggrega-cli checkout --force "refs/tags/${TAG}"

      - name: Check that the version recipe has one home
        # The binary, the embedded guests' self-reported version, the plugin
        # entities generated from them and the desktop extension package are
        # each stamped by a different build script, and a release ships them
        # together. They agree only while every one of those scripts takes the
        # version from the one shared recipe; a script that derived it by its
        # own git invocation could ship a release whose outputs disagree on
        # their version. The check refuses, naming each offending script and
        # line, when a stamping script does not source the shared recipe or
        # derives the version inline. It sits after the step that moves the tree
        # onto the release tag, so it judges the tree this run builds, and before
        # the build, so a forked recipe halts the run before anything is
        # stamped. It reads only the CLI tree, with no toolchain and no network,
        # so it needs nothing the later steps install. It runs on a dry run too.
        run: |
          set -euo pipefail
          aggrega-cli/scripts/check-version-single-source.sh

      - name: Resolve sibling checkout refs from the CLI's go.mod
        # The CLI's own manifests decide the sibling versions: read the schemas,
        # abi, and pdk pins from the (now tag-pinned) go.mod require lines so the
        # siblings are checked out at exactly what this CLI build expects. Reading
        # at runtime keeps the refs correct as the pins move, rather than
        # hardcoding them here. A require still on the local-replace placeholder
        # (empty or v0.0.0) has no published tag: the resolve fails loudly rather
        # than guessing a branch, because a floating branch is exactly the drift a
        # pinned release must not ship. Pin every sibling before publishing.
        # aggrega-hub carries no CLI-side pin, so it always uses HUB_REF.
        id: pins
        run: |
          set -euo pipefail
          gomod=aggrega-cli/go.mod
          read_req() { grep -E "^[[:space:]]+$1 v" "$gomod" | awk '{print $2}' | head -1; }
          require_pin() {
            local module="$1" ref
            ref="$(read_req "$module")"
            case "$ref" in
              ''|v0.0.0)
                echo "resolve: $module is unpinned in go.mod (found '${ref:-<none>}'); pin it to a released tag before publishing" >&2
                exit 1 ;;
            esac
            printf '%s' "$ref"
          }
          # Every sibling tags v-prefixed, so each go.mod require matches its git
          # tag directly — no rewriting needed.
          schemas_ref="$(require_pin github.com/aggrega-ai/aggrega-schemas)"
          abi_ref="$(require_pin github.com/aggrega-ai/aggrega-abi-go)"
          pdk_ref="$(require_pin github.com/aggrega-ai/aggrega-pdk-go)"
          {
            echo "schemas_ref=$schemas_ref"
            echo "abi_ref=$abi_ref"
            echo "pdk_ref=$pdk_ref"
          } >> "$GITHUB_OUTPUT"
          echo "resolved sibling refs: schemas=$schemas_ref abi=$abi_ref pdk=$pdk_ref hub=$HUB_REF"

      - name: Check out the schemas sibling
        # Satisfies the CLI go.mod replace ../aggrega-schemas.
        uses: actions/checkout@v5
        with:
          repository: aggrega-ai/aggrega-schemas
          path: aggrega-schemas
          ref: ${{ steps.pins.outputs.schemas_ref }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Check out the abi sibling
        # Satisfies the CLI go.mod replace ../aggrega-abi/go (repo root holds go/).
        uses: actions/checkout@v5
        with:
          repository: aggrega-ai/aggrega-abi
          path: aggrega-abi
          ref: ${{ steps.pins.outputs.abi_ref }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Check out the pdk sibling
        # Satisfies the CLI go.mod replace ../aggrega-pdk/go (repo root holds go/).
        uses: actions/checkout@v5
        with:
          repository: aggrega-ai/aggrega-pdk
          path: aggrega-pdk
          ref: ${{ steps.pins.outputs.pdk_ref }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Check out the hub sibling
        # Supplies the authored plugin overlays (OVERLAY_DIR) that catalog
        # generation consumes and that the embedded-overlay consistency check
        # reads. aggrega-hub has no CLI-side version pin, so it is checked out at
        # HUB_REF.
        uses: actions/checkout@v5
        with:
          repository: aggrega-ai/aggrega-hub
          path: aggrega-hub
          ref: ${{ env.HUB_REF }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Go
        # Pin the toolchain to the (tag-pinned) module's declared version and
        # cache modules so the guest and binary build does not re-download the
        # dependency graph on every run.
        uses: actions/setup-go@v6
        with:
          go-version-file: aggrega-cli/go.mod
          # 🔴 CACHING OFF, DELIBERATELY. setup-go caches GOMODCACHE and GOCACHE by
          # default, which is right on an ephemeral hosted runner where both vanish
          # between jobs. This workflow runs on a PERSISTENT self-hosted runner,
          # where they are still on disk next run — so the post-job step was tarring
          # and uploading ~3 GB to the Actions cache service, taking minutes, only to
          # download it again over files that never left. It also competes for the
          # 10 GB per-repository cache budget and evicts entries that are not
          # redundant.
          #
          # ⚠️ Reverse this if the job is ever moved back to a hosted runner: there
          # the cache is not redundant and its absence means re-downloading the whole
          # dependency graph every run.
          cache: false

      - name: Install Rust for the wasm32-wasip1 embedded guest
        # Building the CLI regenerates its embedded guests; one guest is a Rust
        # crate compiled to wasm32-wasip1, so the target must be installed.
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85'
          targets: wasm32-wasip1

      - name: Cache the Rust guest build
        # The publishing linter guest is a Rust crate; cache its registry and
        # target so a rebuild does not recompile the dependency graph every run.
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: aggrega-cli/plugins/publishing-linter

      - name: Build the binary and embedded guests
        # Regenerates the Wasm guests and their descriptors and produces the
        # version-stamped binary with the guests embedded. NOT the light build —
        # the light binary embeds no guests and could neither generate the core
        # entities nor supply the guests to publish. Scoped to aggrega-cli:
        # publishing needs only the binary and its embedded guests, not the PDK
        # packages, so an unrelated PDK build issue cannot block a publish (and
        # the run is faster).
        run: |
          set -euo pipefail
          aggrega-cli/scripts/build.sh

      - name: Build the light binary for the release
        # The light no-embed binary ships as a downloadable release asset beside
        # the full binary. It embeds no Wasm guests (-tags light) and resolves
        # every provider through the plugin cascade, so it plays no part in image
        # or plugin publishing — it is built here purely for the GitHub release.
        # Built in the prep phase alongside the full build so a light-build
        # failure halts before any external side effect. The output is
        # aggrega-cli/aggrega-light, beside the full aggrega-cli/aggrega.
        run: |
          set -euo pipefail
          aggrega-cli/scripts/build.sh --light

      - name: Assert ABI self-consistency
        # A real gate, not a comment: the binary reports the single ABI version its
        # host speaks, and every embedded guest self-reports the ABI it binds
        # against in its build descriptor. If any guest disagrees with the host, or
        # any value is empty, the generated catalog entities would advertise an ABI
        # the binary cannot honor — so the run fails here, before generating or
        # publishing anything. Whenever a release tag is in play — a tag push, or a
        # manual dispatch that supplied a tag input — the binary's stamped version
        # must also equal that tag; a mismatch means the build did not stamp the
        # release and the run fails. This is a prep-phase check: it needs only the
        # built binary and its guests, no registry and no image.
        run: |
          set -euo pipefail

          VERSION_JSON="$(aggrega-cli/aggrega version -o json)"
          # Whitespace is stripped before the match so the extraction is insensitive to
          # the pretty-printer, and it needs no jq. Stripping the whole payload is safe
          # only where the extracted value contains no whitespace, which holds for the
          # version and ABI version strings read here.
          HOST_ABI="$(printf '%s' "$VERSION_JSON" | tr -d '[:space:]' | grep -o '"abiVersion":"[^"]*"' | head -1 | cut -d'"' -f4)"
          BIN_VERSION="$(printf '%s' "$VERSION_JSON" | tr -d '[:space:]' | grep -o '"version":"[^"]*"' | head -1 | cut -d'"' -f4)"
          [ -n "$HOST_ABI" ] || { echo "ABI gate: binary reported no abiVersion" >&2; exit 1; }

          DESC_DIR="aggrega-cli/internal/wasm/embedded/plugins"
          shopt -s nullglob
          descriptors=("$DESC_DIR"/*.describe.json)
          [ "${#descriptors[@]}" -gt 0 ] || { echo "ABI gate: no guest descriptors found in $DESC_DIR — the embedded build did not run" >&2; exit 1; }

          mismatch=0
          for d in "${descriptors[@]}"; do
            guest_abi="$(grep -oE '"abi_version"[[:space:]]*:[[:space:]]*"[^"]+"' "$d" | head -1 | grep -oE '"[^"]+"$' | tr -d '"')"
            if [ -z "$guest_abi" ]; then
              echo "ABI gate: $d reports no abi_version" >&2
              mismatch=1
            elif [ "$guest_abi" != "$HOST_ABI" ]; then
              echo "ABI gate: $d reports abi_version '$guest_abi' but the binary speaks '$HOST_ABI'" >&2
              mismatch=1
            fi
          done
          [ "$mismatch" -eq 0 ] || { echo "ABI gate: host/guest ABI mismatch — refusing to generate or publish" >&2; exit 1; }

          if [ "$EVENT_NAME" = "push" ]; then
            TAG="$REF_NAME"
          else
            TAG="$DISPATCH_TAG"
          fi
          if [ -n "$TAG" ]; then
            EXPECTED="${TAG#v}"
            if [ "$BIN_VERSION" != "$EXPECTED" ]; then
              echo "ABI gate: binary version '$BIN_VERSION' does not equal the release tag '$EXPECTED'" >&2
              exit 1
            fi
          fi

          echo "ABI gate: host and ${#descriptors[@]} guest(s) all agree on '$HOST_ABI'"

      - name: Build the Windows binary and its stripped copy for the release
        # The release also carries the CLI for windows/amd64, built by the same
        # build script as the Linux binary with the target named, so the two
        # cannot follow different build steps. The full binary embeds the guests
        # the Linux build above regenerated, which are WebAssembly and the same
        # for every system. --stripped also writes the stripped copy, the full
        # binary without its debug information, with the one recipe the tooling
        # image strips the Linux copy with. A Windows binary cannot run on this
        # runner, so the script reads each binary's stamped version from the
        # binary itself and refuses, naming both, unless it is the version the
        # Linux binary reports — which, whenever a release tag is in play, the
        # ABI gate above has already held to that tag. Writes
        # aggrega-cli/aggrega-windows-amd64.exe and
        # aggrega-cli/aggrega-stripped-windows-amd64.exe. A prep-phase step with
        # no external side effect: a dry run builds both, and the release step
        # attaches them.
        run: |
          set -euo pipefail
          # Whitespace is stripped before the match so the extraction is insensitive to
          # the pretty-printer, and it needs no jq. Stripping the whole payload is safe
          # only where the extracted value contains no whitespace, which holds for the
          # version string read here.
          BIN_VERSION="$(aggrega-cli/aggrega version -o json | tr -d '[:space:]' | grep -o '"version":"[^"]*"' | head -1 | cut -d'"' -f4)"
          [ -n "$BIN_VERSION" ] || { echo "binary reported no version" >&2; exit 1; }
          aggrega-cli/scripts/build.sh --target windows/amd64 --stripped --expect-version "$BIN_VERSION"

      - name: Build the light Windows binary for the release
        # The light no-embed binary for windows/amd64, by the same build script
        # and held to the same version as the step above, for the same reasons.
        # Writes aggrega-cli/aggrega-light-windows-amd64.exe; a dry run builds it
        # too.
        run: |
          set -euo pipefail
          # Whitespace is stripped before the match so the extraction is insensitive to
          # the pretty-printer, and it needs no jq. Stripping the whole payload is safe
          # only where the extracted value contains no whitespace, which holds for the
          # version string read here.
          BIN_VERSION="$(aggrega-cli/aggrega version -o json | tr -d '[:space:]' | grep -o '"version":"[^"]*"' | head -1 | cut -d'"' -f4)"
          [ -n "$BIN_VERSION" ] || { echo "binary reported no version" >&2; exit 1; }
          aggrega-cli/scripts/build.sh --light --target windows/amd64 --expect-version "$BIN_VERSION"

      - name: Build the macOS arm64 binary for the release
        # The release also carries the CLI for macOS on Apple silicon
        # (darwin/arm64) and on Intel (darwin/amd64), in the full and light
        # variants, built by the same build script as the Linux and Windows
        # binaries with the target named; the full binary embeds the guests the
        # Linux build above regenerated. A macOS binary cannot run on this
        # runner, so the script reads each binary's stamped version from the
        # binary itself and refuses, naming both, unless it is the version the
        # Linux binary reports — which, whenever a release tag is in play, the
        # ABI gate above has already held to that tag. There is no stripped macOS
        # binary: the strip recipe's GNU strip cannot read a macOS binary, and the
        # script refuses --stripped with a darwin target. The Go linker signs an
        # arm64 binary ad hoc, which an Apple silicon Mac requires before it runs
        # one; no macOS binary carries a Developer ID signature or is notarized.
        # Writes aggrega-cli/aggrega-darwin-arm64. A prep-phase step with no
        # external side effect: a dry run builds it, and the release step
        # attaches it.
        run: |
          set -euo pipefail
          # Whitespace is stripped before the match so the extraction is insensitive to
          # the pretty-printer, and it needs no jq. Stripping the whole payload is safe
          # only where the extracted value contains no whitespace, which holds for the
          # version string read here.
          BIN_VERSION="$(aggrega-cli/aggrega version -o json | tr -d '[:space:]' | grep -o '"version":"[^"]*"' | head -1 | cut -d'"' -f4)"
          [ -n "$BIN_VERSION" ] || { echo "binary reported no version" >&2; exit 1; }
          aggrega-cli/scripts/build.sh --target darwin/arm64 --expect-version "$BIN_VERSION"

      - name: Build the light macOS arm64 binary for the release
        # The light no-embed binary for darwin/arm64, by the same build script
        # and held to the same version as the step above, for the same reasons.
        # Writes aggrega-cli/aggrega-light-darwin-arm64; a dry run builds it too.
        run: |
          set -euo pipefail
          # Whitespace is stripped before the match so the extraction is insensitive to
          # the pretty-printer, and it needs no jq. Stripping the whole payload is safe
          # only where the extracted value contains no whitespace, which holds for the
          # version string read here.
          BIN_VERSION="$(aggrega-cli/aggrega version -o json | tr -d '[:space:]' | grep -o '"version":"[^"]*"' | head -1 | cut -d'"' -f4)"
          [ -n "$BIN_VERSION" ] || { echo "binary reported no version" >&2; exit 1; }
          aggrega-cli/scripts/build.sh --light --target darwin/arm64 --expect-version "$BIN_VERSION"

      - name: Build the macOS amd64 binary for the release
        # The full binary for darwin/amd64, by the same build script and held to
        # the same version as the macOS arm64 steps above, for the same reasons;
        # an amd64 binary carries no signature, which an Intel Mac does not
        # require. Writes aggrega-cli/aggrega-darwin-amd64; a dry run builds it
        # too.
        run: |
          set -euo pipefail
          # Whitespace is stripped before the match so the extraction is insensitive to
          # the pretty-printer, and it needs no jq. Stripping the whole payload is safe
          # only where the extracted value contains no whitespace, which holds for the
          # version string read here.
          BIN_VERSION="$(aggrega-cli/aggrega version -o json | tr -d '[:space:]' | grep -o '"version":"[^"]*"' | head -1 | cut -d'"' -f4)"
          [ -n "$BIN_VERSION" ] || { echo "binary reported no version" >&2; exit 1; }
          aggrega-cli/scripts/build.sh --target darwin/amd64 --expect-version "$BIN_VERSION"

      - name: Build the light macOS amd64 binary for the release
        # The light no-embed binary for darwin/amd64, by the same build script
        # and held to the same version as the steps above, for the same reasons.
        # Writes aggrega-cli/aggrega-light-darwin-amd64; a dry run builds it too.
        run: |
          set -euo pipefail
          # Whitespace is stripped before the match so the extraction is insensitive to
          # the pretty-printer, and it needs no jq. Stripping the whole payload is safe
          # only where the extracted value contains no whitespace, which holds for the
          # version string read here.
          BIN_VERSION="$(aggrega-cli/aggrega version -o json | tr -d '[:space:]' | grep -o '"version":"[^"]*"' | head -1 | cut -d'"' -f4)"
          [ -n "$BIN_VERSION" ] || { echo "binary reported no version" >&2; exit 1; }
          aggrega-cli/scripts/build.sh --light --target darwin/amd64 --expect-version "$BIN_VERSION"

      - name: Stage the Windows smoke run's inputs
        # Everything the windows-smoke job runs, staged by one script into one
        # directory: the three Windows binaries above; a Windows test executable
        # for each package whose tests prove a platform split, cross-compiled
        # here because the Windows runner has no toolchain and no sibling
        # repositories; and the worked example, with the workspace this
        # machine's validate, pull and build of it leave — the bytes the Windows
        # run must reproduce. The example builds from a catalog in this
        # repository and the guests the full binary embeds, offline and with no
        # configuration of this machine read, so the Windows run needs no
        # registry either. The script builds that reference twice, in two
        # directories, and refuses when the two differ. A prep-phase step with
        # no external side effect; a dry run stages too. It needs no credential,
        # so the registry password is blanked for it.
        id: windows-smoke-inputs
        env:
          AGGREGA_REGISTRY_PASSWORD: ''
        run: |
          set -euo pipefail
          aggrega-cli/scripts/stage-platform-smoke.sh --target windows/amd64 --output-dir "$RUNNER_TEMP/windows-smoke"
          # The commit the windows-smoke job checks out is the one the staged
          # inputs record, so the job and the inputs cannot name different ones.
          while IFS='=' read -r key value; do
            if [ "$key" = commit ]; then
              printf 'commit=%s\n' "$value" >> "$GITHUB_OUTPUT"
            fi
          done < "$RUNNER_TEMP/windows-smoke/smoke.env"

      - name: Upload the Windows smoke run's inputs
        # One workflow artifact, read only by the windows-smoke job of this same
        # run and kept for a day. Hidden files are included so the example
        # reaches the Windows run exactly as it was built here.
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-inputs
          path: ${{ runner.temp }}/windows-smoke
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

      - name: Stage the macOS smoke runs' inputs
        # Everything each macos-smoke job runs, staged by the same script as the
        # Windows inputs, once per macOS target into a directory of its own: the
        # full and light binaries above for that target, its test executables,
        # cross-compiled here, and the worked example with the workspace this
        # machine's validate, pull and build of it leave. The tests listed for
        # Windows alone are left out and named in the log. A prep-phase step
        # with no external side effect; a dry run stages too. It needs no
        # credential, so the registry password is blanked for it.
        id: macos-smoke-inputs
        env:
          AGGREGA_REGISTRY_PASSWORD: ''
        run: |
          set -euo pipefail
          for target in darwin/arm64 darwin/amd64; do
            aggrega-cli/scripts/stage-platform-smoke.sh --target "$target" --output-dir "$RUNNER_TEMP/macos-smoke/${target/\//-}"
          done
          # Both targets are staged from this one tree, so their inputs record
          # one commit; the macos-smoke jobs check out that commit, and the
          # smoke script refuses a checkout at any other.
          while IFS='=' read -r key value; do
            if [ "$key" = commit ]; then
              printf 'commit=%s\n' "$value" >> "$GITHUB_OUTPUT"
            fi
          done < "$RUNNER_TEMP/macos-smoke/darwin-arm64/smoke.env"

      - name: Upload the macOS arm64 smoke run's inputs
        # One workflow artifact per macOS target, read only by that target's
        # macos-smoke job of this same run and kept for a day. Hidden files are
        # included so the example reaches the macOS run exactly as it was built
        # here. An artifact keeps the bytes of each file, the signature the
        # linker embeds in an arm64 executable among them, but not its mode; the
        # smoke script makes the executables executable again.
        uses: actions/upload-artifact@v4
        with:
          name: macos-smoke-inputs-darwin-arm64
          path: ${{ runner.temp }}/macos-smoke/darwin-arm64
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

      - name: Upload the macOS amd64 smoke run's inputs
        # The darwin/amd64 inputs, as the step above uploads the darwin/arm64 ones.
        uses: actions/upload-artifact@v4
        with:
          name: macos-smoke-inputs-darwin-amd64
          path: ${{ runner.temp }}/macos-smoke/darwin-amd64
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

      - name: Set up Node for the extension packer
        # The desktop extension package is packed by the bundle format's own
        # packer, an npm package, so the job needs Node. A self-hosted runner need
        # not carry it, so it is installed here rather than assumed.
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Pack the desktop extension package
        # Builds aggrega-<version>.mcpb, the single file a client such as Claude
        # Desktop adds from its extension settings to run Aggrega as a local MCP
        # server. The step is one invocation of the script that holds the whole
        # procedure — the pinned packer, the version stamp, validation and
        # packing — so a local build and a release build cannot differ. The
        # script stamps the bundle's version from the same recipe the binary's
        # stamp uses, and refuses, naming both, when the stamp differs from the
        # version the built binary reports — which, whenever a release tag is in
        # play, the ABI gate above has already held to that tag. A prep-phase
        # step with no external side effect: a dry run packs the bundle too, and
        # the release step attaches it.
        #
        # The packer is third-party npm code run inside this job, so the registry
        # password the job's environment carries is blanked for this step.
        id: mcp-bundle
        env:
          AGGREGA_REGISTRY_PASSWORD: ''
        run: |
          set -euo pipefail
          # Whitespace is stripped before the match so the extraction is insensitive to
          # the pretty-printer, and it needs no jq. Stripping the whole payload is safe
          # only where the extracted value contains no whitespace, which holds for the
          # version string read here.
          BIN_VERSION="$(aggrega-cli/aggrega version -o json | tr -d '[:space:]' | grep -o '"version":"[^"]*"' | head -1 | cut -d'"' -f4)"
          [ -n "$BIN_VERSION" ] || { echo "binary reported no version" >&2; exit 1; }
          BUNDLE="$(aggrega-cli/scripts/build-mcp-bundle.sh --output-dir "$RUNNER_TEMP/mcp-bundle" --expect-version "$BIN_VERSION")"
          echo "bundle=$BUNDLE" >> "$GITHUB_OUTPUT"
          echo "packed $BUNDLE"

      - name: Generate the core plugin catalog entities
        # Emits one Plugin entity per embedded guest by merging each guest's
        # machine-derived contract fields with its authored overlay; the entity
        # version is the binary's own build version. The overlay directory is the
        # REQUIRED authored input surfaced above; a guest with no overlay halts
        # this step rather than getting invented entity content.
        # A prep-phase step: pure computation from the built guests, with no
        # external side effect, so it runs before anything is pushed.
        run: |
          set -euo pipefail
          export AGGREGA_BIN="$PWD/aggrega-cli/aggrega"
          mkdir -p "$RUNNER_TEMP/entities"
          "$AGGREGA_BIN" plugin gen-catalog --from-embedded --overlay "$OVERLAY_DIR" --output-dir "$RUNNER_TEMP/entities"

      # =====================================================================
      # PUBLISH PHASE — reached only when every prep step above succeeded.
      # These steps have real external side effects and are each gated to a real
      # publish (a push event, or a manual dispatch with dry_run=false); a dry
      # run prints its plan and pushes, publishes, signs, and releases nothing.
      # Registry auth and the OIDC-token mint sit here at the phase boundary:
      # neither pushes anything itself, but both are prerequisites of the pushes
      # that follow, so they run immediately before them.
      # =====================================================================

      - name: Authenticate to the registry
        # Only a real publish logs in. A dry run's one contact with the registry
        # is the credential check at the start of the job, which needs no stored
        # login. Both the tooling-image push (docker) and the plugin publish
        # (aggrega) authenticate with the same registry credentials; the password
        # is read from the environment, never placed on a command line or
        # interpolated.
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
        run: |
          set -euo pipefail
          aggrega-cli/aggrega login "$REGISTRY" --username "$REGISTRY_USERNAME"
          printf '%s' "$AGGREGA_REGISTRY_PASSWORD" | docker login "$REGISTRY" --username "$REGISTRY_USERNAME" --password-stdin

      - name: Mint the Sigstore OIDC identity token
        # Keyless signing needs a short-lived OIDC identity token. Request one
        # from the Actions runtime (available because id-token:write is granted),
        # audience-scoped to sigstore, and export it as SIGSTORE_ID_TOKEN so every
        # `aggrega sign` in later steps reads it non-interactively — no browser,
        # no offline key. Only a real publish signs, so a dry run skips this.
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
        run: |
          set -euo pipefail
          token_json="$(curl -sSL \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sigstore")"
          id_token="$(printf '%s' "$token_json" | grep -o '"value":"[^"]*"' | head -1 | cut -d'"' -f4)"
          [ -n "$id_token" ] || { echo "OIDC: runtime returned no token value" >&2; exit 1; }
          echo "::add-mask::$id_token"
          echo "SIGSTORE_ID_TOKEN=$id_token" >> "$GITHUB_ENV"

      - name: Make the image builder available
        # The tooling image is built with `docker buildx build --platform … --push`,
        # and buildx is a docker CLI PLUGIN rather than part of docker itself. Where
        # the plugin is absent the CLI parses `buildx build` as positional arguments
        # to its root command, so the first unrecognised flag is what it reports:
        # `unknown flag: --platform`, followed by the ROOT usage rather than
        # `docker build`'s. That names the flag instead of the missing plugin, so it
        # reads as a defect in the build script and is not one — the script asks for
        # the right tool and the tool is not installed. This step supplies it.
        #
        # It runs unconditionally, including on a dry run that pushes nothing. A dry
        # run exists to answer whether the real run would work, so it has to meet the
        # same prerequisites; skipping the builder here would let this failure hide
        # until the next real publish, which is exactly how it was found.
        uses: docker/setup-buildx-action@v3

      - name: Build and push the tooling image
        # Packages the freshly-built embedded binary as the tooling image at the
        # reserved tools/ namespace so consumer CI can run the CLI without a Go
        # toolchain. A dry run prints the planned commands and pushes nothing; a
        # real run pushes and then signs the image by reference keyless against
        # public Sigstore. The image tag is derived from the same version the
        # binary reports, so the pushed reference and the binary stay in lockstep.
        #
        # The image carries a copy of the binary stripped of its debug
        # information, because of the registry's per-request ceiling: the
        # registry refuses a single upload request above 100,000,000 bytes, and
        # buildx sends each layer in one request, the binary's layer included.
        # The build script strips the copy on a dry run too, and keeps
        # it at the path this step outputs as stripped_binary; the release step
        # attaches that same file, so the image and the release asset cannot
        # differ. aggrega-cli/aggrega itself stays as built.
        id: tooling-image
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            DRY="$DISPATCH_DRY_RUN"
          else
            DRY="false"
          fi

          STRIPPED_BINARY="$RUNNER_TEMP/aggrega-stripped"
          echo "stripped_binary=$STRIPPED_BINARY" >> "$GITHUB_OUTPUT"

          if [ "$DRY" = "true" ]; then
            aggrega-cli/scripts/build-tooling-image.sh --registry "$REGISTRY" \
              --keep-stripped "$STRIPPED_BINARY" --dry-run
            exit 0
          fi

          aggrega-cli/scripts/build-tooling-image.sh --registry "$REGISTRY" \
            --keep-stripped "$STRIPPED_BINARY" --push

          # Sign the pushed image by its resolved reference, keyless against
          # public Sigstore. The identity token is read from SIGSTORE_ID_TOKEN
          # (minted above). The image tag equals the binary's reported version
          # (v-less), matching the tag the build script pushed.
          # Whitespace is stripped before the match so the extraction is insensitive to
          # the pretty-printer, and it needs no jq. Stripping the whole payload is safe
          # only where the extracted value contains no whitespace, which holds for the
          # version and ABI version strings read here.
          BIN_VERSION="$(aggrega-cli/aggrega version -o json | tr -d '[:space:]' | grep -o '"version":"[^"]*"' | head -1 | cut -d'"' -f4)"
          [ -n "$BIN_VERSION" ] || { echo "binary reported no version" >&2; exit 1; }
          aggrega-cli/aggrega sign "$REGISTRY/tools/aggrega:$BIN_VERSION" \
            --fulcio-url "$FULCIO_URL" --rekor-url "$REKOR_URL"

      - name: Publish and sign the core plugins
        # Publishes exactly the set of guests built into this binary: each
        # generated entity paired with its decompressed guest, pushed and signed
        # keyless against public Sigstore. The guests are embedded compressed, so
        # decompress them into a working directory the publish reads; the publish
        # pairs each entity to its guest by the entity's plugin identity. A dry run
        # prints the reference set and the sign plan without any network call or
        # signing.
        run: |
          set -euo pipefail
          export AGGREGA_BIN="$PWD/aggrega-cli/aggrega"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            DRY="$DISPATCH_DRY_RUN"
          else
            DRY="false"
          fi

          # Stage each guest under the filename the PUBLISHER will look for, and
          # ask the product's own tool what that filename is rather than building
          # one here. The guests are embedded as <name>.wasm.gz, but a plugin's
          # guest file is identified by socket AND name — `governance--cel.wasm`,
          # not `cel.wasm` — because a name is unique only within its socket.
          # Deriving the staged name from the .gz filename produced `cel.wasm`,
          # the publisher looked for `governance--cel.wasm`, and all 14 failed.
          #
          # 🔴 `internal/buildtools/pluginguestfile` is the one place that rule
          # lives, and publish-plugins.sh resolves every guest through it. Reading
          # the socket out of the entity path and joining it here would work today
          # and be a second copy of the rule — the first naming change would break
          # this loop silently, since a wrong name looks exactly like a missing file.
          WASM_DIR="$RUNNER_TEMP/wasm"
          mkdir -p "$WASM_DIR"
          staged=0
          for entity in "$RUNNER_TEMP"/entities/*/*/*/plugin.yaml; do
            [ -f "$entity" ] || continue
            leaf="$(cd aggrega-cli && GOWORK=off go run ./internal/buildtools/pluginguestfile -entity "$entity")"
            # entities/<socket>/<name>/<version>/plugin.yaml -> <name>
            name="$(basename "$(dirname "$(dirname "$entity")")")"
            src="aggrega-cli/internal/wasm/embedded/plugins/$name.wasm.gz"
            [ -f "$src" ] || { echo "no embedded guest for $entity at $src" >&2; exit 1; }
            gunzip -c "$src" > "$WASM_DIR/$leaf"
            staged=$((staged + 1))
          done
          [ "$staged" -gt 0 ] || { echo "staged no guests — entity generation produced nothing" >&2; exit 1; }
          echo "staged $staged guest(s) into $WASM_DIR"

          args=(enumerate-embedded --entities-dir "$RUNNER_TEMP/entities" --wasm-dir "$WASM_DIR" --registry "$REGISTRY")
          if [ "$DRY" = "true" ]; then
            args+=(--dry-run)
          else
            # Keyless signing: publish-plugins.sh signs each reference through
            # `aggrega push --plugin --sign`, which reads the identity token from
            # SIGSTORE_ID_TOKEN (minted above) and uses the binary's public
            # Sigstore defaults for Fulcio and Rekor.
            args+=(--sign)
          fi

          aggrega-cli/scripts/publish-plugins.sh "${args[@]}"

      - name: Create the GitHub release and upload the binaries and the extension package
        # The publish phase's final side effect: attach the full, light and
        # stripped binaries for linux/amd64 and for windows/amd64, the full and
        # light binaries for darwin/arm64 and for darwin/amd64, and the desktop
        # extension package, to the GitHub release for this tag so they are
        # downloadable from the release page. A stripped binary is the full
        # binary without its debug information. The Linux one is the very file
        # the tooling image carries, which the image step kept at its
        # stripped_binary output; this step copies that file and never strips,
        # so the asset and the image cannot differ. The Windows and macOS ones
        # are the files the Windows and macOS build steps wrote, each already
        # held to the Linux binary's version. The extension package is the file
        # the pack step wrote, copied under the name the pack script gave it.
        # The embedded guests are NOT uploaded here — they publish to the
        # registry with their Plugin entities; the release carries only the
        # runnable binaries and the extension package, and GitHub attaches the
        # source archives on its own. The step refuses to release when any of
        # those files is missing. A dry run prints the planned release and asset
        # names and creates nothing. The release lands on this repository —
        # GH_REPO pins it explicitly — for the tag the human already pushed;
        # contents:write authorizes it. Asset names carry the binary's reported
        # version; the binaries' also carry their build's target, linux/amd64,
        # windows/amd64 (with .exe), darwin/arm64 or darwin/amd64, and the
        # extension package's carries none, because it holds no program and
        # serves every platform its manifest declares.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STRIPPED_BINARY: ${{ steps.tooling-image.outputs.stripped_binary }}
          MCP_BUNDLE: ${{ steps.mcp-bundle.outputs.bundle }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            DRY="$DISPATCH_DRY_RUN"
            TAG="$DISPATCH_TAG"
          else
            DRY="false"
            TAG="$REF_NAME"
          fi

          # Whitespace is stripped before the match so the extraction is insensitive to
          # the pretty-printer, and it needs no jq. Stripping the whole payload is safe
          # only where the extracted value contains no whitespace, which holds for the
          # version and ABI version strings read here.
          BIN_VERSION="$(aggrega-cli/aggrega version -o json | tr -d '[:space:]' | grep -o '"version":"[^"]*"' | head -1 | cut -d'"' -f4)"
          [ -n "$BIN_VERSION" ] || { echo "binary reported no version" >&2; exit 1; }

          # The stripped binary is the file the tooling image step kept; refuse
          # rather than release two binaries when it is missing.
          if [ -z "$STRIPPED_BINARY" ] || [ ! -f "$STRIPPED_BINARY" ]; then
            echo "the tooling image step kept no stripped binary (expected at '${STRIPPED_BINARY:-<unset>}')" >&2
            exit 1
          fi

          # The extension package is the file the pack step wrote; refuse rather
          # than release without it when it is missing.
          if [ -z "$MCP_BUNDLE" ] || [ ! -f "$MCP_BUNDLE" ]; then
            echo "the pack step wrote no extension package (expected at '${MCP_BUNDLE:-<unset>}')" >&2
            exit 1
          fi

          # The Windows binaries are the files the Windows build steps wrote;
          # refuse rather than release without one when it is missing.
          WIN_FULL="aggrega-cli/aggrega-windows-amd64.exe"
          WIN_LIGHT="aggrega-cli/aggrega-light-windows-amd64.exe"
          WIN_STRIPPED="aggrega-cli/aggrega-stripped-windows-amd64.exe"
          for built in "$WIN_FULL" "$WIN_LIGHT" "$WIN_STRIPPED"; do
            if [ ! -f "$built" ]; then
              echo "the Windows build steps wrote no $(basename "$built") (expected at '$built')" >&2
              exit 1
            fi
          done

          # The macOS binaries are the files the macOS build steps wrote; refuse
          # rather than release without one when it is missing.
          MAC_ARM_FULL="aggrega-cli/aggrega-darwin-arm64"
          MAC_ARM_LIGHT="aggrega-cli/aggrega-light-darwin-arm64"
          MAC_AMD_FULL="aggrega-cli/aggrega-darwin-amd64"
          MAC_AMD_LIGHT="aggrega-cli/aggrega-light-darwin-amd64"
          for built in "$MAC_ARM_FULL" "$MAC_ARM_LIGHT" "$MAC_AMD_FULL" "$MAC_AMD_LIGHT"; do
            if [ ! -f "$built" ]; then
              echo "the macOS build steps wrote no $(basename "$built") (expected at '$built')" >&2
              exit 1
            fi
          done

          RELEASE_DIR="$RUNNER_TEMP/release"
          mkdir -p "$RELEASE_DIR"
          FULL_ASSET="$RELEASE_DIR/aggrega-$BIN_VERSION-linux-amd64"
          LIGHT_ASSET="$RELEASE_DIR/aggrega-light-$BIN_VERSION-linux-amd64"
          STRIPPED_ASSET="$RELEASE_DIR/aggrega-stripped-$BIN_VERSION-linux-amd64"
          WIN_FULL_ASSET="$RELEASE_DIR/aggrega-$BIN_VERSION-windows-amd64.exe"
          WIN_LIGHT_ASSET="$RELEASE_DIR/aggrega-light-$BIN_VERSION-windows-amd64.exe"
          WIN_STRIPPED_ASSET="$RELEASE_DIR/aggrega-stripped-$BIN_VERSION-windows-amd64.exe"
          MAC_ARM_FULL_ASSET="$RELEASE_DIR/aggrega-$BIN_VERSION-darwin-arm64"
          MAC_ARM_LIGHT_ASSET="$RELEASE_DIR/aggrega-light-$BIN_VERSION-darwin-arm64"
          MAC_AMD_FULL_ASSET="$RELEASE_DIR/aggrega-$BIN_VERSION-darwin-amd64"
          MAC_AMD_LIGHT_ASSET="$RELEASE_DIR/aggrega-light-$BIN_VERSION-darwin-amd64"
          BUNDLE_ASSET="$RELEASE_DIR/$(basename "$MCP_BUNDLE")"
          cp aggrega-cli/aggrega "$FULL_ASSET"
          cp aggrega-cli/aggrega-light "$LIGHT_ASSET"
          cp "$STRIPPED_BINARY" "$STRIPPED_ASSET"
          cp "$WIN_FULL" "$WIN_FULL_ASSET"
          cp "$WIN_LIGHT" "$WIN_LIGHT_ASSET"
          cp "$WIN_STRIPPED" "$WIN_STRIPPED_ASSET"
          cp "$MAC_ARM_FULL" "$MAC_ARM_FULL_ASSET"
          cp "$MAC_ARM_LIGHT" "$MAC_ARM_LIGHT_ASSET"
          cp "$MAC_AMD_FULL" "$MAC_AMD_FULL_ASSET"
          cp "$MAC_AMD_LIGHT" "$MAC_AMD_LIGHT_ASSET"
          cp "$MCP_BUNDLE" "$BUNDLE_ASSET"

          # The one list of what the release carries: the dry run prints it, and
          # the upload and the creation attach exactly it.
          ASSETS=(
            "$FULL_ASSET" "$LIGHT_ASSET" "$STRIPPED_ASSET"
            "$WIN_FULL_ASSET" "$WIN_LIGHT_ASSET" "$WIN_STRIPPED_ASSET"
            "$MAC_ARM_FULL_ASSET" "$MAC_ARM_LIGHT_ASSET"
            "$MAC_AMD_FULL_ASSET" "$MAC_AMD_LIGHT_ASSET"
            "$BUNDLE_ASSET"
          )

          if [ "$DRY" = "true" ]; then
            echo "publish-plugins (dry-run): would create release '$TAG' on $GH_REPO with assets:"
            for asset in "${ASSETS[@]}"; do
              echo "  $(basename "$asset")"
            done
            exit 0
          fi

          # Idempotent on re-run (a manual re-publish of a tag whose release
          # already exists): create the release the first time, otherwise
          # re-upload the assets over the existing ones.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "$TAG" \
              --notes "Release $TAG. Downloadable binaries for linux/amd64, for windows/amd64 (the Windows files end in .exe and are not code-signed), and for macOS on Apple silicon (darwin/arm64) and on Intel (darwin/amd64) (the macOS files carry no Developer ID signature and are not notarized): aggrega (full, with embedded plugin guests), aggrega-light (no-embed, resolves plugins through the cascade) and, for linux/amd64 and windows/amd64, aggrega-stripped (the full binary without its debug information; for linux/amd64, the same bytes the tooling image carries). $(basename "$BUNDLE_ASSET") is the desktop extension package: added from Claude Desktop's extension settings, it runs an aggrega binary already installed as a local MCP server. It carries no program of its own, so the one file serves macOS, Windows and Linux."
          fi

  windows-smoke:
    # Runs the Windows binaries the job above built, on Windows. Cross-compiling
    # proves only that the code compiles for Windows; this job proves that the
    # binaries start, answer, and build what the Linux build builds, byte for
    # byte, and that the platform splits — file locks, files another process
    # holds open, forward-slash paths, a Unix-socket listen address — behave
    # there. Everything it runs comes from the artifact the job above staged; it
    # checks out this repository only so that each test executable runs from its
    # package directory, at the commit the artifact records. It holds no secret
    # and reads only this repository, and its one script stops at the first
    # failure, saying what failed.
    needs: publish-sign
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        # The shell Git for Windows installs on the runner; the script it runs
        # is bash.
        shell: bash
    steps:
      - name: Keep line endings exactly as committed
        # The comparison and the tests read checked-out files, so the checkout
        # must hold the committed bytes; a Git configured to convert line
        # endings on checkout would hand them different ones.
        run: git config --global core.autocrlf false

      - name: Check out the CLI at the commit the inputs were staged from
        uses: actions/checkout@v5
        with:
          path: aggrega-cli
          ref: ${{ needs.publish-sign.outputs.smoke_commit }}
          persist-credentials: false

      - name: Download the Windows smoke run's inputs
        uses: actions/download-artifact@v4
        with:
          name: windows-smoke-inputs
          path: ${{ runner.temp }}/windows-smoke

      - name: Run the Windows binaries and tests
        # The versions, the handshake, the example and its byte comparison —
        # with a planted one-byte difference shown turning the comparison red —
        # then the named tests, any of which skipping or not running fails the
        # step. aggrega-cli/scripts/platform-smoke.sh --help says what each
        # check asserts.
        run: |
          set -euo pipefail
          aggrega-cli/scripts/platform-smoke.sh --target windows/amd64 --inputs "$RUNNER_TEMP/windows-smoke"

  macos-smoke:
    # Runs the macOS binaries the job above built, on macOS: the darwin/arm64
    # ones on an Apple silicon runner and the darwin/amd64 ones on an Intel
    # runner, through the same script and the same checks as windows-smoke. It
    # proves that the binaries start, answer, and build what the Linux build
    # builds, byte for byte, and that the platform splits — file locks, files
    # another process holds open, forward-slash paths, a Unix-socket listen
    # address — behave there. The script also refuses a machine whose
    # architecture is not the target's, because a Mac with Apple silicon runs
    # an amd64 binary too, through Rosetta 2. Everything it runs comes from the
    # artifact the job above staged for the target; it checks out this
    # repository only so that each test executable runs from its package
    # directory, at the commit the artifact records. It holds no secret and
    # reads only this repository.
    #
    # macos-15 names GitHub's hosted Apple silicon image and macos-15-intel its
    # hosted Intel image. A label GitHub does not offer leaves its job queued,
    # waiting for a runner that never comes, so a job that never starts is the
    # sign that its label needs changing here.
    needs: publish-sign
    name: macos-smoke (${{ matrix.target }})
    strategy:
      # Each target is a proof of its own: one failing does not cancel the other.
      fail-fast: false
      matrix:
        include:
          - target: darwin/arm64
            artifact: macos-smoke-inputs-darwin-arm64
            runner: macos-15
          - target: darwin/amd64
            artifact: macos-smoke-inputs-darwin-amd64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line endings exactly as committed
        # The comparison and the tests read checked-out files, so the checkout
        # must hold the committed bytes whatever the runner's Git is configured
        # to do with line endings.
        run: git config --global core.autocrlf false

      - name: Check out the CLI at the commit the inputs were staged from
        uses: actions/checkout@v5
        with:
          path: aggrega-cli
          ref: ${{ needs.publish-sign.outputs.macos_smoke_commit }}
          persist-credentials: false

      - name: Download the macOS smoke run's inputs
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/macos-smoke

      - name: Provide a bash the smoke script can run under
        # The smoke script needs bash 4.3 or later, and the bash macOS ships is
        # older. The script's own check decides: when the bash on PATH passes
        # it, nothing is installed; otherwise Homebrew installs a current bash,
        # and its directory goes first on PATH for the steps after this one.
        run: |
          if bash -c '. aggrega-cli/scripts/lib/platform-smoke-common.sh && smoke_require_bash'; then
            echo "bash on PATH: $(command -v bash), $BASH_VERSION"
          else
            HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install bash
            echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          fi

      - name: Run the macOS binaries and tests
        # The machine check, the versions, the handshake, the example and its
        # byte comparison — with a planted one-byte difference shown turning the
        # comparison red — then the named tests, any of which skipping or not
        # running fails the step. aggrega-cli/scripts/platform-smoke.sh --help
        # says what each check asserts.
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          aggrega-cli/scripts/platform-smoke.sh --target "$TARGET" --inputs "$RUNNER_TEMP/macos-smoke"
