name: Publish and sign core plugins

# Tag-driven publisher for the CLI release: the binaries for Linux, Windows and
# macOS with the SHA256SUMS list of what the release attaches, the desktop
# extension package, the tooling image, and the core plugins
# the core-plugin list names — the ones embedded in the aggrega binary and the
# ones built and published with it but not embedded.
#
# The work is split across jobs so that the credentials that sign and publish
# never share a job with third-party code. Building runs code this repository
# does not control — Go and Rust dependencies' build logic, the pinned bundle
# packer fetched from the npm registry, the base image and packages the tooling
# image is built from — and any step of a job can read what that job holds: its
# environment, a token a checkout leaves in a repository's git configuration,
# and, when the job may mint one, the request credentials for an OIDC identity
# token. So the jobs are:
#
#   registry-credential  Proves that the registry accepts the stored
#                        credential: one authenticated GET /v2/, which pushes
#                        nothing and opens no upload session. It is the run's
#                        first act, a dry run's included, so a manual dry run
#                        is also how to prove that the stored credential
#                        matches the registry. Before that request it decides,
#                        from the event, the dry_run input and the ref alone,
#                        whether this run signs the Windows binaries, and
#                        refuses a decision to leave them unsigned on a run
#                        that publishes, as described below. It runs the
#                        repository's own scripts and nothing else but, first,
#                        the refusal of a run with no self-hosted runner named
#                        for the local jobs.
#   sources              Checks out the sibling repositories the CLI builds
#                        against, at the refs the CLI's go.mod pins once the CLI
#                        tree is on the release tag, with a read token minted
#                        from the organization App's secrets, and hands the four
#                        checkouts, without a token, to the build job in the
#                        hand-over folder described below, with a SHA-256 list
#                        of them. It runs nothing but GitHub's own checkout and
#                        token actions, git and the shell's own utilities, so
#                        the App's secrets share a job with no third-party code,
#                        and the build job, which runs such code, names no
#                        secret at all.
#   build                Compiles, packs and stages everything the release
#                        carries, naming no secret and holding no permission to
#                        mint an OIDC token: it builds the commit the sources job
#                        pinned, against the sibling checkouts that job handed
#                        over, once they match its list; it checks that
#                        every build script stamping a version takes it from
#                        the one shared recipe, builds the binary and every
#                        core guest (plus the light no-embed binary),
#                        asserts host/guest ABI self-consistency, builds the
#                        Windows, macOS and ARM Linux binaries, stages each smoke run's
#                        inputs, packs the desktop extension package, generates
#                        the core Plugin catalog entities and pairs each with
#                        its guest, and builds the tooling image into an
#                        archive. Everything the publish needs, and the three
#                        Windows binaries, unsigned, it leaves in the hand-over
#                        folder described below, with a SHA-256 list of every
#                        file in it; it uploads only what the GitHub-hosted
#                        smoke jobs run.
#   sign-windows         Signs those three Windows binaries with Authenticode,
#                        as Cognitio S.r.l., through Azure Artifact Signing,
#                        every signature carrying an RFC 3161 timestamp, and
#                        hands them on with a SHA-256 list of them as
#                        windows-binaries-signed, on every run but a manual dry
#                        run launched from a ref the signing identity is taken
#                        not to admit, which skips it. It runs on the runner the
#                        AGGREGA_RUNNER label names, after the build, and reads
#                        the three from the hand-over folder once they match its
#                        list. It may mint the OIDC token, which it exchanges
#                        with Microsoft Entra ID for the token that signs, and
#                        holds no secret, no registry password and no release
#                        token. It checks out nothing and runs no action but
#                        upload-artifact; the programs it runs, beside the
#                        shell's own utilities, are curl, and jsign under a Java
#                        runtime of its own: each is fetched at one version and
#                        refused unless its SHA-256 is the one written here, so
#                        no Java the machine carries is run. It is a job of its
#                        own so that jsign and the token exchange share a job
#                        with nothing else, and so that the Windows smoke run
#                        and the release both see the bytes it signed. It does
#                        not confine the signing identity to itself: no claim of
#                        the OIDC token names the job that minted it, so Azure
#                        accepts the token of any job of this workflow on a ref
#                        it admits, and sign-and-publish, which may mint the
#                        token for its Sigstore signatures, could exchange one
#                        too.
#   sign-and-publish     Once every smoke job below has passed, reads the
#                        release inputs from the hand-over folder once every
#                        file there matches its list, downloads
#                        windows-binaries-signed, and publishes them: it pushes
#                        the tooling image from the archive, publishes each
#                        plugin with its guest, signs both, and creates the
#                        GitHub release with the downloadable binaries, the
#                        extension package and SHA256SUMS, the list of their
#                        SHA-256 digests it writes from the very files it
#                        attaches. It may mint the OIDC token, for
#                        those Sigstore signatures, and alone holds the token
#                        that writes the release; the registry password it
#                        holds is otherwise held only by registry-credential. It
#                        runs no build or pack step and no action but checkout
#                        and download-artifact: the programs it runs, beside the
#                        shell's own utilities, are the aggrega binary the build
#                        job built, docker (to load and push the image archive),
#                        gh and curl. On a real publish it hands the plugin
#                        publish's own output on, as its plugin_push_output, to
#                        record-published.
#   record-published     After a real publish only — on a dry run it is skipped —
#                        records what sign-and-publish published on aggrega-hub's
#                        published branch: each plugin's reference, version and
#                        digest, read from the push's own output by aggrega-hub's
#                        row reader, and the generated core plugin entities, read
#                        from the hand-over folder once it matches its list. It
#                        writes through aggrega-hub's one writer,
#                        scripts/record-published.sh, which pushes one commit as a
#                        fast-forward of the branch and never forces, and never
#                        writes aggrega-hub's main branch. Its one credential
#                        beside the run's own read-only token is a GitHub App
#                        installation token for aggrega-hub alone, asking for its
#                        contents alone, minted here by GitHub's own
#                        create-github-app-token action; it holds no registry
#                        password, no release token and no permission to mint an
#                        OIDC token, and runs no action but checkout and that one.
#                        The token reaches the writer's git commands through their
#                        environment and is never written to disk.
#   publish-skills       Once sign-and-publish has succeeded, publishes the
#                        skills built into the aggrega binary to the public
#                        aggrega-skills repository: the tree committed at
#                        internal/skills/repository, at the commit the build job
#                        built, which the build job has held to what the skills
#                        built into the binary generate. It makes one commit on
#                        that repository's main branch whose tree is exactly that
#                        tree, tags it with the release tag, and pushes both
#                        together as a fast-forward, never forcing: a tag already
#                        there is left as it is when it names the same tree and
#                        refused when it names another. On a dry run it prints the
#                        tree it would publish and pushes nothing. It runs on a
#                        GitHub-hosted runner and needs nothing from the hand-over
#                        folder. Its one credential beside the run's own read-only
#                        token is a GitHub App installation token for
#                        aggrega-skills alone, asking for its contents alone,
#                        minted only on a real publish by GitHub's own
#                        create-github-app-token action; it runs no action but
#                        checkout and that one, and no program but git and the
#                        shell's own utilities. The token reaches git through its
#                        environment and is never written to disk.
#   clean-up             Runs last, whatever every other job did, a failure or a
#                        cancellation included: deletes every artifact this run
#                        uploaded, through the REST API with the run's own token,
#                        removes the hand-over folder, and empties the runner's
#                        temporary directory of anything the runner left there.
#                        It may delete the run's artifacts (actions: write) and
#                        holds nothing else: no checkout, no action, no secret.
#
# The sources, build, sign-windows, sign-and-publish, record-published and
# clean-up jobs run on one machine, the self-hosted runner AGGREGA_RUNNER names,
# and hand files to each other on its disk, in the hand-over folder:
# aggrega-release-handover/<run id>-<attempt>
# beside the runner's temporary directory, which the runner empties at the start
# and end of every job. The sources job makes it, readable by the runner's user
# alone, and writes into it the sibling checkouts and a SHA-256 list of them,
# which the build job holds them to before it takes them out and removes the
# list. The build job then writes into it what the jobs after it read, and a
# list of that last, after every third-party step of that job has run; each job
# that reads the folder holds it to the list it finds there first. Both lists
# are written by one function of the repository's smoke library. A run with no
# such runner stops in its first job, saying so: nothing falls back to a hosted
# runner or to artifacts. Only what a GitHub-hosted job runs is uploaded — the
# Windows, macOS and ARM Linux smoke inputs, the signed Windows binaries, and the earlier
# release's binaries smoke_binaries_from names — and clean-up deletes it all when
# the run ends, so no artifact outlives the run that made it; the one-day
# retention each upload names is what removes them should clean-up never run. A
# re-run must re-run every job: a re-run of the failed jobs alone finds the
# folder and the artifacts gone.
#
# Everything sign-and-publish signs is signed keyless via the GitHub Actions
# OIDC identity against the public Sigstore instance (Fulcio + Rekor). The
# Windows binaries are signed by sign-windows instead, with the Authenticode
# signature Windows itself checks. The build reproduces the Windows binaries'
# unsigned bytes; a signed file differs from one signing to the next, in its
# certificate and its timestamp, while its Authenticode digest, which leaves
# the signature out, does not. Every checkout sets persist-credentials: false,
# so no checkout leaves its token in the repository's git configuration for a
# later step to read.
# scripts/check-release-job-isolation.sh reads this file and refuses it when a
# job that may mint the OIDC token runs a build or pack step, directly or through
# a repository script, when such a job runs any action but checkout and the
# artifact download and upload, when a checkout keeps its token, when a job
# that runs third-party code names a secret or the run's token anywhere in it —
# in an action's with: as well as in an environment or a run body — or when the
# job that may delete the run's artifacts is granted anything else, runs any
# action or a build step, or names a secret.
#
# Three more jobs prove the Windows, macOS and ARM Linux binaries on
# GitHub-hosted machines of each platform: windows-smoke on a Windows runner,
# macos-smoke on an Apple silicon (darwin/arm64) and an Intel (darwin/amd64)
# macOS runner, and linux-smoke on an ARM Linux (linux/arm64) runner. Each
# runs every binary's version report, the protocol handshake over standard input
# and output, a validate, pull and build of a worked example whose result it
# compares byte for byte with the result the build job produced; then, in a
# directory whose path holds a space and a letter outside ASCII, config init
# with only the platform's own rule able to place the global configuration, a
# pull from a registry the job starts on its own loopback address that writes
# the workspace's entity cache and a build from that cache, a pull naming one
# catalog directory twice, and a second, chart-backed example built and compared
# the same way; every command's output is redirected and must carry no escape
# byte; and the tests that prove each platform split behaves on that platform,
# all through one script. windows-smoke runs the binaries sign-windows signed,
# and last checks their signatures: Windows' own Get-AuthenticodeSignature must
# report each one valid, signed by Cognitio S.r.l. and timestamped, and each
# must match sign-windows' SHA-256 list, while the unsigned copies the build
# wrote are shown refused. On a manual dry run from a ref the signing identity
# is taken not to admit, nothing is signed: windows-smoke runs the unsigned
# binaries the build wrote, through the same script, which reports the
# signature check not applicable rather than passed, and sign-and-publish, which
# waits for sign-windows, is skipped with it, so such a run prints no publish
# plan. They need nothing the build needs — no
# sibling repository, no toolchain, no secret, no network beyond their own
# loopback address — because the build job stages everything each runs as one
# workflow artifact per target. They publish nothing, and sign-and-publish
# waits for all of them: it starts only when the Windows run, both macOS runs
# and the ARM Linux run have passed, on a release tag and on a dispatch, a dry
# run's included.
# So a binary that fails on its own platform stops the release before anything
# is pushed, and a smoke job that never starts holds sign-and-publish back with
# it. A dry run proves the binaries the same way before a tag is pushed.
#
# A dry run may also name, in smoke_binaries_from, the tag of an earlier
# release: windows-smoke then runs that release's Windows binaries in place of
# this run's own, every check, the signature check included, reporting its
# verdict, to show which checks those binaries fail. Such a smoke run never
# passes, so the run never reaches sign-and-publish, and a dispatch that is not
# a dry run is refused for naming one before anything is built.
#
# Nothing is pushed, published or released until every build, validation and
# smoke run has passed, so a failure in the ABI check, in catalog generation or
# on a smoke runner can never strand an already-pushed tooling image or a
# half-published plugin set. The one request with an effect beyond this run
# before then is sign-windows' signing, which publishes nothing: a signed binary
# whose smoke run fails is never released. The Wasm guests are reproducible
# build outputs, not tracked files, so they are absent from a fresh checkout:
# the build MUST run before catalog generation (which reads each guest's
# self-reported descriptor) and before the plugins are staged for publishing
# (which needs each guest's compiled module).
#
# This workflow NEVER creates or pushes a git tag on this repository. Deciding
# the version and cutting the tag is a human action; this workflow publishes the
# OCI artifacts and attaches the built binaries and the extension package to the
# GitHub release for the already-pushed tag. Its git writes are two, both after a
# real publish and both to another repository: record-published's one commit on
# aggrega-hub's published branch, never on a main branch, and publish-skills'
# one commit on aggrega-skills' main branch with the release tag on it, a
# repository that holds nothing but the generated skills tree.
#
# The manual-dispatch entry defaults to a dry run. It checks the credential,
# builds everything a real run builds — the tooling image included — signs the
# Windows binaries as a real run does, so the signing and the signature check
# are proven before a tag exists, runs the Windows, macOS and ARM Linux smoke jobs in full,
# and then, once they have passed, sign-and-publish loads the image archive and
# prints what it would push, publish, sign and release, doing none of it,
# record-published is skipped, and publish-skills prints the tree it would
# publish to aggrega-skills, pushing nothing.
#
# Which refs may sign is decided by the signing identity's federated
# credentials in Azure. The refs this workflow takes them to admit — the main
# branch and every tag — are written once, in .github/scripts/windows-signing.sh.
# A dry run launched from any other ref signs nothing: sign-windows is skipped,
# windows-smoke runs the unsigned binaries the build wrote, its signature check
# not applicable, and sign-and-publish is skipped with sign-windows. That skip
# is decided in registry-credential by the event, the dry_run input and the ref,
# before anything is built or signed, and never by a signing that failed; the
# same job refuses it on a tag push and on a dispatch that is not a dry run,
# which always sign, so on those a ref the credentials do not admit fails in
# sign-windows, naming the ref.
#
# Settings, by name:
#   variables  CLI_PUBLISH_REGISTRY      the registry to publish to, as its host
#              REGISTRY_USERNAME         the registry username
#              AGGREGA_RUNNER            the label of the self-hosted runner
#                                        sources, build, sign-windows,
#                                        sign-and-publish, record-published and
#                                        clean-up run on (required; one machine)
#              CLI_PUBLISH_OVERLAY_DIR   the per-plugin overlay directory
#                                        (optional, aggrega-hub/plugin-overlays
#                                        by default)
#              CLI_PUBLISH_HUB_REF       the aggrega-hub ref sources checks out
#                                        for the overlays, and record-published
#                                        takes aggrega-hub's writer from
#                                        (optional, main by default)
#              AZURE_TENANT_ID           the Microsoft Entra tenant of the
#                                        identity sign-windows signs as
#              AZURE_CLIENT_ID           that identity's client ID: an app
#                                        registration with no secret, whose
#                                        federated credentials accept this
#                                        workflow's OIDC token
#              ARTIFACT_SIGNING_ENDPOINT the Artifact Signing account's
#                                        endpoint, its account URI
#              ARTIFACT_SIGNING_ACCOUNT  the Artifact Signing account's name
#              ARTIFACT_SIGNING_PROFILE  the certificate profile that signs
#                                        (sign-windows only, all five; each is
#                                        an identifier, none a secret, and
#                                        sign-windows refuses, naming it, any
#                                        that is not set)
#   secrets    REGISTRY_PASSWORD         the registry password
#                                        (registry-credential and
#                                        sign-and-publish only)
#              SUBMODULE_APP_CLIENT_ID   the organization App that reads the
#              SUBMODULE_APP_PRIVATE_KEY private sibling repositories (sources
#                                        only, handed to the action that mints
#                                        the read token and to nothing else)
#              HUB_PUBLISHED_APP_CLIENT_ID   the App installed on aggrega-hub
#              HUB_PUBLISHED_APP_PRIVATE_KEY alone, with its contents' write
#                                        permission, that writes its published
#                                        branch (record-published only, handed
#                                        to the action that mints the write
#                                        token and to nothing else)
#              SKILLS_PUBLISH_APP_CLIENT_ID   the App installed on
#              SKILLS_PUBLISH_APP_PRIVATE_KEY aggrega-skills alone, with its
#                                        contents' write permission, that
#                                        publishes the skills there
#                                        (publish-skills only, on a real
#                                        publish, handed to the action that
#                                        mints the write token and to nothing
#                                        else)

on:
  # A release tag is the trigger and the human gate: a person decides the version
  # and pushes the tag. The pattern matches a vMAJOR.MINOR.PATCH tag; a
  # pre-release suffix is intentionally excluded from automatic publishing. The
  # git tag is v-prefixed; the build stamps a v-less version onto the binary,
  # image, and plugins.
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Check the stored registry credential, build everything a release carries (the tooling image and the extension package included), generate the entities, and print the publish plan without pushing the image, publishing, signing, or creating a release. From a ref other than main or a tag, the Windows binaries are not signed: the Windows smoke job runs them unsigned and no plan is printed."
        required: false
        default: true
        type: boolean
      tag:
        description: "The release tag (vMAJOR.MINOR.PATCH) to build and publish on a manual run; required for a real manual publish, ignored on a tag push (which uses the pushed tag)."
        required: false
        default: ""
        type: string
      smoke_binaries_from:
        description: "Dry run only: the tag of an earlier release whose Windows binaries the Windows smoke job runs in place of this run's own, reporting every check's verdict, to show which checks they fail. The smoke run then never passes."
        required: false
        default: ""
        type: string

# Every job reads this repository and nothing more unless it says otherwise
# below. Two jobs add to it. sign-windows adds id-token:write, which lets it
# mint the short-lived OIDC identity token Microsoft Entra ID exchanges for the
# token that signs the Windows binaries, so no signing secret is stored.
# sign-and-publish adds id-token:write, which lets it mint the short-lived OIDC
# identity token keyless signing needs (no offline key is stored; the artifacts
# publish to the public hub, so recording them in the public transparency log is
# expected, not a leak), and contents:write, which lets it create the GitHub
# release and upload the built binaries as release assets on this repository.
# contents:write grants no other git write: the workflow never creates or pushes
# a tag. clean-up replaces it with actions:write alone, which lets it list and
# delete this run's artifacts and does not let it read the repository.
# record-published keeps contents:read: what it writes is aggrega-hub's published
# branch, with the App token it mints, never this repository; so does
# publish-skills, which writes aggrega-skills with the App token it mints.
# sources keeps contents:read too: it reads the sibling repositories with the
# App token it mints.
permissions:
  contents: read

# The hand-over folder's name and its key, this run and this attempt: the one
# statement of it. Each job on the runner AGGREGA_RUNNER names finds the folder
# at "$(dirname "$RUNNER_TEMP")/$RELEASE_HANDOVER", beside the runner's
# temporary directory — the runner's work directory — since the runner empties
# the temporary directory itself at the start and end of every job.
env:
  RELEASE_HANDOVER: aggrega-release-handover/${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  registry-credential:
    # A hosted runner, as the other publishers' credential checks run: the job is
    # one request, and it holds the registry password in a job that runs no
    # third-party code. It is the run's first job, so it is also where a run with
    # no runner for the local jobs stops, and where the run decides whether it
    # signs the Windows binaries.
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # Whether this run signs the Windows binaries, sign or skip, as the decision
    # step below wrote it and the guard step after it let it stand. sign-windows
    # and windows-smoke read it, and name this job in their needs for that.
    outputs:
      signing: ${{ steps.signing.outputs.signing }}

    steps:
      - name: Require the runner the local jobs share
        # sources, build, sign-windows, sign-and-publish, record-published and
        # clean-up hand files to each other on one machine's disk, so the release
        # runs only where AGGREGA_RUNNER names that machine; with it unset the run
        # stops here, before anything is checked out or built, rather than falling
        # back to a hosted runner or to artifacts.
        env:
          AGGREGA_RUNNER: ${{ vars.AGGREGA_RUNNER }}
        run: |
          set -euo pipefail
          if [ -z "$AGGREGA_RUNNER" ]; then
            echo "publish-plugins: the release needs its self-hosted runner: set the repository variable AGGREGA_RUNNER to that runner's label, since the sources, build, signing, publishing, recording and clean-up jobs hand files to each other on its disk" >&2
            exit 1
          fi
          echo "publish-plugins: the sources, build, signing, publishing, recording and clean-up jobs run on the runner labelled $AGGREGA_RUNNER"

      - name: Check out the CLI
        # Only for the scripts the steps below run. The launched ref, not the
        # release tag: a dispatch naming an earlier tag still runs them from the
        # launched ref.
        uses: actions/checkout@v5
        with:
          path: aggrega-cli
          persist-credentials: false

      - name: Decide whether this run signs the Windows binaries
        # From the event, the dry_run input and the ref alone, before anything
        # is built or signed: sign on every run but a manual dry run launched
        # from a ref the signing identity is taken not to admit, which is skip.
        # The refs it is taken to admit are written once, in the script. On
        # skip, sign-windows is skipped and windows-smoke runs the unsigned
        # binaries the build wrote; no signing has happened yet, so a signing
        # that failed can never be what decided it.
        id: signing
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_DRY_RUN: ${{ inputs.dry_run }}
          RUN_REF: ${{ github.ref }}
        run: |
          aggrega-cli/.github/scripts/windows-signing.sh decide \
            --event "$EVENT_NAME" --dry-run "$DISPATCH_DRY_RUN" --ref "$RUN_REF"

      - name: Refuse to leave the Windows binaries unsigned on a run that publishes
        # The decision as the jobs after this one read it, held to the one
        # property that keeps an unsigned binary from a release: skip stands only
        # on a workflow_dispatch with dry_run true, and any other value, an empty
        # one included, is refused. The script reads the event and the input
        # itself rather than trusting the step above, so a decision gone wrong
        # stops the run here, before anything is built, signed or published, and
        # a tag push or a dispatch that publishes always signs.
        env:
          SIGNING: ${{ steps.signing.outputs.signing }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          aggrega-cli/.github/scripts/windows-signing.sh guard \
            --signing "$SIGNING" --event "$EVENT_NAME" --dry-run "$DISPATCH_DRY_RUN"

      - name: Check the stored registry credential
        # One GET /v2/ with the stored credential, before anything is built;
        # anything but 200 fails, naming the settings to check and reporting only
        # the HTTP status. An empty password or username is refused before any
        # request. The credential is read from the environment, never placed on a
        # command line or interpolated into the script. The placeholder registry
        # default names a host that never resolves, so an unset variable fails the
        # check, which names the variable.
        env:
          REGISTRY: ${{ vars.CLI_PUBLISH_REGISTRY || 'registry.invalid' }}
          REGISTRY_USERNAME: ${{ vars.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          aggrega-cli/.github/scripts/registry-gate.sh credential \
            --registry-url "https://$REGISTRY" \
            --registry-setting CLI_PUBLISH_REGISTRY \
            --username-setting REGISTRY_USERNAME \
            --password-setting REGISTRY_PASSWORD

  sources:
    needs: registry-credential
    # The sibling repositories the CLI builds against are private, and are read
    # with an installation token of the organization's GitHub App, minted from
    # the App's two secrets. A job holds every secret it names for its whole run,
    # within reach of each of its later steps, so the token is minted here, in a
    # job that runs nothing but GitHub's own checkout and token actions, git and
    # the shell's own utilities, and not in the build job, whose third-party build
    # code would otherwise run beside the App's private key. This job moves the
    # CLI tree onto the release tag, reads the sibling refs from that tree's
    # go.mod, checks the four siblings out at them, and hands the checkouts,
    # which keep no token, to the build job in this run's hand-over folder, with
    # a SHA-256 list of every file in them. It makes the folder.
    #
    # The self-hosted runner AGGREGA_RUNNER names, with no hosted fallback: the
    # build job takes the checkouts from that machine's disk.
    runs-on: ${{ vars.AGGREGA_RUNNER }}
    permissions:
      contents: read

    # The commit the build job checks out and builds: the release tag's on a tag
    # push or a dispatch naming a tag, otherwise the commit the run was launched
    # at. Its go.mod is the one the sibling refs are read from.
    outputs:
      commit: ${{ steps.pinned.outputs.commit }}

    env:
      # aggrega-hub carries no CLI-side version pin, so it is always checked out at
      # HUB_REF (operator-overridable via a repository variable). The schemas, abi,
      # and pdk siblings are NOT configured here: the CLI's own go.mod is the single
      # source for their versions, and the resolve step below reads those require
      # lines and checks each sibling out at exactly its pinned tag. An unpinned
      # sibling (still on the local-replace placeholder) fails the resolve loudly —
      # the release must pin every sibling before publishing.
      HUB_REF: ${{ vars.CLI_PUBLISH_HUB_REF || 'main' }}
      # Event data surfaced as env so run scripts read it from the environment
      # rather than interpolating expressions into shell.
      EVENT_NAME: ${{ github.event_name }}
      # The release tag requested by a manual dispatch (empty on a tag push).
      DISPATCH_TAG: ${{ inputs.tag }}
      # The pushed ref name (the tag on a push event).
      REF_NAME: ${{ github.ref_name }}

    steps:
      - name: Require a tag for a real manual publish
        # A real manual publish (a dispatch that is not a dry run) targets a past
        # release tag, so it MUST name one. Fail fast here, before anything is
        # checked out or built, when the tag input is empty. A manual dry run
        # needs no tag: it builds the checked-out CLI tree as-is and prints the
        # plan.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == false && inputs.tag == '' }}
        run: |
          set -euo pipefail
          echo "publish-plugins: a manual publish requires the tag input (vMAJOR.MINOR.PATCH)" >&2
          exit 2

      - name: Refuse substituted smoke binaries on a real publish
        # smoke_binaries_from has windows-smoke prove an earlier release's
        # binaries rather than the ones this run builds, so it proves nothing
        # about what a publish would ship: a dispatch that would publish is
        # refused for naming one, here, before anything is checked out or built.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == false && inputs.smoke_binaries_from != '' }}
        run: |
          set -euo pipefail
          echo "publish-plugins: smoke_binaries_from runs only on a dry run (dry_run=true)" >&2
          exit 2

      - name: Check out the CLI with full history and tags
        # For the release tag's go.mod, which decides the sibling refs, and for
        # the smoke library's SHA-256 list writer. Full history and every tag are
        # fetched here, so the pin step below needs no fetch of its own.
        uses: actions/checkout@v5
        with:
          path: aggrega-cli
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Pin the CLI tree to the release tag
        # Move the CLI tree onto the release tag so the sibling pins are read
        # from the tag's go.mod, and so the commit recorded below, which the build
        # job checks out and stamps the released version from, is the tag's. On a
        # manual dispatch that supplies a tag input the run targets a past
        # release. The effective tag is the pushed tag (push) or the tag input
        # (dispatch). A manual dry run with no tag input skips this and builds the
        # checked-out tree as-is. The checkout above fetched every tag and kept no
        # credential, so this moves the tree without contacting the remote.
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.tag != '') }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            TAG="$REF_NAME"
          else
            TAG="$DISPATCH_TAG"
          fi
          git -C aggrega-cli checkout --force "refs/tags/${TAG}"

      - name: Record the commit this run builds
        # The build job checks out exactly this commit, whose go.mod the sibling
        # refs below are read from, and sign-and-publish runs its publishing
        # scripts from it.
        id: pinned
        run: |
          set -euo pipefail
          commit="$(git -C aggrega-cli rev-parse HEAD)"
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
          echo "this run builds aggrega-cli at $commit"

      - name: Resolve sibling checkout refs from the CLI's go.mod
        # The CLI's own manifests decide the sibling versions: read the schemas,
        # abi, and pdk pins from the (now tag-pinned) go.mod require lines so the
        # siblings are checked out at exactly what this CLI build expects. Reading
        # at runtime keeps the refs correct as the pins move, rather than
        # hardcoding them here. A require still on the local-replace placeholder
        # (empty or v0.0.0) has no published tag: the resolve fails loudly rather
        # than guessing a branch, because a floating branch is exactly the drift a
        # pinned release must not ship. Pin every sibling before publishing.
        # aggrega-hub carries no CLI-side pin, so it always uses HUB_REF.
        id: pins
        run: |
          set -euo pipefail
          gomod=aggrega-cli/go.mod
          read_req() { grep -E "^[[:space:]]+$1 v" "$gomod" | awk '{print $2}' | head -1; }
          require_pin() {
            local module="$1" ref
            ref="$(read_req "$module")"
            case "$ref" in
              ''|v0.0.0)
                echo "resolve: $module is unpinned in go.mod (found '${ref:-<none>}'); pin it to a released tag before publishing" >&2
                exit 1 ;;
            esac
            printf '%s' "$ref"
          }
          # Every sibling tags v-prefixed, so each go.mod require matches its git
          # tag directly — no rewriting needed.
          schemas_ref="$(require_pin github.com/aggrega-ai/aggrega-schemas)"
          abi_ref="$(require_pin github.com/aggrega-ai/aggrega-abi-go)"
          pdk_ref="$(require_pin github.com/aggrega-ai/aggrega-pdk-go)"
          {
            echo "schemas_ref=$schemas_ref"
            echo "abi_ref=$abi_ref"
            echo "pdk_ref=$pdk_ref"
          } >> "$GITHUB_OUTPUT"
          echo "resolved sibling refs: schemas=$schemas_ref abi=$abi_ref pdk=$pdk_ref hub=$HUB_REF"

      - name: Mint org app token for private-sibling access
        # The sibling repositories are private; a GitHub App installation token
        # scoped to the org grants the checkouts read access to all of them. The
        # App's secrets are handed to this action and to no step, and its token
        # to the checkouts below, none of which keeps it; like everything a job
        # holds, both stay within reach of the job's later steps, which is why
        # this job runs nothing but those checkouts, git and the shell's own
        # utilities after it.
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SUBMODULE_APP_CLIENT_ID }}
          private-key: ${{ secrets.SUBMODULE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Check out the schemas sibling
        # Satisfies the CLI go.mod replace ../aggrega-schemas.
        uses: actions/checkout@v5
        with:
          repository: aggrega-ai/aggrega-schemas
          path: aggrega-schemas
          ref: ${{ steps.pins.outputs.schemas_ref }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Check out the abi sibling
        # Satisfies the CLI go.mod replace ../aggrega-abi/go (repo root holds go/).
        uses: actions/checkout@v5
        with:
          repository: aggrega-ai/aggrega-abi
          path: aggrega-abi
          ref: ${{ steps.pins.outputs.abi_ref }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Check out the pdk sibling
        # Satisfies the CLI go.mod replace ../aggrega-pdk/go (repo root holds go/).
        uses: actions/checkout@v5
        with:
          repository: aggrega-ai/aggrega-pdk
          path: aggrega-pdk
          ref: ${{ steps.pins.outputs.pdk_ref }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Check out the hub sibling
        # Supplies the authored plugin overlays (OVERLAY_DIR) that catalog
        # generation consumes and that the embedded-overlay consistency check
        # reads. aggrega-hub has no CLI-side version pin, so it is checked out at
        # HUB_REF.
        uses: actions/checkout@v5
        with:
          repository: aggrega-ai/aggrega-hub
          path: aggrega-hub
          ref: ${{ env.HUB_REF }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Make this run's hand-over folder
        # The folder in which this run's jobs on the self-hosted runner hand files
        # to each other, beside the runner's temporary directory, which the runner
        # empties when this job ends. It is made here, by the first job that
        # writes into it, readable by the runner's user alone, and refused if it
        # already exists; the root that holds every run's folder must be that
        # user's own, and is kept readable by them alone. clean-up removes the
        # folder when the run ends.
        run: |
          set -euo pipefail
          [ -n "$RELEASE_HANDOVER" ] || { echo "publish-plugins: RELEASE_HANDOVER is empty" >&2; exit 1; }
          handover="$(dirname "$RUNNER_TEMP")/$RELEASE_HANDOVER"
          root="$(dirname "$handover")"
          mkdir -p "$root"
          if [ ! -O "$root" ]; then
            echo "publish-plugins: $root, which holds the hand-over folders, is not owned by the runner's user" >&2
            exit 1
          fi
          chmod 0700 "$root"
          if ! mkdir -m 0700 "$handover"; then
            echo "publish-plugins: this run's hand-over folder $handover already exists; a run attempt makes its own once" >&2
            exit 1
          fi
          printf 'HANDOVER=%s\n' "$handover" >> "$GITHUB_ENV"
          echo "hand-over folder: $handover"

      - name: Hand the sibling checkouts to the build job
        # Moves the four checkouts into the hand-over folder's sources/, each
        # refused if its git configuration still carries an authorization header,
        # so no token reaches the build job with them; then writes the folder's
        # SHA-256 list, through the smoke library's one writer of it, which the
        # build job holds the checkouts to before it takes them.
        run: |
          set -euo pipefail
          mkdir "$HANDOVER/sources"
          for repo in aggrega-schemas aggrega-abi aggrega-pdk aggrega-hub; do
            config="$GITHUB_WORKSPACE/$repo/.git/config"
            if [ ! -f "$config" ]; then
              echo "publish-plugins: $GITHUB_WORKSPACE/$repo holds no checkout to hand over" >&2
              exit 1
            fi
            if git config --file "$config" --get-regexp '^http\..*\.extraheader$' >/dev/null; then
              echo "publish-plugins: the checkout of $repo still carries an authorization header in its git configuration; it is not handed over" >&2
              exit 1
            else
              status=$?
              if [ "$status" != 1 ]; then
                echo "publish-plugins: could not read $config (git config exited $status)" >&2
                exit 1
              fi
            fi
            mv -- "$GITHUB_WORKSPACE/$repo" "$HANDOVER/sources/$repo"
          done
          . aggrega-cli/scripts/lib/platform-smoke-common.sh
          smoke_require_bash
          smoke_write_tree_sums "$HANDOVER"

  build:
    needs: sources
    # The self-hosted runner AGGREGA_RUNNER names, with no hosted fallback:
    # building the embedded guests is heavy, the sibling checkouts this job
    # builds against are the ones the sources job left on that machine's disk,
    # and sign-windows and sign-and-publish read what this job builds from that
    # disk, in the hand-over folder. Every later step that needs this build's
    # outputs reads them in this job, from the hand-over folder, or, on a
    # GitHub-hosted runner, from the artifacts it uploads.
    runs-on: ${{ vars.AGGREGA_RUNNER }}
    permissions:
      contents: read

    # The commit this job built — the one the sources job recorded, whose go.mod
    # chose the sibling checkouts — which sign-and-publish checks out for its
    # scripts, and the commits the Windows, the macOS and the ARM Linux smoke
    # inputs were staged from, which the windows-smoke, macos-smoke and
    # linux-smoke jobs check out: on a dispatch naming a tag the tree is moved onto
    # that tag, so the commit the run was launched at may not be it.
    outputs:
      commit: ${{ needs.sources.outputs.commit }}
      smoke_commit: ${{ steps.windows-smoke-inputs.outputs.commit }}
      macos_smoke_commit: ${{ steps.macos-smoke-inputs.outputs.commit }}
      linux_smoke_commit: ${{ steps.linux-smoke-inputs.outputs.commit }}

    # No secret appears anywhere in this job, the App's that reads the sibling
    # repositories included: it runs third-party build code, so it holds no
    # registry, signing or repository credential beyond the run's own read
    # token, and builds against the checkouts the sources job handed over.
    env:
      # Destination registry host, a variable rather than a secret: the tooling
      # image is built under its references, and the archive carries them to the
      # job that pushes it.
      REGISTRY: ${{ vars.CLI_PUBLISH_REGISTRY || 'registry.invalid' }}
      # Authored per-plugin overlay directory that catalog generation merges with
      # each guest's machine-derived contract fields. This is a REQUIRED input: the
      # overlays supply the OCI identity, runtime limits, and provider block that
      # the guests deliberately do not carry, and the generate step halts, naming
      # the guest, when one has no overlay. Each overlay's plugin identity must
      # name a guest present in the decompressed guest set below (the publish
      # pairs them by that identity). The overlays live in the aggrega-hub sibling
      # checkout.
      OVERLAY_DIR: ${{ vars.CLI_PUBLISH_OVERLAY_DIR || 'aggrega-hub/plugin-overlays' }}
      # Event data surfaced as env so run scripts read it from the environment
      # rather than interpolating expressions into shell.
      EVENT_NAME: ${{ github.event_name }}
      # The release tag requested by a manual dispatch (empty on a tag push).
      DISPATCH_TAG: ${{ inputs.tag }}
      # The pushed ref name (the tag on a push event), for the tag-equals-version
      # assertion.
      REF_NAME: ${{ github.ref_name }}

    steps:
      # Nothing in this job has an external side effect: it builds, validates and
      # stages. A failure anywhere below halts the run before sign-and-publish, so
      # no image, plugin, or release is ever produced from an unvalidated build.

      - name: Give aggrega a configuration of this run's own
        # On the persistent self-hosted runner AGGREGA_RUNNER names, the
        # runner's user may keep a global aggrega configuration of their own,
        # and every aggrega command reads it: a registry, a trust setting, a CLI
        # plugin or an offline posture recorded there would shape what this
        # run builds. So every aggrega command in this job reads its global
        # configuration from a directory made empty here, the way the platform
        # smoke runs keep the machine's configuration out: XDG_CONFIG_HOME names
        # the directory, and AGGREGA_CONFIG, which would name a file in its
        # place, is emptied, which aggrega reads as unset. Other programs that
        # look for their settings under XDG_CONFIG_HOME, Go and Git among them,
        # find none there either. The machine-wide caches are not configuration
        # and stay where they are. RUN_CONFIG_HOME names the directory too, so
        # the last step removes this run's directory and never one that
        # XDG_CONFIG_HOME named before this step.
        run: |
          set -euo pipefail
          config_home="$(mktemp -d "$RUNNER_TEMP/config-home.XXXXXX")"
          printf 'RUN_CONFIG_HOME=%s\nXDG_CONFIG_HOME=%s\nAGGREGA_CONFIG=\n' \
            "$config_home" "$config_home" >> "$GITHUB_ENV"

      - name: Check out the CLI at the commit the sources job recorded
        # This workflow runs in the CLI repository; check it out into aggrega-cli/
        # so its build driver and manifests sit under that path, at exactly the
        # commit the sources job recorded — the release tag's, whenever one is in
        # play — whose go.mod chose the sibling checkouts that job handed over.
        # Full history and every tag are fetched here, so the build stamps the
        # release version from the tag. The CLI cannot build alone: its module
        # resolves the sibling modules through parent-relative replace directives
        # (../aggrega-schemas, ../aggrega-pdk/go, ../aggrega-abi/go), so the next
        # step places the handed-over checkouts beside it.
        uses: actions/checkout@v5
        with:
          path: aggrega-cli
          ref: ${{ needs.sources.outputs.commit }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Take the sibling checkouts from the hand-over folder
        # The four checkouts the sources job left in this run's hand-over folder,
        # on this machine, are used only once every file there is one the
        # folder's list names, each once, with the SHA-256 it gives, and the list
        # names nothing else — so a file changed, added or removed since the
        # sources job wrote the list is refused before anything is built from it.
        # The list is read through the smoke library from this job's own
        # checkout. Each checkout is then moved beside the CLI, in place of
        # whatever an earlier run left at that path on the persistent runner,
        # the list is removed, since it described a hand-over now taken, and the
        # folder must then be empty, for the build to write into. A folder that
        # is not here means the sources job ran on another machine or in another
        # attempt, and is refused.
        run: |
          set -euo pipefail
          [ -n "$RELEASE_HANDOVER" ] || { echo "publish-plugins: RELEASE_HANDOVER is empty" >&2; exit 1; }
          handover="$(dirname "$RUNNER_TEMP")/$RELEASE_HANDOVER"
          if [ ! -d "$handover" ] || [ ! -O "$handover" ] || [ ! -f "$handover/SHA256SUMS" ]; then
            echo "build: this run's hand-over folder $handover, with its list, is not on this machine: the sources job of this run attempt left none here. sources, build, sign-windows, sign-and-publish, record-published and clean-up run on the one machine AGGREGA_RUNNER names, in one attempt; re-run every job, not only the failed ones" >&2
            exit 1
          fi
          . aggrega-cli/scripts/lib/platform-smoke-common.sh
          smoke_require_bash
          smoke_check_tree_sums "$handover"
          for repo in aggrega-schemas aggrega-abi aggrega-pdk aggrega-hub; do
            if [ -e "$GITHUB_WORKSPACE/$repo" ]; then
              chmod -R u+w -- "$GITHUB_WORKSPACE/$repo" 2>/dev/null || true
              rm -rf -- "${GITHUB_WORKSPACE:?}/$repo"
            fi
            mv -- "$handover/sources/$repo" "$GITHUB_WORKSPACE/$repo"
          done
          rmdir -- "$handover/sources"
          rm -f -- "$handover/SHA256SUMS"
          if [ -n "$(find "$handover" -mindepth 1 -print -quit)" ]; then
            echo "build: the hand-over folder $handover holds more than the sources job's checkouts:" >&2
            find "$handover" -mindepth 1 -printf '  %P\n' >&2
            exit 1
          fi
          printf 'HANDOVER=%s\n' "$handover" >> "$GITHUB_ENV"
          echo "build: took aggrega-schemas, aggrega-abi, aggrega-pdk and aggrega-hub from $handover, each file as the sources job listed it"

      - name: Check that the version recipe has one home
        # The binary, the embedded guests' self-reported version, the plugin
        # entities generated from them and the desktop extension package are
        # each stamped by a different build script, and a release ships them
        # together. They agree only while every one of those scripts takes the
        # version from the one shared recipe; a script that derived it by its
        # own git invocation could ship a release whose outputs disagree on
        # their version. The check refuses, naming each offending script and
        # line, when a stamping script does not source the shared recipe or
        # derives the version inline. It sits after the checkout of the commit
        # the sources job recorded, so it judges the tree this run builds, and
        # before the build, so a forked recipe halts the run before anything is
        # stamped. It reads only the CLI tree, with no toolchain and no network,
        # so it needs nothing the later steps install. It runs on a dry run too.
        run: |
          set -euo pipefail
          aggrega-cli/scripts/check-version-single-source.sh

      - name: Set up Go
        # Pin the toolchain to the (tag-pinned) module's declared version and
        # cache modules so the guest and binary build does not re-download the
        # dependency graph on every run.
        uses: actions/setup-go@v6
        with:
          go-version-file: aggrega-cli/go.mod
          # 🔴 CACHING OFF, DELIBERATELY. setup-go caches GOMODCACHE and GOCACHE by
          # default, which is right on an ephemeral hosted runner where both vanish
          # between jobs. This workflow runs on a PERSISTENT self-hosted runner,
          # where they are still on disk next run — so the post-job step was tarring
          # and uploading ~3 GB to the Actions cache service, taking minutes, only to
          # download it again over files that never left. It also competes for the
          # 10 GB per-repository cache budget and evicts entries that are not
          # redundant.
          #
          # ⚠️ Reverse this if the job is ever moved back to a hosted runner: there
          # the cache is not redundant and its absence means re-downloading the whole
          # dependency graph every run.
          cache: false

      - name: Check that the committed skills repository is what the skills generate
        # publish-skills publishes the tree committed at
        # internal/skills/repository, at the commit this job builds, to the
        # public aggrega-skills repository, so that tree must be exactly what the
        # skills built into the binary generate: the skills package's generator
        # writes the tree into a folder of its own here, and any file missing,
        # added or different stops the run before anything is published, naming
        # the difference. The comparison runs here, in a job that names no secret,
        # because the generator is compiled from the module, which reaches its
        # dependencies' build logic; publish-skills, which holds the token that
        # writes aggrega-skills, compiles nothing and pushes this commit's tree.
        run: |
          set -euo pipefail
          generated="$(mktemp -d "$RUNNER_TEMP/skills-repository.XXXXXX")"
          trap 'rm -rf -- "$generated"' EXIT
          (cd aggrega-cli && GOWORK=off go run ./internal/skills/genrepository -out "$generated")
          if ! diff -r aggrega-cli/internal/skills/repository "$generated"; then
            echo "build: aggrega-cli/internal/skills/repository, which publish-skills publishes to aggrega-skills, is not what the skills built into the binary generate (the differences are above); run go generate ./internal/skills in aggrega-cli and commit the result" >&2
            exit 1
          fi
          echo "build: aggrega-cli/internal/skills/repository is what the skills built into the binary generate"

      - name: Install the Rust toolchains the guests pin
        # Building the CLI regenerates its core guests, and each Rust guest pins
        # one exact toolchain in its rust-toolchain.toml, with every target it is
        # compiled for: the guest build compiles it with that release and refuses
        # any other, so a guest published from here is byte-identical to the same
        # commit built anywhere else. In each Rust guest's source directory, named
        # by the core-plugin list's one reader, rustup is asked to install with no
        # toolchain named, and so installs the release that directory's file pins
        # together with every target the file lists. No release and no target is
        # written here: a pin or a target changed in the tree is the one
        # installed. RUSTUP_TOOLCHAIN is cleared for the call because it outranks
        # every toolchain file. The release build only compiles the guests, so it
        # needs no component beyond the minimal profile's. rustup installs from a
        # toolchain file this way from release 1.28.0 on; an older one refuses the
        # call, and the step then stops naming that minimum and the runner's own
        # rustup. rustup is taken from the path or from the cargo home, and the
        # cargo home's bin directory is put on the path of the steps after this one.
        run: |
          set -euo pipefail
          cargo_bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          if ! command -v rustup >/dev/null 2>&1; then
            [ -x "$cargo_bin/rustup" ] || { echo "rust: rustup is neither on the path nor in $cargo_bin; install it on the runner" >&2; exit 1; }
            PATH="$cargo_bin:$PATH"
          fi
          . aggrega-cli/scripts/lib/core-plugins.sh
          dirs="$(core_plugin_rust_dirs)"
          while IFS= read -r dir; do
            [ -n "$dir" ] || continue
            echo "rust: installing the toolchain aggrega-cli/$dir/rust-toolchain.toml pins, with its targets"
            if ! ( cd "$CORE_PLUGIN_MODULE_ROOT/$dir" && env -u RUSTUP_TOOLCHAIN rustup toolchain install --profile minimal --no-self-update ); then
              echo "rust: rustup could not install the toolchain aggrega-cli/$dir/rust-toolchain.toml pins. With no toolchain named, rustup installs the one a toolchain file names from release 1.28.0 on; this runner has $(rustup --version 2>/dev/null | awk 'NR == 1')" >&2
              exit 1
            fi
          done <<< "$dirs"
          echo "$cargo_bin" >> "$GITHUB_PATH"

      - name: Cache the Rust guest build
        # The publishing linter guest is a Rust crate; cache its registry and
        # target so a rebuild does not recompile the dependency graph every run.
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: aggrega-cli/plugins/publishing-linter

      - name: Build the binary and embedded guests
        # Regenerates the Wasm guests and their descriptors and produces the
        # version-stamped binary with the guests embedded, twice:
        # aggrega-cli/aggrega-debug as the linker writes it, with its debug
        # information, and aggrega-cli/aggrega, that binary without it, which
        # every later step that runs the binary runs, the tooling image carries
        # and the release attaches under the plain name. NOT the light build —
        # the light binary embeds no guests and could neither generate the core
        # entities nor supply the guests to publish. Scoped to aggrega-cli:
        # publishing needs only the binary and its embedded guests, not the PDK
        # packages, so an unrelated PDK build issue cannot block a publish (and
        # the run is faster).
        run: |
          set -euo pipefail
          aggrega-cli/scripts/build.sh

      - name: Build the light binary for the release
        # The light no-embed binary ships as a downloadable release asset beside
        # the default and debug binaries. It embeds no Wasm guests (-tags light)
        # and resolves every provider through the plugin cascade, so it plays no
        # part in image or plugin publishing — it is built here purely for the
        # GitHub release. Built alongside the embedded build so a light-build
        # failure halts before any external side effect. The output is
        # aggrega-cli/aggrega-light, beside aggrega-cli/aggrega and
        # aggrega-cli/aggrega-debug.
        run: |
          set -euo pipefail
          aggrega-cli/scripts/build.sh --light

      - name: Assert ABI self-consistency
        # A real gate, not a comment: the binary reports the single ABI version its
        # host speaks, and every core guest — embedded or not — self-reports the
        # ABI it binds against in its build descriptor, which the build wrote in
        # the guest's own artifact directory. The descriptors read are the ones
        # the core-plugin list names, through its one reader, so a guest the list
        # names whose descriptor is missing fails here too. If any guest disagrees
        # with the host, or any value is empty, the generated catalog entities
        # would advertise an ABI the binary cannot honor — so the run fails here,
        # before generating or publishing anything. Whenever a release tag is in
        # play — a tag push, or a manual dispatch that supplied a tag input — the
        # binary's stamped version must also equal that tag; a mismatch means the
        # build did not stamp the release and the run fails. It needs only the
        # built binary and its guests, no registry and no image.
        run: |
          set -euo pipefail

          VERSION_JSON="$(aggrega-cli/aggrega version -o json)"
          # Whitespace is stripped before the match so the extraction is insensitive to
          # the pretty-printer, and it needs no jq. Stripping the whole payload is safe
          # only where the extracted value contains no whitespace, which holds for the
          # version and ABI version strings read here.
          HOST_ABI="$(printf '%s' "$VERSION_JSON" | tr -d '[:space:]' | grep -o '"abiVersion":"[^"]*"' | head -1 | cut -d'"' -f4)"
          BIN_VERSION="$(printf '%s' "$VERSION_JSON" | tr -d '[:space:]' | grep -o '"version":"[^"]*"' | head -1 | cut -d'"' -f4)"
          [ -n "$HOST_ABI" ] || { echo "ABI gate: binary reported no abiVersion" >&2; exit 1; }

          . aggrega-cli/scripts/lib/core-plugins.sh
          rows="$(core_plugin_rows)"
          descriptors=()
          while IFS=$'\x1f' read -r socket name _src _toolchain _extra _embed dir; do
            [ -n "$socket" ] || continue
            descriptors+=("aggrega-cli/$dir/$name.describe.json")
          done <<< "$rows"
          [ "${#descriptors[@]}" -gt 0 ] || { echo "ABI gate: the core-plugin list names no guest" >&2; exit 1; }

          mismatch=0
          for d in "${descriptors[@]}"; do
            if [ ! -f "$d" ]; then
              echo "ABI gate: no guest descriptor at $d — the guest build did not run for it" >&2
              mismatch=1
              continue
            fi
            guest_abi="$(grep -oE '"abi_version"[[:space:]]*:[[:space:]]*"[^"]+"' "$d" | head -1 | grep -oE '"[^"]+"$' | tr -d '"')"
            if [ -z "$guest_abi" ]; then
              echo "ABI gate: $d reports no abi_version" >&2
              mismatch=1
            elif [ "$guest_abi" != "$HOST_ABI" ]; then
              echo "ABI gate: $d reports abi_version '$guest_abi' but the binary speaks '$HOST_ABI'" >&2
              mismatch=1
            fi
          done
          [ "$mismatch" -eq 0 ] || { echo "ABI gate: host/guest ABI mismatch — refusing to generate or publish" >&2; exit 1; }

          if [ "$EVENT_NAME" = "push" ]; then
            TAG="$REF_NAME"
          else
            TAG="$DISPATCH_TAG"
          fi
          if [ -n "$TAG" ]; then
            EXPECTED="${TAG#v}"
            if [ "$BIN_VERSION" != "$EXPECTED" ]; then
              echo "ABI gate: binary version '$BIN_VERSION' does not equal the release tag '$EXPECTED'" >&2
              exit 1
            fi
          fi

          echo "ABI gate: host and ${#descriptors[@]} guest(s) all agree on '$HOST_ABI'"

      - name: Build the default and debug Windows binaries for the release
        # The release also carries the CLI for windows/amd64, built by the same
        # build script as the Linux binary with the target named, so the two
        # cannot follow different build steps. Both binaries embed the guests
        # the Linux build above regenerated, which are WebAssembly and the same
        # for every system. The default binary is the debug one without its
        # debug information, which for Windows the linker writes from the debug
        # binary's own build with -w added, rather than strip after linking as
        # for Linux; the build script says why. A Windows binary cannot run on
        # this runner, so the script reads each binary's stamped version from
        # the binary itself and refuses, naming both, unless it is the version
        # the Linux binary reports — which, whenever a release tag is in play,
        # the ABI gate above has already held to that tag. Writes
        # aggrega-cli/aggrega-windows-amd64.exe and
        # aggrega-cli/aggrega-debug-windows-amd64.exe, unsigned. No external
        # side effect: a dry run builds both, and sign-windows signs them before
        # the Windows smoke run and the release step see them.
        run: |
          set -euo pipefail
          # Whitespace is stripped before the match so the extraction is insensitive to
          # the pretty-printer, and it needs no jq. Stripping the whole payload is safe
          # only where the extracted value contains no whitespace, which holds for the
          # version string read here.
          BIN_VERSION="$(aggrega-cli/aggrega version -o json | tr -d '[:space:]' | grep -o '"version":"[^"]*"' | head -1 | cut -d'"' -f4)"
          [ -n "$BIN_VERSION" ] || { echo "binary reported no version" >&2; exit 1; }
          aggrega-cli/scripts/build.sh --target windows/amd64 --expect-version "$BIN_VERSION"

      - name: Build the light Windows binary for the release
        # The light no-embed binary for windows/amd64, by the same build script
        # and held to the same version as the step above, for the same reasons.
        # Writes aggrega-cli/aggrega-light-windows-amd64.exe, unsigned, as the
        # step above writes its two; a dry run builds it too.
        run: |
          set -euo pipefail
          # Whitespace is stripped before the match so the extraction is insensitive to
          # the pretty-printer, and it needs no jq. Stripping the whole payload is safe
          # only where the extracted value contains no whitespace, which holds for the
          # version string read here.
          BIN_VERSION="$(aggrega-cli/aggrega version -o json | tr -d '[:space:]' | grep -o '"version":"[^"]*"' | head -1 | cut -d'"' -f4)"
          [ -n "$BIN_VERSION" ] || { echo "binary reported no version" >&2; exit 1; }
          aggrega-cli/scripts/build.sh --light --target windows/amd64 --expect-version "$BIN_VERSION"

      - name: Build the default and debug macOS arm64 binaries for the release
        # The release also carries the CLI for macOS on Apple silicon
        # (darwin/arm64) and on Intel (darwin/amd64), in the default, debug and
        # light variants, built by the same build script as the Linux and
        # Windows binaries with the target named; the default and debug binaries
        # embed the guests the Linux build above regenerated. The default binary
        # is the debug one without its debug information, which for macOS, as
        # for Windows, the linker writes from the debug binary's own build with
        # -w added, rather than strip after linking as for Linux; the build
        # script says why. A macOS binary cannot run on this runner, so the
        # script reads each binary's stamped version from the binary itself and
        # refuses, naming both, unless it is the version the Linux binary
        # reports — which, whenever a release tag is in play, the ABI gate above
        # has already held to that tag. The Go linker signs an arm64 binary ad
        # hoc, each of the two, which an Apple silicon Mac requires before it
        # runs one; no macOS binary carries a Developer ID signature or is
        # notarized. Writes aggrega-cli/aggrega-darwin-arm64 and
        # aggrega-cli/aggrega-debug-darwin-arm64. No external side effect: a
        # dry run builds both, and the release step attaches them.
        run: |
          set -euo pipefail
          # Whitespace is stripped before the match so the extraction is insensitive to
          # the pretty-printer, and it needs no jq. Stripping the whole payload is safe
          # only where the extracted value contains no whitespace, which holds for the
          # version string read here.
          BIN_VERSION="$(aggrega-cli/aggrega version -o json | tr -d '[:space:]' | grep -o '"version":"[^"]*"' | head -1 | cut -d'"' -f4)"
          [ -n "$BIN_VERSION" ] || { echo "binary reported no version" >&2; exit 1; }
          aggrega-cli/scripts/build.sh --target darwin/arm64 --expect-version "$BIN_VERSION"

      - name: Build the light macOS arm64 binary for the release
        # The light no-embed binary for darwin/arm64, by the same build script
        # and held to the same version as the step above, for the same reasons.
        # Writes aggrega-cli/aggrega-light-darwin-arm64; a dry run builds it too.
        run: |
          set -euo pipefail
          # Whitespace is stripped before the match so the extraction is insensitive to
          # the pretty-printer, and it needs no jq. Stripping the whole payload is safe
          # only where the extracted value contains no whitespace, which holds for the
          # version string read here.
          BIN_VERSION="$(aggrega-cli/aggrega version -o json | tr -d '[:space:]' | grep -o '"version":"[^"]*"' | head -1 | cut -d'"' -f4)"
          [ -n "$BIN_VERSION" ] || { echo "binary reported no version" >&2; exit 1; }
          aggrega-cli/scripts/build.sh --light --target darwin/arm64 --expect-version "$BIN_VERSION"

      - name: Build the default and debug macOS amd64 binaries for the release
        # The default and debug binaries for darwin/amd64, by the same build
        # script and held to the same version as the macOS arm64 steps above,
        # for the same reasons; an amd64 binary carries no signature, which an
        # Intel Mac does not require. Writes aggrega-cli/aggrega-darwin-amd64 and
        # aggrega-cli/aggrega-debug-darwin-amd64; a dry run builds both too.
        run: |
          set -euo pipefail
          # Whitespace is stripped before the match so the extraction is insensitive to
          # the pretty-printer, and it needs no jq. Stripping the whole payload is safe
          # only where the extracted value contains no whitespace, which holds for the
          # version string read here.
          BIN_VERSION="$(aggrega-cli/aggrega version -o json | tr -d '[:space:]' | grep -o '"version":"[^"]*"' | head -1 | cut -d'"' -f4)"
          [ -n "$BIN_VERSION" ] || { echo "binary reported no version" >&2; exit 1; }
          aggrega-cli/scripts/build.sh --target darwin/amd64 --expect-version "$BIN_VERSION"

      - name: Build the light macOS amd64 binary for the release
        # The light no-embed binary for darwin/amd64, by the same build script
        # and held to the same version as the steps above, for the same reasons.
        # Writes aggrega-cli/aggrega-light-darwin-amd64; a dry run builds it too.
        run: |
          set -euo pipefail
          # Whitespace is stripped before the match so the extraction is insensitive to
          # the pretty-printer, and it needs no jq. Stripping the whole payload is safe
          # only where the extracted value contains no whitespace, which holds for the
          # version string read here.
          BIN_VERSION="$(aggrega-cli/aggrega version -o json | tr -d '[:space:]' | grep -o '"version":"[^"]*"' | head -1 | cut -d'"' -f4)"
          [ -n "$BIN_VERSION" ] || { echo "binary reported no version" >&2; exit 1; }
          aggrega-cli/scripts/build.sh --light --target darwin/amd64 --expect-version "$BIN_VERSION"

      - name: Build the default and debug Linux arm64 binaries for the release
        # The release also carries the CLI for Linux on 64-bit ARM
        # (linux/arm64), in the default, debug and light variants, built by the
        # same build script as the other binaries with the target named and held
        # to the same version for the same reasons; the default and debug
        # binaries embed the guests the Linux build above regenerated. The
        # default binary is the debug one without its debug information, which
        # for any target the build is given, as for Windows and macOS, the linker
        # writes from the debug binary's own build with -w added: this runner's
        # strip reads only its own architecture's executables; the build script
        # says why. An arm64 binary cannot run on this runner, so its stamped
        # version is read from the binary itself. Writes aggrega-cli/aggrega-linux-arm64 and
        # aggrega-cli/aggrega-debug-linux-arm64. No external side effect: a dry
        # run builds both, linux-smoke runs them, and the release step attaches
        # them.
        run: |
          set -euo pipefail
          # Whitespace is stripped before the match so the extraction is insensitive to
          # the pretty-printer, and it needs no jq. Stripping the whole payload is safe
          # only where the extracted value contains no whitespace, which holds for the
          # version string read here.
          BIN_VERSION="$(aggrega-cli/aggrega version -o json | tr -d '[:space:]' | grep -o '"version":"[^"]*"' | head -1 | cut -d'"' -f4)"
          [ -n "$BIN_VERSION" ] || { echo "binary reported no version" >&2; exit 1; }
          aggrega-cli/scripts/build.sh --target linux/arm64 --expect-version "$BIN_VERSION"

      - name: Build the light Linux arm64 binary for the release
        # The light no-embed binary for linux/arm64, by the same build script
        # and held to the same version as the step above, for the same reasons.
        # Writes aggrega-cli/aggrega-light-linux-arm64; a dry run builds it too.
        run: |
          set -euo pipefail
          # Whitespace is stripped before the match so the extraction is insensitive to
          # the pretty-printer, and it needs no jq. Stripping the whole payload is safe
          # only where the extracted value contains no whitespace, which holds for the
          # version string read here.
          BIN_VERSION="$(aggrega-cli/aggrega version -o json | tr -d '[:space:]' | grep -o '"version":"[^"]*"' | head -1 | cut -d'"' -f4)"
          [ -n "$BIN_VERSION" ] || { echo "binary reported no version" >&2; exit 1; }
          aggrega-cli/scripts/build.sh --light --target linux/arm64 --expect-version "$BIN_VERSION"

      - name: Make this run's own staging directories
        # On the persistent self-hosted runner AGGREGA_RUNNER names, a fixed name
        # can still hold an earlier run's files, which the smoke staging refuses
        # to stage over and the release inputs would otherwise carry as this
        # run's own. So the smoke inputs, which are uploaded, are staged into
        # directories of this run's own in the runner's temporary directory, and
        # the last steps remove them; and what sign-windows and sign-and-publish
        # read — the unsigned Windows binaries and the release inputs — goes into
        # this run's hand-over folder, beside that directory, since the runner
        # empties it when this job ends. The sources job made the folder, and the
        # step that took the sibling checkouts from it left it empty; its two
        # directories are made here. clean-up removes the folder when the run
        # ends. The steps below read every directory from the environment.
        run: |
          set -euo pipefail
          [ -d "${HANDOVER:-}" ] || { echo "publish-plugins: this run's hand-over folder is not here" >&2; exit 1; }
          mkdir "$HANDOVER/windows-unsigned" "$HANDOVER/release-inputs"
          windows_smoke="$(mktemp -d "$RUNNER_TEMP/windows-smoke.XXXXXX")"
          macos_smoke="$(mktemp -d "$RUNNER_TEMP/macos-smoke.XXXXXX")"
          linux_smoke="$(mktemp -d "$RUNNER_TEMP/linux-smoke.XXXXXX")"
          printf 'WINDOWS_UNSIGNED=%s\nRELEASE_INPUTS=%s\nWINDOWS_SMOKE_INPUTS=%s\nMACOS_SMOKE_INPUTS=%s\nLINUX_SMOKE_INPUTS=%s\n' \
            "$HANDOVER/windows-unsigned" "$HANDOVER/release-inputs" "$windows_smoke" "$macos_smoke" "$linux_smoke" >> "$GITHUB_ENV"
          echo "hand-over folder: $HANDOVER"

      - name: Collect the Windows binaries for signing
        # The three Windows binaries the steps above wrote, unsigned, under the
        # names they wrote them, into the hand-over folder's windows-unsigned/:
        # sign-windows reads exactly these, and nothing else this job built. A
        # missing file fails the copy.
        run: |
          set -euo pipefail
          for built in aggrega-windows-amd64.exe aggrega-debug-windows-amd64.exe aggrega-light-windows-amd64.exe; do
            cp "aggrega-cli/$built" "$WINDOWS_UNSIGNED/$built"
          done
          ls -l "$WINDOWS_UNSIGNED"

      - name: Stage the Windows smoke run's inputs
        # Everything the windows-smoke job runs, staged by one script into one
        # directory: the three Windows binaries above, unsigned, which the smoke
        # run holds as what its signature check must refuse, since it runs the
        # copies sign-windows signed — or runs these, on a dry run that signs
        # nothing; a Windows test executable
        # for each package whose tests prove a platform split, cross-compiled
        # here because the Windows runner has no toolchain and no sibling
        # repositories; the two worked examples, each with the workspace this
        # machine's validate, pull and build of it leave — the bytes the Windows
        # run must reproduce; and, for the entity-cache check, a registry program
        # built for Windows from a module go.mod already pins, one entity to
        # publish to it, and a copy of the first example that pulls that entity
        # from it. The examples build from catalogs in this repository and the
        # guests the default binary embeds, offline and with no configuration of
        # this machine read, so the Windows run needs no registry but the one it
        # starts on its own loopback address. The script builds each reference
        # twice, in two directories, and refuses when the two differ. No external
        # side effect; a dry run stages too.
        id: windows-smoke-inputs
        run: |
          set -euo pipefail
          aggrega-cli/scripts/stage-platform-smoke.sh --target windows/amd64 --output-dir "$WINDOWS_SMOKE_INPUTS"
          # The commit the windows-smoke job checks out is the one the staged
          # inputs record, so the job and the inputs cannot name different ones.
          while IFS='=' read -r key value; do
            if [ "$key" = commit ]; then
              printf 'commit=%s\n' "$value" >> "$GITHUB_OUTPUT"
            fi
          done < "$WINDOWS_SMOKE_INPUTS/smoke.env"

      - name: Upload the Windows smoke run's inputs
        # One workflow artifact, read only by the windows-smoke job of this same
        # run, which runs on a GitHub-hosted machine, and deleted by clean-up
        # when the run ends (kept a day at most should clean-up never run).
        # Hidden files are included so the example reaches the Windows run
        # exactly as it was built here.
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-inputs
          path: ${{ env.WINDOWS_SMOKE_INPUTS }}
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

      - name: Stage the macOS smoke runs' inputs
        # Everything each macos-smoke job runs, staged by the same script as the
        # Windows inputs, once per macOS target into a directory of its own: the
        # default, debug and light binaries above for that target, its test
        # executables, cross-compiled here, and the two worked examples, each
        # with the workspace this machine's validate, pull and build of it leave.
        # The tests listed for Windows alone are left out and named in the log.
        # No external side effect; a dry run stages too.
        id: macos-smoke-inputs
        run: |
          set -euo pipefail
          for target in darwin/arm64 darwin/amd64; do
            aggrega-cli/scripts/stage-platform-smoke.sh --target "$target" --output-dir "$MACOS_SMOKE_INPUTS/${target/\//-}"
          done
          # Both targets are staged from this one tree, so their inputs record
          # one commit; the macos-smoke jobs check out that commit, and the
          # smoke script refuses a checkout at any other.
          while IFS='=' read -r key value; do
            if [ "$key" = commit ]; then
              printf 'commit=%s\n' "$value" >> "$GITHUB_OUTPUT"
            fi
          done < "$MACOS_SMOKE_INPUTS/darwin-arm64/smoke.env"

      - name: Upload the macOS arm64 smoke run's inputs
        # One workflow artifact per macOS target, read only by that target's
        # macos-smoke job of this same run and deleted by clean-up when the run
        # ends (kept a day at most should clean-up never run). Hidden files are
        # included so the example reaches the macOS run exactly as it was built
        # here. An artifact keeps the bytes of each file, the signature the
        # linker embeds in an arm64 executable among them, but not its mode; the
        # smoke script makes the executables executable again.
        uses: actions/upload-artifact@v4
        with:
          name: macos-smoke-inputs-darwin-arm64
          path: ${{ env.MACOS_SMOKE_INPUTS }}/darwin-arm64
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

      - name: Upload the macOS amd64 smoke run's inputs
        # The darwin/amd64 inputs, as the step above uploads the darwin/arm64 ones.
        uses: actions/upload-artifact@v4
        with:
          name: macos-smoke-inputs-darwin-amd64
          path: ${{ env.MACOS_SMOKE_INPUTS }}/darwin-amd64
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

      - name: Stage the ARM Linux smoke run's inputs
        # Everything the linux-smoke job runs, staged by the same script as the
        # Windows and macOS inputs: the default, debug and light linux/arm64
        # binaries above, its test executables, cross-compiled here, and the two
        # worked examples, each with the workspace this machine's validate, pull
        # and build of it leave. The tests listed for Windows alone are left out
        # and named in the log. No external side effect; a dry run stages too.
        id: linux-smoke-inputs
        run: |
          set -euo pipefail
          aggrega-cli/scripts/stage-platform-smoke.sh --target linux/arm64 --output-dir "$LINUX_SMOKE_INPUTS"
          # The commit the linux-smoke job checks out is the one the staged
          # inputs record, so the job and the inputs cannot name different ones.
          while IFS='=' read -r key value; do
            if [ "$key" = commit ]; then
              printf 'commit=%s\n' "$value" >> "$GITHUB_OUTPUT"
            fi
          done < "$LINUX_SMOKE_INPUTS/smoke.env"

      - name: Upload the ARM Linux smoke run's inputs
        # One workflow artifact, read only by the linux-smoke job of this same
        # run, which runs on a GitHub-hosted ARM Linux machine, and deleted by
        # clean-up when the run ends (kept a day at most should clean-up never
        # run). Hidden files are included so the example reaches the ARM Linux
        # run exactly as it was built here. An artifact does not keep file
        # modes; the smoke script makes the executables executable again.
        uses: actions/upload-artifact@v4
        with:
          name: linux-smoke-inputs-linux-arm64
          path: ${{ env.LINUX_SMOKE_INPUTS }}
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

      - name: Set up Node for the extension packer
        # The desktop extension package is packed by the bundle format's own
        # packer, an npm package, so the job needs Node. A self-hosted runner need
        # not carry it, so it is installed here rather than assumed.
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Pack the desktop extension package
        # Builds aggrega-<version>.mcpb, the single file a client such as Claude
        # Desktop adds from its extension settings to run Aggrega as a local MCP
        # server. The step is one invocation of the script that holds the whole
        # procedure — the pinned packer, the version stamp, validation and
        # packing — so a local build and a release build cannot differ. The
        # script stamps the bundle's version from the same recipe the binary's
        # stamp uses, and refuses, naming both, when the stamp differs from the
        # version the built binary reports — which, whenever a release tag is in
        # play, the ABI gate above has already held to that tag. No external
        # side effect: a dry run packs the bundle too, and the release step
        # attaches it. The packer is third-party npm code, which is why this job
        # holds no publishing credential.
        run: |
          set -euo pipefail
          # Whitespace is stripped before the match so the extraction is insensitive to
          # the pretty-printer, and it needs no jq. Stripping the whole payload is safe
          # only where the extracted value contains no whitespace, which holds for the
          # version string read here.
          BIN_VERSION="$(aggrega-cli/aggrega version -o json | tr -d '[:space:]' | grep -o '"version":"[^"]*"' | head -1 | cut -d'"' -f4)"
          [ -n "$BIN_VERSION" ] || { echo "binary reported no version" >&2; exit 1; }
          BUNDLE="$(aggrega-cli/scripts/build-mcp-bundle.sh --output-dir "$RELEASE_INPUTS/mcp-bundle" --expect-version "$BIN_VERSION")"
          echo "packed $BUNDLE"

      - name: Generate the core plugin catalog entities
        # Emits one Plugin entity per core guest by merging each guest's
        # machine-derived contract fields with its authored overlay; the entity
        # version is the binary's own build version, which every core guest was
        # stamped with. The guests the binary embeds are generated from the
        # binary itself; the core plugins the list names as not embedded are
        # generated from the guests the build wrote beside the embedded ones,
        # through the core-plugin list's one generation of them, which the local
        # generators call as well. The overlay directory is the REQUIRED authored
        # input surfaced above; a guest with no overlay halts this step rather
        # than getting invented entity content. Pure computation from the built
        # guests, with no external side effect.
        run: |
          set -euo pipefail
          export AGGREGA_BIN="$PWD/aggrega-cli/aggrega"
          mkdir -p "$RELEASE_INPUTS/plugins/entities"
          "$AGGREGA_BIN" plugin gen-catalog --from-embedded --overlay "$OVERLAY_DIR" --output-dir "$RELEASE_INPUTS/plugins/entities"
          . aggrega-cli/scripts/lib/core-plugins.sh
          core_plugin_generate_unembedded "$AGGREGA_BIN" "$OVERLAY_DIR" "$RELEASE_INPUTS/plugins/entities"

      - name: Stage the core plugins for publishing
        # Exactly the set of core guests this build stamped — the ones built into
        # this binary and the ones the core-plugin list builds without embedding —
        # each generated entity paired with its decompressed guest, written as the
        # pairing sign-and-publish publishes. Each guest is read from the artifact
        # directory its row of the core-plugin list names, through the list's one
        # reader, so a guest the binary does not embed is found where the build
        # wrote it and no directory is spelled here. The guests are stored
        # compressed, so they are decompressed into a working directory under the
        # filename the publisher looks for, and that filename comes from the
        # product's own tool rather than from a rule spelled here. A guest's file
        # is identified by socket AND name — `governance--cel.wasm`, not
        # `cel.wasm` — because a name is unique only within its socket, and
        # deriving it from the .gz filename names a file the publisher never looks
        # for.
        #
        # 🔴 `internal/buildtools/pluginguestfile` is the one place that rule
        # lives, and publish-plugins.sh resolves every guest through it. The
        # socket and name read out of the entity path below only find the
        # entity's row of the core-plugin list; joining them into the filename
        # here would work today and be a second copy of the rule — the first
        # naming change would break this loop silently, since a wrong name looks
        # exactly like a missing file.
        #
        # Deriving the filename runs Go, which is why the pairing is resolved
        # here: publish-plugins.sh --pairs-out writes, for each entity, the guest
        # it pairs with, relative to the staging directory, and publishes nothing.
        # The pairing is written only when every entity paired.
        run: |
          set -euo pipefail
          . aggrega-cli/scripts/lib/core-plugins.sh
          STAGE="$RELEASE_INPUTS/plugins"
          WASM_DIR="$STAGE/wasm"
          mkdir -p "$WASM_DIR"
          staged=0
          for entity in "$STAGE"/entities/*/*/*/plugin.yaml; do
            [ -f "$entity" ] || continue
            leaf="$(cd aggrega-cli && GOWORK=off go run ./internal/buildtools/pluginguestfile -entity "$entity")"
            # entities/<socket>/<name>/<version>/plugin.yaml -> <socket>, <name>:
            # the row of the core-plugin list the entity was generated for.
            name="$(basename "$(dirname "$(dirname "$entity")")")"
            socket="$(basename "$(dirname "$(dirname "$(dirname "$entity")")")")"
            dir="$(core_plugin_dir_of "$socket" "$name")"
            src="aggrega-cli/$dir/$name.wasm.gz"
            [ -f "$src" ] || { echo "no built guest for $entity at $src" >&2; exit 1; }
            gunzip -c "$src" > "$WASM_DIR/$leaf"
            staged=$((staged + 1))
          done
          [ "$staged" -gt 0 ] || { echo "staged no guests — entity generation produced nothing" >&2; exit 1; }
          echo "staged $staged guest(s) into $WASM_DIR"
          aggrega-cli/scripts/publish-plugins.sh enumerate-embedded \
            --entities-dir "$STAGE/entities" --wasm-dir "$WASM_DIR" --pairs-out "$STAGE/pairs.tsv"

      - name: Make the image builder available
        # The tooling image is built with `docker buildx build --platform …`, and
        # buildx is a docker CLI PLUGIN rather than part of docker itself. Where
        # the plugin is absent the CLI parses `buildx build` as positional arguments
        # to its root command, so the first unrecognised flag is what it reports:
        # `unknown flag: --platform`, followed by the ROOT usage rather than
        # `docker build`'s. That names the flag instead of the missing plugin, so it
        # reads as a defect in the build script and is not one — the script asks for
        # the right tool and the tool is not installed. This step supplies it. It
        # runs on a dry run too, because a dry run builds the image.
        uses: docker/setup-buildx-action@v3

      - name: Build the tooling image
        # Packages the freshly-built embedded binary as the tooling image at the
        # reserved tools/ namespace so consumer CI can run the CLI without a Go
        # toolchain. The image is built here, for real on a dry run too, and
        # written as an archive carrying its version reference and the moving
        # :stable one, which sign-and-publish loads and pushes without building
        # anything. Both references come from one build and name one image.
        #
        # The image carries aggrega-cli/aggrega, the binary without its debug
        # information, because of the registry's per-request ceiling: the
        # registry refuses a single upload request above 100,000,000 bytes, and
        # each layer is sent in one request, the binary's layer included. The
        # image build copies that file as it is and refuses one carrying debug
        # information, and the release step attaches that same file, so the
        # image and the release asset cannot differ.
        run: |
          set -euo pipefail
          aggrega-cli/scripts/build-tooling-image.sh --registry "$REGISTRY" \
            --save "$RELEASE_INPUTS/image"

      - name: Collect the binaries the release carries
        # The binaries the steps above wrote, under the names they wrote them,
        # into the release inputs sign-and-publish reads from the hand-over
        # folder: aggrega (the file the tooling image carries, which
        # sign-and-publish also runs to log in, publish and sign), aggrega-debug,
        # aggrega-light, and the macOS and ARM Linux binaries. The Windows
        # binaries are not: the release attaches them signed, from sign-windows'
        # artifact, so the release inputs leave them out and the unsigned ones
        # have no way to the release. A copy keeps each file's mode, so aggrega
        # stays executable. A missing file fails the copy.
        run: |
          set -euo pipefail
          BIN="$RELEASE_INPUTS/bin"
          mkdir -p "$BIN"
          for built in aggrega aggrega-debug aggrega-light \
              aggrega-darwin-arm64 aggrega-debug-darwin-arm64 aggrega-light-darwin-arm64 \
              aggrega-darwin-amd64 aggrega-debug-darwin-amd64 aggrega-light-darwin-amd64 \
              aggrega-linux-arm64 aggrega-debug-linux-arm64 aggrega-light-linux-arm64; do
            cp "aggrega-cli/$built" "$BIN/$built"
          done
          ls -l "$BIN"

      - name: Write the hand-over folder's list
        # The last step that writes into the hand-over folder, after every step
        # of this job that runs third-party code. SHA256SUMS, at the folder's
        # root, gives the SHA-256 of every file beneath it — windows-unsigned/
        # with the three unsigned Windows binaries, and release-inputs/ with
        # bin/ (the binaries), mcp-bundle/ (the extension package), plugins/
        # (the entities, their guests and the pairing) and image/ (the tooling
        # image archive and its references) — by its path from the folder, in
        # bytewise order, in the form sha256sum writes. It is written under
        # another name and then renamed, so a list present means the hand-over
        # is complete. sign-windows, sign-and-publish and record-published hold
        # what they read to it before using any of it, so a file changed, added
        # or removed after this step is refused. Anything in the folder that is
        # neither a file nor a directory refuses the list, since no list can hold
        # it. The list is written by the smoke library's one writer of it, the
        # one the sources job wrote its own list with.
        run: |
          set -euo pipefail
          . aggrega-cli/scripts/lib/platform-smoke-common.sh
          smoke_require_bash
          smoke_write_tree_sums "$HANDOVER"
          cat "$HANDOVER/SHA256SUMS"

      - name: Remove this run's staging directories
        # Whatever the steps above did, so nothing this run staged in the
        # runner's temporary directory is left on the persistent runner for a
        # later run to find; a directory made read-only is made writable first.
        # The hand-over folder is not one of them: sign-windows and
        # sign-and-publish read it after this job, and clean-up removes it.
        if: ${{ always() && env.WINDOWS_SMOKE_INPUTS != '' }}
        run: |
          chmod -R u+w -- "$WINDOWS_SMOKE_INPUTS" "$MACOS_SMOKE_INPUTS" "$LINUX_SMOKE_INPUTS" 2>/dev/null || true
          rm -rf -- "$WINDOWS_SMOKE_INPUTS" "$MACOS_SMOKE_INPUTS" "$LINUX_SMOKE_INPUTS"

      - name: Remove this run's configuration
        # Whatever the steps above did, so nothing written to this run's
        # configuration directory is left on a persistent runner for a later run
        # to find.
        if: ${{ always() && env.RUN_CONFIG_HOME != '' }}
        run: |
          chmod -R u+w -- "$RUN_CONFIG_HOME" 2>/dev/null || true
          rm -rf -- "$RUN_CONFIG_HOME"

  sign-windows:
    # Signs the three Windows binaries the build job built, with Authenticode, so
    # that Windows names their publisher, Cognitio S.r.l., and can tell that
    # nothing changed them since. It runs on every trigger, a dry run's included,
    # so the signing and the Windows smoke run's check of it are proven before a
    # tag exists — on every run but a manual dry run launched from a ref the
    # signing identity is taken not to admit, which registry-credential decides
    # before anything is built, and on which this job is skipped. Its if: reads
    # that decision and nothing else: a signing that failed cannot skip it, and
    # on a run that publishes no ref can either. windows-smoke and
    # sign-and-publish both wait for it.
    #
    # The signing service is Azure Artifact Signing, which keeps its keys in its
    # own hardware: jsign sends each file's digest to it, and it signs with a
    # certificate it issues from the account's certificate profile. Each such
    # certificate is valid for three days, so every signature carries an RFC 3161
    # timestamp countersignature from Microsoft's timestamp service: Windows
    # checks a timestamped signature's certificate as of the time the timestamp
    # attests, so the signature stays valid after the certificate expires, and
    # one without a timestamp would stop validating when its certificate does.
    #
    # The job signs as an Azure identity without holding a secret: the run's
    # OIDC token, which only a job granted id-token:write can mint, is exchanged
    # with Microsoft Entra ID for a short-lived token that may sign with that
    # profile. Which refs of which workflow may make that exchange is decided by
    # the identity's federated credentials in Azure; the refs a dry run takes
    # them to admit are stated once, in .github/scripts/windows-signing.sh, and
    # read only to decide whether a dry run signs.
    # Everything that runs in this job can reach those tokens, so what runs is
    # kept to the shell's own utilities, curl, GitHub's own artifact upload, and
    # jsign — one jar, fetched at one version and refused unless its SHA-256 is
    # the one written below — under a Java runtime fetched and held the same
    # way, so no Java the machine carries runs here. No checkout, no secret, no
    # build step.
    #
    # It runs on the runner AGGREGA_RUNNER names, the machine the build ran on,
    # and reads the three unsigned binaries from the hand-over folder there, once
    # every file the folder's list names matches it: nothing the build wrote is
    # uploaded for it. That machine keeps state between runs, and the build's
    # third-party code ran on it, as the runner's user, before this job: what
    # this job holds is its own, what the machine holds is shared. The publishing
    # job, on the same machine, can already exchange its own token for the
    # signing identity (above), so signing here adds no reach to the identity
    # that the machine did not have.
    #
    # Signing changes the files: a signed binary differs from one signing to the
    # next, in its certificate and its timestamp, while its Authenticode digest,
    # which leaves the signature out, does not. The bytes the build reproduces
    # are the unsigned ones, and the bytes that run on Windows and ship are the
    # ones this job signs, which its SHA-256 list names.
    #
    # registry-credential is named because a job reads the outputs only of the
    # jobs it names. The condition runs this job unless the decision is skip, so
    # a decision that is anything else signs; the guard in registry-credential
    # has already refused skip on a run that publishes.
    needs: [registry-credential, build]
    if: ${{ needs.registry-credential.outputs.signing != 'skip' }}
    runs-on: ${{ vars.AGGREGA_RUNNER }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      # The five settings the signing reads; each is an identifier, none a
      # secret.
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
      ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
      ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
      # jsign 7.5, from Maven Central, and the SHA-256 of that jar, which is
      # also the digest GitHub publishes for the same jar on jsign's 7.5
      # release. Whatever the server sends, a jar with any other digest is
      # refused before it runs; moving to another version changes both lines.
      JSIGN_URL: https://repo1.maven.org/maven2/net/jsign/jsign/7.5/jsign-7.5.jar
      JSIGN_SHA256: 602a51c3545a6dc4fb99bd2ea7152b26d1345916d0c93ddfbd5936cb735af91c
      # The Java runtime jsign runs under: Eclipse Temurin 21.0.12.1+1, the JRE
      # for x64 Linux, from Adoptium's release on GitHub, and the SHA-256 of that
      # archive, which is also the digest GitHub publishes for it, the release's
      # own .sha256.txt and Adoptium's API. An archive with any other digest is
      # refused before it is unpacked; moving to another version changes both
      # lines.
      JAVA_URL: https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.12.1%2B1/OpenJDK21U-jre_x64_linux_hotspot_21.0.12.1_1.tar.gz
      JAVA_SHA256: 2413149700df0f7d440500a84a8f764c535f21e5a5e87d38328b64eec2c5b500
      # The binaries this job signs, under the names the build wrote them.
      WINDOWS_BINARIES: aggrega-windows-amd64.exe aggrega-debug-windows-amd64.exe aggrega-light-windows-amd64.exe
    steps:
      - name: Refuse a signing setting that is not set
        # Before any request, so a missing variable is named rather than
        # surfacing as a refusal from the token exchange or the signing service.
        run: |
          set -euo pipefail
          missing=0
          for name in AZURE_TENANT_ID AZURE_CLIENT_ID ARTIFACT_SIGNING_ENDPOINT ARTIFACT_SIGNING_ACCOUNT ARTIFACT_SIGNING_PROFILE; do
            if [ -z "${!name:-}" ]; then
              echo "sign-windows: the repository variable $name is not set" >&2
              missing=1
            fi
          done
          [ "$missing" = 0 ] || exit 1
          echo "sign-windows: signing with the profile $ARTIFACT_SIGNING_PROFILE of the account $ARTIFACT_SIGNING_ACCOUNT at $ARTIFACT_SIGNING_ENDPOINT"

      - name: Hold the hand-over's Windows binaries to the build job's list
        # The three unsigned binaries the build job left in this run's hand-over
        # folder, on this machine, are signed only once every file the folder's
        # list names still has the SHA-256 the list gives it and the list names
        # all three; and exactly the three, nothing beside them, are copied to
        # the directory of this job's own they are signed in. The list is read by
        # sha256sum itself: this job checks out nothing, so it cannot read it
        # through the smoke library's smoke_check_sums, which sign-and-publish
        # holds the whole folder to. A folder that is not here means the build
        # ran on another machine or in another attempt, and is refused. The
        # digests printed are the unsigned bytes the build wrote.
        run: |
          set -euo pipefail
          [ -n "$RELEASE_HANDOVER" ] || { echo "sign-windows: RELEASE_HANDOVER is empty" >&2; exit 1; }
          handover="$(dirname "$RUNNER_TEMP")/$RELEASE_HANDOVER"
          unsigned="$handover/windows-unsigned"
          signed="$RUNNER_TEMP/windows-signed"
          read -r -a names <<<"$WINDOWS_BINARIES"
          if [ ! -d "$handover" ] || [ ! -O "$handover" ] || [ ! -f "$handover/SHA256SUMS" ]; then
            echo "sign-windows: this run's hand-over folder $handover, with its list, is not on this machine: the build job of this run attempt left none here. sources, build, sign-windows, sign-and-publish, record-published and clean-up run on the one machine AGGREGA_RUNNER names, in one attempt; re-run every job, not only the failed ones" >&2
            exit 1
          fi
          if ! verified="$(cd "$handover" && sha256sum --check --strict SHA256SUMS 2>&1)"; then
            printf '%s\n' "$verified" >&2
            echo "sign-windows: the hand-over folder $handover no longer matches the list the build job wrote" >&2
            exit 1
          fi
          printf '%s\n' "$verified"
          for name in "${names[@]}"; do
            case $'\n'"$verified"$'\n' in
              *$'\n'"windows-unsigned/$name: OK"$'\n'*) ;;
              *)
                echo "sign-windows: the hand-over folder's list does not name windows-unsigned/$name" >&2
                exit 1
                ;;
            esac
          done
          shopt -s nullglob dotglob
          found=("$unsigned"/*)
          shopt -u nullglob dotglob
          exact=1
          [ "${#found[@]}" = "${#names[@]}" ] || exact=0
          for name in "${names[@]}"; do
            [ -f "$unsigned/$name" ] || exact=0
          done
          if [ "$exact" != 1 ]; then
            echo "sign-windows: $unsigned holds ${#found[@]} file(s), not exactly ${names[*]}:" >&2
            for path in "${found[@]}"; do
              echo "  ${path##*/}" >&2
            done
            exit 1
          fi
          mkdir -p "$signed"
          for name in "${names[@]}"; do
            cp "$unsigned/$name" "$signed/$name"
          done
          echo "unsigned, as the build job wrote them:"
          (cd "$signed" && sha256sum "${names[@]}")

      - name: Fetch the Java runtime and hold it to its SHA-256
        # The runtime jsign runs under, fetched for this job rather than taken
        # from the machine: an archive whose digest is not the one written above
        # is removed before anything in it is unpacked, and the step names both
        # digests. The archive is
        # for x64 Linux, so another machine is refused, naming what it is.
        run: |
          set -euo pipefail
          machine="$(uname -s)/$(uname -m)"
          if [ "$machine" != Linux/x86_64 ]; then
            echo "sign-windows: the Java runtime this workflow pins is for x64 Linux, and this runner is $machine" >&2
            exit 1
          fi
          archive="$RUNNER_TEMP/java-runtime.tar.gz"
          runtime="$RUNNER_TEMP/java"
          curl -sSfL --retry 3 -o "$archive" "$JAVA_URL"
          actual="$(sha256sum < "$archive")"
          actual="${actual%% *}"
          if [ "$actual" != "$JAVA_SHA256" ]; then
            rm -f -- "$archive"
            echo "sign-windows: $JAVA_URL has SHA-256 $actual, not $JAVA_SHA256, the digest this workflow pins; refusing to unpack it" >&2
            exit 1
          fi
          mkdir -p "$runtime"
          tar -xzf "$archive" -C "$runtime" --strip-components=1
          rm -f -- "$archive"
          echo "java: $JAVA_URL, SHA-256 $actual, the pinned digest, unpacked at $runtime"
          "$runtime/bin/java" -version

      - name: Fetch jsign and hold it to its SHA-256
        # A jar whose digest is not the one written above is removed unrun, and
        # the step names both digests.
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jsign"
          jar="$RUNNER_TEMP/jsign/jsign.jar"
          curl -sSfL --retry 3 -o "$jar" "$JSIGN_URL"
          actual="$(sha256sum < "$jar")"
          actual="${actual%% *}"
          if [ "$actual" != "$JSIGN_SHA256" ]; then
            rm -f -- "$jar"
            echo "sign-windows: $JSIGN_URL has SHA-256 $actual, not $JSIGN_SHA256, the digest this workflow pins; refusing to run it" >&2
            exit 1
          fi
          echo "jsign: $JSIGN_URL, SHA-256 $actual, the pinned digest"

      - name: Sign the Windows binaries
        # Mints the run's OIDC token, exchanges it with Microsoft Entra ID for a
        # token scoped to the signing service, and signs the three binaries with
        # it, all in this one step, so the signing token lives only in this
        # step's shell and in jsign's environment, and never in a file or in the
        # environment of a later step. Neither token stands on a command line:
        # each reaches curl on its standard input, and the signing token reaches
        # jsign through --storepass env:, which names the variable it is read
        # from. Each is masked in the log the moment it is read.
        #
        # A refused exchange fails here, naming the HTTP status, Entra ID's
        # error and its description, and this run's ref: the identity's
        # federated credentials in Azure decide which refs may sign, so a run
        # that reaches this step from a ref they do not admit stops here.
        #
        # jsign signs the three in one invocation, because it asks the service
        # for the certificate chain once per invocation. --tsaurl and --tsmode
        # are both given: jsign takes the timestamp's form from --tsmode alone,
        # so the address without it would ask for the older Authenticode
        # timestamp rather than an RFC 3161 one.
        run: |
          set -euo pipefail
          signed="$RUNNER_TEMP/windows-signed"
          read -r -a names <<<"$WINDOWS_BINARIES"

          if ! oidc_json="$(printf 'Authorization: bearer %s\n' "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" |
              curl -sSf -H @- "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange")"; then
            echo "sign-windows: the Actions runtime did not issue this run's OIDC token" >&2
            exit 1
          fi
          re='"value":"([^"]+)"'
          if ! [[ $oidc_json =~ $re ]]; then
            echo "sign-windows: the Actions runtime returned no OIDC token" >&2
            exit 1
          fi
          oidc_token="${BASH_REMATCH[1]}"
          echo "::add-mask::$oidc_token"
          # The request credentials are not needed again in this step, so they are
          # taken out of the environment jsign inherits. That narrows what jsign
          # is handed; it is no barrier, since a program running as this job's
          # user can still read them from the process that started it.
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL

          token_url="https://login.microsoftonline.com/$AZURE_TENANT_ID/oauth2/v2.0/token"
          if ! response="$(printf '%s' "$oidc_token" | curl -sS \
              --data-urlencode "client_id=$AZURE_CLIENT_ID" \
              --data-urlencode "scope=https://codesigning.azure.net/.default" \
              --data-urlencode "client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer" \
              --data-urlencode "client_assertion@-" \
              --data-urlencode "grant_type=client_credentials" \
              -w '\n%{http_code}' "$token_url")"; then
            echo "sign-windows: the token request to $token_url did not complete" >&2
            exit 1
          fi
          status="${response##*$'\n'}"
          body="${response%$'\n'*}"
          if [ "$status" != 200 ]; then
            error="" description=""
            re='"error":"([^"]*)"'
            if [[ $body =~ $re ]]; then error="${BASH_REMATCH[1]}"; fi
            re='"error_description":"(([^"\\]|\\.)*)"'
            if [[ $body =~ $re ]]; then description="${BASH_REMATCH[1]}"; fi
            echo "sign-windows: Microsoft Entra ID refused to exchange this run's OIDC token: HTTP $status, ${error:-no error code}: ${description:-no description}" >&2
            echo "sign-windows: this run's ref is $GITHUB_REF (workflow $GITHUB_WORKFLOW_REF); the federated credentials of the identity AZURE_CLIENT_ID names decide which refs may sign" >&2
            exit 1
          fi
          re='"access_token":"([^"]+)"'
          if ! [[ $body =~ $re ]]; then
            echo "sign-windows: Microsoft Entra ID answered HTTP 200 without an access token" >&2
            exit 1
          fi
          access_token="${BASH_REMATCH[1]}"
          echo "::add-mask::$access_token"
          unset oidc_json oidc_token response body

          files=()
          for name in "${names[@]}"; do
            files+=("$signed/$name")
          done
          ARTIFACT_SIGNING_TOKEN="$access_token" "$RUNNER_TEMP/java/bin/java" -jar "$RUNNER_TEMP/jsign/jsign.jar" \
            --storetype TRUSTEDSIGNING \
            --keystore "$ARTIFACT_SIGNING_ENDPOINT" \
            --storepass env:ARTIFACT_SIGNING_TOKEN \
            --alias "$ARTIFACT_SIGNING_ACCOUNT/$ARTIFACT_SIGNING_PROFILE" \
            --tsaurl http://timestamp.acs.microsoft.com/ \
            --tsmode RFC3161 \
            "${files[@]}"
          unset access_token

      - name: Write the SHA-256 list of the signed binaries
        # SHA256SUMS, in the form sha256sum writes, beside the three: the
        # Windows smoke run holds the binaries it runs to it, and
        # sign-and-publish attaches the binaries only when they still match it,
        # so what ships is byte for byte what ran on Windows.
        run: |
          set -euo pipefail
          signed="$RUNNER_TEMP/windows-signed"
          read -r -a names <<<"$WINDOWS_BINARIES"
          (cd "$signed" && sha256sum "${names[@]}") > "$signed/SHA256SUMS"
          echo "signed, as the Windows smoke run and the release receive them:"
          cat "$signed/SHA256SUMS"
          ls -l "$signed"

      - name: Upload the signed Windows binaries and their list
        # One workflow artifact, read by windows-smoke, on a GitHub-hosted
        # Windows machine, and by sign-and-publish of this same run, so the
        # release attaches the very bytes the Windows run ran; deleted by
        # clean-up when the run ends (kept a day at most should clean-up never
        # run).
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries-signed
          path: ${{ runner.temp }}/windows-signed
          if-no-files-found: error
          retention-days: 1

      - name: Remove this job's directories
        # Whatever the steps above did, so neither the binaries this job copied
        # and signed nor the Java runtime and jsign it fetched are left in the
        # runner's temporary directory on the persistent runner; a directory
        # made read-only is made writable first. The hand-over folder is
        # clean-up's to remove.
        if: ${{ always() }}
        run: |
          for dir in "$RUNNER_TEMP/windows-signed" "$RUNNER_TEMP/java" "$RUNNER_TEMP/jsign"; do
            chmod -R u+w -- "$dir" 2>/dev/null || true
            rm -rf -- "$dir"
          done
          rm -f -- "$RUNNER_TEMP/java-runtime.tar.gz"

  sign-and-publish:
    # Waits for the build, for sign-windows and for every smoke run —
    # windows-smoke, both targets of macos-smoke and linux-smoke — and starts only when each
    # one succeeded: a job is skipped when a job it needs failed, was cancelled
    # or was skipped, and this job carries no if: of its own, so it never starts
    # beside a job it needs that did not succeed. sign-windows is skipped on a
    # manual dry run from a ref the signing identity is taken not to admit, and
    # this job is skipped with it there, so the unsigned binaries windows-smoke
    # runs on such a run never reach it. windows-smoke's own if: lets that job
    # run when sign-windows was skipped so, and decides that job alone: this
    # job's needs name sign-windows itself. Nothing is pushed, signed,
    # published or released unless the
    # binaries passed on their own platforms, and a dry run prints its plan only
    # once they have. The build is named as well because a job reads the
    # outputs only of the jobs it names, and sign-windows because this job
    # attaches the Windows binaries it signed; from the smoke jobs this job
    # reads nothing but their result.
    needs: [build, sign-windows, windows-smoke, macos-smoke, linux-smoke]
    # The runner the build ran on, with no hosted fallback: this job reads the
    # release inputs from the hand-over folder on that machine's disk.
    runs-on: ${{ vars.AGGREGA_RUNNER }}
    permissions:
      contents: write
      id-token: write

    # What the plugin publish printed, on a real publish: record-published reads
    # each published plugin's reference, version and digest from it. Empty on a
    # dry run, which publishes nothing.
    outputs:
      plugin_push_output: ${{ steps.plugins.outputs.push_output }}

    env:
      # Destination registry host, the same variable the build named the image
      # under.
      REGISTRY: ${{ vars.CLI_PUBLISH_REGISTRY || 'registry.invalid' }}
      # Registry credentials. Read via the environment (not interpolated into a
      # run script) to avoid expression injection. The username feeds
      # `aggrega login`, which reads the password from
      # AGGREGA_REGISTRY_PASSWORD.
      REGISTRY_USERNAME: ${{ vars.REGISTRY_USERNAME }}
      AGGREGA_REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      # Public-good Sigstore endpoints for keyless signing. The binary already
      # defaults to these; they are named here so the direct `aggrega sign`
      # calls state the trust roots explicitly.
      FULCIO_URL: https://fulcio.sigstore.dev
      REKOR_URL: https://rekor.sigstore.dev
      # Event data surfaced as env so run scripts read it from the environment
      # rather than interpolating expressions into shell.
      EVENT_NAME: ${{ github.event_name }}
      DISPATCH_DRY_RUN: ${{ inputs.dry_run }}
      DISPATCH_TAG: ${{ inputs.tag }}
      REF_NAME: ${{ github.ref_name }}

    steps:
      # Every step here either readies or performs a publish. The steps with an
      # external side effect are each gated to a real publish (a push event, or a
      # manual dispatch with dry_run=false); on a dry run they print their plan
      # and push, publish, sign, and release nothing.

      - name: Give aggrega a configuration of this run's own
        # As in the build job, and for the same reason: on a persistent
        # self-hosted runner, the runner's user may keep a global aggrega
        # configuration of their own, which would otherwise shape what this run
        # publishes and signs. Every aggrega command in this job reads its global
        # configuration from a directory made empty here instead, named by
        # XDG_CONFIG_HOME, with AGGREGA_CONFIG emptied.
        #
        # The registry credential gets a Docker configuration of this run's own
        # too, made empty in that same directory and named by DOCKER_CONFIG.
        # aggrega login stores the credential in Docker's configuration — the
        # directory DOCKER_CONFIG names, else the user's own $HOME/.docker —
        # and aggrega push, aggrega sign and docker push read it from there.
        # Left to the default, a release would leave its publishing
        # credential in the runner user's own Docker configuration, where
        # nothing logs out. Here the credential lives only for the run: no
        # command in this job reads, writes or cleans the runner user's own
        # Docker configuration, and the last step removes the directory
        # RUN_CONFIG_HOME names, the credential with it. The docker commands
        # this job runs — load, image inspect, push and image rm — are
        # docker's own and need no CLI plugin. docker reaches its daemon as it
        # does with no configuration of its own: through DOCKER_HOST when the
        # runner's environment sets it, otherwise through the default socket.
        # Docker keeps its contexts in its configuration, so none of the user's
        # is available here: a runner whose daemon is reached only through a
        # context needs DOCKER_HOST set in its environment.
        run: |
          set -euo pipefail
          config_home="$(mktemp -d "$RUNNER_TEMP/config-home.XXXXXX")"
          mkdir -m 0700 "$config_home/docker"
          printf 'RUN_CONFIG_HOME=%s\nXDG_CONFIG_HOME=%s\nAGGREGA_CONFIG=\nDOCKER_CONFIG=%s\n' \
            "$config_home" "$config_home" "$config_home/docker" >> "$GITHUB_ENV"

      - name: Check out the CLI at the commit the build job built
        # For the publishing scripts only, taken from the repository at the
        # commit the build job built rather than handed over by that job.
        uses: actions/checkout@v5
        with:
          path: aggrega-cli
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false

      - name: Make this run's own directories
        # On the persistent self-hosted runner AGGREGA_RUNNER names, a fixed
        # name in the runner's temporary directory can still hold an earlier
        # run's files, which this run would then read as inputs it was handed or
        # release beside its own. The signed Windows binaries arrive in a
        # directory of this run's own, WINDOWS_SIGNED, and the release assets
        # are assembled in another, RELEASE_DIR, both made empty here; the steps
        # below read them from the environment, and the last steps remove them.
        # The release inputs are read where the build job left them, in this
        # run's hand-over folder, INPUTS, once the next step has held that
        # folder to its list; clean-up removes the folder.
        run: |
          set -euo pipefail
          [ -n "$RELEASE_HANDOVER" ] || { echo "sign-and-publish: RELEASE_HANDOVER is empty" >&2; exit 1; }
          handover="$(dirname "$RUNNER_TEMP")/$RELEASE_HANDOVER"
          windows_signed="$(mktemp -d "$RUNNER_TEMP/windows-signed.XXXXXX")"
          release="$(mktemp -d "$RUNNER_TEMP/release.XXXXXX")"
          printf 'HANDOVER=%s\nINPUTS=%s\nWINDOWS_SIGNED=%s\nRELEASE_DIR=%s\n' \
            "$handover" "$handover/release-inputs" "$windows_signed" "$release" >> "$GITHUB_ENV"

      - name: Hold the hand-over folder to the build job's list
        # Before anything in it is used or run: every file in this run's
        # hand-over folder, on this machine, must be one SHA256SUMS names, each
        # once, with the SHA-256 it gives, and the list must name nothing else —
        # so a file changed, added or removed since the build job wrote the list
        # is refused. It is read by smoke_check_tree_sums, through
        # smoke_check_sums, the same function that holds the signed Windows
        # binaries to theirs below, from the repository's own smoke library at
        # the commit the build job built. A folder that is not here means the
        # build ran on another machine or in another attempt, and is refused; so
        # is anything in the folder that is neither a file nor a directory. A dry
        # run checks too.
        run: |
          set -euo pipefail
          if [ ! -d "$HANDOVER" ] || [ ! -O "$HANDOVER" ] || [ ! -f "$HANDOVER/SHA256SUMS" ]; then
            echo "sign-and-publish: this run's hand-over folder $HANDOVER, with its list, is not on this machine: the build job of this run attempt left none here. sources, build, sign-windows, sign-and-publish, record-published and clean-up run on the one machine AGGREGA_RUNNER names, in one attempt; re-run every job, not only the failed ones" >&2
            exit 1
          fi
          . aggrega-cli/scripts/lib/platform-smoke-common.sh
          smoke_require_bash
          smoke_check_tree_sums "$HANDOVER"

      - name: Download the signed Windows binaries
        # The artifact sign-windows uploaded and windows-smoke ran: the three
        # signed binaries and their SHA-256 list.
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries-signed
          path: ${{ env.WINDOWS_SIGNED }}

      - name: Hold the signed Windows binaries to their list
        # Before anything is pushed, published or released: each signed binary
        # must have the SHA-256 that sign-windows' list gives it, the list
        # naming exactly the Windows binaries the release carries, so what the
        # release attaches is byte for byte what windows-smoke ran and checked.
        # It is the same check that smoke run makes, from the same function, in
        # the repository's own smoke library at the commit the build job built;
        # the release step below refuses a binary that is missing. A dry run
        # checks too.
        run: |
          set -euo pipefail
          . aggrega-cli/scripts/lib/platform-smoke-common.sh
          smoke_require_bash
          names="$(smoke_target_binaries windows/amd64)"
          mapfile -t windows_binaries <<<"$names"
          smoke_check_sums "$WINDOWS_SIGNED/SHA256SUMS" "$WINDOWS_SIGNED" "${windows_binaries[@]}"

      - name: Hold the built binary to the release
        # The hand-over folder keeps each file's mode, so the binary this job
        # runs is executable as the build job wrote it, and one that is not is
        # refused rather than made so. Whenever a release tag is in play, the
        # binary must report that tag's version, as the build job's ABI gate held
        # it to, so the job publishes the build it was handed and no other. Later
        # steps find the binary through AGGREGA_BIN, and the inputs through
        # INPUTS.
        run: |
          set -euo pipefail
          [ -x "$INPUTS/bin/aggrega" ] || { echo "the build job handed over no executable aggrega at $INPUTS/bin/aggrega" >&2; exit 1; }
          # Whitespace is stripped before the match so the extraction is insensitive to
          # the pretty-printer, and it needs no jq. Stripping the whole payload is safe
          # only where the extracted value contains no whitespace, which holds for the
          # version string read here.
          BIN_VERSION="$("$INPUTS/bin/aggrega" version -o json | tr -d '[:space:]' | grep -o '"version":"[^"]*"' | head -1 | cut -d'"' -f4)"
          [ -n "$BIN_VERSION" ] || { echo "the handed-over binary reported no version" >&2; exit 1; }
          if [ "$EVENT_NAME" = "push" ]; then
            TAG="$REF_NAME"
          else
            TAG="$DISPATCH_TAG"
          fi
          if [ -n "$TAG" ] && [ "$BIN_VERSION" != "${TAG#v}" ]; then
            echo "the handed-over binary reports version '$BIN_VERSION', not the release tag '${TAG#v}'" >&2
            exit 1
          fi
          echo "AGGREGA_BIN=$INPUTS/bin/aggrega" >> "$GITHUB_ENV"
          echo "publishing version $BIN_VERSION from $INPUTS"

      - name: Authenticate to the registry
        # Only a real publish logs in. A dry run's one contact with the registry
        # is the credential check that opens the run, which needs no stored
        # login. The tooling-image push (docker) and the plugin publish
        # (aggrega) authenticate with the same registry credential, and one
        # login stores it for both; the password is read from the environment,
        # never placed on a command line or interpolated.
        #
        # aggrega login, given a Docker configuration that names no credential
        # helper — this run's own, which DOCKER_CONFIG names, made empty above —
        # writes the credential into that configuration's file, config.json, as
        # the entry for the registry under auths, the form docker reads. docker
        # push reads it from there, and the job runs no docker login. So no
        # command here stores the credential with a credential helper of the
        # machine, in the runner user's own password store or keyring, which
        # the last step does not clean: docker login, run against a
        # configuration that records no credential, looks for one — on Linux,
        # docker-credential-pass when pass is installed, else
        # docker-credential-secretservice — and stores the credential with it
        # when one is installed, while docker push, finding the credential
        # recorded, looks for none and stores nothing.
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
        run: |
          set -euo pipefail
          "$AGGREGA_BIN" login "$REGISTRY" --username "$REGISTRY_USERNAME"

      - name: Mint the Sigstore OIDC identity token
        # Keyless signing needs a short-lived OIDC identity token. Request one
        # from the Actions runtime (available because id-token:write is granted
        # to this job, as to sign-windows, which mints its own for Azure and
        # nothing else), audience-scoped to sigstore, and export it as
        # SIGSTORE_ID_TOKEN so every `aggrega sign` in later steps reads it
        # non-interactively — no browser, no offline key. Only a real publish
        # signs, so a dry run skips this.
        #
        # The request credential reaches curl on its standard input, which -H @-
        # reads as header lines, and never on its command line: a command line
        # is readable in the process list by every other user of the machine,
        # which on the persistent self-hosted runner AGGREGA_RUNNER names may
        # be someone else. printf is the shell's own, so it starts no process
        # whose command line carries the credential either.
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
        run: |
          set -euo pipefail
          token_json="$(printf 'Authorization: bearer %s\n' "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" |
            curl -sSL -H @- "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sigstore")"
          id_token="$(printf '%s' "$token_json" | grep -o '"value":"[^"]*"' | head -1 | cut -d'"' -f4)"
          [ -n "$id_token" ] || { echo "OIDC: runtime returned no token value" >&2; exit 1; }
          echo "::add-mask::$id_token"
          echo "SIGSTORE_ID_TOKEN=$id_token" >> "$GITHUB_ENV"

      - name: Publish and sign the tooling image
        # Loads the archive the build job wrote and pushes each reference it was
        # built under — the version tag and the moving :stable tag, one image —
        # then signs the version reference by reference, keyless against public
        # Sigstore; the signature resolves to the shared digest, so it covers
        # :stable too. Nothing is built here. A dry run loads the archive and
        # checks both references are in it, then prints what it would push and
        # sign, pushing nothing. The image tag equals the binary's reported
        # version (v-less), so the pushed reference and the binary stay in
        # lockstep.
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            DRY="$DISPATCH_DRY_RUN"
          else
            DRY="false"
          fi

          if [ "$DRY" = "true" ]; then
            aggrega-cli/scripts/publish-tooling-image.sh --archive-dir "$INPUTS/image" \
              --registry "$REGISTRY" --dry-run
            exit 0
          fi

          aggrega-cli/scripts/publish-tooling-image.sh --archive-dir "$INPUTS/image" \
            --registry "$REGISTRY"

          # Whitespace is stripped before the match so the extraction is insensitive to
          # the pretty-printer, and it needs no jq. Stripping the whole payload is safe
          # only where the extracted value contains no whitespace, which holds for the
          # version string read here.
          BIN_VERSION="$("$AGGREGA_BIN" version -o json | tr -d '[:space:]' | grep -o '"version":"[^"]*"' | head -1 | cut -d'"' -f4)"
          [ -n "$BIN_VERSION" ] || { echo "binary reported no version" >&2; exit 1; }
          "$AGGREGA_BIN" sign "$REGISTRY/tools/aggrega:$BIN_VERSION" \
            --fulcio-url "$FULCIO_URL" --rekor-url "$REKOR_URL"

      - name: Publish and sign the core plugins
        # Publishes exactly the core plugins the build job stamped, embedded or
        # not: each pair in the build job's pairing — a generated entity and its
        # decompressed guest — pushed and signed keyless against public Sigstore. The pairing
        # was resolved by the build job, so publishing it needs only the binary.
        # A dry run prints the reference set and the sign plan without any
        # network call or signing.
        #
        # A real publish also hands what it printed, unchanged, to
        # record-published as this job's plugin_push_output: each push's
        # "Push complete:" or "Already published:" line carries the reference,
        # the version and the digest exactly as the push computed and published
        # it, and record-published reads them from there rather than computing
        # anything again. The output is written under a delimiter drawn at
        # random for this run, so no line the push prints can end it early.
        id: plugins
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            DRY="$DISPATCH_DRY_RUN"
          else
            DRY="false"
          fi

          args=(--pairs "$INPUTS/plugins/pairs.tsv" --registry "$REGISTRY")
          if [ "$DRY" = "true" ]; then
            args+=(--dry-run)
            aggrega-cli/scripts/publish-plugin-pairs.sh "${args[@]}"
            exit 0
          fi

          # Keyless signing: each pair is signed through
          # `aggrega push --plugin --sign`, which reads the identity token from
          # SIGSTORE_ID_TOKEN (minted above) and uses the binary's public
          # Sigstore defaults for Fulcio and Rekor.
          args+=(--sign)
          printed="$(mktemp "$RUNNER_TEMP/plugin-push-output.XXXXXX")"
          trap 'rm -f -- "$printed"' EXIT
          aggrega-cli/scripts/publish-plugin-pairs.sh "${args[@]}" | tee "$printed"

          delimiter="plugin-push-output-$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          {
            printf 'push_output<<%s\n' "$delimiter"
            awk 1 "$printed"
            printf '%s\n' "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Create the GitHub release and upload the binaries, the extension package and SHA256SUMS
        # The final side effect: attach the default, debug and light binaries for
        # linux/amd64, linux/arm64, windows/amd64, darwin/arm64 and darwin/amd64,
        # the desktop extension package, and SHA256SUMS, the SHA-256 list of all
        # of them, to the GitHub release for this tag so they are downloadable
        # from the release page. The default binary, under the plain name, is the
        # debug one without its debug information. The linux/amd64 one is the
        # very file the tooling image carries, which the image step copied as it
        # is, so the asset and the image cannot differ. The macOS and ARM Linux
        # ones are the files the build job's steps for them wrote, each already
        # held to the Linux binary's version. The Windows ones are the files the
        # build job's Windows steps wrote, held to that version too, as
        # sign-windows signed them: the step above held them to sign-windows'
        # SHA-256 list, so they are byte for byte the files windows-smoke ran and
        # whose signatures it checked. Those are signed bytes, which differ from
        # one signing to the next; what the build reproduces is the unsigned
        # bytes, and the Authenticode digest, which leaves the signature out, is
        # the same for both. The extension package is the file the pack step
        # wrote, copied under the name the pack script gave it. Which binaries a
        # target's release carries, and under what names the build writes them,
        # is read from the smoke library's smoke_target_binaries for every target
        # it lists, the list the smoke runs ran; linux/amd64, which this build
        # machine is, writes them under the bare names. The embedded guests are
        # NOT uploaded here — they publish to the registry with their Plugin
        # entities; the release carries only the runnable binaries, the
        # extension package and the list, and GitHub attaches the source archives
        # on its own. The step refuses to release when any of those files is
        # missing.
        #
        # SHA256SUMS is written here, from the very files the release attaches,
        # once this run's release directory holds exactly them, by the smoke
        # library's one writer of such lists, in the form sha256sum writes and
        # `sha256sum -c` reads; it is then held to them by the library's one
        # reader of such lists, which refuses unless it names each attached file
        # exactly once, with the digest of the bytes about to be attached, and
        # nothing else. So a release whose list misses an asset, names one it
        # does not attach or gives one other bytes is refused before anything is
        # created, and what a downloader checks against is what was uploaded,
        # the signed Windows binaries included. A dry run writes and checks the
        # list too, prints it with the planned release and asset names, and
        # creates nothing. The release lands on this repository — GH_REPO pins it
        # explicitly — for the tag the human already pushed; contents:write
        # authorizes it. Asset names carry the binary's reported version; the
        # binaries' also carry their build's target, with .exe for windows/amd64,
        # and the extension package's carries none, because it holds no program
        # and serves every platform its manifest declares.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            DRY="$DISPATCH_DRY_RUN"
            TAG="$DISPATCH_TAG"
          else
            DRY="false"
            TAG="$REF_NAME"
          fi

          # Whitespace is stripped before the match so the extraction is insensitive to
          # the pretty-printer, and it needs no jq. Stripping the whole payload is safe
          # only where the extracted value contains no whitespace, which holds for the
          # version and ABI version strings read here.
          BIN_VERSION="$("$AGGREGA_BIN" version -o json | tr -d '[:space:]' | grep -o '"version":"[^"]*"' | head -1 | cut -d'"' -f4)"
          [ -n "$BIN_VERSION" ] || { echo "binary reported no version" >&2; exit 1; }

          . aggrega-cli/scripts/lib/platform-smoke-common.sh
          smoke_require_bash

          BIN="$INPUTS/bin"

          # The extension package is the one file the pack step wrote; refuse
          # rather than release without it, or with a second one beside it.
          shopt -s nullglob
          bundles=("$INPUTS"/mcp-bundle/*.mcpb)
          shopt -u nullglob
          if [ "${#bundles[@]}" -ne 1 ]; then
            echo "the pack step wrote ${#bundles[@]} extension package(s) into '$INPUTS/mcp-bundle'; expected exactly one" >&2
            exit 1
          fi
          MCP_BUNDLE="${bundles[0]}"

          # The one list of what the release carries: the dry run prints it, and
          # the upload and the creation attach exactly it. attach copies a file
          # into RELEASE_DIR, this run's own directory made empty by the step
          # that makes this run's own directories, under its asset name, and
          # refuses rather than release without it when it is missing.
          ASSETS=()
          attach() { # <file> <asset name> <what wrote it>
            if [ ! -f "$1" ]; then
              echo "$3 wrote no $(basename "$1") (expected at '$1')" >&2
              exit 1
            fi
            cp "$1" "$RELEASE_DIR/$2"
            ASSETS+=("$RELEASE_DIR/$2")
          }
          for variant in aggrega aggrega-debug aggrega-light; do
            attach "$BIN/$variant" "$variant-$BIN_VERSION-linux-amd64" "the linux/amd64 build steps"
          done
          for target in linux/arm64 darwin/arm64 darwin/amd64; do
            suffix="${target%/*}-${target#*/}"
            names="$(smoke_target_binaries "$target")"
            while IFS= read -r name; do
              attach "$BIN/$name" "${name%-"$suffix"}-$BIN_VERSION-$suffix" "the $target build steps"
            done <<<"$names"
          done
          names="$(smoke_target_binaries windows/amd64)"
          while IFS= read -r name; do
            stem="${name%.exe}"
            attach "$WINDOWS_SIGNED/$name" "${stem%-windows-amd64}-$BIN_VERSION-windows-amd64.exe" "sign-windows"
          done <<<"$names"
          attach "$MCP_BUNDLE" "$(basename "$MCP_BUNDLE")" "the pack step"

          # SHA256SUMS, written from the files RELEASE_DIR now holds, which are
          # exactly the ones in ASSETS, then held to ASSETS by name and digest.
          smoke_write_tree_sums "$RELEASE_DIR"
          asset_names=()
          for asset in "${ASSETS[@]}"; do
            asset_names+=("$(basename "$asset")")
          done
          smoke_check_sums "$RELEASE_DIR/SHA256SUMS" "$RELEASE_DIR" "${asset_names[@]}"
          ASSETS+=("$RELEASE_DIR/SHA256SUMS")

          if [ "$DRY" = "true" ]; then
            echo "publish-plugins (dry-run): would create release '$TAG' on $GH_REPO with assets:"
            for asset in "${ASSETS[@]}"; do
              echo "  $(basename "$asset")"
            done
            echo "publish-plugins (dry-run): SHA256SUMS would read:"
            cat "$RELEASE_DIR/SHA256SUMS"
            exit 0
          fi

          # Idempotent on re-run (a manual re-publish of a tag whose release
          # already exists): create the release the first time, otherwise
          # re-upload the assets over the existing ones.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "$TAG" \
              --notes "Release $TAG. Downloadable binaries for Linux on x86-64 (linux/amd64) and on ARM (linux/arm64), for windows/amd64 (the Windows files end in .exe and carry an Authenticode signature, timestamped, whose publisher Windows shows as Cognitio S.r.l.), and for macOS on Apple silicon (darwin/arm64) and on Intel (darwin/amd64) (the macOS files carry no Developer ID signature and are not notarized): aggrega (the default build, with embedded plugin guests and without debug information; for linux/amd64, the same bytes the tooling image carries), aggrega-debug (the same build with its debug information, for a debugger or a profiler) and aggrega-light (no embedded plugins; resolves plugins through the cascade). $(basename "$MCP_BUNDLE") is the desktop extension package: added from Claude Desktop's extension settings, it runs an aggrega binary already installed as a local MCP server. It carries no program of its own, so the one file serves macOS, Windows and Linux. SHA256SUMS lists the SHA-256 digest of every other file attached here, in the form sha256sum -c reads."
          fi

      - name: Remove this run's directories
        # Whatever the steps above did, so nothing this run received or
        # assembled in the runner's temporary directory is left on the persistent
        # runner for a later run to find; a directory made read-only is made
        # writable first. The hand-over folder, which INPUTS lies in, is
        # clean-up's to remove.
        if: ${{ always() && env.RELEASE_DIR != '' }}
        run: |
          chmod -R u+w -- "$WINDOWS_SIGNED" "$RELEASE_DIR" 2>/dev/null || true
          rm -rf -- "$WINDOWS_SIGNED" "$RELEASE_DIR"

      - name: Remove this run's configuration
        # Whatever the steps above did, so nothing written to this run's
        # configuration directory — the registry credential aggrega login stored
        # in its Docker configuration among it — is left on a persistent runner
        # for a later run to find.
        if: ${{ always() && env.RUN_CONFIG_HOME != '' }}
        run: |
          chmod -R u+w -- "$RUN_CONFIG_HOME" 2>/dev/null || true
          rm -rf -- "$RUN_CONFIG_HOME"

  record-published:
    # Records what sign-and-publish published on aggrega-hub's published branch,
    # the branch the publish workflows alone write and a workspace's sync commit
    # takes into aggrega-hub's main branch: each plugin's reference, version and
    # digest beside the catalog's, and the core plugin entities this run
    # generated and published, at aggrega-catalog/plugin, the path they occupy on
    # the main branch.
    #
    # It runs after a real publish only, and only once sign-and-publish has
    # succeeded: a dry run publishes nothing, so this job is skipped and nothing
    # is written. A job of its own, so the token that writes aggrega-hub shares
    # a job with no other credential but the run's own token, which here reads
    # this repository and nothing more: no registry password, no release token,
    # no permission to mint an OIDC token. It runs no action but checkout and
    # GitHub's own create-github-app-token, and no program but the shell's own
    # utilities, git, the smoke library's list check, and aggrega-hub's own
    # scripts, taken from aggrega-hub itself.
    #
    # On the runner the build ran on, because the entities it records are the
    # ones the build job left in the hand-over folder, read once the folder
    # matches its list. clean-up waits for it.
    needs: [build, sign-and-publish]
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
    runs-on: ${{ vars.AGGREGA_RUNNER }}
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Find this run's hand-over folder and make this job's directory
        # The release inputs are read where the build job left them, in this
        # run's hand-over folder, INPUTS, once the step after the checkout has
        # held that folder to its list. The rows this job records are written in
        # a directory of this run's own, RECORD_DIR, made empty here, which the
        # last step removes.
        run: |
          set -euo pipefail
          [ -n "$RELEASE_HANDOVER" ] || { echo "record-published: RELEASE_HANDOVER is empty" >&2; exit 1; }
          handover="$(dirname "$RUNNER_TEMP")/$RELEASE_HANDOVER"
          record="$(mktemp -d "$RUNNER_TEMP/record.XXXXXX")"
          printf 'HANDOVER=%s\nINPUTS=%s\nRECORD_DIR=%s\n' \
            "$handover" "$handover/release-inputs" "$record" >> "$GITHUB_ENV"

      - name: Check out the CLI at the commit the build job built
        # For the smoke library's list check only.
        uses: actions/checkout@v5
        with:
          path: aggrega-cli
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false

      - name: Hold the hand-over folder to the build job's list
        # Before anything in it is read: every file in this run's hand-over
        # folder must be one SHA256SUMS names, each once, with the SHA-256 it
        # gives, and the list must name nothing else, checked by
        # smoke_check_tree_sums from the repository's own smoke library at the
        # commit the build job built. So the entities recorded are byte for byte
        # the ones the build job generated and sign-and-publish published. A
        # folder that is not here, or anything in it that is neither a file nor
        # a directory, is refused.
        run: |
          set -euo pipefail
          if [ ! -d "$HANDOVER" ] || [ ! -O "$HANDOVER" ] || [ ! -f "$HANDOVER/SHA256SUMS" ]; then
            echo "record-published: this run's hand-over folder $HANDOVER, with its list, is not on this machine: the build job of this run attempt left none here. sources, build, sign-windows, sign-and-publish, record-published and clean-up run on the one machine AGGREGA_RUNNER names, in one attempt; re-run every job, not only the failed ones" >&2
            exit 1
          fi
          . aggrega-cli/scripts/lib/platform-smoke-common.sh
          smoke_require_bash
          smoke_check_tree_sums "$HANDOVER"

      - name: Mint the token that writes aggrega-hub
        # A GitHub App installation token for aggrega-hub alone, asking for
        # write access to its contents and nothing else; the App is installed
        # on aggrega-hub alone, and a ruleset there admits only it and
        # aggrega-hub's own workflows as writers of the published branch. The
        # App's secrets are handed to this action and to no step, and an
        # installation token expires an hour after it is minted.
        id: hub-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.HUB_PUBLISHED_APP_CLIENT_ID }}
          private-key: ${{ secrets.HUB_PUBLISHED_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: aggrega-hub
          permission-contents: write

      - name: Check out aggrega-hub
        # For its writer, scripts/record-published.sh, and the branch library
        # that writer and this job's row reader share. The checkout keeps no
        # token: the write below hands it to git through the environment.
        uses: actions/checkout@v5
        with:
          repository: aggrega-ai/aggrega-hub
          path: aggrega-hub
          ref: ${{ vars.CLI_PUBLISH_HUB_REF || 'main' }}
          token: ${{ steps.hub-token.outputs.token }}
          persist-credentials: false

      - name: Record what this release published on aggrega-hub's published branch
        # The rows: each published plugin's reference, version and digest, read
        # by aggrega-hub's own row reader, published_rows_from_push, from the
        # "Push complete:" and "Already published:" lines sign-and-publish
        # handed on — the digest exactly as the push computed and published it.
        # They must be one row for each pair the release published, no two for
        # one reference and version, so a hand-over that lost or repeated any
        # refuses here, with nothing written.
        #
        # The tree: aggrega-catalog/plugin becomes exactly the entities the build
        # job generated and sign-and-publish published, and the branch owns it.
        #
        # aggrega-hub's writer makes one commit on top of the branch as the
        # remote holds it and pushes it as a fast-forward, never forcing; a
        # branch another publish moved meanwhile is read again and the commit
        # rebuilt on it. The token reaches the writer's git commands as an
        # Authorization header through git's environment configuration
        # (GIT_CONFIG_COUNT), so it is never placed on a command line or written
        # to the checkout's configuration; a git too old to read that is
        # refused, naming its version, before anything is written.
        env:
          HUB_TOKEN: ${{ steps.hub-token.outputs.token }}
          APP_SLUG: ${{ steps.hub-token.outputs.app-slug }}
          PUSH_OUTPUT: ${{ needs.sign-and-publish.outputs.plugin_push_output }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            TAG="$REF_NAME"
          else
            TAG="$DISPATCH_TAG"
          fi

          . aggrega-hub/scripts/lib/published-branch.sh
          printf '%s\n' "$PUSH_OUTPUT" | published_rows_from_push > "$RECORD_DIR/rows.tsv"
          pairs="$(awk 'NF { n++ } END { print n + 0 }' "$INPUTS/plugins/pairs.tsv")"
          rows="$(awk -F'\t' '!seen[$1 FS $2]++ { n++ } END { print n + 0 }' "$RECORD_DIR/rows.tsv")"
          lines="$(awk 'END { print NR }' "$RECORD_DIR/rows.tsv")"
          if [ "$pairs" -eq 0 ] || [ "$rows" -ne "$pairs" ] || [ "$lines" -ne "$rows" ]; then
            echo "record-published: sign-and-publish published $pairs plugin(s), and what it handed on carries $lines row(s) for $rows distinct reference(s) and version(s); nothing was recorded" >&2
            exit 1
          fi
          echo "record-published: $rows plugin(s) to record:"
          awk -F'\t' '{ print "  " $1 ":" $2 " (" $3 ")" }' "$RECORD_DIR/rows.tsv"

          probe="$(GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=recordpublished.probe GIT_CONFIG_VALUE_0=read git config --get recordpublished.probe || true)"
          if [ "$probe" != read ]; then
            echo "record-published: this machine's $(git --version) does not read configuration from GIT_CONFIG_COUNT, which is how the token reaches git without being written to disk; git 2.31 or later does. Nothing was recorded." >&2
            exit 1
          fi
          auth="$(printf 'x-access-token:%s' "$HUB_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          # The commit is authored in the App's name, at a no-reply address.
          author="${APP_SLUG:-aggrega-cli-release}[bot]"
          export GIT_AUTHOR_NAME="$author" GIT_COMMITTER_NAME="$author"
          export GIT_AUTHOR_EMAIL="$author@users.noreply.github.com" GIT_COMMITTER_EMAIL="$author@users.noreply.github.com"

          aggrega-hub/scripts/record-published.sh --rows "$RECORD_DIR/rows.tsv" \
            --tree "aggrega-catalog/plugin=$INPUTS/plugins/entities" \
            --remote origin \
            --message "chore(catalog): record the core plugins aggrega-cli $TAG published"

      - name: Remove this job's directory
        # Whatever the steps above did, so the rows this job wrote are not left
        # on the persistent runner. The hand-over folder is clean-up's to
        # remove.
        if: ${{ always() && env.RECORD_DIR != '' }}
        run: |
          chmod -R u+w -- "$RECORD_DIR" 2>/dev/null || true
          rm -rf -- "$RECORD_DIR"

  publish-skills:
    # Publishes the skills built into the aggrega binary to the public
    # aggrega-skills repository, so an assistant's own skills tool can install
    # them from there, tagged with the release they were generated from. What
    # it publishes is the tree committed at internal/skills/repository, at the
    # commit the build job built, which the build job has held to what the
    # skills built into the binary generate: a tree that differs stopped the
    # run there, before anything was published.
    #
    # It runs once sign-and-publish has succeeded, on a dry run too: a dry run
    # prints the tree it would publish and mints no token, reads nothing from
    # aggrega-skills and pushes nothing. A job of its own, on a GitHub-hosted
    # runner, so the token that writes aggrega-skills shares a job with no other
    # credential but the run's own token, which here reads this repository and
    # nothing more. It runs no action but checkout and GitHub's own
    # create-github-app-token, and no program but git and the shell's own
    # utilities; it compiles nothing, which is why the comparison with the
    # generator runs in the build job.
    needs: [build, sign-and-publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out the CLI at the commit the build job built
        # For the committed skills repository tree only.
        uses: actions/checkout@v5
        with:
          path: aggrega-cli
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false

      - name: Mint the token that writes aggrega-skills
        # On a real publish only. A GitHub App installation token for
        # aggrega-skills alone, asking for write access to its contents and
        # nothing else; the App is installed on aggrega-skills alone. The App's
        # secrets are handed to this action and to no step, and an installation
        # token expires an hour after it is minted.
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
        id: skills-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SKILLS_PUBLISH_APP_CLIENT_ID }}
          private-key: ${{ secrets.SKILLS_PUBLISH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: aggrega-skills
          permission-contents: write

      - name: Publish the skills to aggrega-skills, tagged with the release
        # The commit's tree is exactly the checked-out tree, read into a
        # repository of this job's own, so a file the tree no longer has is gone
        # from the published copy too. The commit goes on top of aggrega-skills'
        # main branch as the remote holds it; when that branch already holds
        # this tree, the tag goes on its head and no commit is made. The branch
        # and the tag are pushed in one atomic push, never forced: a branch
        # another push moved meanwhile, or a tag already there, is refused by
        # the remote and nothing is written. A tag already there is read first:
        # naming this tree it is left as it is and the step passes, naming
        # another tree it is refused, since a published tag never moves. The
        # token reaches git as an Authorization header through git's
        # environment configuration (GIT_CONFIG_COUNT), so it is never placed
        # on a command line or written to disk; a git too old to read that is
        # refused, naming its version, before anything is read or written.
        env:
          SKILLS_TOKEN: ${{ steps.skills-token.outputs.token }}
          APP_SLUG: ${{ steps.skills-token.outputs.app-slug }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_DRY_RUN: ${{ inputs.dry_run }}
          DISPATCH_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ needs.build.outputs.commit }}
          SKILLS_REMOTE: https://github.com/${{ github.repository_owner }}/aggrega-skills.git
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            DRY="$DISPATCH_DRY_RUN"
            TAG="$DISPATCH_TAG"
          else
            DRY="false"
            TAG="$REF_NAME"
          fi

          src="$PWD/aggrega-cli/internal/skills/repository"
          if [ ! -f "$src/README.md" ] || [ ! -d "$src/skills" ]; then
            echo "publish-skills: aggrega-cli at $SOURCE_COMMIT holds no skills repository tree at internal/skills/repository; nothing was published" >&2
            exit 1
          fi

          work="$(mktemp -d "$RUNNER_TEMP/skills.XXXXXX")"
          trap 'rm -rf -- "$work"' EXIT
          repo="$work/repo.git"
          git init -q --bare "$repo"
          g() { git --git-dir="$repo" "$@"; }
          (cd "$src" && GIT_INDEX_FILE="$work/index" git --git-dir="$repo" --work-tree=. add -A)
          tree="$(GIT_INDEX_FILE="$work/index" g write-tree)"

          if [ "$DRY" = "true" ]; then
            echo "publish-skills: dry run: would publish this tree from aggrega-cli $SOURCE_COMMIT to $SKILLS_REMOTE, as the main branch tagged ${TAG:-with the release tag}; nothing is pushed:"
            g ls-tree -r "$tree" | awk -F'\t' '{ print "  " $2 }'
            echo "publish-skills: tree $tree"
            exit 0
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "publish-skills: '$TAG' is not a release tag of the form vMAJOR.MINOR.PATCH; nothing was published" >&2
            exit 1
          fi
          if [ -z "$SKILLS_TOKEN" ]; then
            echo "publish-skills: no token for aggrega-skills was minted; nothing was published" >&2
            exit 1
          fi
          probe="$(GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=publishskills.probe GIT_CONFIG_VALUE_0=read git config --get publishskills.probe || true)"
          if [ "$probe" != read ]; then
            echo "publish-skills: this machine's $(git --version) does not read configuration from GIT_CONFIG_COUNT, which is how the token reaches git without being written to disk; git 2.31 or later does. Nothing was published." >&2
            exit 1
          fi
          auth="$(printf 'x-access-token:%s' "$SKILLS_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          # The commit is authored in the App's name, at a no-reply address.
          author="${APP_SLUG:-aggrega-cli-release}[bot]"
          export GIT_AUTHOR_NAME="$author" GIT_COMMITTER_NAME="$author"
          export GIT_AUTHOR_EMAIL="$author@users.noreply.github.com" GIT_COMMITTER_EMAIL="$author@users.noreply.github.com"

          if ! heads="$(g ls-remote "$SKILLS_REMOTE" refs/heads/main "refs/tags/$TAG")"; then
            echo "publish-skills: could not read $SKILLS_REMOTE; nothing was published" >&2
            exit 1
          fi
          main_on_remote=no
          tag_on_remote=no
          while IFS=$'\t' read -r _ ref; do
            case "$ref" in
              refs/heads/main) main_on_remote=yes ;;
              "refs/tags/$TAG") tag_on_remote=yes ;;
            esac
          done <<< "$heads"

          if [ "$tag_on_remote" = yes ]; then
            g fetch -q --no-tags "$SKILLS_REMOTE" "refs/tags/$TAG:refs/published/tag"
            published="$(g rev-parse "refs/published/tag^{tree}")"
            if [ "$published" = "$tree" ]; then
              echo "publish-skills: $TAG is already on aggrega-skills with this tree; nothing to push"
              exit 0
            fi
            echo "publish-skills: $TAG is already on aggrega-skills and names tree $published, not this release's $tree; a published tag is never moved, so nothing was published" >&2
            exit 1
          fi

          parent=""
          if [ "$main_on_remote" = yes ]; then
            g fetch -q --no-tags "$SKILLS_REMOTE" "refs/heads/main:refs/published/main"
            parent="$(g rev-parse refs/published/main)"
          fi
          if [ -n "$parent" ] && [ "$(g rev-parse "$parent^{tree}")" = "$tree" ]; then
            commit="$parent"
            echo "publish-skills: aggrega-skills' main branch already holds this tree; tagging its head $commit"
          else
            message="$(printf 'Publish the Aggrega skills from aggrega-cli %s\n\nGenerated from aggrega-ai/aggrega-cli at %s.\n' "$TAG" "$SOURCE_COMMIT")"
            if [ -n "$parent" ]; then
              commit="$(g commit-tree "$tree" -p "$parent" -m "$message")"
            else
              commit="$(g commit-tree "$tree" -m "$message")"
            fi
            echo "publish-skills: commit $commit on aggrega-skills' main branch, tagged $TAG"
          fi
          g ls-tree -r "$tree" | awk -F'\t' '{ print "  " $2 }'
          g push --atomic "$SKILLS_REMOTE" "$commit:refs/heads/main" "$commit:refs/tags/$TAG"
          echo "publish-skills: published $TAG to aggrega-skills"

  smoke-binaries:
    # Fetches, on a dry run naming smoke_binaries_from, that release's Windows
    # binaries and hands them to windows-smoke as an artifact, saved under the
    # names the smoke inputs give the binaries; on every other run each step is
    # skipped and the job passes at once. It runs on every run, rather than
    # being skipped, because windows-smoke waits for it and runs only once it has
    # succeeded. The download reads
    # this repository's releases with the run's own token; the job runs nothing
    # but the GitHub CLI and the artifact upload, which is why it is a job of its
    # own: windows-smoke runs code a token must not reach. It starts once the
    # credential check has passed, beside the build.
    needs: registry-credential
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download the release binaries named to run in place of this run's own
        if: ${{ inputs.smoke_binaries_from != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SUBSTITUTE_TAG: ${{ inputs.smoke_binaries_from }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/substituted-binaries"
          mkdir -p "$dir"
          version="${SUBSTITUTE_TAG#v}"
          for name in aggrega aggrega-debug aggrega-light; do
            gh release download "$SUBSTITUTE_TAG" -R "$GITHUB_REPOSITORY" \
              -p "$name-$version-windows-amd64.exe" -O "$dir/$name-windows-amd64.exe"
          done
          ls -l "$dir"

      - name: Upload them for windows-smoke
        if: ${{ inputs.smoke_binaries_from != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: substituted-windows-binaries
          path: ${{ runner.temp }}/substituted-binaries
          if-no-files-found: error
          retention-days: 1

  windows-smoke:
    # Runs the Windows binaries the build job built, as sign-windows signed them,
    # on Windows. Cross-compiling proves only that the code compiles for
    # Windows; this job proves that the
    # binaries start, answer, and build what the Linux build builds, byte for
    # byte; that they do what a Windows user does where a Unix-like shell would
    # hide it — place the global configuration with no HOME, write the entity
    # cache under names Windows accepts, work in a path with a space and an
    # accented letter, and keep escape bytes out of redirected output; that
    # the platform splits — file locks, files another process holds open,
    # forward-slash paths, a Unix-socket listen address — behave there; and
    # that Windows itself accepts each binary's signature, from Cognitio S.r.l.
    # and timestamped, on the very bytes sign-windows' SHA-256 list names.
    # Everything it runs comes from the artifacts the build job staged — a
    # registry program among them, which serves on this machine's loopback
    # address alone — and sign-windows signed; it
    # checks out this repository only so that each test executable runs from its
    # package directory, at the commit the artifact records. It holds no secret
    # and reads only this repository, and its one script stops at the first
    # failure, saying what failed. sign-and-publish waits for it, so a failure
    # here publishes nothing. On a dry run naming smoke_binaries_from it runs
    # the binaries smoke-binaries fetched instead, and fails whatever they do.
    #
    # On a manual dry run from a ref the signing identity is taken not to admit,
    # registry-credential decides that nothing is signed and sign-windows is
    # skipped: this job then runs the unsigned binaries the build wrote, staged
    # in its inputs, every check reporting its verdict, the signature check
    # reported not applicable rather than passed, and fails whatever the others
    # do. sign-and-publish is skipped on such a run, since it needs sign-windows
    # itself, so those binaries go no further.
    #
    # The if: takes the place of the default, which would skip this job whenever
    # sign-windows is skipped. It runs when the run was not cancelled, when
    # registry-credential, build and smoke-binaries succeeded, and when
    # sign-windows either succeeded or was skipped on a decision of skip; a
    # sign-windows that failed, or was skipped on any other ground, skips this
    # job. registry-credential is named because a job reads the outputs only of
    # the jobs it names.
    needs: [registry-credential, build, smoke-binaries, sign-windows]
    if: >-
      ${{ !cancelled()
      && needs.registry-credential.result == 'success'
      && needs.build.result == 'success'
      && needs.smoke-binaries.result == 'success'
      && (needs.sign-windows.result == 'success'
      || (needs.sign-windows.result == 'skipped' && needs.registry-credential.outputs.signing == 'skip')) }}
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # This run's signing decision, sign or skip, as registry-credential wrote
      # it: on skip no signed binaries exist, and the unsigned ones run.
      SIGNING: ${{ needs.registry-credential.outputs.signing }}
    defaults:
      run:
        # The shell Git for Windows installs on the runner; the script it runs
        # is bash.
        shell: bash
    steps:
      - name: Keep line endings exactly as committed
        # The comparison and the tests read checked-out files, so the checkout
        # must hold the committed bytes; a Git configured to convert line
        # endings on checkout would hand them different ones.
        run: git config --global core.autocrlf false

      - name: Check out the CLI at the commit the inputs were staged from
        uses: actions/checkout@v5
        with:
          path: aggrega-cli
          ref: ${{ needs.build.outputs.smoke_commit }}
          persist-credentials: false

      - name: Download the Windows smoke run's inputs
        uses: actions/download-artifact@v4
        with:
          name: windows-smoke-inputs
          path: ${{ runner.temp }}/windows-smoke

      - name: Download the signed Windows binaries
        # The three binaries sign-windows signed, and SHA256SUMS, its list of
        # them: the binaries every check below runs, and the ones the release
        # attaches. Not on a run whose decision is skip, on which sign-windows
        # signed nothing and uploaded nothing.
        if: ${{ env.SIGNING != 'skip' }}
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries-signed
          path: ${{ runner.temp }}/windows-signed

      - name: Download the release binaries named to run in place of this run's own
        # Only on a dry run naming smoke_binaries_from: the binaries
        # smoke-binaries fetched from that release.
        if: ${{ inputs.smoke_binaries_from != '' }}
        uses: actions/download-artifact@v4
        with:
          name: substituted-windows-binaries
          path: ${{ runner.temp }}/substituted-binaries

      - name: Run the Windows binaries and tests
        # The versions, the handshake, the first example and its byte comparison
        # — with a planted one-byte difference shown turning it red — then config
        # init with no HOME, a pull from a registry on this machine into the
        # entity cache and a build from it, a catalog directory named twice, and
        # the chart-backed example compared the same way, all in a path with a
        # space and an accented letter, every command's redirected output free of
        # escape bytes, each check shown refusing a planted fault; then the named
        # tests, any of which skipping or not running fails the step; and last
        # the signatures: each binary must match sign-windows' SHA-256 list, and
        # Windows' own Get-AuthenticodeSignature must report it Valid, signed by
        # Cognitio S.r.l. and timestamped, with the unsigned copy the build wrote
        # shown refused. On a dry run naming smoke_binaries_from, the binaries
        # downloaded above run instead, the signature check among the checks
        # reporting on them, and the step fails whatever they do. On a run whose
        # decision is skip, the script is told the binaries are unsigned: it runs
        # the ones the build wrote, staged in its inputs, every check reporting
        # its verdict, reports the signature check not applicable rather than
        # passed, and fails whatever the others do.
        # aggrega-cli/scripts/platform-smoke.sh --help says what each check
        # asserts.
        env:
          SUBSTITUTE_TAG: ${{ inputs.smoke_binaries_from }}
        run: |
          set -euo pipefail
          args=(--target windows/amd64 --inputs "$RUNNER_TEMP/windows-smoke")
          if [ "$SIGNING" = skip ]; then
            args+=(--unsigned)
          else
            args+=(--signed "$RUNNER_TEMP/windows-signed")
          fi
          if [ -n "$SUBSTITUTE_TAG" ]; then
            args+=(--binaries "$RUNNER_TEMP/substituted-binaries")
          fi
          aggrega-cli/scripts/platform-smoke.sh "${args[@]}"

  macos-smoke:
    # Runs the macOS binaries the build job built, on macOS: the darwin/arm64
    # ones on an Apple silicon runner and the darwin/amd64 ones on an Intel
    # runner, through the same script and the same checks as windows-smoke but
    # the signature check, since the release does not sign the macOS binaries,
    # its configuration check holding macOS's own rule, which reads HOME. It proves
    # that the binaries start, answer, and build what the Linux build builds,
    # byte for byte, and that the platform splits — file locks, files another
    # process holds open, forward-slash paths, a Unix-socket listen address —
    # behave there. The script also refuses a machine whose
    # architecture is not the target's, because a Mac with Apple silicon runs
    # an amd64 binary too, through Rosetta 2. Everything it runs comes from the
    # artifact the build job staged for the target; it checks out this
    # repository only so that each test executable runs from its package
    # directory, at the commit the artifact records. It holds no secret and
    # reads only this repository. sign-and-publish waits for both targets, so a
    # failure on either publishes nothing.
    #
    # macos-15 names GitHub's hosted Apple silicon image and macos-15-intel its
    # hosted Intel image. A label GitHub does not offer leaves its job queued,
    # waiting for a runner that never comes, and sign-and-publish waiting behind
    # it, so a job that never starts is the sign that its label needs changing
    # here.
    needs: build
    name: macos-smoke (${{ matrix.target }})
    strategy:
      # Each target is a proof of its own: one failing does not cancel the other.
      fail-fast: false
      matrix:
        include:
          - target: darwin/arm64
            artifact: macos-smoke-inputs-darwin-arm64
            runner: macos-15
          - target: darwin/amd64
            artifact: macos-smoke-inputs-darwin-amd64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line endings exactly as committed
        # The comparison and the tests read checked-out files, so the checkout
        # must hold the committed bytes whatever the runner's Git is configured
        # to do with line endings.
        run: git config --global core.autocrlf false

      - name: Check out the CLI at the commit the inputs were staged from
        uses: actions/checkout@v5
        with:
          path: aggrega-cli
          ref: ${{ needs.build.outputs.macos_smoke_commit }}
          persist-credentials: false

      - name: Download the macOS smoke run's inputs
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/macos-smoke

      - name: Provide a bash the smoke script can run under
        # The smoke script needs bash 4.3 or later, and the bash macOS ships is
        # older. The script's own check decides: when the bash on PATH passes
        # it, nothing is installed; otherwise Homebrew installs a current bash,
        # and its directory goes first on PATH for the steps after this one.
        run: |
          if bash -c '. aggrega-cli/scripts/lib/platform-smoke-common.sh && smoke_require_bash'; then
            echo "bash on PATH: $(command -v bash), $BASH_VERSION"
          else
            HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install bash
            echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          fi

      - name: Run the macOS binaries and tests
        # The machine check, the versions, the handshake, the first example and
        # its byte comparison — with a planted one-byte difference shown turning
        # it red — then config init placed by HOME alone, a pull from a registry
        # on this machine into the entity cache and a build from it, a catalog
        # directory named twice, and the chart-backed example compared the same
        # way, all in a path with a space and an accented letter, every command's
        # redirected output free of escape bytes, each check shown refusing a
        # planted fault; then the named tests, any of which skipping or not
        # running fails the step. aggrega-cli/scripts/platform-smoke.sh --help
        # says what each check asserts.
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          aggrega-cli/scripts/platform-smoke.sh --target "$TARGET" --inputs "$RUNNER_TEMP/macos-smoke"

  linux-smoke:
    # Runs the ARM Linux binaries the build job built, on an ARM Linux machine,
    # through the same script and the same checks as macos-smoke: the machine
    # check, the versions, the handshake, both examples compared byte for byte
    # with the build machine's, config init placed by HOME alone, the entity
    # cache, the catalog named twice, the escape check, and the named tests, its
    # configuration check holding the Linux rule, which reads HOME and places the
    # caches under its .cache. It proves that the binaries start, answer, and
    # build what the x86-64 Linux build builds, byte for byte, on the other
    # architecture. The script refuses a machine whose architecture is not the
    # target's, because a Linux machine with an emulator registered runs a
    # binary of another architecture too. Everything it runs comes from the
    # artifact the build job staged; it checks out this repository only so that
    # each test executable runs from its package directory, at the commit the
    # artifact records. It holds no secret and reads only this repository.
    # sign-and-publish waits for it, so a failure here publishes nothing.
    #
    # ubuntu-24.04-arm names GitHub's hosted ARM Linux image. A label GitHub does
    # not offer leaves the job queued, waiting for a runner that never comes, and
    # sign-and-publish waiting behind it, so a job that never starts is the sign
    # that its label needs changing here. The smoke script checks for every tool
    # it runs and names one the image does not carry.
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line endings exactly as committed
        # The comparison and the tests read checked-out files, so the checkout
        # must hold the committed bytes whatever the runner's Git is configured
        # to do with line endings.
        run: git config --global core.autocrlf false

      - name: Check out the CLI at the commit the inputs were staged from
        uses: actions/checkout@v5
        with:
          path: aggrega-cli
          ref: ${{ needs.build.outputs.linux_smoke_commit }}
          persist-credentials: false

      - name: Download the ARM Linux smoke run's inputs
        uses: actions/download-artifact@v4
        with:
          name: linux-smoke-inputs-linux-arm64
          path: ${{ runner.temp }}/linux-smoke

      - name: Run the ARM Linux binaries and tests
        # The machine check, the versions, the handshake, the first example and
        # its byte comparison — with a planted one-byte difference shown turning
        # it red — then config init placed by HOME alone, a pull from a registry
        # on this machine into the entity cache and a build from it, a catalog
        # directory named twice, and the chart-backed example compared the same
        # way, all in a path with a space and an accented letter, every command's
        # redirected output free of escape bytes, each check shown refusing a
        # planted fault; then the named tests, any of which skipping or not
        # running fails the step. aggrega-cli/scripts/platform-smoke.sh --help
        # says what each check asserts.
        run: |
          set -euo pipefail
          aggrega-cli/scripts/platform-smoke.sh --target linux/arm64 --inputs "$RUNNER_TEMP/linux-smoke"

  clean-up:
    # Runs last, once every other job has ended, whatever each did — passed,
    # failed, was skipped or was cancelled — so a run leaves nothing behind it:
    # no artifact on GitHub, whose storage every artifact counts against until
    # it is deleted, and nothing on the runner AGGREGA_RUNNER names, whose disk
    # the build fills. The release's own assets are attached to the GitHub
    # release, not to the run, and nothing here touches them. With
    # AGGREGA_RUNNER unset the run stopped in its first job, before anything was
    # built or uploaded, so this job is skipped then.
    #
    # It may list and delete this run's artifacts (actions: write) and holds
    # nothing else: it cannot read the repository, checks out nothing, runs no
    # action, names no secret, and its token reaches curl on standard input.
    # It touches no container image and no Docker configuration: the run leaves
    # no image in the machine's image store — the build job writes the tooling
    # image to an archive and loads nothing, and sign-and-publish's publish
    # script removes every reference it loads when it exits, a refusal
    # included.
    needs: [registry-credential, sources, build, sign-windows, sign-and-publish, record-published, publish-skills, smoke-binaries, windows-smoke, macos-smoke, linux-smoke]
    if: ${{ always() && vars.AGGREGA_RUNNER != '' }}
    runs-on: ${{ vars.AGGREGA_RUNNER }}
    timeout-minutes: 15
    permissions:
      actions: write
    steps:
      - name: Delete every artifact this run uploaded
        # Lists this run's artifacts through the REST API, a hundred at a time,
        # prints each one's name and size, deletes each, and lists them again
        # until none is left, so the run ends keeping none. The run's token
        # reaches curl on its standard input as a header line, never on its
        # command line. Only an artifact carries a url ending in
        # /actions/artifacts/<id>, a name and a size, so each is read from those,
        # with the whitespace of the answer set aside and no jq. An artifact
        # already gone is reported and passes; any other refusal fails the step,
        # naming the HTTP status.
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ARTIFACTS_URL: ${{ github.api_url }}/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts
          ARTIFACTS_URL: ${{ github.api_url }}/repos/${{ github.repository }}/actions/artifacts
        run: |
          set -euo pipefail
          response="$(mktemp "$RUNNER_TEMP/artifacts.XXXXXX")"
          trap 'rm -f -- "$response"' EXIT
          api() {
            printf 'Authorization: Bearer %s\nAccept: application/vnd.github+json\n' "$GH_TOKEN" |
              curl -sS --retry 3 -X "$1" -H @- -o "$response" -w '%{http_code}' "$2"
          }
          list() {
            local page=1 status body rest n
            local re_url='"url":"[^"]*/actions/artifacts/([0-9]+)"' re_name='"name":"([^"]*)"' re_size='"size_in_bytes":([0-9]+)'
            ids=() names=() sizes=()
            while :; do
              status="$(api GET "$RUN_ARTIFACTS_URL?per_page=100&page=$page")"
              if [ "$status" != 200 ]; then
                echo "clean-up: listing this run's artifacts answered HTTP $status" >&2
                return 1
              fi
              body="$(tr -d '[:space:]' < "$response")"
              n=0
              rest="$body"
              while [[ $rest =~ $re_url ]]; do
                ids+=("${BASH_REMATCH[1]}")
                rest="${rest#*"${BASH_REMATCH[0]}"}"
                n=$((n + 1))
              done
              rest="$body"
              while [[ $rest =~ $re_name ]]; do
                names+=("${BASH_REMATCH[1]}")
                rest="${rest#*"${BASH_REMATCH[0]}"}"
              done
              rest="$body"
              while [[ $rest =~ $re_size ]]; do
                sizes+=("${BASH_REMATCH[1]}")
                rest="${rest#*"${BASH_REMATCH[0]}"}"
              done
              [ "$n" -eq 100 ] || return 0
              page=$((page + 1))
            done
          }

          list || exit 1
          echo "this run uploaded ${#ids[@]} artifact(s):"
          for i in "${!ids[@]}"; do
            if [ "${#names[@]}" -eq "${#ids[@]}" ] && [ "${#sizes[@]}" -eq "${#ids[@]}" ]; then
              echo "  ${names[$i]}, ${sizes[$i]} bytes (id ${ids[$i]})"
            else
              echo "  id ${ids[$i]}"
            fi
          done
          failed=0
          for id in "${ids[@]}"; do
            status="$(api DELETE "$ARTIFACTS_URL/$id")"
            case "$status" in
              204) echo "deleted artifact $id" ;;
              404) echo "artifact $id was already gone" ;;
              *)
                echo "clean-up: deleting artifact $id answered HTTP $status" >&2
                failed=1
                ;;
            esac
          done
          [ "$failed" = 0 ] || exit 1
          for attempt in 1 2 3 4 5; do
            list || exit 1
            if [ "${#ids[@]}" -eq 0 ]; then
              echo "ok: this run keeps no artifact"
              exit 0
            fi
            echo "listed again ($attempt): ${#ids[@]} artifact(s) still shown"
            sleep 3
          done
          echo "clean-up: ${#ids[@]} artifact(s) of this run are still listed after their deletion: ${names[*]:-${ids[*]}}" >&2
          exit 1

      - name: Remove this run's hand-over folder
        # Whatever the steps and jobs before did: the folder the sources job made
        # for this run attempt, made writable first, so no directory made
        # read-only survives. The root that holds every run's folder goes too
        # once it is empty; a folder of another run is left to that run's own
        # clean-up, which may still be to come, and named in the log.
        if: ${{ always() }}
        run: |
          set -euo pipefail
          [ -n "$RELEASE_HANDOVER" ] || { echo "clean-up: RELEASE_HANDOVER is empty" >&2; exit 1; }
          handover="$(dirname "$RUNNER_TEMP")/$RELEASE_HANDOVER"
          root="$(dirname "$handover")"
          if [ -e "$handover" ]; then
            chmod -R u+w -- "$handover"
            rm -rf -- "$handover"
            echo "removed this run's hand-over folder $handover"
          else
            echo "this run attempt left no hand-over folder at $handover"
          fi
          if [ -e "$handover" ]; then
            echo "clean-up: $handover is still there after its removal" >&2
            exit 1
          fi
          [ ! -d "$root" ] || rmdir -- "$root" 2>/dev/null || true
          if [ -d "$root" ]; then
            echo "other runs' hand-over folders remain in $root, each left to its own run's clean-up:"
            ls -la -- "$root"
          fi

      - name: Empty the runner's temporary directory of what the run left there
        # The runner empties its temporary directory itself when every job starts
        # and ends, of everything its user may delete, so what is found here is
        # what it could not remove — a directory made read-only, most often.
        # Each such entry is named, made writable and removed. Entries whose
        # names begin with an underscore are the runner's own, the files it reads
        # this job's step commands from among them, and stay, as does this step's
        # own script. What the runner's user may still not remove is named in a
        # warning.
        if: ${{ always() }}
        run: |
          set -euo pipefail
          shopt -s nullglob dotglob
          left=()
          for entry in "$RUNNER_TEMP"/*; do
            case "${entry##*/}" in _*) continue ;; esac
            [ "$entry" -ef "$0" ] && continue
            left+=("$entry")
          done
          if [ "${#left[@]}" -eq 0 ]; then
            echo "ok: the runner's temporary directory $RUNNER_TEMP holds nothing the run left"
            exit 0
          fi
          echo "left in the runner's temporary directory $RUNNER_TEMP, now removed:"
          remaining=()
          for entry in "${left[@]}"; do
            echo "  ${entry##*/}"
            chmod -R u+w -- "$entry" 2>/dev/null || true
            rm -rf -- "$entry" 2>/dev/null || true
            [ ! -e "$entry" ] || remaining+=("${entry##*/}")
          done
          if [ "${#remaining[@]}" -gt 0 ]; then
            echo "::warning::the runner's user may not remove ${remaining[*]} from $RUNNER_TEMP"
          fi
