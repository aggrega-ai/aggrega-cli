name: Publish and sign core plugins

# Tag-driven publisher for the CLI release: the binaries for Linux, Windows and
# macOS with the SHA256SUMS list of what the release attaches, the desktop
# extension package, the install scripts, the tooling image, and the core plugins
# the core-plugin list names — the ones embedded in the aggrega binary and the
# ones built and published with it but not embedded.
#
# The work is split across jobs so that the credentials that sign and publish
# never share a job with third-party code. Building runs code this repository
# does not control — Go and Rust dependencies' build logic, the pinned bundle
# packer fetched from the npm registry, the base image and packages the tooling
# image is built from — and any step of a job can read what that job holds: its
# environment, a token a checkout leaves in a repository's git configuration,
# and, when the job may mint one, the request credentials for an OIDC identity
# token. So the jobs are:
#
#   registry-credential  Proves that the registry accepts the stored
#                        credential: one authenticated GET /v2/, which pushes
#                        nothing and opens no upload session. It is the run's
#                        first act, a dry run's included, so a manual dry run
#                        is also how to prove that the stored credential
#                        matches the registry. Before that request it decides,
#                        from the event, the dry_run input and the ref alone,
#                        whether this run signs the Windows binaries, and
#                        refuses a decision to leave them unsigned on a run
#                        that publishes, as described below; then, from that
#                        and the repository variable AGGREGA_MACOS_SIGNING,
#                        whether it signs the macOS ones. It runs the
#                        repository's own scripts and nothing else but, first,
#                        the refusal of a run with no self-hosted runner named
#                        for the local jobs.
#   sources              Moves the CLI tree onto the release tag, checks out
#                        aggrega-hub, whose overlays the build reads, at the
#                        commit it resolves once for the run, as the job
#                        describes, with the run's own read token (aggrega-hub
#                        is a public repository), and hands the checkout,
#                        without a token, to the build job in the hand-over
#                        folder described below, with a SHA-256 list of it. It
#                        runs nothing but GitHub's own checkout action, git and
#                        the shell's own utilities, and the build job, which
#                        runs third-party code, names no secret at all.
#   build                Compiles, packs and stages everything the release
#                        carries, naming no secret and holding no permission to
#                        mint an OIDC token: it builds the commit the sources job
#                        pinned, with the aggrega-hub checkout that job handed
#                        over, once it matches its list; it checks that
#                        every build script stamping a version takes it from
#                        the one shared recipe, builds the binary and every
#                        core guest (plus the light no-embed binary),
#                        asserts host/guest ABI self-consistency, builds the
#                        Windows, macOS and ARM Linux binaries, builds the two
#                        program files the Windows installer carries beside
#                        the binary — its uninstaller and the plug-in that
#                        edits the user PATH — with makensis, stages each smoke run's
#                        inputs, packs the desktop extension package, generates
#                        the core Plugin catalog entities and pairs each with
#                        its guest, and builds the tooling image for
#                        linux/amd64 and linux/arm64 into one archive per
#                        platform, after registering ARM emulation with
#                        docker/setup-qemu-action, a third-party action this job
#                        may run because it names no secret. Everything the
#                        publish needs, and the three Windows binaries and the
#                        installer's two program files, unsigned, it leaves in
#                        the hand-over
#                        folder described below, with a SHA-256 list of every
#                        file in it; it uploads only what the GitHub-hosted
#                        jobs read: what the smoke jobs run, and the six macOS
#                        binaries, unsigned, with a SHA-256 list of them, for
#                        sign-macos, the list's own SHA-256 being one of its
#                        outputs.
#   sign-windows         Signs those three Windows binaries and the installer's
#                        two program files with Authenticode,
#                        as Cognitio S.r.l., through Azure Artifact Signing,
#                        every signature carrying an RFC 3161 timestamp, and
#                        hands them on, each set with a SHA-256 list of it, as
#                        windows-binaries-signed and
#                        windows-installer-parts-signed, on every run but one
#                        on which registry-credential decides to skip the
#                        signing, as described below. It runs on the runner the
#                        AGGREGA_RUNNER label names, after the build, and reads
#                        the five from the hand-over folder once they match its
#                        list. It may mint the OIDC token, which it exchanges
#                        with Microsoft Entra ID for the token that signs, and
#                        holds no secret, no registry password and no release
#                        token. It checks out this repository at the commit the
#                        build built, for the one script every Windows signing
#                        runs, scripts/sign-windows-files.sh, and the smoke
#                        library's names of the files, and runs no action but
#                        checkout and upload-artifact; the programs it runs,
#                        beside the shell's own utilities, are curl, and jsign
#                        under a Java runtime of its own: each is fetched at one
#                        version and refused unless its SHA-256 is the one that
#                        script pins, so no Java the machine carries is run. It
#                        is a job of its
#                        own so that jsign and the token exchange share a job
#                        with nothing else, and so that the Windows smoke run,
#                        the installer and the release all see the bytes it
#                        signed. It does
#                        not confine the signing identity to itself: no claim of
#                        the OIDC token names the job that minted it, so Azure
#                        accepts the token of any job of this workflow that
#                        presents the subject its credentials trust — every
#                        job naming the release environment that may mint the
#                        token presents it — and sign-and-publish, which may
#                        mint the token for its Sigstore signatures, could
#                        exchange one too.
#   windows-installer    Builds the Windows installer,
#                        aggrega-<version>-windows-amd64-setup.exe as the
#                        release attaches it, with makensis, from the default
#                        Windows binary and the two program files sign-windows
#                        signed, after holding each to its list, and from the
#                        unsigned uninstaller in the hand-over folder, which the
#                        uninstaller makensis generates again must match byte
#                        for byte before the signed one is stored in its place;
#                        on a run that signs nothing, from the unsigned files
#                        the build wrote. It hands the installer on, unsigned,
#                        with a SHA-256 list of it, as windows-installer. It runs
#                        on the runner AGGREGA_RUNNER names, because it reads the
#                        hand-over folder, holding it to its list first. It
#                        names no secret, may not mint the OIDC token, and runs
#                        no action but checkout and the artifact download and
#                        upload: makensis, and the NSIS packages and the plug-in
#                        it fetches, are third-party code, so the installer is
#                        built in a job of its own rather than where anything
#                        signs.
#   sign-windows-installer
#                        Signs the installer windows-installer built, once it
#                        matches its list, through the same script, the same
#                        identity and the same pinned jsign and Java runtime as
#                        sign-windows, and hands it on with a SHA-256 list of it
#                        as windows-installer-signed; skipped when sign-windows
#                        is. It holds what sign-windows holds and nothing else,
#                        and runs what sign-windows runs and nothing else.
#   sign-macos           Signs the six macOS binaries — the default, debug and
#                        light ones for darwin/arm64 and darwin/amd64 — with
#                        the Developer ID Application identity Apple issued to
#                        COGNITIO SRL, team N4DSTL8KLH,
#                        with the hardened runtime and a secure timestamp,
#                        claiming the entitlements
#                        packaging/macos/aggrega.entitlements declares, submits
#                        them to Apple's notary service without waiting for its
#                        answer, gives the submission's ID as its output
#                        notary_submission_id, printing it in the log and the
#                        run's summary, and hands the binaries on,
#                        each target's three with a SHA-256 list of them, as
#                        macos-binaries-signed-darwin-arm64 and
#                        macos-binaries-signed-darwin-amd64; skipped on the
#                        decision that skips sign-windows, and whenever the
#                        repository variable AGGREGA_MACOS_SIGNING is not
#                        true, when the release ships the six unsigned, as
#                        the build wrote them, and says so. It runs on a
#                        GitHub-hosted Apple silicon macOS machine, after the
#                        build, with Apple's own codesign, notarytool,
#                        security, ditto and openssl, and nothing else but the
#                        shell's own utilities and the artifact download and
#                        upload, pinned by commit: it checks nothing out and
#                        runs no build. It takes the unsigned binaries and that
#                        entitlements file from the build's artifact once the
#                        list beside them has the SHA-256 the build gave as its
#                        output and each file the digest the list gives it.
#                        The identity goes into a
#                        keychain of the job's own, in the runner's temporary
#                        directory, deleted once the signing ends, whatever
#                        ended it. It is the one job that names the Apple
#                        secrets but the notary key, which notarization-check
#                        names too, and it holds no other secret, no token of the
#                        run's and no permission at all; a submission Apple's
#                        notary service does not take, so that there is no
#                        submission ID, fails it.
#   sign-and-publish     Once every smoke job below has passed, reads the
#                        release inputs from the hand-over folder once every
#                        file there matches its list, downloads
#                        windows-binaries-signed, windows-installer-signed and
#                        both macos-binaries-signed artifacts — or, while macOS
#                        signing is off, the build's unsigned macOS binaries,
#                        held to the list the build wrote of them — and
#                        publishes them: it pushes
#                        the tooling image's platforms from their archives and
#                        then the index joining them under one tag, publishes each
#                        plugin with its guest, signs both, and creates the
#                        GitHub release with the downloadable binaries, the
#                        Windows installer, the
#                        extension package, the install scripts and the
#                        quickstart scripts from its checkout, the software
#                        bill of materials, THIRD-PARTY.spdx from that
#                        checkout under a version-named file, and SHA256SUMS, the list of their SHA-256
#                        digests it writes from the very files it attaches. It
#                        may mint the OIDC token, for
#                        those Sigstore signatures, and alone holds the token
#                        that writes the release; the registry password it
#                        holds is otherwise held only by registry-credential. It
#                        runs no build or pack step and no action but checkout,
#                        download-artifact and upload-artifact: the programs it
#                        runs, beside the shell's own utilities, are the aggrega
#                        binary the build job built, docker (to load and push the
#                        image archives and join them under one tag with its own
#                        manifest command), gh and curl. On a real publish it
#                        hands the plugin publish's own output on, as its
#                        plugin_push_output, to
#                        record-published. Once the release step has run, a dry
#                        run's included, it hands that SHA256SUMS on to attest as
#                        release-checksums, renders the Homebrew formula, the
#                        Scoop manifest and the winget manifest from the files it
#                        attached and their SHA256SUMS, hands the first two on to
#                        publish-package-channels, and prints the winget
#                        manifest's three files and hands them on to
#                        open-winget-pull-request.
#   attest               After a real publish, writes GitHub's build provenance
#                        for every file SHA256SUMS lists, each named and
#                        digested as the list gives it: one attestation, signed
#                        keyless with a Sigstore certificate issued for this
#                        run's OIDC identity, recorded in the public transparency
#                        log and stored with this repository's attestations, so
#                        that gh attestation verify <file> --repo
#                        aggrega-ai/aggrega-cli shows that a downloaded file is
#                        one this workflow released. The provenance names this
#                        workflow, the run and its attempt, and the ref the run
#                        started from with that ref's commit, as the run's OIDC
#                        token gives them: on a tag push the tag and its commit,
#                        on a dispatch the ref it was dispatched from, so a real
#                        manual publish is dispatched from its tag, whose commit
#                        is the one the build built. It runs on
#                        a GitHub-hosted runner, names no environment and no
#                        secret, and has two steps and nothing else: the artifact
#                        download of release-checksums, and GitHub's own attest
#                        action, pinned by commit, which reads the list and
#                        writes the attestation. It may mint the OIDC token, as
#                        the attest action needs, and is a job of its own so
#                        that the token shares a job with those two actions
#                        alone. Its token names the ref rather than the release
#                        environment; it runs only once sign-and-publish, which
#                        names that environment, has succeeded in the same run,
#                        so on a ref the environment admits. A dry run attests
#                        nothing: this job is skipped there.
#   record-published     After a real publish, records what sign-and-publish
#                        published on aggrega-hub's
#                        published branch: each plugin's reference, version and
#                        digest, read from the push's own output by aggrega-hub's
#                        row reader, and the generated core plugin entities, read
#                        from the hand-over folder once it matches its list. It
#                        writes through aggrega-hub's one writer,
#                        scripts/record-published.sh, which pushes one commit as a
#                        fast-forward of the branch and never forces, and never
#                        writes aggrega-hub's main branch. Its one credential
#                        beside the run's own read-only token is a GitHub App
#                        installation token for aggrega-hub alone, asking for its
#                        contents alone, minted here by GitHub's own
#                        create-github-app-token action, which revokes it when
#                        the job ends; it holds no registry
#                        password, no release token and no permission to mint an
#                        OIDC token, and runs no action but checkout and that one.
#                        The token reaches the writer's git commands through their
#                        environment and is never written to disk. On a dry run
#                        it mints the token, which proves the App's client ID and
#                        private key, uses it for nothing and does nothing else.
#   publish-skills       Once sign-and-publish has succeeded, for a tag with
#                        no pre-release suffix, publishes the
#                        skills built into the aggrega binary, and the plugin
#                        manifests generated beside them, to the public
#                        aggrega-skills repository: the tree committed at
#                        internal/skills/repository, at the commit the build job
#                        built, which the build job has held to what the skills
#                        package's generator writes. It makes one commit on
#                        that repository's main branch whose tree is exactly that
#                        tree, tags it with the release tag, and pushes both
#                        together as a fast-forward, never forcing: a tag already
#                        there is left as it is when it names the same tree and
#                        refused when it names another. On a dry run it mints
#                        its token, as below, uses it for nothing, prints the
#                        tree it would publish and pushes nothing. It runs on a
#                        GitHub-hosted runner and needs nothing from the hand-over
#                        folder. Its one credential beside the run's own read-only
#                        token is a GitHub App installation token for
#                        aggrega-skills alone, asking for its contents alone,
#                        minted on a dry run too by GitHub's own
#                        create-github-app-token action, which revokes it when
#                        the job ends; it runs no action but
#                        checkout and that one, and no program but git and the
#                        shell's own utilities. The token reaches git through its
#                        environment and is never written to disk.
#   publish-package-channels
#                        Once sign-and-publish has succeeded, for a tag with
#                        no pre-release suffix, commits the
#                        Homebrew formula it rendered, Formula/aggrega.rb, to the
#                        aggrega-ai/homebrew-tap repository, and the Scoop
#                        manifest, bucket/aggrega.json, to aggrega-ai/scoop-bucket,
#                        each as one commit on that repository's main branch,
#                        pushed as a fast-forward and never forced. A file
#                        already there unchanged is left as it is, and so is one
#                        naming a later release. On a dry run it mints its
#                        token, as below, uses it for nothing, prints both
#                        files and where each would go, and pushes nothing. It
#                        runs on a GitHub-hosted runner, checks nothing out and
#                        needs nothing from the hand-over folder. Its one
#                        credential is a GitHub App installation token for those
#                        two repositories alone, asking for their contents
#                        alone, minted on a dry run too by GitHub's own
#                        create-github-app-token action, which revokes it when
#                        the job ends; it runs no action but
#                        that one, and no program but git and the shell's own
#                        utilities. The token reaches git through its
#                        environment and is never written to disk.
#   open-winget-pull-request
#                        Once sign-and-publish has succeeded, for a tag with
#                        no pre-release suffix, opens the pull
#                        request that adds the winget manifest sign-and-publish
#                        rendered to the winget community repository,
#                        microsoft/winget-pkgs, through
#                        scripts/open-winget-pull-request.sh: it syncs the
#                        organization's fork of that repository, pushes to the
#                        fork a branch adding the manifest's three files, as
#                        sign-and-publish rendered them, under the folder
#                        winget-pkgs keeps them in, never forced, and opens the
#                        pull request from that branch. It does so only on a
#                        real publish, and only when the repository variable
#                        AGGREGA_WINGET_PULL_REQUEST is true; with it anything
#                        else, unset included, it opens nothing and says that
#                        the gate is off. On a dry run it prints the fork, the
#                        branch, the files' paths and the title of the pull
#                        request it would open, and opens nothing, whatever the
#                        variable is, and checks the token: GitHub must accept
#                        it, and it must carry the public_repo scope. It runs on
#                        a GitHub-hosted runner, checks
#                        out this repository at the commit the build job built
#                        for that script and needs nothing from the hand-over
#                        folder. Its one credential beside the run's own
#                        read-only token is the personal access token
#                        WINGET_PULL_REQUEST_TOKEN; it may not mint an OIDC
#                        token, and runs no action but checkout and no program
#                        but gh, git and the shell's own utilities. The token
#                        reaches gh and git through their environment and is
#                        never written to disk.
#   publish-downloads    Once sign-and-publish has succeeded, for a final
#                        release tag (a pre-release is skipped), publishes
#                        the Windows installer that release attached to the public R2
#                        bucket aggrega-downloads, at the address the Microsoft
#                        Store listing installs from,
#                        https://download.aggrega.ai/aggrega-cli/v<version>/aggrega-<version>-windows-amd64-setup.exe,
#                        which answers 200 itself where a GitHub release asset
#                        redirects. It downloads the installer and SHA256SUMS
#                        from the release with gh release download and holds the
#                        one to the other, uploads the installer through R2's S3
#                        endpoint with one PUT curl signs, carrying
#                        If-None-Match: *, so the object is created only where
#                        none is and never replaced — a key already taken passes
#                        when the object there is this installer, which makes a
#                        re-run safe, and fails otherwise, naming both SHA-256
#                        digests — and then downloads the public address in full:
#                        200 with no redirect, a Content-Length equal to the
#                        installer's size, and the bytes SHA256SUMS lists. On a
#                        dry run it prints the address it would publish and
#                        uploads nothing. On a dry run and a real publish alike
#                        it refuses, naming each, a setting it needs that is not
#                        set, so a release never skips the Store's download. It
#                        runs on a GitHub-hosted runner, checks out this
#                        repository at the commit the build job built for the
#                        smoke library and needs nothing from the hand-over
#                        folder. Its one credential beside the run's own
#                        read-only token is the R2 key pair
#                        DOWNLOADS_R2_ACCESS_KEY_ID and
#                        DOWNLOADS_R2_SECRET_ACCESS_KEY; it may not mint an OIDC
#                        token, and runs no action but checkout and no program
#                        but gh, curl and the shell's own utilities. The key
#                        pair reaches curl on its standard input and is never
#                        written to disk.
#   microsoft-store-submission
#                        Once publish-downloads has succeeded, for a final
#                        release tag (a pre-release is skipped), submits the
#                        release's Windows installer to Aggrega's Microsoft
#                        Store listing, with
#                        .github/scripts/microsoft-store-submission.sh: it
#                        points the listing's one package at the installer's
#                        public address, which it first holds to the SHA-256
#                        the release's SHA256SUMS lists, commits the draft and
#                        submits it for certification, then reads the
#                        submission's status and passes while it is in
#                        certification or published. A submission already in
#                        progress and a draft that holds a newer version leave
#                        the listing unchanged and the job passing, with a
#                        warning, whose summary line says why and, for a
#                        submission in progress, names the Submit to the
#                        Microsoft Store dispatch to run once it ends;
#                        a draft that does not hold exactly one package is
#                        refused, changing nothing. On a dry run it reads the
#                        release, the address, the draft's status and its
#                        packages, and prints the change, writing nothing. It
#                        runs on a GitHub-hosted runner, checks out this
#                        repository at the commit the build job built for the
#                        script and needs nothing from the hand-over folder. It
#                        names the environment microsoft-store, not release, so
#                        its credentials are the Store's alone: the three
#                        secrets MICROSOFT_STORE_TENANT_ID,
#                        MICROSOFT_STORE_CLIENT_ID and
#                        MICROSOFT_STORE_CLIENT_SECRET and the two variables
#                        MICROSOFT_STORE_SELLER_ID and
#                        MICROSOFT_STORE_PRODUCT_ID, beside the run's own
#                        read-only token; it may not mint an OIDC token, and
#                        runs no action but checkout and no program but curl,
#                        jq, gh and the shell's own utilities. The three
#                        secrets reach curl on its standard input and are never
#                        written to disk. The microsoft-store-submission
#                        workflow runs the same script by hand for a released
#                        version.
#   notarization-check   Once sign-and-publish, record-published,
#                        publish-skills, publish-package-channels,
#                        open-winget-pull-request, publish-downloads and
#                        microsoft-store-submission have ended, whatever each
#                        did, on a real publish and a dry run alike, whenever
#                        sign-macos succeeded and gave a submission ID: asks
#                        Apple's notary service, once, with Apple's own
#                        notarytool info, how that submission stands. Accepted:
#                        it prints Apple's log and has Apple's codesign confirm
#                        that each signed binary, as sign-macos handed them on,
#                        is signed with the release's Developer ID and is
#                        notarized, failing when one is not. In Progress: it warns,
#                        naming the submission and the command that reads it
#                        later, and passes, since the binaries are published
#                        signed and macOS fetches each one's ticket online once
#                        Apple accepts it. Invalid or Rejected: it prints
#                        Apple's log and fails, saying the published macOS
#                        binaries are not notarized. It runs on a
#                        GitHub-hosted Apple silicon macOS machine, polls
#                        nothing, and holds what sign-macos holds of the notary
#                        key and nothing else: the key, written as sign-macos
#                        writes it, and its two identifiers; no other secret, no
#                        token of the run's and no permission at all. It runs
#                        Apple's own programs, the shell's own utilities and the
#                        artifact download, pinned by commit, and checks nothing
#                        out.
#   clean-up             Runs last, whatever every other job did, a failure or a
#                        cancellation included: deletes every artifact this run
#                        uploaded, through the REST API with the run's own token,
#                        removes the hand-over folder, and empties the runner's
#                        temporary directory of anything the runner left there.
#                        It may delete the run's artifacts (actions: write) and
#                        holds nothing else: no checkout, no action, no secret.
#
# publish-skills, publish-package-channels, open-winget-pull-request,
# publish-downloads and microsoft-store-submission publish final releases alone.
# For a tag carrying a pre-release suffix (v0.9.0-rc.1),
# a dry run's included, each is skipped by its if:, which reads
# sign-and-publish's prerelease output, and sign-and-publish's release step
# names them all in its log; so a pre-release run shows them skipped, not
# failed. On a real publish the first four each still refuse, in their own
# step, any other tag that is not a release tag; microsoft-store-submission
# checks no tag, needs publish-downloads, which compares the tag with the
# version, and its script refuses, on a real run, a version that is not
# MAJOR.MINOR.PATCH.
#
# The sources, build, sign-windows, windows-installer, sign-windows-installer,
# sign-and-publish, record-published and
# clean-up jobs run on one machine, the self-hosted runner AGGREGA_RUNNER names,
# and hand files to each other on its disk, in the hand-over folder:
# aggrega-release-handover/<run id>-<attempt>
# beside the runner's temporary directory, which the runner empties at the start
# and end of every job. The sources job makes it, readable by the runner's user
# alone, and writes into it the aggrega-hub checkout and a SHA-256 list of it,
# which the build job holds it to before it takes it out and removes the
# list. The build job then writes into it what the jobs after it read, and a
# list of that last, after every third-party step of that job has run; each job
# that reads the folder holds it to the list it finds there first. Both lists
# are written by one function of the repository's smoke library. A run with no
# such runner stops in its first job, saying so: nothing falls back to a hosted
# runner or to artifacts. Only what a GitHub-hosted job runs is uploaded — the
# Windows, macOS and ARM Linux smoke inputs, the signed Windows binaries, the
# Windows installer, the macOS binaries, unsigned for sign-macos and signed by
# it, and the earlier
# release's binaries smoke_binaries_from names — and what a job on the runner
# writes after the hand-over folder's list and hands to the next: the
# installer's signed program files, which windows-installer builds the installer
# from, the installer it builds, which sign-windows-installer signs, and the
# release's SHA256SUMS, which sign-and-publish writes and attest reads. clean-up
# deletes it all when
# the run ends, so no artifact outlives the run that made it; the one-day
# retention each upload names is what removes them should clean-up never run. A
# re-run must re-run every job: a re-run of the failed jobs alone finds the
# folder and the artifacts gone.
#
# Everything sign-and-publish signs is signed keyless via the GitHub Actions
# OIDC identity against the public Sigstore instance (Fulcio + Rekor), and so is
# the build provenance attest writes. The
# Windows binaries are signed by sign-windows instead, with the Authenticode
# signature Windows itself checks, and so are the program files the Windows
# installer carries; the installer, which carries those signed files, is built
# after them and signed by sign-windows-installer. The build reproduces the
# Windows binaries' unsigned bytes, and windows-installer the installer's from
# the same signed files; a signed file differs from one signing to the next, in its
# certificate and its timestamp, while its Authenticode digest, which leaves
# the signature out, does not. The macOS binaries are signed by sign-macos, with
# the Developer ID signature macOS itself checks, and submitted to Apple's
# notary service; a bare executable cannot carry its notarization ticket
# stapled, so Gatekeeper finds the ticket online, and the binaries may be
# published before Apple has answered. notarization-check reads that answer at
# the end of the run. The build reproduces the macOS binaries' unsigned bytes
# too.
# Every checkout sets persist-credentials: false,
# so no checkout leaves its token in the repository's git configuration for a
# later step to read.
# scripts/check-release-job-isolation.sh reads this file and refuses it when a
# job that may mint the OIDC token runs a build or pack step, directly or through
# a repository script, when such a job runs any action but checkout and the
# artifact download and upload — save GitHub's attest action, in a job whose
# steps are the artifact download and that action alone, granted contents:
# read, id-token: write, attestations: write and artifact-metadata: write and
# nothing else, naming no secret and no environment, and running on a
# GitHub-hosted image it names by a literal label — when a checkout keeps its
# token, when a job that runs third-party code names a secret or the run's
# token anywhere in it — in an action's with: as well as in an environment or a
# run body — when the
# job that may delete the run's artifacts is granted anything else, runs any
# action or a build step, or names a secret, or when a secret whose name begins
# APPLE_ is named outside sign-macos, save the notary key, which
# notarization-check alone names besides, or either of those two jobs checks
# anything out, runs a build step or a repository script, runs an action but
# the artifact download and upload or one not pinned by its full commit, is
# granted a permission, names another secret or the run's token, or runs
# anywhere but on a GitHub-hosted macOS machine it names.
#
# Three more jobs prove the Windows, macOS and ARM Linux binaries on
# GitHub-hosted machines of each platform: windows-smoke on a Windows runner,
# macos-smoke on an Apple silicon (darwin/arm64) and an Intel (darwin/amd64)
# macOS runner, and linux-smoke on an ARM Linux (linux/arm64) runner. Each
# runs every binary's version report, the protocol handshake over standard input
# and output, a validate, pull and build of a worked example whose result it
# compares byte for byte with the result the build job produced; then, in a
# directory whose path holds a space and a letter outside ASCII, config init
# with only the platform's own rule able to place the global configuration, a
# pull from a registry the job starts on its own loopback address that writes
# the workspace's entity cache and a build from that cache, a pull naming one
# catalog directory twice, and a second, chart-backed example built and compared
# the same way; every command's output is redirected and must carry no escape
# byte; and the tests that prove each platform split behaves on that platform,
# all through one script. windows-smoke runs the binaries sign-windows signed,
# and last checks their signatures: Windows' own Get-AuthenticodeSignature must
# report each one valid, signed by Cognitio S.r.l. and timestamped, and each
# must match sign-windows' SHA-256 list, while the unsigned copies the build
# wrote are shown refused; then it installs aggrega with the installer
# sign-windows-installer signed, silently, runs it by name from a new shell,
# installs over that install, checks the installer's and the installed files'
# signatures the same way, and uninstalls silently, leaving neither the folder
# nor its PATH entry; and it renders the winget manifest from a folder of those
# files, as the release renders it, and holds it to winget validate.
# macos-smoke runs the binaries sign-macos signed, and last checks their
# signatures: macOS's own codesign must accept each one and report
# it signed with the Developer ID Application certificate Apple issued to
# COGNITIO SRL, team N4DSTL8KLH, with the hardened runtime and a
# secure timestamp, claiming exactly the entitlements the checkout's
# packaging/macos/aggrega.entitlements declares and never get-task-allow,
# and each must match sign-macos' SHA-256 list, while the unsigned
# copies the build wrote are shown refused. Apple may not yet have answered
# the notarization when macos-smoke runs, so each binary's notarization is
# checked in notarization-check, once Apple has accepted it. While macOS signing is off, the
# repository variable AGGREGA_MACOS_SIGNING not being true, sign-macos is
# skipped on every run, macos-smoke runs the unsigned macOS binaries the build
# wrote, its signature check not applicable, and passes when every other check
# does, and sign-and-publish releases those binaries unsigned, saying so in the
# release notes and in the run's summary; the Windows binaries are signed as
# ever. On a decision to skip the signing, which no run the release
# environment admits reaches (see the refs below), nothing is signed:
# windows-smoke and macos-smoke run the unsigned
# binaries the build wrote, windows-smoke the installer windows-installer built from
# them too, through the same script, which reports the
# signature check not applicable rather than passed, and sign-and-publish, which
# waits for sign-windows and sign-macos, is skipped with them, so the run prints no publish
# plan. They need nothing the build needs — no
# sibling repository, no toolchain, no secret, no network beyond their own
# loopback address, save the Windows run's download of a pinned WinGet CLI from
# GitHub when its image carries no winget — because the build job stages
# everything each runs as one workflow artifact per target. They publish nothing, and sign-and-publish
# waits for all of them: it starts only when the Windows run, both macOS runs
# and the ARM Linux run have passed, on a release tag and on a dispatch, a dry
# run's included.
# So a binary that fails on its own platform stops the release before anything
# is pushed, and a smoke job that never starts holds sign-and-publish back with
# it. A dry run proves the binaries the same way before a tag is pushed.
#
# A dry run may also name, in smoke_binaries_from, the tag of an earlier
# release: windows-smoke then runs that release's Windows binaries in place of
# this run's own, every check, the signature check included, reporting its
# verdict, to show which checks those binaries fail. Such a smoke run never
# passes, so the run never reaches sign-and-publish, and a dispatch that is not
# a dry run is refused for naming one before anything is built.
#
# Nothing is pushed, published or released until every build, validation and
# smoke run has passed, so a failure in the ABI check, in catalog generation or
# on a smoke runner can never strand an already-pushed tooling image or a
# half-published plugin set. The requests with an effect beyond this run
# before then are the Windows signing, sign-windows' and
# sign-windows-installer's, which publishes nothing, and sign-macos' signing and
# its submission for notarization, after which Apple, once it accepts the
# submission, publishes the notarization ticket of each macOS binary for
# Gatekeeper to find: a signed binary or installer whose smoke run fails is
# never released. Apple's answer is not one of those checks: the release goes
# ahead while it is pending, and notarization-check reads it at the end. The Wasm guests are reproducible
# build outputs, not tracked files, so they are absent from a fresh checkout:
# the build MUST run before catalog generation (which reads each guest's
# self-reported descriptor) and before the plugins are staged for publishing
# (which needs each guest's compiled module).
#
# This workflow NEVER creates or pushes a git tag on this repository. Deciding
# the version and cutting the tag is a human action; this workflow publishes the
# OCI artifacts and attaches the built binaries and the extension package to the
# GitHub release for the already-pushed tag. Its git writes are five, all after a
# real publish and all to another repository: record-published's one commit on
# aggrega-hub's published branch, never on a main branch; publish-skills' one
# commit on aggrega-skills' main branch with the release tag on it, a repository
# that holds nothing but the generated skills tree; publish-package-channels'
# one commit on the main branch of each of aggrega-ai/homebrew-tap and
# aggrega-ai/scoop-bucket, each changing one file; and, while
# AGGREGA_WINGET_PULL_REQUEST is true, open-winget-pull-request's one branch on
# the organization's fork of microsoft/winget-pkgs, a new branch holding one
# commit that adds the winget manifest's three files, from which it opens a pull
# request on microsoft/winget-pkgs. A real publish of a pre-release makes
# record-published's write alone: the jobs after it are skipped.
# Beside those, a real publish of a final release writes one object:
# publish-downloads' copy of the Windows installer in the download bucket,
# created under the release's version and never replaced; and
# microsoft-store-submission's update of the Microsoft Store listing's package
# to that installer's address, which it submits for certification.
#
# A manual dispatch, from a release/* branch or a v* tag (the refs the release
# environment admits), defaults to a dry run; the dry run before a release tag
# exists is dispatched from release/vX.Y.Z, the release's own branch, which
# carries the commit the tag will name. It checks the credential, builds
# everything a real run builds — the tooling image and the Windows installer
# included — signs the Windows binaries and the installer, and signs the macOS
# binaries and submits them to Apple for notarization, as a real run does, so
# the signing and the signature checks are proven before a tag exists, runs the
# Windows, macOS and ARM Linux smoke jobs in full, and then, once they have
# passed, sign-and-publish loads and checks the image's two archives and prints
# what it would push, publish, sign and release, doing none of it, and hands
# SHA256SUMS on as release-checksums, which attest, skipped on a dry run, does
# not read.
# record-published, publish-skills and publish-package-channels each mint their
# App's token, which proves that App's client ID and private key, and use it
# for nothing, the action that minted it revoking it when the job ends;
# record-published does nothing else, publish-skills prints the tree it would
# publish to aggrega-skills, publish-package-channels prints the formula and
# the manifest it would commit, pushing nothing, and open-winget-pull-request
# prints the pull request it would open on microsoft/winget-pkgs and what
# AGGREGA_WINGET_PULL_REQUEST would make of it, opening nothing, and checks its
# token: GitHub must accept it, and it must carry the public_repo scope; with
# no token set, it refuses when that variable is true and otherwise says so
# and passes — save for a tag carrying a pre-release suffix, for which
# publish-skills, publish-package-channels, open-winget-pull-request,
# publish-downloads and microsoft-store-submission are skipped, as on a real
# run, so the dry run shows the run graph the real
# run would; publish-downloads refuses, naming each, an R2 setting that is not
# set, and prints the address it would publish the Windows installer at,
# uploading nothing; microsoft-store-submission refuses, naming each, a Store
# setting that is not set, reads the listing's draft and prints the change it
# would make, writing nothing; last, notarization-check reads
# Apple's answer to the submission as on a real run, which publishes nothing.
#
# The release credentials are held by the GitHub environment named release,
# which these jobs name: registry-credential, sign-windows,
# sign-windows-installer, sign-macos, sign-and-publish, record-published,
# publish-skills, publish-package-channels, open-winget-pull-request,
# publish-downloads and notarization-check. Its branch and tag rule admits the
# branches matching release/* and the tags matching v*. The one job of this
# workflow that holds other credentials, microsoft-store-submission, names the
# GitHub environment microsoft-store instead, which holds the Store's and
# whose branch and tag rule admits main, the branches matching release/* and the
# tags matching v*; the release credentials never reach it, and the Store's
# reach no job that names release. On a run from any other
# ref, registry-credential, the run's first job, fails before any step of it
# runs, and every other job is skipped but clean-up, which names no environment
# and holds no secret: nothing is checked out, built, signed or published.
# The environment's secrets reach only the jobs that name it, whatever any
# other job runs; the list of settings below says which are the environment's.
# Every job naming it that may mint the OIDC token — sign-windows,
# sign-windows-installer and sign-and-publish — presents the subject
# repo:aggrega-ai/aggrega-cli:environment:release, which names the environment
# in place of the ref, and that is the subject one of the Windows signing
# identity's federated credentials trusts: sign-and-publish's token is
# accepted too, as sign-windows' entry above says. Fulcio takes the identity
# of sign-and-publish's Sigstore certificates from the workflow's path and
# ref, not from that subject. attest, which may mint the token too, names no
# environment, so its token's subject names the ref the run started from in
# place of the environment.
#
# Which refs sign is decided by the release environment's branch and tag
# rule: every job of this workflow that may mint the OIDC token but attest
# names the environment and presents its subject, which names no ref, so the
# signing identity's federated credentials in Azure decide that the environment
# may sign, and the environment decides from which refs; attest runs only once
# sign-and-publish has succeeded in the same run, so only on a ref the
# environment admits. Whether a run signs is
# decided in registry-credential by the event, the dry_run input and the ref,
# before anything is built or signed, and never by a signing that failed:
# sign, or skip for a manual dry run from a ref outside those
# .github/scripts/windows-signing.sh takes the identity to admit, written once
# there — every release/* branch and every tag. Every ref that list leaves out
# is one the release environment does not admit, and registry-credential names
# the environment, so no run the environment admits reaches skip: every run that
# reaches the decision signs. On a decision to skip, sign-windows,
# sign-windows-installer and sign-macos are skipped, windows-installer builds the installer
# from the unsigned files the build wrote,
# windows-smoke runs the unsigned binaries and that installer, macos-smoke the
# unsigned macOS binaries, each signature check
# not applicable, and sign-and-publish is skipped with sign-windows. The same
# job refuses skip on a tag push and on a dispatch that is not a dry run,
# which always sign, so on those a token the identity's credentials do not
# accept fails in sign-windows, naming the ref. The macOS signing follows that one decision,
# and is switched on by the repository variable AGGREGA_MACOS_SIGNING: on a
# decision to sign, the macOS binaries are signed when it is true, and
# otherwise released unsigned, which registry-credential prints and writes to
# the run's summary; on a decision to skip, they are not signed whatever it
# is. Apple's credentials are not bound to a ref: they reach sign-macos as
# secrets of the release environment, so the macOS binaries are signed from
# the refs that environment admits, and a run that signs the macOS
# binaries and lacks an Apple setting fails in sign-macos, naming each one
# missing.
#
# Settings, by name, each where it lives: in the repository's settings, or in
# the release environment's, which only the jobs naming the environment read.
#   repository variables
#              CLI_PUBLISH_REGISTRY      the registry to publish to, as its host
#              REGISTRY_USERNAME         the registry username
#              AGGREGA_RUNNER            the label of the self-hosted runner
#                                        sources, build, sign-windows,
#                                        windows-installer,
#                                        sign-windows-installer,
#                                        sign-and-publish, record-published and
#                                        clean-up run on (required; one machine)
#              CLI_PUBLISH_OVERLAY_DIR   the per-plugin overlay directory
#                                        (optional, aggrega-hub/plugin-overlays
#                                        by default)
#              CLI_PUBLISH_HUB_REF       the aggrega-hub ref sources checks out
#                                        for the overlays, and record-published
#                                        takes aggrega-hub's writer from
#                                        (optional; set, it overrides
#                                        .github/release-hub-commit, as the
#                                        sources job describes)
#              AZURE_TENANT_ID           the Microsoft Entra tenant of the
#                                        identity sign-windows and
#                                        sign-windows-installer sign as
#              AZURE_CLIENT_ID           that identity's client ID: an app
#                                        registration with no secret, whose
#                                        federated credentials accept this
#                                        workflow's OIDC token
#              ARTIFACT_SIGNING_ENDPOINT the Artifact Signing account's
#                                        endpoint, its account URI
#              ARTIFACT_SIGNING_ACCOUNT  the Artifact Signing account's name
#              ARTIFACT_SIGNING_PROFILE  the certificate profile that signs
#                                        (sign-windows and
#                                        sign-windows-installer only, all five;
#                                        each is an identifier, none a secret,
#                                        and each of the two refuses, naming
#                                        it, any that is not set)
#              APPLE_NOTARY_API_KEY_ID   the App Store Connect API key's ID
#              APPLE_NOTARY_API_ISSUER_ID
#                                        that key's issuer ID (sign-macos and
#                                        notarization-check only, both;
#                                        identifiers notarytool takes as
#                                        arguments, neither a secret, and each
#                                        of the two jobs refuses, naming it,
#                                        either that is not set)
#              AGGREGA_MACOS_SIGNING     true to sign the macOS binaries and
#                                        submit them for notarization in
#                                        sign-macos, Apple's answer read in
#                                        notarization-check, which then
#                                        need the two above and the three
#                                        Apple secrets below; anything else,
#                                        unset included, releases them
#                                        unsigned and not notarized, saying so
#                                        (read by registry-credential alone)
#              AGGREGA_WINGET_PULL_REQUEST
#                                        true to open the pull request that
#                                        adds each final release's winget manifest
#                                        to microsoft/winget-pkgs, in
#                                        open-winget-pull-request, on a real
#                                        publish, which then needs the secret
#                                        WINGET_PULL_REQUEST_TOKEN below and the
#                                        steps after this list; anything else,
#                                        unset included, opens none, saying
#                                        so (read by open-winget-pull-request
#                                        alone). Leave it unset while the
#                                        release's downloads are not public:
#                                        winget-pkgs' validation downloads the
#                                        installer from the address the
#                                        manifest names
#              DOWNLOADS_R2_ENDPOINT     the S3 endpoint of the Cloudflare
#                                        account holding the download bucket,
#                                        https://<account ID>.r2.cloudflarestorage.com
#                                        (publish-downloads only, which refuses
#                                        it unset or not an https:// address;
#                                        an address, not a secret)
#   release-environment variables
#              HUB_PUBLISHED_APP_CLIENT_ID
#                                        the client ID of the App installed on
#                                        aggrega-hub alone, with its contents'
#                                        write permission, that writes its
#                                        published branch (record-published
#                                        only)
#              SKILLS_PUBLISH_APP_CLIENT_ID
#                                        the client ID of the App installed on
#                                        aggrega-skills alone, with its
#                                        contents' write permission, that
#                                        publishes the skills there
#                                        (publish-skills only)
#              PACKAGE_CHANNELS_APP_CLIENT_ID
#                                        the client ID of the App installed on
#                                        aggrega-ai/homebrew-tap and
#                                        aggrega-ai/scoop-bucket alone, with
#                                        their contents' write permission, that
#                                        commits the formula and the manifest
#                                        there (publish-package-channels only;
#                                        each client ID is an identifier, not
#                                        a secret)
#   release-environment secrets
#              REGISTRY_PASSWORD         the registry password
#                                        (registry-credential and
#                                        sign-and-publish only)
#              HUB_PUBLISHED_APP_PRIVATE_KEY
#              SKILLS_PUBLISH_APP_PRIVATE_KEY
#              PACKAGE_CHANNELS_APP_PRIVATE_KEY
#                                        the private keys of those Apps,
#                                        each read by the one job that reads
#                                        its App's client ID and handed, with
#                                        that client ID, to the action that
#                                        mints the write token, on a dry run
#                                        too, and to nothing else; the step
#                                        before that action refuses, naming it,
#                                        a client ID or key that is not set
#              APPLE_DEVELOPER_ID_CERTIFICATE
#                                        the Developer ID Application identity,
#                                        its certificate and private key, as a
#                                        PKCS#12 file in base64
#              APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD
#                                        the passphrase that file was exported
#                                        with
#              APPLE_NOTARY_API_KEY      the App Store Connect API key's private
#                                        key, the text of its .p8 file
#                                        (sign-macos only, all three, save this
#                                        last, which notarization-check is given
#                                        too; each reaching a program through
#                                        its environment or a file in the
#                                        runner's temporary directory, never its
#                                        command line; each of the two jobs
#                                        refuses, naming it, any it reads that
#                                        is not set)
#              WINGET_PULL_REQUEST_TOKEN a personal access token (classic)
#                                        with the public_repo scope alone, of
#                                        an account that may push to the
#                                        organization's fork of
#                                        microsoft/winget-pkgs: it pushes the
#                                        branch to the fork and opens the pull
#                                        request on microsoft/winget-pkgs, which
#                                        neither a fine-grained token nor an App
#                                        installation token can do, since
#                                        neither writes to a public repository
#                                        the organization neither owns nor is a
#                                        member of (open-winget-pull-request
#                                        only, read on a real publish with
#                                        AGGREGA_WINGET_PULL_REQUEST true and
#                                        checked on a dry run, and
#                                        reaching gh and git through their
#                                        environment alone)
#              DOWNLOADS_R2_ACCESS_KEY_ID
#              DOWNLOADS_R2_SECRET_ACCESS_KEY
#                                        the S3 key pair of an R2 API token
#                                        with Object Read & Write on the
#                                        bucket aggrega-downloads alone, which
#                                        uploads the Windows installer there
#                                        (publish-downloads only, read on a
#                                        real publish, refused unset on a dry
#                                        run and a real publish alike, and
#                                        reaching curl on its standard input
#                                        alone)
#   the microsoft-store environment's, which only microsoft-store-submission
#   (and the microsoft-store-submission workflow) reads:
#              MICROSOFT_STORE_TENANT_ID the Microsoft Entra tenant of the
#                                        Partner Center account (secret; Entra
#                                        admin center, Overview of the tenant)
#              MICROSOFT_STORE_CLIENT_ID the application (client) ID of the
#                                        Entra app registration that Partner
#                                        Center lists with the Manager role
#                                        (secret; Partner Center, Account
#                                        settings, User management,
#                                        Microsoft Entra applications)
#              MICROSOFT_STORE_CLIENT_SECRET
#                                        a client secret of that registration
#                                        (secret; Entra admin center, the
#                                        registration's Certificates &
#                                        secrets), renewed before it expires
#              MICROSOFT_STORE_SELLER_ID the seller ID, a number (variable;
#                                        Partner Center, Account settings,
#                                        Legal info)
#              MICROSOFT_STORE_PRODUCT_ID
#                                        the listing's Store ID (variable;
#                                        Partner Center, the app's overview)
#                                        The tenant ID, the client ID and the
#                                        client secret reach curl on its
#                                        standard input alone; each setting is
#                                        refused, named, when unset on a dry
#                                        run and a real publish alike.
#
# Before AGGREGA_WINGET_PULL_REQUEST is set to true, once:
#   1. fork microsoft/winget-pkgs into this organization, keeping the name
#      winget-pkgs, the name open-winget-pull-request's env: gives the fork;
#   2. as a member of this organization who may push to that fork, create a
#      personal access token (classic) with the public_repo scope and no other,
#      in GitHub's Settings, Developer settings, Personal access tokens, Tokens
#      (classic), with an expiry, renewing it before it expires; the
#      organization's policy must not restrict personal access tokens (classic);
#   3. store it as the secret WINGET_PULL_REQUEST_TOKEN of the release
#      environment;
#   4. with the account that created it, sign Microsoft's Contributor License
#      Agreement, https://cla.opensource.microsoft.com, which winget-pkgs' pull
#      request template asks every author to have signed: that account is the
#      author of each pull request the release opens;
#   5. set the repository variable AGGREGA_WINGET_PULL_REQUEST to true.
# A manual dry run then prints the pull request a real publish would open and
# checks the token.

on:
  # A release tag is the trigger and the human gate: a person decides the version
  # and pushes the tag. The pattern matches a vMAJOR.MINOR.PATCH tag; a
  # pre-release suffix is intentionally excluded from automatic publishing. The
  # git tag is v-prefixed; the build stamps a v-less version onto the binary,
  # image, and plugins.
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Check the stored registry credential, build everything a release carries (the tooling image and the extension package included), generate the entities, and print the publish plan without pushing the image, publishing, signing, or creating a release; the jobs a pre-release tag does not skip mint each App's token, using it for nothing, and check the winget token. Dispatch it from a release/* branch or a v* tag, the refs the release environment admits, and before a release from release/vX.Y.Z, the release's own branch: from any other ref nothing is checked out, built, signed or published."
        required: false
        default: true
        type: boolean
      tag:
        description: "The release tag (vMAJOR.MINOR.PATCH) to build and publish on a manual run; required for a real manual publish, ignored on a tag push (which uses the pushed tag)."
        required: false
        default: ""
        type: string
      smoke_binaries_from:
        description: "Dry run only: the tag of an earlier release whose Windows binaries the Windows smoke job runs in place of this run's own, reporting every check's verdict, to show which checks they fail. The smoke run then never passes."
        required: false
        default: ""
        type: string

# Every job reads this repository and nothing more unless it says otherwise
# below. sign-windows and sign-windows-installer add
# id-token:write, which lets each mint the short-lived OIDC identity token
# Microsoft Entra ID exchanges for the token that signs the Windows binaries, the
# installer's program files and the installer, so no signing secret is stored.
# sign-and-publish adds id-token:write, which lets it mint the short-lived OIDC
# identity token keyless signing needs (no offline key is stored; the artifacts
# publish to the public hub, so recording them in the public transparency log is
# expected, not a leak), and contents:write, which lets it create the GitHub
# release and upload the built binaries as release assets on this repository.
# contents:write grants no other git write: the workflow never creates or pushes
# a tag. attest adds id-token:write, which lets it mint the short-lived OIDC
# identity token its Sigstore certificate is issued for; attestations:write,
# which lets it store the attestation it signs with this repository's
# attestations, where gh attestation verify finds it; and
# artifact-metadata:write, the third grant GitHub's attest action asks for,
# which lets it record where an attested container image is stored (it attests
# files here, for which it records none). clean-up replaces it with
# actions:write alone, which lets it list and delete this run's artifacts and
# does not let it read the repository. sign-macos takes nothing, not even
# contents:read: it checks nothing out, and the artifact download and upload it
# runs reach this run's artifacts without the run's token.
# notarization-check takes nothing either, for the same reasons.
# record-published keeps contents:read: what it writes is aggrega-hub's published
# branch, with the App token it mints, never this repository; so does
# publish-skills, which writes aggrega-skills with the App token it mints, and
# publish-package-channels, which writes the Homebrew tap and the Scoop bucket
# with the App token it mints, and open-winget-pull-request, which writes the
# organization's fork of microsoft/winget-pkgs and opens the pull request with
# the personal access token it is given, and publish-downloads, which reads the
# release with the run's own token and writes the download bucket with the R2
# key pair it is given, and microsoft-store-submission, which writes the
# Microsoft Store listing's draft with the Entra credentials it is given, never
# this repository.
# sources keeps contents:read too: it reads aggrega-hub with the run's own token.
permissions:
  contents: read

# The hand-over folder's name and its key, this run and this attempt: the one
# statement of it. Each job on the runner AGGREGA_RUNNER names finds the folder
# at "$(dirname "$RUNNER_TEMP")/$RELEASE_HANDOVER", beside the runner's
# temporary directory — the runner's work directory — since the runner empties
# the temporary directory itself at the start and end of every job.
env:
  RELEASE_HANDOVER: aggrega-release-handover/${{ github.run_id }}-${{ github.run_attempt }}
  # The Homebrew tap's and the Scoop bucket's repository names, in this
  # repository's owner: the one statement of them, which
  # publish-package-channels commits to and the release notes tell users to
  # install from.
  HOMEBREW_TAP_REPOSITORY: homebrew-tap
  SCOOP_BUCKET_REPOSITORY: scoop-bucket

jobs:
  registry-credential:
    # A hosted runner, as the other publishers' credential checks run: the job is
    # one request, and it holds the registry password in a job that runs no
    # third-party code. It is the run's first job, so it is also where a run with
    # no runner for the local jobs stops, and where the run decides whether it
    # signs the Windows binaries, and the macOS ones. It names the release
    # environment, so on a run from a ref that environment does not admit it
    # fails before any of its steps runs, and every other job but clean-up is
    # skipped.
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read

    # signing: whether this run signs the Windows binaries, sign or skip, as the
    # decision step below wrote it and the guard step after it let it stand.
    # sign-windows, windows-installer, sign-windows-installer and windows-smoke
    # read it. macos_signing: what that decision means for the macOS binaries,
    # with the repository variable AGGREGA_MACOS_SIGNING — sign, on sign with
    # the variable true; unsigned, on sign with it anything else, when the
    # release ships them unsigned; skip, on skip. sign-macos, macos-smoke and
    # sign-and-publish read it. Each names this job in its needs for that.
    outputs:
      signing: ${{ steps.signing.outputs.signing }}
      macos_signing: ${{ steps.macos-signing.outputs.macos_signing }}

    steps:
      - name: Require the runner the local jobs share
        # sources, build, sign-windows, sign-and-publish, record-published and
        # clean-up hand files to each other on one machine's disk, so the release
        # runs only where AGGREGA_RUNNER names that machine; with it unset the run
        # stops here, before anything is checked out or built, rather than falling
        # back to a hosted runner or to artifacts.
        env:
          AGGREGA_RUNNER: ${{ vars.AGGREGA_RUNNER }}
        run: |
          set -euo pipefail
          if [ -z "$AGGREGA_RUNNER" ]; then
            echo "publish-plugins: the release needs its self-hosted runner: set the repository variable AGGREGA_RUNNER to that runner's label, since the sources, build, signing, publishing, recording and clean-up jobs hand files to each other on its disk" >&2
            exit 1
          fi
          echo "publish-plugins: the sources, build, signing, publishing, recording and clean-up jobs run on the runner labelled $AGGREGA_RUNNER"

      - name: Check out the CLI
        # Only for the scripts the steps below run. The launched ref, not the
        # release tag: a dispatch naming an earlier tag still runs them from the
        # launched ref.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: aggrega-cli
          persist-credentials: false

      - name: Decide whether this run signs the Windows and macOS binaries
        # From the event, the dry_run input and the ref alone, before anything
        # is built or signed: sign on every run but a manual dry run launched
        # from a ref the signing identity is taken not to admit, which is skip.
        # The refs it is taken to admit are written once, in the script; every
        # ref it leaves out is one the release environment, which this job
        # names, does not admit, so no run that reaches this step decides skip.
        # On skip, sign-windows and sign-macos are skipped and windows-smoke and
        # macos-smoke run the unsigned binaries the build wrote; no signing has
        # happened yet, so a signing that failed can never be what decided it.
        # The script speaks of the Windows binaries; the step after the guard
        # decides what it means for the macOS ones.
        id: signing
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_DRY_RUN: ${{ inputs.dry_run }}
          RUN_REF: ${{ github.ref }}
        run: |
          aggrega-cli/.github/scripts/windows-signing.sh decide \
            --event "$EVENT_NAME" --dry-run "$DISPATCH_DRY_RUN" --ref "$RUN_REF"

      - name: Refuse to leave the Windows binaries unsigned on a run that publishes
        # The decision as the jobs after this one read it, held to the one
        # property that keeps an unsigned Windows binary from a release: skip
        # stands only on a workflow_dispatch with dry_run true, and any other
        # value, an empty one included, is refused. The script reads the event
        # and the input itself rather than trusting the step above, so a
        # decision gone wrong stops the run here, before anything is built,
        # signed or published, and a tag push or a dispatch that publishes
        # always signs the Windows binaries.
        env:
          SIGNING: ${{ steps.signing.outputs.signing }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          aggrega-cli/.github/scripts/windows-signing.sh guard \
            --signing "$SIGNING" --event "$EVENT_NAME" --dry-run "$DISPATCH_DRY_RUN"

      - name: Decide whether this run signs the macOS binaries
        # From the decision the guard above let stand and the repository
        # variable AGGREGA_MACOS_SIGNING, which switches macOS signing on: sign
        # when the decision is sign and the variable is true; unsigned when the
        # decision is sign and the variable is anything else, unset included —
        # sign-macos is skipped, macos-smoke runs the binaries as the build wrote
        # them, and sign-and-publish releases them so, saying so in the release
        # notes; skip when the decision is skip, as for the Windows binaries.
        # Any outcome but sign is printed and written to the run's summary, so
        # a release never ships the macOS binaries unsigned silently.
        id: macos-signing
        env:
          SIGNING: ${{ steps.signing.outputs.signing }}
          AGGREGA_MACOS_SIGNING: ${{ vars.AGGREGA_MACOS_SIGNING }}
        run: |
          set -euo pipefail
          case "$SIGNING" in
            sign)
              if [ "$AGGREGA_MACOS_SIGNING" = true ]; then
                macos=sign
                line="this run signs the macOS binaries and submits them to Apple for notarization, in sign-macos, and reads Apple's answer in notarization-check"
              else
                macos=unsigned
                line="the macOS binaries are not signed or notarized: the repository variable AGGREGA_MACOS_SIGNING is not true, so sign-macos is skipped, macos-smoke runs them as the build wrote them, and the release ships them so"
              fi
              ;;
            skip)
              macos=skip
              line="this run leaves the macOS binaries unsigned too: sign-macos is skipped, and macos-smoke runs them as the build wrote them, its signature check not applicable"
              ;;
            *)
              echo "publish-plugins: the signing decision is '$SIGNING', neither sign nor skip" >&2
              exit 1
              ;;
          esac
          printf 'macos_signing=%s\n' "$macos" >> "$GITHUB_OUTPUT"
          echo "publish-plugins: $line"
          if [ "$macos" != sign ]; then
            printf -- '- %s\n' "${line^}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check the stored registry credential
        # One GET /v2/ with the stored credential, before anything is built;
        # anything but 200 fails, naming the settings to check and reporting only
        # the HTTP status. An empty password or username is refused before any
        # request. The credential is read from the environment, never placed on a
        # command line or interpolated into the script. The placeholder registry
        # default names a host that never resolves, so an unset variable fails the
        # check, which names the variable.
        env:
          REGISTRY: ${{ vars.CLI_PUBLISH_REGISTRY || 'registry.invalid' }}
          REGISTRY_USERNAME: ${{ vars.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          aggrega-cli/.github/scripts/registry-gate.sh credential \
            --registry-url "https://$REGISTRY" \
            --registry-setting CLI_PUBLISH_REGISTRY \
            --username-setting REGISTRY_USERNAME \
            --password-setting REGISTRY_PASSWORD

  sources:
    needs: registry-credential
    # aggrega-hub, whose overlays the build reads, is a public repository, read
    # with the run's own token. This job runs nothing but GitHub's own checkout
    # action, git and the shell's own utilities. It moves the CLI tree onto the
    # release tag, resolves the aggrega-hub commit the run reads, checks
    # aggrega-hub out there, and
    # hands the checkout, which keeps no token, to the build job in this run's
    # hand-over folder, with a SHA-256 list of every file in it. It makes the
    # folder.
    #
    # The self-hosted runner AGGREGA_RUNNER names, with no hosted fallback: the
    # build job takes the checkout from that machine's disk.
    runs-on: ${{ vars.AGGREGA_RUNNER }}
    permissions:
      contents: read

    # The commit the build job checks out and builds: the release tag's on a tag
    # push or a dispatch naming a tag, otherwise the commit the run was launched
    # at. And the aggrega-hub commit this job checked out, which the build job
    # hands on to record-published, so both read the same aggrega-hub commit.
    outputs:
      commit: ${{ steps.pinned.outputs.commit }}
      hub_commit: ${{ steps.hub-commit.outputs.commit }}

    env:
      # The schemas, abi and pdk modules are NOT configured here: the CLI's own
      # go.mod is the single source for their versions, and the build resolves
      # them from it. aggrega-hub carries no CLI-side version pin; the step that
      # resolves its commit says where that commit comes from.
      # Event data surfaced as env so run scripts read it from the environment
      # rather than interpolating expressions into shell.
      EVENT_NAME: ${{ github.event_name }}
      # The release tag requested by a manual dispatch (empty on a tag push).
      DISPATCH_TAG: ${{ inputs.tag }}
      # The pushed ref name (the tag on a push event).
      REF_NAME: ${{ github.ref_name }}

    steps:
      - name: Require a tag for a real manual publish
        # A real manual publish (a dispatch that is not a dry run) targets a past
        # release tag, so it MUST name one. Fail fast here, before anything is
        # checked out or built, when the tag input is empty. A manual dry run
        # needs no tag: it builds the checked-out CLI tree as-is and prints the
        # plan.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == false && inputs.tag == '' }}
        run: |
          set -euo pipefail
          echo "publish-plugins: a manual publish requires the tag input (vMAJOR.MINOR.PATCH)" >&2
          exit 2

      - name: Refuse substituted smoke binaries on a real publish
        # smoke_binaries_from has windows-smoke prove an earlier release's
        # binaries rather than the ones this run builds, so it proves nothing
        # about what a publish would ship: a dispatch that would publish is
        # refused for naming one, here, before anything is checked out or built.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == false && inputs.smoke_binaries_from != '' }}
        run: |
          set -euo pipefail
          echo "publish-plugins: smoke_binaries_from runs only on a dry run (dry_run=true)" >&2
          exit 2

      - name: Check out the CLI with full history and tags
        # For the release tag's tree, which the build job builds, and for the
        # smoke library's SHA-256 list writer. Full history and every tag are
        # fetched here, so the pin step below needs no fetch of its own.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: aggrega-cli
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Pin the CLI tree to the release tag
        # Move the CLI tree onto the release tag so the commit recorded below,
        # which the build job checks out and stamps the released version from, is
        # the tag's. On a
        # manual dispatch that supplies a tag input the run targets a past
        # release. The effective tag is the pushed tag (push) or the tag input
        # (dispatch). A manual dry run with no tag input skips this and builds the
        # checked-out tree as-is. The checkout above fetched every tag and kept no
        # credential, so this moves the tree without contacting the remote.
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.tag != '') }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            TAG="$REF_NAME"
          else
            TAG="$DISPATCH_TAG"
          fi
          git -C aggrega-cli checkout --force "refs/tags/${TAG}"

      - name: Record the commit this run builds
        # The build job checks out exactly this commit, whose go.mod names the
        # sibling module versions the build resolves, and sign-and-publish runs
        # its publishing scripts from it.
        id: pinned
        run: |
          set -euo pipefail
          commit="$(git -C aggrega-cli rev-parse HEAD)"
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
          echo "this run builds aggrega-cli at $commit"

      - name: Resolve the aggrega-hub ref this run reads
        # Resolved once, here: the repository variable CLI_PUBLISH_HUB_REF when
        # it is set; otherwise the aggrega-hub commit .github/release-hub-commit
        # names at the commit this run builds, where a release records the
        # aggrega-hub commit it checked, so a dry run and the tag's run of the
        # same commit read the same overlays; otherwise main. The file holds one
        # line, the commit's 40 lowercase hexadecimal digits; a file holding
        # anything else fails the job, naming it.
        id: hub-ref
        env:
          HUB_REF_VARIABLE: ${{ vars.CLI_PUBLISH_HUB_REF }}
          COMMIT: ${{ steps.pinned.outputs.commit }}
        run: |
          set -euo pipefail
          file=.github/release-hub-commit
          if [ -n "$HUB_REF_VARIABLE" ]; then
            ref="$HUB_REF_VARIABLE"
            from="the repository variable CLI_PUBLISH_HUB_REF"
          elif git -C aggrega-cli cat-file -e "$COMMIT:$file" 2>/dev/null; then
            git -C aggrega-cli show "$COMMIT:$file" > "$RUNNER_TEMP/release-hub-commit"
            lines="$(awk 'END { print NR }' "$RUNNER_TEMP/release-hub-commit")"
            ref="$(head -n 1 "$RUNNER_TEMP/release-hub-commit")"
            if [ "$lines" -ne 1 ] || ! printf '%s\n' "$ref" | grep -Eqx '[0-9a-f]{40}'; then
              echo "publish-plugins: $file at $COMMIT must hold exactly one line, an aggrega-hub commit as 40 lowercase hexadecimal digits; it holds $lines line(s), the first reading '$ref'" >&2
              exit 1
            fi
            from="$file at $COMMIT"
          else
            ref=main
            from="neither CLI_PUBLISH_HUB_REF nor $file at $COMMIT names one"
          fi
          printf 'ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"
          echo "this run reads aggrega-hub at $ref: $from"

      - name: Check out the hub sibling
        # Supplies the authored plugin overlays (OVERLAY_DIR) that catalog
        # generation consumes, that the embedded plugin entities are generated
        # from, and that the embedded-overlay consistency check reads. The CLI's
        # other sibling modules — the schemas, the Go plugin kit and the Go ABI —
        # are resolved by the build at the versions its go.mod requires, so no
        # checkout of them is needed. aggrega-hub has no CLI-side version pin,
        # so it is checked out at the ref the step above resolved. The repository
        # is public: the run's own token reads it. The checkout keeps no
        # credential in its git configuration, and the hand-over step below
        # refuses to hand one over.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: aggrega-ai/aggrega-hub
          path: aggrega-hub
          ref: ${{ steps.hub-ref.outputs.ref }}
          persist-credentials: false

      - name: Record the aggrega-hub commit this run reads
        # The commit the checkout above holds, which record-published checks out
        # for aggrega-hub's writer, so that job reads what this one resolved.
        id: hub-commit
        run: |
          set -euo pipefail
          commit="$(git -C aggrega-hub rev-parse HEAD)"
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
          echo "this run reads aggrega-hub at commit $commit"

      - name: Make this run's hand-over folder
        # The folder in which this run's jobs on the self-hosted runner hand files
        # to each other, beside the runner's temporary directory, which the runner
        # empties when this job ends. It is made here, by the first job that
        # writes into it, readable by the runner's user alone, and refused if it
        # already exists; the root that holds every run's folder must be that
        # user's own, and is kept readable by them alone. clean-up removes the
        # folder when the run ends.
        run: |
          set -euo pipefail
          [ -n "$RELEASE_HANDOVER" ] || { echo "publish-plugins: RELEASE_HANDOVER is empty" >&2; exit 1; }
          handover="$(dirname "$RUNNER_TEMP")/$RELEASE_HANDOVER"
          root="$(dirname "$handover")"
          mkdir -p "$root"
          if [ ! -O "$root" ]; then
            echo "publish-plugins: $root, which holds the hand-over folders, is not owned by the runner's user" >&2
            exit 1
          fi
          chmod 0700 "$root"
          if ! mkdir -m 0700 "$handover"; then
            echo "publish-plugins: this run's hand-over folder $handover already exists; a run attempt makes its own once" >&2
            exit 1
          fi
          printf 'HANDOVER=%s\n' "$handover" >> "$GITHUB_ENV"
          echo "hand-over folder: $handover"

      - name: Hand the aggrega-hub checkout to the build job
        # Moves the aggrega-hub checkout into the hand-over folder's sources/,
        # refused if its git configuration still carries an authorization header,
        # so no token reaches the build job with it; then writes the folder's
        # SHA-256 list, through the smoke library's one writer of it, which the
        # build job holds the checkout to before it takes it.
        run: |
          set -euo pipefail
          mkdir "$HANDOVER/sources"
          for repo in aggrega-hub; do
            config="$GITHUB_WORKSPACE/$repo/.git/config"
            if [ ! -f "$config" ]; then
              echo "publish-plugins: $GITHUB_WORKSPACE/$repo holds no checkout to hand over" >&2
              exit 1
            fi
            if git config --file "$config" --get-regexp '^http\..*\.extraheader$' >/dev/null; then
              echo "publish-plugins: the checkout of $repo still carries an authorization header in its git configuration; it is not handed over" >&2
              exit 1
            else
              status=$?
              if [ "$status" != 1 ]; then
                echo "publish-plugins: could not read $config (git config exited $status)" >&2
                exit 1
              fi
            fi
            mv -- "$GITHUB_WORKSPACE/$repo" "$HANDOVER/sources/$repo"
          done
          . aggrega-cli/scripts/lib/platform-smoke-common.sh
          smoke_require_bash
          smoke_write_tree_sums "$HANDOVER"

  build:
    needs: sources
    # The self-hosted runner AGGREGA_RUNNER names, with no hosted fallback:
    # building the embedded guests is heavy, the aggrega-hub checkout this job
    # builds with is the one the sources job left on that machine's disk,
    # and sign-windows, windows-installer and sign-and-publish read what this
    # job builds from that disk, in the hand-over folder. Every later step that needs this build's
    # outputs reads them in this job, from the hand-over folder, or, on a
    # GitHub-hosted runner, from the artifacts it uploads.
    runs-on: ${{ vars.AGGREGA_RUNNER }}
    permissions:
      contents: read

    # The commit this job built — the one the sources job recorded — which sign-windows, windows-installer,
    # sign-windows-installer and sign-and-publish check out for their
    # scripts, and the commits the Windows, the macOS and the ARM Linux smoke
    # inputs were staged from, which the windows-smoke, macos-smoke and
    # linux-smoke jobs check out: on a dispatch naming a tag the tree is moved onto
    # that tag, so the commit the run was launched at may not be it. And the
    # version the binaries report, which windows-installer records in the
    # installer. And the SHA-256 of the list of the unsigned macOS binaries this
    # job uploads, which sign-macos, checking nothing out, holds that list to
    # before it holds the binaries to the list. And the aggrega-hub commit the
    # sources job checked out, which record-published checks out for
    # aggrega-hub's writer.
    outputs:
      commit: ${{ needs.sources.outputs.commit }}
      hub_commit: ${{ needs.sources.outputs.hub_commit }}
      smoke_commit: ${{ steps.windows-smoke-inputs.outputs.commit }}
      macos_smoke_commit: ${{ steps.macos-smoke-inputs.outputs.commit }}
      linux_smoke_commit: ${{ steps.linux-smoke-inputs.outputs.commit }}
      version: ${{ steps.installer-parts.outputs.version }}
      macos_unsigned_sums: ${{ steps.macos-unsigned.outputs.sums }}

    # No secret appears anywhere in this job: it runs third-party build code,
    # so it holds no registry, signing or repository credential beyond the
    # run's own read token, and builds with the checkout the sources job handed
    # over.
    env:
      # Destination registry host, a variable rather than a secret: the tooling
      # image is built under its references, and the archives carry them to the
      # job that pushes them.
      REGISTRY: ${{ vars.CLI_PUBLISH_REGISTRY || 'registry.invalid' }}
      # Authored per-plugin overlay directory that catalog generation merges with
      # each guest's machine-derived contract fields. This is a REQUIRED input: the
      # overlays supply the OCI identity, runtime limits, and provider block that
      # the guests deliberately do not carry, and the generate step halts, naming
      # the guest, when one has no overlay. Each overlay's plugin identity must
      # name a guest present in the decompressed guest set below (the publish
      # pairs them by that identity). The overlays live in the aggrega-hub sibling
      # checkout.
      OVERLAY_DIR: ${{ vars.CLI_PUBLISH_OVERLAY_DIR || 'aggrega-hub/plugin-overlays' }}
      # Event data surfaced as env so run scripts read it from the environment
      # rather than interpolating expressions into shell.
      EVENT_NAME: ${{ github.event_name }}
      # The release tag requested by a manual dispatch (empty on a tag push).
      DISPATCH_TAG: ${{ inputs.tag }}
      # The pushed ref name (the tag on a push event), for the tag-equals-version
      # assertion.
      REF_NAME: ${{ github.ref_name }}
      # The image that registers ARM emulation for the tooling image's ARM half,
      # pinned by its digest (the tag beside it names the release it was read
      # from): the emulation step runs it, privileged, and the step after the
      # image build removes it from the machine's image store.
      BINFMT_IMAGE: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

    steps:
      # Nothing in this job has an external side effect: it builds, validates and
      # stages. A failure anywhere below halts the run before sign-and-publish, so
      # no image, plugin, or release is ever produced from an unvalidated build.

      - name: Give aggrega a configuration of this run's own
        # On the persistent self-hosted runner AGGREGA_RUNNER names, the
        # runner's user may keep a global aggrega configuration of their own,
        # and every aggrega command reads it: a registry, a trust setting, a CLI
        # plugin or an offline posture recorded there would shape what this
        # run builds. So every aggrega command in this job reads its global
        # configuration from a directory made empty here, the way the platform
        # smoke runs keep the machine's configuration out: XDG_CONFIG_HOME names
        # the directory, and AGGREGA_CONFIG, which would name a file in its
        # place, is emptied, which aggrega reads as unset. Other programs that
        # look for their settings under XDG_CONFIG_HOME, Go and Git among them,
        # find none there either. The machine-wide caches are not configuration
        # and stay where they are. RUN_CONFIG_HOME names the directory too, so
        # the last step removes this run's directory and never one that
        # XDG_CONFIG_HOME named before this step.
        run: |
          set -euo pipefail
          config_home="$(mktemp -d "$RUNNER_TEMP/config-home.XXXXXX")"
          printf 'RUN_CONFIG_HOME=%s\nXDG_CONFIG_HOME=%s\nAGGREGA_CONFIG=\n' \
            "$config_home" "$config_home" >> "$GITHUB_ENV"

      - name: Check out the CLI at the commit the sources job recorded
        # This workflow runs in the CLI repository; check it out into aggrega-cli/
        # so its build driver and manifests sit under that path, at exactly the
        # commit the sources job recorded — the release tag's, whenever one is in
        # play.
        # Full history and every tag are fetched here, so the build stamps the
        # release version from the tag. The build resolves the sibling modules at
        # the versions its go.mod requires; the next step places the handed-over
        # aggrega-hub checkout beside it, for the embedded plugin entities and
        # the catalog generation.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: aggrega-cli
          ref: ${{ needs.sources.outputs.commit }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Take the aggrega-hub checkout from the hand-over folder
        # The aggrega-hub checkout the sources job left in this run's hand-over folder,
        # on this machine, are used only once every file there is one the
        # folder's list names, each once, with the SHA-256 it gives, and the list
        # names nothing else — so a file changed, added or removed since the
        # sources job wrote the list is refused before anything is built from it.
        # The list is read through the smoke library from this job's own
        # checkout. The checkout is then moved beside the CLI, in place of
        # whatever an earlier run left at that path on the persistent runner,
        # the list is removed, since it described a hand-over now taken, and the
        # folder must then be empty, for the build to write into. A folder that
        # is not here means the sources job ran on another machine or in another
        # attempt, and is refused.
        run: |
          set -euo pipefail
          [ -n "$RELEASE_HANDOVER" ] || { echo "publish-plugins: RELEASE_HANDOVER is empty" >&2; exit 1; }
          handover="$(dirname "$RUNNER_TEMP")/$RELEASE_HANDOVER"
          if [ ! -d "$handover" ] || [ ! -O "$handover" ] || [ ! -f "$handover/SHA256SUMS" ]; then
            echo "build: this run's hand-over folder $handover, with its list, is not on this machine: the sources job of this run attempt left none here. sources, build, sign-windows, sign-and-publish, record-published and clean-up run on the one machine AGGREGA_RUNNER names, in one attempt; re-run every job, not only the failed ones" >&2
            exit 1
          fi
          . aggrega-cli/scripts/lib/platform-smoke-common.sh
          smoke_require_bash
          smoke_check_tree_sums "$handover"
          for repo in aggrega-hub; do
            if [ -e "$GITHUB_WORKSPACE/$repo" ]; then
              chmod -R u+w -- "$GITHUB_WORKSPACE/$repo" 2>/dev/null || true
              rm -rf -- "${GITHUB_WORKSPACE:?}/$repo"
            fi
            mv -- "$handover/sources/$repo" "$GITHUB_WORKSPACE/$repo"
          done
          rmdir -- "$handover/sources"
          rm -f -- "$handover/SHA256SUMS"
          if [ -n "$(find "$handover" -mindepth 1 -print -quit)" ]; then
            echo "build: the hand-over folder $handover holds more than the sources job's checkout:" >&2
            find "$handover" -mindepth 1 -printf '  %P\n' >&2
            exit 1
          fi
          printf 'HANDOVER=%s\n' "$handover" >> "$GITHUB_ENV"
          echo "build: took aggrega-hub from $handover, each file as the sources job listed it"

      - name: Check that the version recipe has one home
        # The binary, the embedded guests' self-reported version, the plugin
        # entities generated from them and the desktop extension package are
        # each stamped by a different build script, and a release ships them
        # together. They agree only while every one of those scripts takes the
        # version from the one shared recipe; a script that derived it by its
        # own git invocation could ship a release whose outputs disagree on
        # their version. The check refuses, naming each offending script and
        # line, when a stamping script does not source the shared recipe or
        # derives the version inline. It sits after the checkout of the commit
        # the sources job recorded, so it judges the tree this run builds, and
        # before the build, so a forked recipe halts the run before anything is
        # stamped. It reads only the CLI tree, with no toolchain and no network,
        # so it needs nothing the later steps install. It runs on a dry run too.
        run: |
          set -euo pipefail
          aggrega-cli/scripts/check-version-single-source.sh

      - name: Check that the third-party attribution is current
        # The third-party notices the binary prints, and the licence texts,
        # SBOM and index beside them, are generated from the Go module graph,
        # the embedded Rust plugins' lockfiles, the embedded rows of the
        # core-plugin list and the generator itself, and the generator records a
        # digest of those inputs. A release must not ship notices that describe
        # a dependency set other than the one it builds. The check refuses,
        # naming both digests and the command that regenerates, when the
        # recorded digest is not the one the tree gives, or when the notices
        # embedded in the binary differ from the committed file. It sits after
        # the checkout of the commit the sources job recorded, so it judges the
        # tree this run builds, and before the build, so stale notices halt the
        # run before anything is stamped. It only hashes files of the CLI tree,
        # with no toolchain and no network, so it needs nothing the later steps
        # install. It runs on a dry run too.
        run: |
          set -euo pipefail
          aggrega-cli/scripts/check-third-party-licenses.sh

      - name: Set up Go
        # Pin the toolchain to the (tag-pinned) module's declared version.
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: aggrega-cli/go.mod
          # setup-go's cache of GOMODCACHE and GOCACHE is off: this job builds
          # what the release publishes, so it restores nothing from the Actions
          # cache, which other workflow runs can write. On the persistent
          # self-hosted runner this job runs on, both stay on the machine's disk
          # between runs regardless.
          cache: false

      - name: Check that the committed skills repository is what the skills generate
        # publish-skills publishes the tree committed at
        # internal/skills/repository, at the commit this job builds, to the
        # public aggrega-skills repository, so that tree must be exactly what the
        # skills package's generator writes — the skills built into the binary
        # and the plugin manifests beside them: the generator writes the tree
        # into a folder of its own here, and any file missing,
        # added or different stops the run before anything is published, naming
        # the difference. The comparison runs here, in a job that names no secret,
        # because the generator is compiled from the module, which reaches its
        # dependencies' build logic; publish-skills, which holds the token that
        # writes aggrega-skills, compiles nothing and pushes this commit's tree.
        run: |
          set -euo pipefail
          generated="$(mktemp -d "$RUNNER_TEMP/skills-repository.XXXXXX")"
          trap 'rm -rf -- "$generated"' EXIT
          (cd aggrega-cli && GOWORK=off go run ./internal/skills/genrepository -out "$generated")
          if ! diff -r aggrega-cli/internal/skills/repository "$generated"; then
            echo "build: aggrega-cli/internal/skills/repository, which publish-skills publishes to aggrega-skills, is not what the skills built into the binary generate (the differences are above); run go generate ./internal/skills in aggrega-cli and commit the result" >&2
            exit 1
          fi
          echo "build: aggrega-cli/internal/skills/repository is what the skills built into the binary generate"

      - name: Install the Rust toolchains the guests pin
        # Building the CLI regenerates its core guests, and each Rust guest pins
        # one exact toolchain in its rust-toolchain.toml, with every target it is
        # compiled for: the guest build compiles it with that release and refuses
        # any other, so a guest published from here is byte-identical to the same
        # commit built anywhere else. The installer reads the pins from the tree,
        # puts a pinned and verified rustup of its own under the runner's
        # temporary directory, and sets RUSTUP_HOME, CARGO_HOME and the path for
        # every step after this one (see its --help).
        run: aggrega-cli/scripts/install-guest-rust-toolchains.sh --github-env "$RUNNER_TEMP/rust"

      - name: Build the binary and embedded guests
        # Regenerates the Wasm guests and their descriptors and produces the
        # version-stamped binary with the guests embedded, twice:
        # aggrega-cli/aggrega-debug as the linker writes it, with its debug
        # information, and aggrega-cli/aggrega, that binary without it, which
        # every later step that runs the binary runs, the tooling image carries
        # for linux/amd64 and the release attaches under the plain name. NOT the
        # light build — the light binary embeds no guests and could neither generate the core
        # entities nor supply the guests to publish. Scoped to aggrega-cli:
        # publishing needs only the binary and its embedded guests, not the PDK
        # packages, so an unrelated PDK build issue cannot block a publish (and
        # the run is faster).
        run: |
          set -euo pipefail
          aggrega-cli/scripts/build.sh

      - name: Build the light binary for the release
        # The light no-embed binary ships as a downloadable release asset beside
        # the default and debug binaries. It embeds no Wasm guests (-tags light)
        # and resolves every provider through the plugin cascade, so it plays no
        # part in image or plugin publishing — it is built here purely for the
        # GitHub release. Built alongside the embedded build so a light-build
        # failure halts before any external side effect. The output is
        # aggrega-cli/aggrega-light, beside aggrega-cli/aggrega and
        # aggrega-cli/aggrega-debug.
        run: |
          set -euo pipefail
          aggrega-cli/scripts/build.sh --light

      - name: Assert ABI self-consistency
        # A real gate, not a comment: the binary reports the single ABI version its
        # host speaks, and every core guest — embedded or not — self-reports the
        # ABI it binds against in its build descriptor, which the build wrote in
        # the guest's own artifact directory. The descriptors read are the ones
        # the core-plugin list names, through its one reader, so a guest the list
        # names whose descriptor is missing fails here too. If any guest disagrees
        # with the host, or any value is empty, the generated catalog entities
        # would advertise an ABI the binary cannot honor — so the run fails here,
        # before generating or publishing anything. Whenever a release tag is in
        # play — a tag push, or a manual dispatch that supplied a tag input — the
        # binary's stamped version must also equal that tag; a mismatch means the
        # build did not stamp the release and the run fails. It needs only the
        # built binary and its guests, no registry and no image.
        run: |
          set -euo pipefail

          VERSION_JSON="$(aggrega-cli/aggrega version -o json)"
          # Whitespace is stripped before the match so the extraction is insensitive to
          # the pretty-printer, and it needs no jq. Stripping the whole payload is safe
          # only where the extracted value contains no whitespace, which holds for the
          # version and ABI version strings read here.
          HOST_ABI="$(printf '%s' "$VERSION_JSON" | tr -d '[:space:]' | grep -o '"abiVersion":"[^"]*"' | head -1 | cut -d'"' -f4)"
          BIN_VERSION="$(printf '%s' "$VERSION_JSON" | tr -d '[:space:]' | grep -o '"version":"[^"]*"' | head -1 | cut -d'"' -f4)"
          [ -n "$HOST_ABI" ] || { echo "ABI gate: binary reported no abiVersion" >&2; exit 1; }

          . aggrega-cli/scripts/lib/core-plugins.sh
          rows="$(core_plugin_rows)"
          descriptors=()
          while IFS=$'\x1f' read -r socket name _src _toolchain _extra _embed dir; do
            [ -n "$socket" ] || continue
            descriptors+=("aggrega-cli/$dir/$name.describe.json")
          done <<< "$rows"
          [ "${#descriptors[@]}" -gt 0 ] || { echo "ABI gate: the core-plugin list names no guest" >&2; exit 1; }

          mismatch=0
          for d in "${descriptors[@]}"; do
            if [ ! -f "$d" ]; then
              echo "ABI gate: no guest descriptor at $d — the guest build did not run for it" >&2
              mismatch=1
              continue
            fi
            guest_abi="$(grep -oE '"abi_version"[[:space:]]*:[[:space:]]*"[^"]+"' "$d" | head -1 | grep -oE '"[^"]+"$' | tr -d '"')"
            if [ -z "$guest_abi" ]; then
              echo "ABI gate: $d reports no abi_version" >&2
              mismatch=1
            elif [ "$guest_abi" != "$HOST_ABI" ]; then
              echo "ABI gate: $d reports abi_version '$guest_abi' but the binary speaks '$HOST_ABI'" >&2
              mismatch=1
            fi
          done
          [ "$mismatch" -eq 0 ] || { echo "ABI gate: host/guest ABI mismatch — refusing to generate or publish" >&2; exit 1; }

          if [ "$EVENT_NAME" = "push" ]; then
            TAG="$REF_NAME"
          else
            TAG="$DISPATCH_TAG"
          fi
          if [ -n "$TAG" ]; then
            EXPECTED="${TAG#v}"
            if [ "$BIN_VERSION" != "$EXPECTED" ]; then
              echo "ABI gate: binary version '$BIN_VERSION' does not equal the release tag '$EXPECTED'" >&2
              exit 1
            fi
          fi

          echo "ABI gate: host and ${#descriptors[@]} guest(s) all agree on '$HOST_ABI'"

      - name: Build the default and debug Windows binaries for the release
        # The release also carries the CLI for windows/amd64, built by the same
        # build script as the Linux binary with the target named, so the two
        # cannot follow different build steps. Both binaries embed the guests
        # the Linux build above regenerated, which are WebAssembly and the same
        # for every system. The default binary is the debug one without its
        # debug information, which for Windows the linker writes from the debug
        # binary's own build with -w added, rather than strip after linking as
        # for Linux; the build script says why. A Windows binary cannot run on
        # this runner, so the script reads each binary's stamped version from
        # the binary itself and refuses, naming both, unless it is the version
        # the Linux binary reports — which, whenever a release tag is in play,
        # the ABI gate above has already held to that tag. Writes
        # aggrega-cli/aggrega-windows-amd64.exe and
        # aggrega-cli/aggrega-debug-windows-amd64.exe, unsigned. No external
        # side effect: a dry run builds both, and sign-windows signs them before
        # the Windows smoke run and the release step see them.
        run: |
          set -euo pipefail
          # Whitespace is stripped before the match so the extraction is insensitive to
          # the pretty-printer, and it needs no jq. Stripping the whole payload is safe
          # only where the extracted value contains no whitespace, which holds for the
          # version string read here.
          BIN_VERSION="$(aggrega-cli/aggrega version -o json | tr -d '[:space:]' | grep -o '"version":"[^"]*"' | head -1 | cut -d'"' -f4)"
          [ -n "$BIN_VERSION" ] || { echo "binary reported no version" >&2; exit 1; }
          aggrega-cli/scripts/build.sh --target windows/amd64 --expect-version "$BIN_VERSION"

      - name: Build the light Windows binary for the release
        # The light no-embed binary for windows/amd64, by the same build script
        # and held to the same version as the step above, for the same reasons.
        # Writes aggrega-cli/aggrega-light-windows-amd64.exe, unsigned, as the
        # step above writes its two; a dry run builds it too.
        run: |
          set -euo pipefail
          # Whitespace is stripped before the match so the extraction is insensitive to
          # the pretty-printer, and it needs no jq. Stripping the whole payload is safe
          # only where the extracted value contains no whitespace, which holds for the
          # version string read here.
          BIN_VERSION="$(aggrega-cli/aggrega version -o json | tr -d '[:space:]' | grep -o '"version":"[^"]*"' | head -1 | cut -d'"' -f4)"
          [ -n "$BIN_VERSION" ] || { echo "binary reported no version" >&2; exit 1; }
          aggrega-cli/scripts/build.sh --light --target windows/amd64 --expect-version "$BIN_VERSION"

      - name: Build the default and debug macOS arm64 binaries for the release
        # The release also carries the CLI for macOS on Apple silicon
        # (darwin/arm64) and on Intel (darwin/amd64), in the default, debug and
        # light variants, built by the same build script as the Linux and
        # Windows binaries with the target named; the default and debug binaries
        # embed the guests the Linux build above regenerated. The default binary
        # is the debug one without its debug information, which for macOS, as
        # for Windows, the linker writes from the debug binary's own build with
        # -w added, rather than strip after linking as for Linux; the build
        # script says why. A macOS binary cannot run on this runner, so the
        # script reads each binary's stamped version from the binary itself and
        # refuses, naming both, unless it is the version the Linux binary
        # reports — which, whenever a release tag is in play, the ABI gate above
        # has already held to that tag. The Go linker signs an arm64 binary ad
        # hoc, each of the two, which an Apple silicon Mac requires before it
        # runs one; sign-macos replaces that signature with the Developer ID
        # one and has the binaries notarized. Writes aggrega-cli/aggrega-darwin-arm64 and
        # aggrega-cli/aggrega-debug-darwin-arm64. No external side effect: a
        # dry run builds both, and the release step attaches them as
        # sign-macos signed them.
        run: |
          set -euo pipefail
          # Whitespace is stripped before the match so the extraction is insensitive to
          # the pretty-printer, and it needs no jq. Stripping the whole payload is safe
          # only where the extracted value contains no whitespace, which holds for the
          # version string read here.
          BIN_VERSION="$(aggrega-cli/aggrega version -o json | tr -d '[:space:]' | grep -o '"version":"[^"]*"' | head -1 | cut -d'"' -f4)"
          [ -n "$BIN_VERSION" ] || { echo "binary reported no version" >&2; exit 1; }
          aggrega-cli/scripts/build.sh --target darwin/arm64 --expect-version "$BIN_VERSION"

      - name: Build the light macOS arm64 binary for the release
        # The light no-embed binary for darwin/arm64, by the same build script
        # and held to the same version as the step above, for the same reasons.
        # Writes aggrega-cli/aggrega-light-darwin-arm64; a dry run builds it too.
        run: |
          set -euo pipefail
          # Whitespace is stripped before the match so the extraction is insensitive to
          # the pretty-printer, and it needs no jq. Stripping the whole payload is safe
          # only where the extracted value contains no whitespace, which holds for the
          # version string read here.
          BIN_VERSION="$(aggrega-cli/aggrega version -o json | tr -d '[:space:]' | grep -o '"version":"[^"]*"' | head -1 | cut -d'"' -f4)"
          [ -n "$BIN_VERSION" ] || { echo "binary reported no version" >&2; exit 1; }
          aggrega-cli/scripts/build.sh --light --target darwin/arm64 --expect-version "$BIN_VERSION"

      - name: Build the default and debug macOS amd64 binaries for the release
        # The default and debug binaries for darwin/amd64, by the same build
        # script and held to the same version as the macOS arm64 steps above,
        # for the same reasons; an amd64 binary leaves the linker with no
        # signature, which an Intel Mac does not require to run it, and
        # sign-macos signs it as it signs the arm64 ones. Writes aggrega-cli/aggrega-darwin-amd64 and
        # aggrega-cli/aggrega-debug-darwin-amd64; a dry run builds both too.
        run: |
          set -euo pipefail
          # Whitespace is stripped before the match so the extraction is insensitive to
          # the pretty-printer, and it needs no jq. Stripping the whole payload is safe
          # only where the extracted value contains no whitespace, which holds for the
          # version string read here.
          BIN_VERSION="$(aggrega-cli/aggrega version -o json | tr -d '[:space:]' | grep -o '"version":"[^"]*"' | head -1 | cut -d'"' -f4)"
          [ -n "$BIN_VERSION" ] || { echo "binary reported no version" >&2; exit 1; }
          aggrega-cli/scripts/build.sh --target darwin/amd64 --expect-version "$BIN_VERSION"

      - name: Build the light macOS amd64 binary for the release
        # The light no-embed binary for darwin/amd64, by the same build script
        # and held to the same version as the steps above, for the same reasons.
        # Writes aggrega-cli/aggrega-light-darwin-amd64; a dry run builds it too.
        run: |
          set -euo pipefail
          # Whitespace is stripped before the match so the extraction is insensitive to
          # the pretty-printer, and it needs no jq. Stripping the whole payload is safe
          # only where the extracted value contains no whitespace, which holds for the
          # version string read here.
          BIN_VERSION="$(aggrega-cli/aggrega version -o json | tr -d '[:space:]' | grep -o '"version":"[^"]*"' | head -1 | cut -d'"' -f4)"
          [ -n "$BIN_VERSION" ] || { echo "binary reported no version" >&2; exit 1; }
          aggrega-cli/scripts/build.sh --light --target darwin/amd64 --expect-version "$BIN_VERSION"

      - name: Build the default and debug Linux arm64 binaries for the release
        # The release also carries the CLI for Linux on 64-bit ARM
        # (linux/arm64), in the default, debug and light variants, built by the
        # same build script as the other binaries with the target named and held
        # to the same version for the same reasons; the default and debug
        # binaries embed the guests the Linux build above regenerated. The
        # default binary is the debug one without its debug information, which
        # for any target the build is given, as for Windows and macOS, the linker
        # writes from the debug binary's own build with -w added: this runner's
        # strip reads only its own architecture's executables; the build script
        # says why. An arm64 binary cannot run on this runner, so its stamped
        # version is read from the binary itself. Writes aggrega-cli/aggrega-linux-arm64 and
        # aggrega-cli/aggrega-debug-linux-arm64. No external side effect: a dry
        # run builds both, linux-smoke runs them, and the release step attaches
        # them.
        run: |
          set -euo pipefail
          # Whitespace is stripped before the match so the extraction is insensitive to
          # the pretty-printer, and it needs no jq. Stripping the whole payload is safe
          # only where the extracted value contains no whitespace, which holds for the
          # version string read here.
          BIN_VERSION="$(aggrega-cli/aggrega version -o json | tr -d '[:space:]' | grep -o '"version":"[^"]*"' | head -1 | cut -d'"' -f4)"
          [ -n "$BIN_VERSION" ] || { echo "binary reported no version" >&2; exit 1; }
          aggrega-cli/scripts/build.sh --target linux/arm64 --expect-version "$BIN_VERSION"

      - name: Build the light Linux arm64 binary for the release
        # The light no-embed binary for linux/arm64, by the same build script
        # and held to the same version as the step above, for the same reasons.
        # Writes aggrega-cli/aggrega-light-linux-arm64; a dry run builds it too.
        run: |
          set -euo pipefail
          # Whitespace is stripped before the match so the extraction is insensitive to
          # the pretty-printer, and it needs no jq. Stripping the whole payload is safe
          # only where the extracted value contains no whitespace, which holds for the
          # version string read here.
          BIN_VERSION="$(aggrega-cli/aggrega version -o json | tr -d '[:space:]' | grep -o '"version":"[^"]*"' | head -1 | cut -d'"' -f4)"
          [ -n "$BIN_VERSION" ] || { echo "binary reported no version" >&2; exit 1; }
          aggrega-cli/scripts/build.sh --light --target linux/arm64 --expect-version "$BIN_VERSION"

      - name: Install oras for the released-binary compatibility check
        # The check below writes a second Plugin manifest by hand with oras, and a
        # self-hosted runner need not carry it, so it is installed here at a pinned
        # version rather than assumed.
        uses: oras-project/setup-oras@ac735097e22fe643015b0d19645f7c9a69942128 # v2.0.4
        with:
          version: 1.2.3

      - name: Check that the released 0.9.3 binary installs a plugin published with its notices
        # Proves what a user on the released 0.9.3 binary sees: a Plugin published
        # with its third-party notices layer and its SBOM referrer installs, the
        # .wasm it caches being the one pushed, and a Plugin whose manifest lists the
        # notices before the .wasm is refused. The script builds this checkout's
        # binary, downloads 0.9.3 and its SHA256SUMS from the GitHub release, and
        # needs Go (set up above), curl, jq and oras. Any other outcome, including a
        # download or tool that cannot run, fails the job here, before anything is
        # signed or published, so no release goes out that 0.9.3 cannot install or
        # that would break it.
        run: |
          set -euo pipefail
          aggrega-cli/scripts/check-plugin-notices-compat.sh

      - name: Make this run's own staging directories
        # On the persistent self-hosted runner AGGREGA_RUNNER names, a fixed name
        # can still hold an earlier run's files, which the smoke staging refuses
        # to stage over and the release inputs would otherwise carry as this
        # run's own. So the smoke inputs, which are uploaded, are staged into
        # directories of this run's own in the runner's temporary directory, and
        # the last steps remove them; and what sign-windows and sign-and-publish
        # read — the unsigned Windows binaries and the release inputs — goes into
        # this run's hand-over folder, beside that directory, since the runner
        # empties it when this job ends. The sources job made the folder, and the
        # step that took the aggrega-hub checkout from it left it empty; its two
        # directories are made here. clean-up removes the folder when the run
        # ends. The steps below read every directory from the environment.
        run: |
          set -euo pipefail
          [ -d "${HANDOVER:-}" ] || { echo "publish-plugins: this run's hand-over folder is not here" >&2; exit 1; }
          mkdir "$HANDOVER/windows-unsigned" "$HANDOVER/release-inputs"
          windows_smoke="$(mktemp -d "$RUNNER_TEMP/windows-smoke.XXXXXX")"
          macos_smoke="$(mktemp -d "$RUNNER_TEMP/macos-smoke.XXXXXX")"
          linux_smoke="$(mktemp -d "$RUNNER_TEMP/linux-smoke.XXXXXX")"
          printf 'WINDOWS_UNSIGNED=%s\nRELEASE_INPUTS=%s\nWINDOWS_SMOKE_INPUTS=%s\nMACOS_SMOKE_INPUTS=%s\nLINUX_SMOKE_INPUTS=%s\n' \
            "$HANDOVER/windows-unsigned" "$HANDOVER/release-inputs" "$windows_smoke" "$macos_smoke" "$linux_smoke" >> "$GITHUB_ENV"
          echo "hand-over folder: $HANDOVER"

      - name: Collect the Windows binaries for signing
        # The three Windows binaries the steps above wrote, unsigned, under the
        # names they wrote them, into the hand-over folder's windows-unsigned/:
        # sign-windows reads exactly these and the installer's two program files
        # the next step adds, and nothing else this job built. A missing file
        # fails the copy.
        run: |
          set -euo pipefail
          for built in aggrega-windows-amd64.exe aggrega-debug-windows-amd64.exe aggrega-light-windows-amd64.exe; do
            cp "aggrega-cli/$built" "$WINDOWS_UNSIGNED/$built"
          done
          ls -l "$WINDOWS_UNSIGNED"

      - name: Build the Windows installer's uninstaller and plug-in for signing
        # The Windows installer carries two program files beside aggrega.exe,
        # and every one it carries is signed, so they are built here and signed
        # with the binaries, before the installer is built from them in
        # windows-installer: uninstall.exe, the uninstaller, which makensis
        # generates from packaging/windows/aggrega.nsi, and EnVar.dll, the
        # plug-in that edits the user PATH, as its package carries it. The
        # script fetches NSIS and the plug-in, each held to the SHA-256 it pins,
        # and compiles the installer once to keep the uninstaller it generates;
        # the uninstaller depends on neither the binary nor the plug-in, so
        # windows-installer generates the same bytes again and refuses
        # otherwise. Both go into windows-unsigned/ beside the binaries, under
        # the names the smoke library's smoke_target_installer_parts gives
        # them. makensis and what it reads are third-party code, which is why
        # this runs here, in a job that names no secret, and never where a
        # signing runs. The version the binary reports is this job's version
        # output. No external side effect; a dry run builds them too.
        id: installer-parts
        run: |
          set -euo pipefail
          # Whitespace is stripped before the match so the extraction is insensitive to
          # the pretty-printer, and it needs no jq. Stripping the whole payload is safe
          # only where the extracted value contains no whitespace, which holds for the
          # version string read here.
          BIN_VERSION="$(aggrega-cli/aggrega version -o json | tr -d '[:space:]' | grep -o '"version":"[^"]*"' | head -1 | cut -d'"' -f4)"
          [ -n "$BIN_VERSION" ] || { echo "binary reported no version" >&2; exit 1; }
          parts="$RUNNER_TEMP/windows-installer-parts"
          aggrega-cli/scripts/build-windows-installer.sh parts --version "$BIN_VERSION" \
            --aggrega aggrega-cli/aggrega-windows-amd64.exe --output-dir "$parts"
          . aggrega-cli/scripts/lib/platform-smoke-common.sh
          smoke_require_bash
          names="$(smoke_target_installer_parts windows/amd64)"
          while IFS= read -r name; do
            cp "$parts/$name" "$WINDOWS_UNSIGNED/$name"
          done <<<"$names"
          rm -rf -- "$parts"
          ls -l "$WINDOWS_UNSIGNED"
          printf 'version=%s\n' "$BIN_VERSION" >> "$GITHUB_OUTPUT"

      - name: Stage the Windows smoke run's inputs
        # Everything the windows-smoke job runs, staged by one script into one
        # directory: the three Windows binaries above, unsigned, which the smoke
        # run holds as what its signature check must refuse, since it runs the
        # copies sign-windows signed — or runs these, on a dry run that signs
        # nothing; a Windows test executable
        # for each package whose tests prove a platform split, cross-compiled
        # here because the Windows runner has no toolchain and no sibling
        # repositories; the two worked examples, each with the workspace this
        # machine's validate, pull and build of it leave — the bytes the Windows
        # run must reproduce; and, for the entity-cache check, a registry program
        # built for Windows from a module go.mod already pins, one entity to
        # publish to it, and a copy of the first example that pulls that entity
        # from it. The examples build from catalogs in this repository and the
        # guests the default binary embeds, offline and with no configuration of
        # this machine read, so the Windows run needs no registry but the one it
        # starts on its own loopback address. The script builds each reference
        # twice, in two directories, and refuses when the two differ. No external
        # side effect; a dry run stages too.
        id: windows-smoke-inputs
        run: |
          set -euo pipefail
          aggrega-cli/scripts/stage-platform-smoke.sh --target windows/amd64 --output-dir "$WINDOWS_SMOKE_INPUTS"
          # The commit the windows-smoke job checks out is the one the staged
          # inputs record, so the job and the inputs cannot name different ones.
          while IFS='=' read -r key value; do
            if [ "$key" = commit ]; then
              printf 'commit=%s\n' "$value" >> "$GITHUB_OUTPUT"
            fi
          done < "$WINDOWS_SMOKE_INPUTS/smoke.env"

      - name: Upload the Windows smoke run's inputs
        # One workflow artifact, read only by the windows-smoke job of this same
        # run, which runs on a GitHub-hosted machine, and deleted by clean-up
        # when the run ends (kept a day at most should clean-up never run).
        # Hidden files are included so the example reaches the Windows run
        # exactly as it was built here.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-smoke-inputs
          path: ${{ env.WINDOWS_SMOKE_INPUTS }}
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

      - name: Stage the macOS smoke runs' inputs
        # Everything each macos-smoke job runs, staged by the same script as the
        # Windows inputs, once per macOS target into a directory of its own: the
        # default, debug and light binaries above for that target, unsigned,
        # which the smoke run holds as what its signature check must refuse,
        # since it runs the copies sign-macos signed — or runs these, on a dry
        # run that signs nothing; its test
        # executables, cross-compiled here, and the two worked examples, each
        # with the workspace this machine's validate, pull and build of it leave.
        # The tests listed for Windows alone are left out and named in the log.
        # No external side effect; a dry run stages too.
        id: macos-smoke-inputs
        run: |
          set -euo pipefail
          for target in darwin/arm64 darwin/amd64; do
            aggrega-cli/scripts/stage-platform-smoke.sh --target "$target" --output-dir "$MACOS_SMOKE_INPUTS/${target/\//-}"
          done
          # Both targets are staged from this one tree, so their inputs record
          # one commit; the macos-smoke jobs check out that commit, and the
          # smoke script refuses a checkout at any other.
          while IFS='=' read -r key value; do
            if [ "$key" = commit ]; then
              printf 'commit=%s\n' "$value" >> "$GITHUB_OUTPUT"
            fi
          done < "$MACOS_SMOKE_INPUTS/darwin-arm64/smoke.env"

      - name: Upload the macOS arm64 smoke run's inputs
        # One workflow artifact per macOS target, read only by that target's
        # macos-smoke job of this same run and deleted by clean-up when the run
        # ends (kept a day at most should clean-up never run). Hidden files are
        # included so the example reaches the macOS run exactly as it was built
        # here. An artifact keeps the bytes of each file, the signature the
        # linker embeds in an arm64 executable among them, but not its mode; the
        # smoke script makes the executables executable again.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-smoke-inputs-darwin-arm64
          path: ${{ env.MACOS_SMOKE_INPUTS }}/darwin-arm64
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

      - name: Upload the macOS amd64 smoke run's inputs
        # The darwin/amd64 inputs, as the step above uploads the darwin/arm64 ones.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-smoke-inputs-darwin-amd64
          path: ${{ env.MACOS_SMOKE_INPUTS }}/darwin-amd64
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

      - name: Stage the ARM Linux smoke run's inputs
        # Everything the linux-smoke job runs, staged by the same script as the
        # Windows and macOS inputs: the default, debug and light linux/arm64
        # binaries above, its test executables, cross-compiled here, and the two
        # worked examples, each with the workspace this machine's validate, pull
        # and build of it leave. The tests listed for Windows alone are left out
        # and named in the log. No external side effect; a dry run stages too.
        id: linux-smoke-inputs
        run: |
          set -euo pipefail
          aggrega-cli/scripts/stage-platform-smoke.sh --target linux/arm64 --output-dir "$LINUX_SMOKE_INPUTS"
          # The commit the linux-smoke job checks out is the one the staged
          # inputs record, so the job and the inputs cannot name different ones.
          while IFS='=' read -r key value; do
            if [ "$key" = commit ]; then
              printf 'commit=%s\n' "$value" >> "$GITHUB_OUTPUT"
            fi
          done < "$LINUX_SMOKE_INPUTS/smoke.env"

      - name: Upload the ARM Linux smoke run's inputs
        # One workflow artifact, read only by the linux-smoke job of this same
        # run, which runs on a GitHub-hosted ARM Linux machine, and deleted by
        # clean-up when the run ends (kept a day at most should clean-up never
        # run). Hidden files are included so the example reaches the ARM Linux
        # run exactly as it was built here. An artifact does not keep file
        # modes; the smoke script makes the executables executable again.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-smoke-inputs-linux-arm64
          path: ${{ env.LINUX_SMOKE_INPUTS }}
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

      - name: Set up Node for the extension packer
        # The desktop extension package is packed by the bundle format's own
        # packer, an npm package, so the job needs Node. A self-hosted runner need
        # not carry it, so it is installed here rather than assumed. Its package
        # manager cache is off: this job builds what the release publishes, so it
        # restores nothing from the Actions cache, which other workflow runs can
        # write. The major version is `aggrega-cli/.nvmrc`'s, the one a local check
        # of the staging steps reads too.
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: aggrega-cli/.nvmrc
          package-manager-cache: false

      - name: Pack the desktop extension package
        # Builds aggrega-<version>.mcpb, the single file a client such as Claude
        # Desktop adds from its extension settings to run Aggrega as a local MCP
        # server. The step is one invocation of the script that holds the whole
        # procedure — the pinned packer, the version stamp, validation and
        # packing — so a local build and a release build cannot differ. The
        # script stamps the bundle's version from the same recipe the binary's
        # stamp uses, and refuses, naming both, when the stamp differs from the
        # version the built binary reports — which, whenever a release tag is in
        # play, the ABI gate above has already held to that tag. No external
        # side effect: a dry run packs the bundle too, and the release step
        # attaches it. The packer is third-party npm code, which is why this job
        # holds no publishing credential.
        run: |
          set -euo pipefail
          # Whitespace is stripped before the match so the extraction is insensitive to
          # the pretty-printer, and it needs no jq. Stripping the whole payload is safe
          # only where the extracted value contains no whitespace, which holds for the
          # version string read here.
          BIN_VERSION="$(aggrega-cli/aggrega version -o json | tr -d '[:space:]' | grep -o '"version":"[^"]*"' | head -1 | cut -d'"' -f4)"
          [ -n "$BIN_VERSION" ] || { echo "binary reported no version" >&2; exit 1; }
          BUNDLE="$(aggrega-cli/scripts/build-mcp-bundle.sh --output-dir "$RELEASE_INPUTS/mcp-bundle" --expect-version "$BIN_VERSION")"
          echo "packed $BUNDLE"

      - name: Generate and stage the core plugins for publishing
        # Emits one Plugin entity per core guest by merging each guest's
        # machine-derived contract fields with its authored overlay; the entity
        # version is the binary's own build version, which every core guest was
        # stamped with. The guests the binary embeds are generated from the
        # binary itself; the core plugins the list names as not embedded are
        # generated from the guests the build wrote beside the embedded ones,
        # through the core-plugin list's one generation of them, which the local
        # generators call as well. The overlay directory is the REQUIRED authored
        # input surfaced above; a guest with no overlay halts this step rather
        # than getting invented entity content. Pure computation from the built
        # guests, with no external side effect.
        # Exactly the set of core guests this build stamped — the ones built into
        # this binary and the ones the core-plugin list builds without embedding —
        # each generated entity paired with its decompressed guest, written as the
        # pairing sign-and-publish publishes. Each guest is read from the artifact
        # directory its row of the core-plugin list names, through the list's one
        # reader, so a guest the binary does not embed is found where the build
        # wrote it and no directory is spelled here. The guests are stored
        # compressed, so they are decompressed into a working directory under the
        # filename the publisher looks for, and that filename comes from the
        # product's own tool rather than from a rule spelled here. A guest's file
        # is identified by socket AND name — `governance--cel.wasm`, not
        # `cel.wasm` — because a name is unique only within its socket, and
        # deriving it from the .gz filename names a file the publisher never looks
        # for.
        #
        # 🔴 `internal/buildtools/pluginguestfile` is the one place that rule
        # lives, and publish-plugins.sh resolves every guest through it. The
        # socket and name the script reads out of the entity path only find the
        # entity's row of the core-plugin list; joining them into the filename
        # there would work today and be a second copy of the rule — the first
        # naming change would break its loop silently, since a wrong name looks
        # exactly like a missing file.
        #
        # Deriving the filename runs Go, which is why the pairing is resolved
        # here: publish-plugins.sh --pairs-out writes, for each entity, the guest
        # it pairs with and the guest's notices and SBOM, relative to the staging
        # directory, and publishes nothing. It generates the notices and SBOM
        # here, beside the build whose module and crate caches they are read
        # from, into the staging directory, so they travel with the guest.
        # The pairing is written only when every entity paired.
        #
        # A Rust guest's notices list every crate its Cargo.lock locks, the
        # platform-specific ones included, and the generator reads each crate's
        # source from the cargo registry, offline. The wasm build fetched only
        # the crates that target compiles, so `cargo fetch --locked` runs first in
        # each Rust guest directory the core-plugin list names; it fetches what
        # the cache lacks and nothing else.
        # Both are `scripts/stage-core-plugins.sh`, which a local check of the
        # staging steps runs too.
        run: |
          set -euo pipefail
          aggrega-cli/scripts/stage-core-plugins.sh --overlay "$OVERLAY_DIR" --stage "$RELEASE_INPUTS/plugins"

      - name: Register ARM emulation for the tooling image
        # The tooling image is built for linux/amd64 and linux/arm64, and its
        # Dockerfile's RUN step runs as the code of the platform being built, so
        # the ARM half needs an emulator for aarch64 registered with this
        # machine's kernel. This action registers it: it runs BINFMT_IMAGE,
        # privileged, with --install arm64, which registers the emulator it
        # carries for aarch64 binaries. The action is pinned by its commit (its
        # release tag in the comment), and its image by digest. It comes before
        # the builder is made available because the builder reads which
        # platforms it can build when it starts. cache-image is off: with it on,
        # the action keeps the image in the Actions cache and runs the cached copy
        # when a pull fails, which would run bytes the digest does not name. The
        # registration lasts until the machine restarts, so later runs, and
        # anything else on this machine, can run aarch64 binaries too. This job
        # names no secret, so the action reaches none (see the header). It runs on
        # a dry run too, because a dry run builds the image.
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: ${{ env.BINFMT_IMAGE }}
          platforms: arm64
          cache-image: false

      - name: Make the image builder available
        # The tooling image is built with `docker buildx build --platform …`, and
        # buildx is a docker CLI PLUGIN rather than part of docker itself. Where
        # the plugin is absent the CLI parses `buildx build` as positional arguments
        # to its root command, so the first unrecognised flag is what it reports:
        # `unknown flag: --platform`, followed by the ROOT usage rather than
        # `docker build`'s. That names the flag instead of the missing plugin, so it
        # reads as a defect in the build script and is not one — the script asks for
        # the right tool and the tool is not installed. This step supplies it. It
        # runs on a dry run too, because a dry run builds the image.
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build the tooling image
        # Packages the freshly-built embedded binaries as the tooling image at the
        # reserved tools/ namespace so consumer CI can run the CLI without a Go
        # toolchain, on an x86-64 or an ARM Linux machine alike. The image is
        # built here, for real on a dry run too, once per platform from the one
        # Dockerfile, and written as one archive per platform carrying the
        # version reference, with the list of platforms and the references the
        # image is published under: sign-and-publish loads and pushes each
        # platform's image and joins them under the version tag and :stable,
        # without building anything. The script refuses to build unless the
        # builder lists linux/arm64, which the emulation step above makes
        # possible.
        #
        # The linux/amd64 image carries aggrega-cli/aggrega and the linux/arm64
        # one aggrega-cli/aggrega-linux-arm64, each the binary without its debug
        # information, because of the registry's per-request ceiling: the
        # registry refuses a single upload request above 100,000,000 bytes, and
        # each layer is sent in one request, the binary's layer included. The
        # image build copies each file as it is and refuses one carrying debug
        # information or built for the other processor, and the release step
        # attaches those same files, so the image and the release assets cannot
        # differ.
        run: |
          set -euo pipefail
          aggrega-cli/scripts/build-tooling-image.sh --registry "$REGISTRY" \
            --platform linux/amd64=aggrega-cli/aggrega \
            --platform linux/arm64=aggrega-cli/aggrega-linux-arm64 \
            --save "$RELEASE_INPUTS/image"

      - name: Remove the emulation installer image
        # The emulation step pulled BINFMT_IMAGE into the machine's image store
        # to run it; the run leaves no image there, so it is removed, whatever
        # the steps since did. The emulator it registered stays registered.
        # It is removed by its ID, since a pull by digest gives it no tag to
        # remove it by; where the machine also keeps it under a tag of its own,
        # docker refuses and the step warns, leaving it.
        if: ${{ always() }}
        run: |
          if id="$(docker image inspect --format '{{.Id}}' "$BINFMT_IMAGE" 2>/dev/null)"; then
            docker image rm "$id" >/dev/null || echo "::warning::could not remove $BINFMT_IMAGE ($id) from the image store"
          fi

      - name: Collect the binaries the release carries
        # The binaries the steps above wrote, under the names they wrote them,
        # into the release inputs sign-and-publish reads from the hand-over
        # folder: aggrega (the file the tooling image carries for linux/amd64,
        # which sign-and-publish also runs to log in, publish and sign),
        # aggrega-debug, aggrega-light, and the ARM Linux binaries,
        # aggrega-linux-arm64 being the file the image carries for linux/arm64.
        # The Windows and macOS binaries are not: the release attaches them
        # signed, from sign-windows' and sign-macos' artifacts, so the release
        # inputs leave them out and the unsigned ones have no way to the
        # release. A copy keeps each file's mode, so aggrega
        # stays executable. A missing file fails the copy.
        run: |
          set -euo pipefail
          BIN="$RELEASE_INPUTS/bin"
          mkdir -p "$BIN"
          for built in aggrega aggrega-debug aggrega-light \
              aggrega-linux-arm64 aggrega-debug-linux-arm64 aggrega-light-linux-arm64; do
            cp "aggrega-cli/$built" "$BIN/$built"
          done
          ls -l "$BIN"

      - name: Collect the macOS binaries for signing
        # The six macOS binaries the steps above wrote, unsigned but for the
        # linker's ad hoc signature on the arm64 ones, under the names they
        # wrote them, as the smoke library's smoke_target_binaries names them
        # for darwin/arm64 and darwin/amd64, into a directory of this run's
        # own, beside the property list declaring the entitlements each is
        # signed with, the file smoke_macos_entitlements names in this
        # checkout, under its own name, with SHA256SUMS over all seven, written
        # by the smoke library's one writer of such lists after every step of
        # this job that runs third-party code. sign-macos runs on a
        # GitHub-hosted Mac and reads none of the hand-over folder, so they are
        # uploaded for it below; the SHA-256 of the list itself is this job's
        # macos_unsigned_sums output, which sign-macos, checking nothing out,
        # holds the list to before it holds each file to the list. A missing
        # file fails the copy. No external side effect; a dry run collects them
        # too.
        id: macos-unsigned
        run: |
          set -euo pipefail
          . aggrega-cli/scripts/lib/platform-smoke-common.sh
          smoke_require_bash
          unsigned="$(mktemp -d "$RUNNER_TEMP/macos-unsigned.XXXXXX")"
          printf 'MACOS_UNSIGNED=%s\n' "$unsigned" >> "$GITHUB_ENV"
          for target in darwin/arm64 darwin/amd64; do
            names="$(smoke_target_binaries "$target")"
            while IFS= read -r name; do
              cp "aggrega-cli/$name" "$unsigned/$name"
            done <<<"$names"
          done
          entitlements="$(smoke_macos_entitlements)"
          cp "aggrega-cli/$entitlements" "$unsigned/${entitlements##*/}"
          smoke_write_tree_sums "$unsigned"
          cat "$unsigned/SHA256SUMS"
          sums="$(sha256sum < "$unsigned/SHA256SUMS")"
          printf 'sums=%s\n' "${sums%% *}" >> "$GITHUB_OUTPUT"
          echo "the list's own SHA-256: ${sums%% *}"

      - name: Upload the unsigned macOS binaries, their entitlements and their list
        # One workflow artifact, read only by sign-macos of this same run and
        # deleted by clean-up when the run ends (kept a day at most should
        # clean-up never run). An artifact keeps the bytes of each file, the
        # linker's signature in an arm64 executable among them, but not its
        # mode, which signing does not need.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-binaries-unsigned
          path: ${{ env.MACOS_UNSIGNED }}
          if-no-files-found: error
          retention-days: 1

      - name: Write the hand-over folder's list
        # The last step that writes into the hand-over folder, after every step
        # of this job that runs third-party code. SHA256SUMS, at the folder's
        # root, gives the SHA-256 of every file beneath it — windows-unsigned/
        # with the three unsigned Windows binaries and the installer's two
        # program files, and release-inputs/ with
        # bin/ (the binaries), mcp-bundle/ (the extension package), plugins/
        # (the entities, their guests and the pairing) and image/ (the tooling
        # image archive and its references) — by its path from the folder, in
        # bytewise order, in the form sha256sum writes. It is written under
        # another name and then renamed, so a list present means the hand-over
        # is complete. sign-windows, sign-and-publish and record-published hold
        # what they read to it before using any of it, so a file changed, added
        # or removed after this step is refused. Anything in the folder that is
        # neither a file nor a directory refuses the list, since no list can hold
        # it. The list is written by the smoke library's one writer of it, the
        # one the sources job wrote its own list with.
        run: |
          set -euo pipefail
          . aggrega-cli/scripts/lib/platform-smoke-common.sh
          smoke_require_bash
          smoke_write_tree_sums "$HANDOVER"
          cat "$HANDOVER/SHA256SUMS"

      - name: Remove this run's staging directories
        # Whatever the steps above did, so nothing this run staged in the
        # runner's temporary directory is left on the persistent runner for a
        # later run to find; a directory made read-only is made writable first.
        # The hand-over folder is not one of them: sign-windows and
        # sign-and-publish read it after this job, and clean-up removes it.
        if: ${{ always() && env.WINDOWS_SMOKE_INPUTS != '' }}
        run: |
          chmod -R u+w -- "$WINDOWS_SMOKE_INPUTS" "$MACOS_SMOKE_INPUTS" "$LINUX_SMOKE_INPUTS" 2>/dev/null || true
          rm -rf -- "$WINDOWS_SMOKE_INPUTS" "$MACOS_SMOKE_INPUTS" "$LINUX_SMOKE_INPUTS"
          if [ -n "${MACOS_UNSIGNED:-}" ]; then
            rm -rf -- "$MACOS_UNSIGNED"
          fi

      - name: Remove this run's configuration
        # Whatever the steps above did, so nothing written to this run's
        # configuration directory is left on a persistent runner for a later run
        # to find.
        if: ${{ always() && env.RUN_CONFIG_HOME != '' }}
        run: |
          chmod -R u+w -- "$RUN_CONFIG_HOME" 2>/dev/null || true
          rm -rf -- "$RUN_CONFIG_HOME"

  sign-windows:
    # Signs the three Windows binaries the build job built, and the two program
    # files the Windows installer carries beside the default one, with
    # Authenticode, so that Windows names their publisher, Cognitio S.r.l., and
    # can tell that nothing changed them since. It runs on every trigger, a dry run's included,
    # so the signing and the Windows smoke run's check of it are proven before a
    # tag exists — on every run but one on which registry-credential decides,
    # before anything is built, to skip the signing, and on which this job is
    # skipped. Its if: reads
    # that decision and nothing else: a signing that failed cannot skip it, and
    # on a run that publishes no ref can either. windows-installer, windows-smoke
    # and sign-and-publish all wait for it.
    #
    # The signing itself — the service, the timestamp every signature carries,
    # the exchange of the run's OIDC token for the token that signs, and jsign
    # under the Java runtime it fetches, each held to the SHA-256 it pins — is
    # scripts/sign-windows-files.sh, which says how; sign-windows-installer
    # signs the installer through the same script. The identity's federated
    # credentials in Azure decide which subjects may make that exchange, and
    # this job presents the release environment's, which names no ref, so the
    # environment's branch and tag rule decides which refs sign. The refs the
    # signing decision takes the identity to admit are stated once, in
    # .github/scripts/windows-signing.sh, and read only to decide whether a dry
    # run signs.
    # Everything that runs in this job can reach those tokens, so what runs is
    # kept to the shell's own utilities, curl, GitHub's own checkout and artifact
    # upload, and jsign under its own Java runtime, so no Java the machine
    # carries runs here. The checkout, at the commit the build built, is for the
    # signing script and the smoke library's names of the files, both read by
    # check-release-job-isolation.sh, which refuses either if it runs a build
    # step. No secret, no build step.
    #
    # It runs on the runner AGGREGA_RUNNER names, the machine the build ran on,
    # and reads the five unsigned files from the hand-over folder there, once
    # every file the folder's list names matches it: nothing the build wrote is
    # uploaded for it. That machine keeps state between runs, and the build's
    # third-party code ran on it, as the runner's user, before this job: what
    # this job holds is its own, what the machine holds is shared. The publishing
    # job, on the same machine, can already exchange its own token for the
    # signing identity (above), so signing here adds no reach to the identity
    # that the machine did not have.
    #
    # Signing changes the files: a signed binary differs from one signing to the
    # next, in its certificate and its timestamp, while its Authenticode digest,
    # which leaves the signature out, does not. The bytes the build reproduces
    # are the unsigned ones, and the bytes that run on Windows and ship are the
    # ones this job signs, which its SHA-256 lists name.
    #
    # registry-credential is named because a job reads the outputs only of the
    # jobs it names. The condition runs this job unless the decision is skip, so
    # a decision that is anything else signs; the guard in registry-credential
    # has already refused skip on a run that publishes.
    needs: [registry-credential, build]
    if: ${{ needs.registry-credential.outputs.signing != 'skip' }}
    runs-on: ${{ vars.AGGREGA_RUNNER }}
    environment: release
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      # The five settings the signing reads; each is an identifier, none a
      # secret.
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
      ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
      ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
    steps:
      - name: Check out the CLI at the commit the build job built
        # For the signing script and the smoke library, at the commit whose
        # build this job signs.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: aggrega-cli
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false

      - name: Refuse a signing setting that is not set
        run: |
          set -euo pipefail
          aggrega-cli/scripts/sign-windows-files.sh check-settings

      - name: Hold the hand-over's Windows files to the build job's list
        # The five unsigned files the build job left in this run's hand-over
        # folder, on this machine — the three binaries smoke_target_binaries
        # names and the installer's two program files
        # smoke_target_installer_parts names — are signed only once every file
        # in the folder is one its list names, each once, with the SHA-256 the
        # list gives it, and the list names nothing else, held by the smoke
        # library's one reader of such lists, smoke_check_tree_sums, as
        # windows-installer and sign-and-publish hold it; and exactly the five,
        # nothing beside them in windows-unsigned/, are copied to the
        # directories of this job's own they are signed in, the binaries to one
        # and the installer's files to another. A folder that is not here means
        # the build ran on another machine or in another attempt, and is
        # refused. The digests printed are the unsigned bytes the build wrote.
        run: |
          set -euo pipefail
          [ -n "$RELEASE_HANDOVER" ] || { echo "sign-windows: RELEASE_HANDOVER is empty" >&2; exit 1; }
          handover="$(dirname "$RUNNER_TEMP")/$RELEASE_HANDOVER"
          unsigned="$handover/windows-unsigned"
          . aggrega-cli/scripts/lib/platform-smoke-common.sh
          smoke_require_bash
          binaries_list="$(smoke_target_binaries windows/amd64)"
          parts_list="$(smoke_target_installer_parts windows/amd64)"
          mapfile -t binaries <<<"$binaries_list"
          mapfile -t parts <<<"$parts_list"
          names=("${binaries[@]}" "${parts[@]}")
          if [ ! -d "$handover" ] || [ ! -O "$handover" ] || [ ! -f "$handover/SHA256SUMS" ]; then
            echo "sign-windows: this run's hand-over folder $handover, with its list, is not on this machine: the build job of this run attempt left none here. sources, build, sign-windows, windows-installer, sign-windows-installer, sign-and-publish, record-published and clean-up run on the one machine AGGREGA_RUNNER names, in one attempt; re-run every job, not only the failed ones" >&2
            exit 1
          fi
          if ! smoke_check_tree_sums "$handover"; then
            echo "sign-windows: the hand-over folder $handover no longer matches the list the build job wrote" >&2
            exit 1
          fi
          shopt -s nullglob dotglob
          found=("$unsigned"/*)
          shopt -u nullglob dotglob
          exact=1
          [ "${#found[@]}" = "${#names[@]}" ] || exact=0
          for name in "${names[@]}"; do
            [ -f "$unsigned/$name" ] || exact=0
          done
          if [ "$exact" != 1 ]; then
            echo "sign-windows: $unsigned holds ${#found[@]} file(s), not exactly ${names[*]}:" >&2
            for path in "${found[@]}"; do
              echo "  ${path##*/}" >&2
            done
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/windows-signed" "$RUNNER_TEMP/windows-installer-parts-signed"
          for name in "${binaries[@]}"; do
            cp "$unsigned/$name" "$RUNNER_TEMP/windows-signed/$name"
          done
          for name in "${parts[@]}"; do
            cp "$unsigned/$name" "$RUNNER_TEMP/windows-installer-parts-signed/$name"
          done
          echo "unsigned, as the build job wrote them:"
          (cd "$RUNNER_TEMP/windows-signed" && sha256sum "${binaries[@]}")
          (cd "$RUNNER_TEMP/windows-installer-parts-signed" && sha256sum "${parts[@]}")

      - name: Fetch jsign and the Java runtime it runs under
        run: |
          set -euo pipefail
          aggrega-cli/scripts/sign-windows-files.sh fetch-tools "$RUNNER_TEMP/signing-tools"

      - name: Sign the Windows files
        # All five in one signing, which asks the service for the certificate
        # chain once.
        run: |
          set -euo pipefail
          files=("$RUNNER_TEMP"/windows-signed/* "$RUNNER_TEMP"/windows-installer-parts-signed/*)
          aggrega-cli/scripts/sign-windows-files.sh sign "$RUNNER_TEMP/signing-tools" "${files[@]}"

      - name: Write the SHA-256 lists of the signed files
        # SHA256SUMS, in the form sha256sum writes, beside the three binaries,
        # and another beside the installer's two files: the Windows smoke run
        # holds the binaries it runs to the first, windows-installer holds what
        # it builds the installer from to both, and sign-and-publish attaches the
        # binaries only when they still match theirs, so what ships is byte for
        # byte what ran on Windows.
        run: |
          set -euo pipefail
          . aggrega-cli/scripts/lib/platform-smoke-common.sh
          smoke_require_bash
          for dir in "$RUNNER_TEMP/windows-signed" "$RUNNER_TEMP/windows-installer-parts-signed"; do
            smoke_write_tree_sums "$dir"
            echo "signed, as ${dir##*/} hands them on:"
            cat "$dir/SHA256SUMS"
          done

      - name: Upload the signed Windows binaries and their list
        # One workflow artifact, read by windows-smoke, on a GitHub-hosted
        # Windows machine, by windows-installer, and by sign-and-publish of this
        # same run, so the release attaches the very bytes the Windows run ran;
        # deleted by clean-up when the run ends (kept a day at most should
        # clean-up never run).
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-binaries-signed
          path: ${{ runner.temp }}/windows-signed
          if-no-files-found: error
          retention-days: 1

      - name: Upload the installer's signed program files and their list
        # One workflow artifact, read by windows-installer of this same run,
        # which builds the installer from them; deleted by clean-up when the run
        # ends (kept a day at most should clean-up never run).
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-installer-parts-signed
          path: ${{ runner.temp }}/windows-installer-parts-signed
          if-no-files-found: error
          retention-days: 1

      - name: Remove this job's directories
        # Whatever the steps above did, so neither the files this job copied
        # and signed nor the Java runtime and jsign it fetched are left in the
        # runner's temporary directory on the persistent runner; a directory
        # made read-only is made writable first. The hand-over folder is
        # clean-up's to remove.
        if: ${{ always() }}
        run: |
          for dir in "$RUNNER_TEMP/windows-signed" "$RUNNER_TEMP/windows-installer-parts-signed" "$RUNNER_TEMP/signing-tools"; do
            chmod -R u+w -- "$dir" 2>/dev/null || true
            rm -rf -- "$dir"
          done

  windows-installer:
    # Builds the Windows installer, aggrega-<version>-windows-amd64-setup.exe as
    # the release attaches it, from packaging/windows/aggrega.nsi, with the
    # makensis scripts/build-windows-installer.sh fetches, which says how. Every
    # program file the installer carries is signed before it is built: the
    # default Windows binary and the installer's two program files, which
    # sign-windows signed and this job holds to their lists. The uninstaller
    # makensis generates must be byte for byte the unsigned one the build job
    # left in the hand-over folder, which sign-windows signed, before the signed
    # one is stored in its place, so the installer carries a signature of
    # exactly the uninstaller it would otherwise write. On a manual dry run that
    # signs nothing, sign-windows is skipped and the installer is built from
    # the unsigned files the build wrote, for windows-smoke to install, and
    # goes no further.
    #
    # makensis, the NSIS packages it comes from and the plug-in are third-party
    # code, so this is a job of its own, between the two signings: it names no
    # secret, may not mint the OIDC token, and runs no action but checkout and
    # the artifact download and upload. It runs on the runner AGGREGA_RUNNER
    # names because it reads the hand-over folder, holding it to its list first,
    # and hands the installer on, unsigned, as an artifact, with a SHA-256 list
    # of it, for sign-windows-installer to sign; on a run that signs nothing,
    # windows-smoke installs it as it is.
    #
    # The if: takes the place of the default, which would skip this job
    # whenever sign-windows is skipped: it runs when the run was not cancelled,
    # when registry-credential and build succeeded, and when sign-windows either
    # succeeded or was skipped on a decision of skip.
    needs: [registry-credential, build, sign-windows]
    if: >-
      ${{ !cancelled()
      && needs.registry-credential.result == 'success'
      && needs.build.result == 'success'
      && (needs.sign-windows.result == 'success'
      || (needs.sign-windows.result == 'skipped' && needs.registry-credential.outputs.signing == 'skip')) }}
    runs-on: ${{ vars.AGGREGA_RUNNER }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # This run's signing decision, sign or skip: on skip no signed files exist,
      # and the installer is built from the unsigned ones.
      SIGNING: ${{ needs.registry-credential.outputs.signing }}
      # The version the binaries report, which the installer records.
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Check out the CLI at the commit the build job built
        # For the installer's script, the build script and the smoke library.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: aggrega-cli
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false

      - name: Hold the hand-over folder to the build job's list
        # Before anything in it is read: every file in this run's hand-over
        # folder, on this machine, must be one SHA256SUMS names, each once, with
        # the SHA-256 it gives, and the list must name nothing else. A folder that
        # is not here means the build ran on another machine or in another
        # attempt, and is refused.
        run: |
          set -euo pipefail
          [ -n "$RELEASE_HANDOVER" ] || { echo "windows-installer: RELEASE_HANDOVER is empty" >&2; exit 1; }
          handover="$(dirname "$RUNNER_TEMP")/$RELEASE_HANDOVER"
          if [ ! -d "$handover" ] || [ ! -O "$handover" ] || [ ! -f "$handover/SHA256SUMS" ]; then
            echo "windows-installer: this run's hand-over folder $handover, with its list, is not on this machine: the build job of this run attempt left none here. sources, build, sign-windows, windows-installer, sign-windows-installer, sign-and-publish, record-published and clean-up run on the one machine AGGREGA_RUNNER names, in one attempt; re-run every job, not only the failed ones" >&2
            exit 1
          fi
          . aggrega-cli/scripts/lib/platform-smoke-common.sh
          smoke_require_bash
          smoke_check_tree_sums "$handover"
          printf 'HANDOVER=%s\n' "$handover" >> "$GITHUB_ENV"

      - name: Download the signed Windows binaries
        # Not on a run whose decision is skip, on which sign-windows signed
        # nothing and uploaded nothing.
        if: ${{ env.SIGNING != 'skip' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-binaries-signed
          path: ${{ runner.temp }}/windows-signed

      - name: Download the installer's signed program files
        if: ${{ env.SIGNING != 'skip' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-installer-parts-signed
          path: ${{ runner.temp }}/windows-installer-parts-signed

      - name: Build the Windows installer
        # From the default Windows binary and the installer's two program files,
        # signed — each held first to the list sign-windows wrote beside it — or,
        # on a run whose decision is skip, as the build wrote them; and from the
        # unsigned uninstaller the build wrote, which the one makensis generates
        # must match. SHA256SUMS is then written beside the installer, by the
        # smoke library's one writer of such lists.
        run: |
          set -euo pipefail
          . aggrega-cli/scripts/lib/platform-smoke-common.sh
          smoke_require_bash
          binaries_list="$(smoke_target_binaries windows/amd64)"
          parts_list="$(smoke_target_installer_parts windows/amd64)"
          mapfile -t binaries <<<"$binaries_list"
          mapfile -t parts <<<"$parts_list"
          unsigned="$HANDOVER/windows-unsigned"
          if [ "$SIGNING" = skip ]; then
            echo "windows-installer: this run signs nothing, so the installer is built from the unsigned files the build wrote"
            aggrega="$unsigned/${binaries[0]}"
            given_parts="$unsigned"
          else
            smoke_check_sums "$RUNNER_TEMP/windows-signed/SHA256SUMS" "$RUNNER_TEMP/windows-signed" "${binaries[@]}"
            smoke_check_sums "$RUNNER_TEMP/windows-installer-parts-signed/SHA256SUMS" "$RUNNER_TEMP/windows-installer-parts-signed" "${parts[@]}"
            aggrega="$RUNNER_TEMP/windows-signed/${binaries[0]}"
            given_parts="$RUNNER_TEMP/windows-installer-parts-signed"
          fi
          [ -n "$RELEASE_VERSION" ] || { echo "windows-installer: the build job reported no version" >&2; exit 1; }
          aggrega-cli/scripts/build-windows-installer.sh installer --version "$RELEASE_VERSION" \
            --aggrega "$aggrega" --parts "$given_parts" --unsigned-parts "$unsigned" \
            --output-dir "$RUNNER_TEMP/windows-installer"
          smoke_write_tree_sums "$RUNNER_TEMP/windows-installer"
          cat "$RUNNER_TEMP/windows-installer/SHA256SUMS"

      - name: Upload the Windows installer and its list
        # One workflow artifact, read by sign-windows-installer of this same run,
        # which signs it, or on a run whose decision is skip by windows-smoke;
        # deleted by clean-up when the run ends (kept a day at most should
        # clean-up never run).
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-installer
          path: ${{ runner.temp }}/windows-installer
          if-no-files-found: error
          retention-days: 1

      - name: Remove this job's directories
        # Whatever the steps above did, so nothing this job received or built is
        # left in the runner's temporary directory on the persistent runner. The
        # hand-over folder is clean-up's to remove.
        if: ${{ always() }}
        run: |
          for dir in "$RUNNER_TEMP/windows-signed" "$RUNNER_TEMP/windows-installer-parts-signed" "$RUNNER_TEMP/windows-installer"; do
            chmod -R u+w -- "$dir" 2>/dev/null || true
            rm -rf -- "$dir"
          done

  sign-windows-installer:
    # Signs the installer windows-installer built, through
    # scripts/sign-windows-files.sh, as sign-windows signs the binaries: the
    # same identity, the same settings, the same pinned jsign and Java runtime,
    # and nothing else run beside them, the shell's own utilities, curl, and
    # GitHub's own checkout and artifact actions. It is the second of the two
    # signings because the installer carries the files the first one signed.
    # It skips when sign-windows skips, on the same decision, and otherwise runs
    # once windows-installer has succeeded. windows-smoke and sign-and-publish
    # wait for it, and the installer it signs is the one both see.
    needs: [registry-credential, build, windows-installer]
    if: ${{ needs.registry-credential.outputs.signing != 'skip' }}
    runs-on: ${{ vars.AGGREGA_RUNNER }}
    environment: release
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      # The five settings the signing reads; each is an identifier, none a
      # secret.
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
      ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
      ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
    steps:
      - name: Check out the CLI at the commit the build job built
        # For the signing script and the smoke library.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: aggrega-cli
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false

      - name: Refuse a signing setting that is not set
        run: |
          set -euo pipefail
          aggrega-cli/scripts/sign-windows-files.sh check-settings

      - name: Download the Windows installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-installer
          path: ${{ runner.temp }}/windows-installer-signed

      - name: Hold the installer to its list
        # The installer is signed only once it has the SHA-256 the list
        # windows-installer wrote gives it, and the list names it alone. The list
        # then goes: the one beside the signed installer is written after the
        # signing.
        run: |
          set -euo pipefail
          . aggrega-cli/scripts/lib/platform-smoke-common.sh
          smoke_require_bash
          installer="$(smoke_target_installer windows/amd64)"
          smoke_check_sums "$RUNNER_TEMP/windows-installer-signed/SHA256SUMS" "$RUNNER_TEMP/windows-installer-signed" "$installer"
          rm -f -- "$RUNNER_TEMP/windows-installer-signed/SHA256SUMS"

      - name: Fetch jsign and the Java runtime it runs under
        run: |
          set -euo pipefail
          aggrega-cli/scripts/sign-windows-files.sh fetch-tools "$RUNNER_TEMP/signing-tools"

      - name: Sign the Windows installer
        run: |
          set -euo pipefail
          . aggrega-cli/scripts/lib/platform-smoke-common.sh
          smoke_require_bash
          installer="$(smoke_target_installer windows/amd64)"
          aggrega-cli/scripts/sign-windows-files.sh sign "$RUNNER_TEMP/signing-tools" "$RUNNER_TEMP/windows-installer-signed/$installer"

      - name: Write the SHA-256 list of the signed installer
        # SHA256SUMS beside it: windows-smoke holds the installer it runs to it,
        # and sign-and-publish attaches the installer only when it still matches
        # it, so what ships is byte for byte what ran on Windows.
        run: |
          set -euo pipefail
          . aggrega-cli/scripts/lib/platform-smoke-common.sh
          smoke_require_bash
          smoke_write_tree_sums "$RUNNER_TEMP/windows-installer-signed"
          cat "$RUNNER_TEMP/windows-installer-signed/SHA256SUMS"

      - name: Upload the signed Windows installer and its list
        # One workflow artifact, read by windows-smoke and by sign-and-publish
        # of this same run; deleted by clean-up when the run ends (kept a day at
        # most should clean-up never run).
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-installer-signed
          path: ${{ runner.temp }}/windows-installer-signed
          if-no-files-found: error
          retention-days: 1

      - name: Remove this job's directories
        # Whatever the steps above did, so neither the installer nor the Java
        # runtime and jsign this job fetched are left in the runner's temporary
        # directory on the persistent runner.
        if: ${{ always() }}
        run: |
          for dir in "$RUNNER_TEMP/windows-installer-signed" "$RUNNER_TEMP/signing-tools"; do
            chmod -R u+w -- "$dir" 2>/dev/null || true
            rm -rf -- "$dir"
          done

  sign-macos:
    # Signs the six macOS binaries the build job built — the default, debug and
    # light ones for darwin/arm64 and darwin/amd64 — with the Developer ID
    # Application identity Apple issued to COGNITIO SRL, team N4DSTL8KLH, the
    # registered legal name, so that macOS names who signed them and
    # can tell that nothing changed them since, and submits them to Apple's
    # notary service, so that, once Apple accepts them, Gatekeeper lets a Mac
    # run one downloaded with a browser. Each is signed with the hardened
    # runtime and a secure timestamp,
    # both of which notarization requires, carries the code-signing identifier
    # CODESIGN_IDENTIFIER, as Apple asks of code that is not in a bundle, and
    # claims the entitlements the repository's
    # packaging/macos/aggrega.entitlements declares, and no other: the one
    # exception to the hardened runtime that the WebAssembly runtime the
    # binaries embed needs to compile plugins,
    # com.apple.security.cs.allow-unsigned-executable-memory, since it makes
    # the memory it compiles into executable without mapping it with MAP_JIT,
    # which the narrower com.apple.security.cs.allow-jit covers alone. That
    # file arrives as the binaries do, in the build job's artifact and named in
    # its list, since this job checks nothing out. The six go to the notary
    # service in one zip archive, made with ditto, as Apple's notary service
    # takes a bare executable; a ticket cannot be stapled to a bare executable,
    # so Gatekeeper finds it online, where Apple publishes it once it accepts
    # the submission. So the job does not wait for Apple's answer: it submits,
    # prints the submission's ID in the log and the run's summary, and gives it
    # as its output notary_submission_id, which notarization-check reads at the
    # end of the run to ask Apple how the submission stands. A submission the
    # notary service does not take, so that there is no ID, fails the job.
    #
    # It runs on every trigger, a dry run's included, on the decision
    # registry-credential makes for the macOS binaries, macos_signing, and on no
    # other: skipped on a decision to skip the Windows signing, skipped
    # whenever the repository variable
    # AGGREGA_MACOS_SIGNING is not true, when the release ships the binaries
    # unsigned, and run everywhere else. Run, it first refuses, naming each, any
    # Apple setting that is not set, so a run meant to sign never leaves the
    # binaries unsigned for want of one; macos-smoke and sign-and-publish wait
    # for it.
    #
    # It runs on a GitHub-hosted Apple silicon macOS machine, a fresh one for the
    # job, because Apple's codesign and notarytool run only on macOS. What runs
    # in it is kept to Apple's own programs — /bin/bash, codesign, notarytool,
    # security, ditto, openssl, shasum, plutil and base64, each named by its
    # path, and the shell's own utilities — and GitHub's artifact download and
    # upload, each pinned by its full commit with the release it is beside it. It
    # checks nothing out, runs no build, and is granted no permission: the run's
    # token can read nothing here. The unsigned binaries and the entitlements
    # file arrive as the build job's artifact, used only once the list beside
    # them has the SHA-256 the build job gave as its macos_unsigned_sums output
    # and each file the digest the list gives it, and the list names nothing
    # else. This job writes its
    # own checks of that, rather than running the smoke library's, because it
    # checks out nothing; the lists it hands on are in the form the library's
    # smoke_check_sums reads, and macos-smoke and sign-and-publish read them
    # through it.
    #
    # It is the one job that names the Apple secrets — notarization-check names
    # the notary key too, and no other — and it names no other
    # secret and not the run's token; scripts/check-release-job-isolation.sh
    # refuses the workflow otherwise. Each secret reaches only the step that
    # needs it, through that step's environment: the Developer ID identity's
    # passphrase reaches Apple's openssl through its environment, which unwraps
    # the identity into two pipes and wraps it again under a passphrase drawn for
    # this job, the one security import is given; the identity goes into a
    # keychain of this job's own in the runner's temporary directory, under a
    # password drawn for it, which the signing step deletes when it ends,
    # whatever ended it, and the job's last step deletes again should it be
    # there. The notary key is written, readable by the runner's user alone,
    # into the runner's temporary directory and removed when the submission
    # step ends. No secret stands on a command line. The key's ID and its
    # issuer ID are identifiers notarytool takes as arguments, so they are
    # variables, not secrets.
    #
    # Signing changes the files: a signed binary differs from one signing to the
    # next, in its timestamp, while the bytes the build reproduces are the
    # unsigned ones; the bytes that run on macOS and ship are the ones this job
    # signed, which its SHA-256 lists name.
    needs: [registry-credential, build]
    if: ${{ needs.registry-credential.outputs.macos_signing == 'sign' }}
    # macos-15 names GitHub's hosted Apple silicon image, the one macos-smoke's
    # darwin/arm64 run uses.
    runs-on: macos-15
    environment: release
    timeout-minutes: 90
    permissions: {}
    # notary_submission_id: the ID Apple's notary service gave the submission
    # of the six signed binaries, which notarization-check asks Apple about.
    outputs:
      notary_submission_id: ${{ steps.notarize.outputs.submission_id }}
    env:
      # The code-signing identifier every macOS binary is signed with.
      CODESIGN_IDENTIFIER: ai.aggrega.cli
    defaults:
      run:
        # The bash macOS ships, as Apple ships it, and not one installed beside
        # it; every step here is written for its version, 3.2.
        shell: /bin/bash --noprofile --norc -eo pipefail {0}
    steps:
      - name: Refuse an Apple setting that is not set
        # Before anything is downloaded: each of the five settings the signing
        # and the notarization read must be set, and each that is not is
        # named. The three secrets reach this step only as whether each is set,
        # never as their values.
        env:
          CERTIFICATE_SET: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE != '' }}
          CERTIFICATE_PASSWORD_SET: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD != '' }}
          NOTARY_KEY_SET: ${{ secrets.APPLE_NOTARY_API_KEY != '' }}
          APPLE_NOTARY_API_KEY_ID: ${{ vars.APPLE_NOTARY_API_KEY_ID }}
          APPLE_NOTARY_API_ISSUER_ID: ${{ vars.APPLE_NOTARY_API_ISSUER_ID }}
        run: |
          missing=()
          [ "$CERTIFICATE_SET" = true ] || missing+=("the secret APPLE_DEVELOPER_ID_CERTIFICATE")
          [ "$CERTIFICATE_PASSWORD_SET" = true ] || missing+=("the secret APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD")
          [ "$NOTARY_KEY_SET" = true ] || missing+=("the secret APPLE_NOTARY_API_KEY")
          [ -n "$APPLE_NOTARY_API_KEY_ID" ] || missing+=("the variable APPLE_NOTARY_API_KEY_ID")
          [ -n "$APPLE_NOTARY_API_ISSUER_ID" ] || missing+=("the variable APPLE_NOTARY_API_ISSUER_ID")
          if [ "${#missing[@]}" -gt 0 ]; then
            for setting in "${missing[@]}"; do
              echo "sign-macos: $setting is not set" >&2
            done
            echo "sign-macos: this run signs and notarizes the macOS binaries and cannot without the ${#missing[@]} setting(s) above: set each secret as a secret of the release environment and each variable as a repository variable; or unset the repository variable AGGREGA_MACOS_SIGNING, and the release ships the macOS binaries unsigned, saying so" >&2
            exit 1
          fi
          echo "sign-macos: the three Apple secrets and the notary key's two identifiers are set"

      - name: Download the unsigned macOS binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-binaries-unsigned
          path: ${{ runner.temp }}/macos-signing/unsigned

      - name: Hold the unsigned binaries and the entitlements to the build job's list
        # The list beside the binaries must have the SHA-256 the build job gave
        # as its output, so it is the list the build wrote; each line of it must
        # be "<SHA-256>  <name>", name a darwin/arm64 or darwin/amd64 binary, or
        # the entitlements file — the one name ending .entitlements, the
        # extension Apple gives such a property list — once, and give that
        # file's digest; and the artifact must hold nothing the list does not
        # name. Each binary is then copied into the directory of its target it
        # is signed in, and the entitlements file to where the signing reads
        # it, and printed. The digests printed are the unsigned bytes the build
        # wrote.
        env:
          LISTED_SUMS: ${{ needs.build.outputs.macos_unsigned_sums }}
        run: |
          dir="$RUNNER_TEMP/macos-signing/unsigned"
          list="$dir/SHA256SUMS"
          signed="$RUNNER_TEMP/macos-signing/signed"
          entitlements="$RUNNER_TEMP/macos-signing/entitlements.plist"
          re_digest='^[0-9a-f]{64}$'
          re_line='^([0-9a-f]{64}) [ *]([A-Za-z0-9._-]+)$'
          if [ ! -f "$list" ]; then
            echo "sign-macos: the build job's artifact holds no SHA256SUMS" >&2
            exit 1
          fi
          if ! [[ $LISTED_SUMS =~ $re_digest ]]; then
            echo "sign-macos: the build job gave no SHA-256 of its list (macos_unsigned_sums is '$LISTED_SUMS')" >&2
            exit 1
          fi
          actual="$(/usr/bin/shasum -a 256 < "$list")"
          actual="${actual%% *}"
          if [ "$actual" != "$LISTED_SUMS" ]; then
            echo "sign-macos: the list in the artifact has SHA-256 $actual, but the build job wrote one with SHA-256 $LISTED_SUMS" >&2
            exit 1
          fi
          echo "ok: SHA256SUMS is the list the build job wrote, SHA-256 $actual"
          listed=" "
          bad=0
          count=0
          while IFS= read -r line || [ -n "$line" ]; do
            [ -n "$line" ] || continue
            if ! [[ $line =~ $re_line ]]; then
              echo "sign-macos: SHA256SUMS holds a line that is not \"<SHA-256>  <name>\": $line" >&2
              bad=1
              continue
            fi
            digest="${BASH_REMATCH[1]}"
            name="${BASH_REMATCH[2]}"
            case "$name" in
              *-darwin-arm64) target=darwin-arm64 ;;
              *-darwin-amd64) target=darwin-amd64 ;;
              *.entitlements) target=entitlements ;;
              *)
                echo "sign-macos: SHA256SUMS lists $name, which is no darwin/arm64 or darwin/amd64 binary and no entitlements file" >&2
                bad=1
                continue
                ;;
            esac
            case "$listed" in
              *" $name "*)
                echo "sign-macos: SHA256SUMS lists $name twice" >&2
                bad=1
                continue
                ;;
            esac
            listed="$listed$name "
            if [ ! -f "$dir/$name" ]; then
              echo "sign-macos: the artifact holds no $name, which SHA256SUMS lists" >&2
              bad=1
              continue
            fi
            got="$(/usr/bin/shasum -a 256 < "$dir/$name")"
            got="${got%% *}"
            if [ "$got" != "$digest" ]; then
              echo "sign-macos: $name has SHA-256 $got, but SHA256SUMS lists $digest" >&2
              bad=1
              continue
            fi
            echo "ok: $name has SHA-256 $got, as SHA256SUMS lists"
            if [ "$target" = entitlements ]; then
              if [ -e "$entitlements" ]; then
                echo "sign-macos: SHA256SUMS lists a second entitlements file, $name" >&2
                bad=1
                continue
              fi
              /bin/cp "$dir/$name" "$entitlements"
              continue
            fi
            /bin/mkdir -p "$signed/$target"
            /bin/cp "$dir/$name" "$signed/$target/$name"
            count=$((count + 1))
          done < "$list"
          shopt -s nullglob dotglob
          for path in "$dir"/*; do
            name="${path##*/}"
            [ "$name" != SHA256SUMS ] || continue
            case "$listed" in
              *" $name "*) ;;
              *)
                echo "sign-macos: the artifact holds $name, which SHA256SUMS does not list" >&2
                bad=1
                ;;
            esac
          done
          shopt -u nullglob dotglob
          for target in darwin-arm64 darwin-amd64; do
            if [ ! -d "$signed/$target" ]; then
              echo "sign-macos: SHA256SUMS lists no $target binary that matches it" >&2
              bad=1
            fi
          done
          if [ ! -f "$entitlements" ]; then
            echo "sign-macos: SHA256SUMS lists no entitlements file that matches it" >&2
            bad=1
          fi
          if [ "$bad" != 0 ]; then
            echo "sign-macos: the unsigned binaries and their entitlements are not the ones the build job listed, so none is signed" >&2
            exit 1
          fi
          echo "ok: $count unsigned binaries, each the one the build job listed, to be signed claiming the entitlements it listed:"
          /bin/cat "$entitlements"

      - name: Sign the macOS binaries
        # The identity is unwrapped from its PKCS#12 file by Apple's openssl,
        # which reads the passphrase from its environment, into two pipes, and
        # wrapped again under a passphrase drawn for this job, which security
        # import is given in its place; the decrypted key is never written to a
        # file. It is imported into a keychain of this job's own, under a
        # password drawn for it, which codesign alone may use and which this
        # step deletes when it ends, whatever ended it. The identity must be the
        # one valid Developer ID Application identity the file holds, and each
        # binary is signed with it by its SHA-1 hash, with the hardened runtime,
        # a secure timestamp, the code-signing identifier and the entitlements
        # the step above held to the build job's list, then verified as
        # strictly as notarization verifies, and its signature and the
        # entitlements it claims printed.
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          work="$RUNNER_TEMP/macos-signing"
          keychain="$work/signing.keychain-db"
          identity="$work/identity"
          entitlements="$work/entitlements.plist"
          umask 077
          remove_identity() {
            /usr/bin/security delete-keychain "$keychain" >/dev/null 2>&1 || true
            /bin/rm -rf -- "$identity"
            echo "sign-macos: the keychain and the identity's files are deleted"
          }
          trap remove_identity EXIT
          /bin/mkdir "$identity"
          keychain_password="$(/usr/bin/openssl rand -hex 32)"
          wrap_password="$(/usr/bin/openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          echo "::add-mask::$wrap_password"
          if ! printf '%s' "$APPLE_DEVELOPER_ID_CERTIFICATE" | /usr/bin/base64 --decode > "$identity/identity.p12"; then
            echo "sign-macos: APPLE_DEVELOPER_ID_CERTIFICATE is not base64" >&2
            exit 1
          fi
          # What the identity file holds, in terms that carry no secret: the
          # openssl build reading it, the file's size, the algorithms its bags
          # are encrypted with, how many certificates and private keys it
          # yields, and the first certificate's subject and issuer. The key and
          # the certificates go into a pipe that only counts them; nothing of
          # either is printed. A failure below is then read against these lines.
          echo "sign-macos: identity file diagnostics (no secret material):"
          echo "  openssl: $(/usr/bin/openssl version 2>&1)"
          echo "  identity.p12: $(/usr/bin/wc -c < "$identity/identity.p12" | /usr/bin/tr -d ' ') bytes"
          /usr/bin/openssl pkcs12 -in "$identity/identity.p12" -passin env:APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD -info -noout 2>&1 |
            /usr/bin/sed 's/^/  info: /' || true
          certs="$(/usr/bin/openssl pkcs12 -in "$identity/identity.p12" -passin env:APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD -nokeys 2>/dev/null |
            /usr/bin/grep -c 'BEGIN CERTIFICATE' || true)"
          keys="$(/usr/bin/openssl pkcs12 -in "$identity/identity.p12" -passin env:APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD -nocerts -nodes 2>/dev/null |
            /usr/bin/grep -c 'PRIVATE KEY-----$' || true)"
          echo "  certificates read: ${certs:-0}; private keys read: $(( ${keys:-0} / 2 ))"
          /usr/bin/openssl pkcs12 -in "$identity/identity.p12" -passin env:APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD -nokeys 2>/dev/null |
            /usr/bin/openssl x509 -noout -subject -issuer 2>&1 | /usr/bin/sed 's/^/  first certificate: /' || true
          export WRAP_PASSWORD="$wrap_password"
          # The certificates and the key reach the re-wrap as two separate
          # streams. Apple's openssl is LibreSSL, whose export reads the key and
          # then the certificates from its input, and the key read consumes a
          # single shared stream whole, leaving no certificate to load.
          if ! /usr/bin/openssl pkcs12 -export -passout env:WRAP_PASSWORD \
              -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1 \
              -in <(/usr/bin/openssl pkcs12 -in "$identity/identity.p12" -passin env:APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD -nokeys) \
              -inkey <(/usr/bin/openssl pkcs12 -in "$identity/identity.p12" -passin env:APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD -nocerts -nodes) \
              -out "$identity/import.p12"; then
            echo "sign-macos: the identity in APPLE_DEVELOPER_ID_CERTIFICATE could not be read with APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: it must be a PKCS#12 file holding the certificate and its private key, exported with that passphrase, in base64" >&2
            exit 1
          fi
          unset WRAP_PASSWORD
          /bin/rm -f -- "$identity/identity.p12"
          /usr/bin/security create-keychain -p "$keychain_password" "$keychain"
          /usr/bin/security set-keychain-settings -lut 3600 "$keychain"
          /usr/bin/security unlock-keychain -p "$keychain_password" "$keychain"
          /usr/bin/security import "$identity/import.p12" -k "$keychain" -f pkcs12 -P "$wrap_password" -T /usr/bin/codesign
          /bin/rm -f -- "$identity/import.p12"
          /usr/bin/security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          search=()
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"
            line="${line#\"}"
            line="${line%\"}"
            if [ -n "$line" ]; then
              search+=("$line")
            fi
          done < <(/usr/bin/security list-keychains -d user)
          /usr/bin/security list-keychains -d user -s "$keychain" "${search[@]}"
          identities="$(/usr/bin/security find-identity -v -p codesigning "$keychain")"
          printf '%s\n' "$identities"
          re_identity='^[[:space:]]*[0-9]+\)[[:space:]]+([0-9A-F]{40})[[:space:]]+"(Developer ID Application: [^"]+)"'
          found=0
          hash=""
          signer=""
          while IFS= read -r line; do
            if [[ $line =~ $re_identity ]]; then
              found=$((found + 1))
              hash="${BASH_REMATCH[1]}"
              signer="${BASH_REMATCH[2]}"
            fi
          done <<<"$identities"
          if [ "$found" -ne 1 ]; then
            echo "sign-macos: APPLE_DEVELOPER_ID_CERTIFICATE gives $found valid Developer ID Application identities, not one" >&2
            exit 1
          fi
          echo "sign-macos: signing as $signer ($hash)"
          for file in "$work"/signed/darwin-*/*; do
            /usr/bin/codesign --sign "$hash" --keychain "$keychain" --force --options runtime --timestamp \
              --identifier "$CODESIGN_IDENTIFIER" --entitlements "$entitlements" "$file"
            /usr/bin/codesign --verify --strict --verbose=2 "$file"
            /usr/bin/codesign --display --verbose=2 --entitlements - --xml "$file"
            echo
          done

      - name: Submit the signed binaries to Apple's notary service
        # The six signed binaries, in one zip archive made with ditto, go to
        # Apple's notary service through notarytool, which authenticates with
        # the App Store Connect API key: its private key is written, readable by
        # the runner's user alone, into this job's directory and removed when
        # the step ends, and its ID and issuer ID, which are identifiers, are
        # given as arguments. notarytool does not wait for Apple's answer: it
        # returns once the upload is taken, with the submission's ID, which is
        # printed, written to the run's summary and given as this job's output
        # notary_submission_id. A submission that is not taken, so that
        # notarytool fails or gives no ID, fails the job. Apple's log of the
        # submission is not ready yet; notarization-check fetches it.
        id: notarize
        env:
          APPLE_NOTARY_API_KEY: ${{ secrets.APPLE_NOTARY_API_KEY }}
          APPLE_NOTARY_API_KEY_ID: ${{ vars.APPLE_NOTARY_API_KEY_ID }}
          APPLE_NOTARY_API_ISSUER_ID: ${{ vars.APPLE_NOTARY_API_ISSUER_ID }}
        run: |
          work="$RUNNER_TEMP/macos-signing"
          notary="$work/notary"
          key="$notary/key/AuthKey.p8"
          umask 077
          /bin/mkdir -p "$notary/key"
          trap '/bin/rm -rf -- "$notary/key"' EXIT
          printf '%s\n' "$APPLE_NOTARY_API_KEY" > "$key"
          /usr/bin/ditto -c -k --keepParent "$work/signed" "$notary/aggrega-macos.zip"
          credentials=(--key "$key" --key-id "$APPLE_NOTARY_API_KEY_ID" --issuer "$APPLE_NOTARY_API_ISSUER_ID")
          rc=0
          /usr/bin/xcrun notarytool submit "$notary/aggrega-macos.zip" "${credentials[@]}" \
            --output-format json > "$notary/submission.json" || rc=$?
          /bin/cat "$notary/submission.json"
          echo
          id="$(/usr/bin/plutil -extract id raw -o - "$notary/submission.json" 2>/dev/null || true)"
          re_id='^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'
          if [ "$rc" != 0 ] || ! [[ $id =~ $re_id ]]; then
            echo "sign-macos: Apple's notary service did not take the submission (notarytool exited $rc, submission ID '$id'); its answer is printed above" >&2
            exit 1
          fi
          printf 'submission_id=%s\n' "$id" >> "$GITHUB_OUTPUT"
          echo "sign-macos: submitted the macOS binaries to Apple's notary service as submission $id; notarization-check reads Apple's answer at the end of the run"
          printf -- '- macOS notarization: the signed binaries are submitted to Apple as submission `%s`; notarization-check reads its outcome at the end of the run\n' "$id" >> "$GITHUB_STEP_SUMMARY"

      - name: Write the SHA-256 lists of the signed binaries
        # SHA256SUMS beside each target's three binaries, in the form sha256sum
        # writes, in bytewise order of their names: macos-smoke holds the
        # binaries it runs to it, sign-and-publish attaches the binaries only
        # when they still match it, and notarization-check holds the ones whose
        # notarization it checks to it, so what ships is byte for byte what Apple
        # was handed and what ran on macOS. Written after the submission was
        # taken, so no list names bytes Apple was not handed.
        run: |
          for dir in "$RUNNER_TEMP"/macos-signing/signed/darwin-*; do
            names=()
            while IFS= read -r name; do
              names+=("$name")
            done < <(cd "$dir" && /bin/ls -1 | LC_ALL=C /usr/bin/sort)
            (cd "$dir" && /usr/bin/shasum -a 256 -- "${names[@]}" > SHA256SUMS.partial && /bin/mv SHA256SUMS.partial SHA256SUMS)
            echo "signed and submitted for notarization, as ${dir##*/} hands them on:"
            /bin/cat "$dir/SHA256SUMS"
          done

      - name: Upload the signed darwin/arm64 binaries and their list
        # One workflow artifact per target, read by that target's macos-smoke
        # run, by sign-and-publish and by notarization-check of this same run,
        # so the release attaches
        # the very bytes the macOS run ran; deleted by clean-up when the run
        # ends (kept a day at most should clean-up never run).
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-binaries-signed-darwin-arm64
          path: ${{ runner.temp }}/macos-signing/signed/darwin-arm64
          if-no-files-found: error
          retention-days: 1

      - name: Upload the signed darwin/amd64 binaries and their list
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-binaries-signed-darwin-amd64
          path: ${{ runner.temp }}/macos-signing/signed/darwin-amd64
          if-no-files-found: error
          retention-days: 1

      - name: Remove the keychain and this job's directory
        # Whatever the steps above did: the keychain, should the signing step
        # have ended without deleting it, and everything this job wrote in the
        # runner's temporary directory — the binaries, the archive, Apple's
        # reply to the submission and the notary key's directory.
        if: ${{ always() }}
        run: |
          work="$RUNNER_TEMP/macos-signing"
          keychain="$work/signing.keychain-db"
          if [ -e "$keychain" ]; then
            /usr/bin/security delete-keychain "$keychain" || true
            echo "sign-macos: deleted the keychain the signing step left"
          fi
          /bin/rm -rf -- "$work"
          if [ -e "$work" ]; then
            echo "sign-macos: $work is still there after its removal" >&2
            exit 1
          fi
          echo "ok: no keychain, key or binary of this job is left in the runner's temporary directory"

  sign-and-publish:
    # Waits for the build, for sign-windows, sign-macos and for every smoke run —
    # windows-smoke, both targets of macos-smoke and linux-smoke — and starts only when each
    # one succeeded, but for sign-macos, which may instead have been skipped on
    # registry-credential's macOS decision of unsigned: the if: below takes the
    # place of the default for that alone, and names every other job it needs
    # as having succeeded, so it never starts beside one that did not.
    # sign-windows and sign-macos are
    # skipped on a decision to skip the signing, and this job is skipped with
    # them there, so the unsigned binaries windows-smoke and macos-smoke run on
    # that decision never reach it. The smoke
    # jobs' own if: lets each run when its signing was skipped so, and decides
    # that job alone: this job's needs name sign-windows and sign-macos
    # themselves. While macOS signing is off — the decision unsigned —
    # sign-windows has signed and sign-macos is skipped, and this job takes the
    # macOS binaries unsigned from the build job's artifact, held to the list
    # the build wrote of them — copies, made in the build job, of the files it
    # staged for macos-smoke too — and says in the release notes that they are
    # not signed or notarized.
    # Nothing is pushed, signed,
    # published or released unless the
    # binaries passed on their own platforms, and a dry run prints its plan only
    # once they have. The build is named as well because a job reads the
    # outputs only of the jobs it names, registry-credential for its macOS
    # decision, sign-windows because this job
    # attaches the Windows binaries it signed, sign-windows-installer
    # because it attaches the installer that job signed, skipped with
    # sign-windows, and sign-macos because it attaches the macOS binaries that
    # job signed; from the smoke jobs this job reads nothing but their result.
    needs: [registry-credential, build, sign-windows, sign-windows-installer, sign-macos, windows-smoke, macos-smoke, linux-smoke]
    if: >-
      ${{ !cancelled()
      && needs.registry-credential.result == 'success'
      && needs.build.result == 'success'
      && needs.sign-windows.result == 'success'
      && needs.sign-windows-installer.result == 'success'
      && (needs.sign-macos.result == 'success'
      || (needs.sign-macos.result == 'skipped' && needs.registry-credential.outputs.macos_signing == 'unsigned'))
      && needs.windows-smoke.result == 'success'
      && needs.macos-smoke.result == 'success'
      && needs.linux-smoke.result == 'success' }}
    # The runner the build ran on, with no hosted fallback: this job reads the
    # release inputs from the hand-over folder on that machine's disk.
    runs-on: ${{ vars.AGGREGA_RUNNER }}
    environment: release
    permissions:
      contents: write
      id-token: write

    # What the plugin publish printed, on a real publish: record-published reads
    # each published plugin's reference, version and digest from it. Empty on a
    # dry run, which publishes nothing.
    #
    # The Homebrew formula and the Scoop manifest the render step wrote, and the
    # version their binaries carry: publish-package-channels commits the two
    # files to the tap and the bucket. The winget manifest's three files, one
    # line each as scripts/open-winget-pull-request.sh --pack writes them:
    # open-winget-pull-request adds them to winget-pkgs. publish-downloads names
    # the Windows installer and its address in the download bucket from the
    # version. Set on a dry run too, which renders them.
    #
    # Whether the tag carries a pre-release suffix, true or false, as the
    # release step decides it, on a dry run too: publish-skills,
    # publish-package-channels, open-winget-pull-request and publish-downloads
    # are skipped when it is true. Each reads it as not true rather than as
    # false, so were it
    # ever missing, each would run as on a final release, and on a real
    # publish its own refusal of a tag that is not a release tag would fail a
    # pre-release loudly rather than a final release's channels being skipped.
    outputs:
      plugin_push_output: ${{ steps.plugins.outputs.push_output }}
      homebrew_formula: ${{ steps.package-channels.outputs.formula }}
      scoop_manifest: ${{ steps.package-channels.outputs.manifest }}
      winget_manifest: ${{ steps.package-channels.outputs.winget }}
      release_version: ${{ steps.package-channels.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}

    env:
      # Destination registry host, the same variable the build named the image
      # under.
      REGISTRY: ${{ vars.CLI_PUBLISH_REGISTRY || 'registry.invalid' }}
      # Registry credentials. Read via the environment (not interpolated into a
      # run script) to avoid expression injection. The username feeds
      # `aggrega login`, which reads the password from
      # AGGREGA_REGISTRY_PASSWORD.
      REGISTRY_USERNAME: ${{ vars.REGISTRY_USERNAME }}
      AGGREGA_REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      # Public-good Sigstore endpoints for keyless signing. The binary already
      # defaults to these; they are named here so the direct `aggrega sign`
      # calls state the trust roots explicitly.
      FULCIO_URL: https://fulcio.sigstore.dev
      REKOR_URL: https://rekor.sigstore.dev
      # Event data surfaced as env so run scripts read it from the environment
      # rather than interpolating expressions into shell.
      EVENT_NAME: ${{ github.event_name }}
      DISPATCH_DRY_RUN: ${{ inputs.dry_run }}
      DISPATCH_TAG: ${{ inputs.tag }}
      REF_NAME: ${{ github.ref_name }}
      # This run's macOS decision, sign or unsigned, as registry-credential
      # wrote it: on unsigned, sign-macos signed nothing, and the macOS binaries
      # come unsigned from the build job's artifact.
      MACOS_SIGNING: ${{ needs.registry-credential.outputs.macos_signing }}

    steps:
      # Every step here either readies or performs a publish. The steps with an
      # external side effect are each gated to a real publish (a push event, or a
      # manual dispatch with dry_run=false); on a dry run they print their plan
      # and push, publish, sign, and release nothing.

      - name: Give aggrega a configuration of this run's own
        # As in the build job, and for the same reason: on a persistent
        # self-hosted runner, the runner's user may keep a global aggrega
        # configuration of their own, which would otherwise shape what this run
        # publishes and signs. Every aggrega command in this job reads its global
        # configuration from a directory made empty here instead, named by
        # XDG_CONFIG_HOME, with AGGREGA_CONFIG emptied.
        #
        # The registry credential gets a Docker configuration of this run's own
        # too, made empty in that same directory and named by DOCKER_CONFIG.
        # aggrega login stores the credential in Docker's configuration — the
        # directory DOCKER_CONFIG names, else the user's own $HOME/.docker —
        # and aggrega push, aggrega sign and docker push read it from there.
        # Left to the default, a release would leave its publishing
        # credential in the runner user's own Docker configuration, where
        # nothing logs out. Here the credential lives only for the run: no
        # command in this job reads, writes or cleans the runner user's own
        # Docker configuration, and the last step removes the directory
        # RUN_CONFIG_HOME names, the credential with it. The docker commands
        # this job runs — load, image inspect, tag, push, image rm, and
        # manifest create, push and rm, which join the tooling image's platforms
        # under one tag and keep their working list in this same configuration —
        # are docker's own and need no CLI plugin. docker reaches its daemon as it
        # does with no configuration of its own: through DOCKER_HOST when the
        # runner's environment sets it, otherwise through the default socket.
        # Docker keeps its contexts in its configuration, so none of the user's
        # is available here: a runner whose daemon is reached only through a
        # context needs DOCKER_HOST set in its environment.
        run: |
          set -euo pipefail
          config_home="$(mktemp -d "$RUNNER_TEMP/config-home.XXXXXX")"
          mkdir -m 0700 "$config_home/docker"
          printf 'RUN_CONFIG_HOME=%s\nXDG_CONFIG_HOME=%s\nAGGREGA_CONFIG=\nDOCKER_CONFIG=%s\n' \
            "$config_home" "$config_home" "$config_home/docker" >> "$GITHUB_ENV"

      - name: Check out the CLI at the commit the build job built
        # For the publishing scripts, and the install scripts the release
        # attaches, taken from the repository at the commit the build job built
        # rather than handed over by that job: the commit every smoke run checks
        # out and runs the install scripts from.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: aggrega-cli
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false

      - name: Make this run's own directories
        # On the persistent self-hosted runner AGGREGA_RUNNER names, a fixed
        # name in the runner's temporary directory can still hold an earlier
        # run's files, which this run would then read as inputs it was handed or
        # release beside its own. The signed Windows binaries arrive in a
        # directory of this run's own, WINDOWS_SIGNED, the signed Windows
        # installer in another, WINDOWS_INSTALLER, the signed macOS binaries in
        # a third, MACOS_SIGNED, one directory per target beneath it — or, while
        # macOS signing is off, the unsigned ones in MACOS_UNSIGNED — the
        # release assets are assembled in a fourth, RELEASE_DIR, and the
        # Homebrew formula, the Scoop manifest and the winget manifest are
        # rendered into a fifth, CHANNELS_DIR, all made empty
        # here; the steps below read them from the environment, and the last
        # steps remove them.
        # The release inputs are read where the build job left them, in this
        # run's hand-over folder, INPUTS, once the next step has held that
        # folder to its list; clean-up removes the folder.
        run: |
          set -euo pipefail
          [ -n "$RELEASE_HANDOVER" ] || { echo "sign-and-publish: RELEASE_HANDOVER is empty" >&2; exit 1; }
          handover="$(dirname "$RUNNER_TEMP")/$RELEASE_HANDOVER"
          windows_signed="$(mktemp -d "$RUNNER_TEMP/windows-signed.XXXXXX")"
          windows_installer="$(mktemp -d "$RUNNER_TEMP/windows-installer.XXXXXX")"
          macos_signed="$(mktemp -d "$RUNNER_TEMP/macos-signed.XXXXXX")"
          macos_unsigned="$(mktemp -d "$RUNNER_TEMP/macos-unsigned.XXXXXX")"
          release="$(mktemp -d "$RUNNER_TEMP/release.XXXXXX")"
          channels="$(mktemp -d "$RUNNER_TEMP/channels.XXXXXX")"
          printf 'HANDOVER=%s\nINPUTS=%s\nWINDOWS_SIGNED=%s\nWINDOWS_INSTALLER=%s\nMACOS_SIGNED=%s\nMACOS_UNSIGNED=%s\nRELEASE_DIR=%s\nCHANNELS_DIR=%s\n' \
            "$handover" "$handover/release-inputs" "$windows_signed" "$windows_installer" "$macos_signed" "$macos_unsigned" "$release" "$channels" >> "$GITHUB_ENV"

      - name: Hold the hand-over folder to the build job's list
        # Before anything in it is used or run: every file in this run's
        # hand-over folder, on this machine, must be one SHA256SUMS names, each
        # once, with the SHA-256 it gives, and the list must name nothing else —
        # so a file changed, added or removed since the build job wrote the list
        # is refused. It is read by smoke_check_tree_sums, through
        # smoke_check_sums, the same function that holds the signed Windows
        # binaries to theirs below, from the repository's own smoke library at
        # the commit the build job built. A folder that is not here means the
        # build ran on another machine or in another attempt, and is refused; so
        # is anything in the folder that is neither a file nor a directory. A dry
        # run checks too.
        run: |
          set -euo pipefail
          if [ ! -d "$HANDOVER" ] || [ ! -O "$HANDOVER" ] || [ ! -f "$HANDOVER/SHA256SUMS" ]; then
            echo "sign-and-publish: this run's hand-over folder $HANDOVER, with its list, is not on this machine: the build job of this run attempt left none here. sources, build, sign-windows, windows-installer, sign-windows-installer, sign-and-publish, record-published and clean-up run on the one machine AGGREGA_RUNNER names, in one attempt; re-run every job, not only the failed ones" >&2
            exit 1
          fi
          . aggrega-cli/scripts/lib/platform-smoke-common.sh
          smoke_require_bash
          smoke_check_tree_sums "$HANDOVER"

      - name: Download the signed Windows binaries
        # The artifact sign-windows uploaded and windows-smoke ran: the three
        # signed binaries and their SHA-256 list.
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-binaries-signed
          path: ${{ env.WINDOWS_SIGNED }}

      - name: Download the signed Windows installer
        # The artifact sign-windows-installer uploaded and windows-smoke ran:
        # the signed installer and its SHA-256 list.
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-installer-signed
          path: ${{ env.WINDOWS_INSTALLER }}

      - name: Hold the signed Windows binaries and installer to their lists
        # Before anything is pushed, published or released: each signed binary
        # must have the SHA-256 that sign-windows' list gives it, the list
        # naming exactly the Windows binaries the release carries, and the
        # signed installer the one sign-windows-installer's list gives it, that
        # list naming it alone, so what the
        # release attaches is byte for byte what windows-smoke ran and checked.
        # It is the same check that smoke run makes, from the same function, in
        # the repository's own smoke library at the commit the build job built;
        # the release step below refuses a file that is missing. A dry run
        # checks too.
        run: |
          set -euo pipefail
          . aggrega-cli/scripts/lib/platform-smoke-common.sh
          smoke_require_bash
          names="$(smoke_target_binaries windows/amd64)"
          mapfile -t windows_binaries <<<"$names"
          smoke_check_sums "$WINDOWS_SIGNED/SHA256SUMS" "$WINDOWS_SIGNED" "${windows_binaries[@]}"
          installer="$(smoke_target_installer windows/amd64)"
          smoke_check_sums "$WINDOWS_INSTALLER/SHA256SUMS" "$WINDOWS_INSTALLER" "$installer"

      - name: Download the signed darwin/arm64 binaries
        # The artifact sign-macos uploaded for darwin/arm64 and that target's
        # macos-smoke run ran: the three signed binaries, submitted to Apple for
        # notarization, and their SHA-256 list. Not while macOS signing is off, when sign-macos signed
        # nothing and uploaded nothing.
        if: ${{ env.MACOS_SIGNING == 'sign' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-binaries-signed-darwin-arm64
          path: ${{ env.MACOS_SIGNED }}/darwin-arm64

      - name: Download the signed darwin/amd64 binaries
        # The same for darwin/amd64.
        if: ${{ env.MACOS_SIGNING == 'sign' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-binaries-signed-darwin-amd64
          path: ${{ env.MACOS_SIGNED }}/darwin-amd64

      - name: Download the unsigned macOS binaries
        # While macOS signing is off: the artifact the build job uploaded for
        # sign-macos, the six macOS binaries unsigned, the entitlements file and
        # SHA256SUMS, the build's list of the seven.
        if: ${{ env.MACOS_SIGNING == 'unsigned' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-binaries-unsigned
          path: ${{ env.MACOS_UNSIGNED }}

      - name: Hold the unsigned macOS binaries to the build job's list
        # While macOS signing is off, before anything is pushed, published or
        # released: the list must have the SHA-256 the build job gave as its
        # macos_unsigned_sums output, so it is the list the build wrote, and
        # must name exactly the six macOS binaries and the entitlements file,
        # each with the digest of the file here, held by the smoke library's one
        # reader of such lists. So what the release attaches is byte for byte
        # what the build wrote. The release step below refuses a file that is
        # missing. A dry run checks too.
        if: ${{ env.MACOS_SIGNING == 'unsigned' }}
        env:
          LISTED_SUMS: ${{ needs.build.outputs.macos_unsigned_sums }}
        run: |
          set -euo pipefail
          . aggrega-cli/scripts/lib/platform-smoke-common.sh
          smoke_require_bash
          list="$MACOS_UNSIGNED/SHA256SUMS"
          [ -f "$list" ] || { echo "sign-and-publish: the build job's macOS artifact holds no SHA256SUMS" >&2; exit 1; }
          actual="$(sha256sum < "$list")"
          actual="${actual%% *}"
          if [ -z "$LISTED_SUMS" ] || [ "$actual" != "$LISTED_SUMS" ]; then
            echo "sign-and-publish: the list in the build job's macOS artifact has SHA-256 $actual, but the build job wrote one with SHA-256 '$LISTED_SUMS'" >&2
            exit 1
          fi
          echo "ok: SHA256SUMS is the list the build job wrote, SHA-256 $actual"
          names=()
          for target in darwin/arm64 darwin/amd64; do
            listed="$(smoke_target_binaries "$target")"
            mapfile -t target_binaries <<<"$listed"
            names+=("${target_binaries[@]}")
          done
          entitlements="$(smoke_macos_entitlements)"
          names+=("${entitlements##*/}")
          smoke_check_sums "$list" "$MACOS_UNSIGNED" "${names[@]}"
          echo "sign-and-publish: the macOS binaries this release attaches are not signed or notarized: the repository variable AGGREGA_MACOS_SIGNING is not true"

      - name: Hold the signed macOS binaries to their lists
        # Before anything is pushed, published or released: each target's
        # signed binaries must have the SHA-256 that sign-macos' list for that
        # target gives them, the list naming exactly the binaries the release
        # carries for it, so what the release attaches is byte for byte what
        # Apple was handed to notarize and what macos-smoke ran and checked. It is the same
        # check that smoke run makes, from the same function; the release step
        # below refuses a file that is missing. A dry run checks too.
        if: ${{ env.MACOS_SIGNING == 'sign' }}
        run: |
          set -euo pipefail
          . aggrega-cli/scripts/lib/platform-smoke-common.sh
          smoke_require_bash
          for target in darwin/arm64 darwin/amd64; do
            names="$(smoke_target_binaries "$target")"
            mapfile -t macos_binaries <<<"$names"
            dir="$MACOS_SIGNED/${target/\//-}"
            smoke_check_sums "$dir/SHA256SUMS" "$dir" "${macos_binaries[@]}"
          done

      - name: Hold the built binary to the release
        # The hand-over folder keeps each file's mode, so the binary this job
        # runs is executable as the build job wrote it, and one that is not is
        # refused rather than made so. Whenever a release tag is in play, the
        # binary must report that tag's version, as the build job's ABI gate held
        # it to, so the job publishes the build it was handed and no other. Later
        # steps find the binary through AGGREGA_BIN, and the inputs through
        # INPUTS.
        run: |
          set -euo pipefail
          [ -x "$INPUTS/bin/aggrega" ] || { echo "the build job handed over no executable aggrega at $INPUTS/bin/aggrega" >&2; exit 1; }
          # Whitespace is stripped before the match so the extraction is insensitive to
          # the pretty-printer, and it needs no jq. Stripping the whole payload is safe
          # only where the extracted value contains no whitespace, which holds for the
          # version string read here.
          BIN_VERSION="$("$INPUTS/bin/aggrega" version -o json | tr -d '[:space:]' | grep -o '"version":"[^"]*"' | head -1 | cut -d'"' -f4)"
          [ -n "$BIN_VERSION" ] || { echo "the handed-over binary reported no version" >&2; exit 1; }
          if [ "$EVENT_NAME" = "push" ]; then
            TAG="$REF_NAME"
          else
            TAG="$DISPATCH_TAG"
          fi
          if [ -n "$TAG" ] && [ "$BIN_VERSION" != "${TAG#v}" ]; then
            echo "the handed-over binary reports version '$BIN_VERSION', not the release tag '${TAG#v}'" >&2
            exit 1
          fi
          echo "AGGREGA_BIN=$INPUTS/bin/aggrega" >> "$GITHUB_ENV"
          echo "publishing version $BIN_VERSION from $INPUTS"

      - name: Authenticate to the registry
        # Only a real publish logs in. A dry run's one contact with the registry
        # is the credential check that opens the run, which needs no stored
        # login. The tooling-image push (docker) and the plugin publish
        # (aggrega) authenticate with the same registry credential, and one
        # login stores it for both; the password is read from the environment,
        # never placed on a command line or interpolated.
        #
        # aggrega login, given a Docker configuration that names no credential
        # helper — this run's own, which DOCKER_CONFIG names, made empty above —
        # writes the credential into that configuration's file, config.json, as
        # the entry for the registry under auths, the form docker reads. docker
        # push reads it from there, and the job runs no docker login. So no
        # command here stores the credential with a credential helper of the
        # machine, in the runner user's own password store or keyring, which
        # the last step does not clean: docker login, run against a
        # configuration that records no credential, looks for one — on Linux,
        # docker-credential-pass when pass is installed, else
        # docker-credential-secretservice — and stores the credential with it
        # when one is installed, while docker push, finding the credential
        # recorded, looks for none and stores nothing.
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
        run: |
          set -euo pipefail
          "$AGGREGA_BIN" login "$REGISTRY" --username "$REGISTRY_USERNAME"

      - name: Mint the Sigstore OIDC identity token
        # Keyless signing needs a short-lived OIDC identity token. Request one
        # from the Actions runtime (available because id-token:write is granted
        # to this job, as to sign-windows, which mints its own for Azure and
        # nothing else), audience-scoped to sigstore, and export it as
        # SIGSTORE_ID_TOKEN so every `aggrega sign` in later steps reads it
        # non-interactively — no browser, no offline key. Only a real publish
        # signs, so a dry run skips this.
        #
        # The request credential reaches curl on its standard input, which -H @-
        # reads as header lines, and never on its command line: a command line
        # is readable in the process list by every other user of the machine,
        # which on the persistent self-hosted runner AGGREGA_RUNNER names may
        # be someone else. printf is the shell's own, so it starts no process
        # whose command line carries the credential either.
        # The request is bounded and retried: an unbounded request waits forever on a stalled connection.
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
        timeout-minutes: 5
        run: |
          set -euo pipefail
          token_json="$(printf 'Authorization: bearer %s\n' "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" |
            curl -sSL --connect-timeout 15 --max-time 60 --retry 5 --retry-delay 5 --retry-all-errors \
              -H @- "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sigstore")"
          id_token="$(printf '%s' "$token_json" | grep -o '"value":"[^"]*"' | head -1 | cut -d'"' -f4)"
          [ -n "$id_token" ] || { echo "OIDC: runtime returned no token value" >&2; exit 1; }
          echo "::add-mask::$id_token"
          echo "SIGSTORE_ID_TOKEN=$id_token" >> "$GITHUB_ENV"

      - name: Publish and sign the tooling image
        # Loads the build job's archives, one per platform, and checks each
        # carries the version reference and an image for the platform its line
        # names; then pushes each platform's image under the version tag in turn
        # and, once both are stored, joins them by digest in one index pushed
        # under the version tag and the moving :stable tag, so `docker pull` on
        # x86-64 and on ARM each gets its own image and no tag is left naming a
        # single platform's. The index goes last because the registry accepts it
        # only when every image it names is already stored. Then it signs the
        # version reference by reference, keyless against public Sigstore; the
        # signature resolves to the index digest, which :stable shares, so it
        # covers :stable too. Nothing is built here. A dry run loads and checks
        # the archives, then prints what it would push and sign, pushing
        # nothing. The image tag equals the binary's reported version (v-less),
        # so the pushed reference and the binary stay in lockstep.
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            DRY="$DISPATCH_DRY_RUN"
          else
            DRY="false"
          fi

          if [ "$DRY" = "true" ]; then
            aggrega-cli/scripts/publish-tooling-image.sh --archive-dir "$INPUTS/image" \
              --registry "$REGISTRY" --dry-run
            exit 0
          fi

          aggrega-cli/scripts/publish-tooling-image.sh --archive-dir "$INPUTS/image" \
            --registry "$REGISTRY"

          # Whitespace is stripped before the match so the extraction is insensitive to
          # the pretty-printer, and it needs no jq. Stripping the whole payload is safe
          # only where the extracted value contains no whitespace, which holds for the
          # version string read here.
          BIN_VERSION="$("$AGGREGA_BIN" version -o json | tr -d '[:space:]' | grep -o '"version":"[^"]*"' | head -1 | cut -d'"' -f4)"
          [ -n "$BIN_VERSION" ] || { echo "binary reported no version" >&2; exit 1; }
          "$AGGREGA_BIN" sign "$REGISTRY/tools/aggrega:$BIN_VERSION" \
            --fulcio-url "$FULCIO_URL" --rekor-url "$REKOR_URL"

      - name: Publish and sign the core plugins
        # Publishes exactly the core plugins the build job stamped, embedded or
        # not: each pair in the build job's pairing — a generated entity and its
        # decompressed guest — pushed and signed keyless against public Sigstore. The pairing
        # was resolved by the build job, so publishing it needs only the binary.
        # A dry run prints the reference set and the sign plan without any
        # network call or signing.
        #
        # A real publish also hands what it printed, unchanged, to
        # record-published as this job's plugin_push_output: each push's
        # "Push complete:" or "Already published:" line carries the reference,
        # the version and the digest exactly as the push computed and published
        # it, and record-published reads them from there rather than computing
        # anything again. The output is written under a delimiter drawn at
        # random for this run, so no line the push prints can end it early.
        id: plugins
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            DRY="$DISPATCH_DRY_RUN"
          else
            DRY="false"
          fi

          args=(--pairs "$INPUTS/plugins/pairs.tsv" --registry "$REGISTRY")
          if [ "$DRY" = "true" ]; then
            args+=(--dry-run)
            aggrega-cli/scripts/publish-plugin-pairs.sh "${args[@]}"
            exit 0
          fi

          # Keyless signing: each pair is signed through
          # `aggrega push --plugin --sign`, which reads the identity token from
          # SIGSTORE_ID_TOKEN (minted above) and uses the binary's public
          # Sigstore defaults for Fulcio and Rekor.
          args+=(--sign)
          printed="$(mktemp "$RUNNER_TEMP/plugin-push-output.XXXXXX")"
          trap 'rm -f -- "$printed"' EXIT
          aggrega-cli/scripts/publish-plugin-pairs.sh "${args[@]}" | tee "$printed"

          delimiter="plugin-push-output-$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          {
            printf 'push_output<<%s\n' "$delimiter"
            awk 1 "$printed"
            printf '%s\n' "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Create the GitHub release and upload the binaries, the Windows installer, the extension package, the install scripts, the software bill of materials and SHA256SUMS
        # The final side effect: attach the default, debug and light binaries for
        # linux/amd64, linux/arm64, windows/amd64, darwin/arm64 and darwin/amd64,
        # the Windows installer, the desktop extension package, the install scripts install.sh and
        # install.ps1, the quickstart scripts quickstart-ai.sh, quickstart-ai.ps1,
        # quickstart-web.sh and quickstart-web.ps1, each of which runs one step of
        # an example from the documentation, the software bill of materials
        # aggrega-<version>.spdx, and SHA256SUMS, the SHA-256 list of all of them, to the
        # GitHub release for this tag so they are downloadable from the release
        # page. The default binary, under the plain name, is the
        # debug one without its debug information. The linux/amd64 and linux/arm64
        # ones are the very files the tooling image carries for those platforms,
        # which the image step copied as they are, so the assets and the image
        # cannot differ. The ARM Linux
        # ones are the files the build job's steps for them wrote, each already
        # held to the Linux binary's version. The macOS ones are the files the
        # build job's macOS steps wrote, held to that version too, as sign-macos
        # signed them and submitted them to Apple: the step above held them to
        # sign-macos' SHA-256 lists, so they are byte for byte the files each
        # macos-smoke run ran and whose signatures it checked, and the files
        # whose notarization notarization-check checks once Apple accepts them;
        # while macOS signing is off, they are those files unsigned, as the
        # build job wrote them, held above to its list, and the release notes
        # say they are not signed or notarized.
        # The Windows ones are the files the
        # build job's Windows steps wrote, held to that version too, as
        # sign-windows signed them: the step above held them to sign-windows'
        # SHA-256 list, so they are byte for byte the files windows-smoke ran and
        # whose signatures it checked. Those are signed bytes, which differ from
        # one signing to the next; what the build reproduces is the unsigned
        # bytes, and the Authenticode digest, which leaves the signature out, is
        # the same for both. The Windows installer is the one
        # sign-windows-installer signed, held to its list above, the one
        # windows-smoke installed and uninstalled, attached under the namer's
        # name for it, aggrega-<version>-windows-amd64-setup.exe. The extension package is the file the pack step
        # wrote, copied under the name the pack script gave it. Which binaries a
        # target's release carries, and under what names the build writes them,
        # is read from the smoke library's smoke_target_binaries for every target
        # it lists, the list the smoke runs ran; linux/amd64, which this build
        # machine is, writes them under the bare names. The name each is attached
        # under is the library's smoke_release_asset_name, which the smoke runs'
        # install step names its release folder with too. The install scripts
        # are read from this job's checkout, packaging/install/ at the commit the
        # build job built — the commit each smoke run checks out, whose install
        # step ran these very scripts on its platform — and are attached under
        # their own names, so releases/latest/download/install.sh is always the
        # latest release's. The quickstart scripts are read from the same
        # checkout and attached the same way, under their own names; no smoke
        # run runs them. The embedded guests are
        # NOT uploaded here — they publish to the registry with their Plugin
        # entities; the release carries only the runnable binaries, the Windows
        # installer, the extension package, the install and quickstart scripts, the software bill of materials and the list, and GitHub
        # attaches the source archives on its own. The step refuses to release
        # when any of those files is missing, and refuses to re-publish a
        # release that already carries the Windows installer (below).
        #
        # SHA256SUMS is written here, from the very files the release attaches,
        # once this run's release directory holds exactly them, by the smoke
        # library's one writer of such lists, in the form sha256sum writes and
        # `sha256sum -c` reads; it is then held to them by the library's one
        # reader of such lists, which refuses unless it names each attached file
        # exactly once, with the digest of the bytes about to be attached, and
        # nothing else. So a release whose list misses an asset, names one it
        # does not attach or gives one other bytes is refused before anything is
        # created, and what a downloader checks against is what was uploaded,
        # the signed Windows binaries and installer and the signed macOS
        # binaries included. A dry run writes and checks the
        # list too, prints it with the planned release and asset names, and
        # creates nothing. The release lands on this repository — GH_REPO pins it
        # explicitly — for the tag the human already pushed; contents:write
        # authorizes it. Asset names carry the binary's reported version; the
        # binaries' also carry their build's target, with .exe for windows/amd64,
        # and the extension package's carries none, because it holds no program
        # and serves every platform its manifest declares. The install scripts'
        # names carry no version, so a link to the latest release's copy never
        # changes.
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            DRY="$DISPATCH_DRY_RUN"
            TAG="$DISPATCH_TAG"
          else
            DRY="false"
            TAG="$REF_NAME"
          fi

          # Whitespace is stripped before the match so the extraction is insensitive to
          # the pretty-printer, and it needs no jq. Stripping the whole payload is safe
          # only where the extracted value contains no whitespace, which holds for the
          # version and ABI version strings read here.
          BIN_VERSION="$("$AGGREGA_BIN" version -o json | tr -d '[:space:]' | grep -o '"version":"[^"]*"' | head -1 | cut -d'"' -f4)"
          [ -n "$BIN_VERSION" ] || { echo "binary reported no version" >&2; exit 1; }
          # The version the asset names carry, for the step that renders the
          # Homebrew formula, the Scoop manifest and the winget manifest from
          # these assets.
          printf 'RELEASE_VERSION=%s\n' "$BIN_VERSION" >> "$GITHUB_ENV"

          . aggrega-cli/scripts/lib/platform-smoke-common.sh
          smoke_require_bash

          BIN="$INPUTS/bin"

          # The extension package is the one file the pack step wrote; refuse
          # rather than release without it, or with a second one beside it.
          shopt -s nullglob
          bundles=("$INPUTS"/mcp-bundle/*.mcpb)
          shopt -u nullglob
          if [ "${#bundles[@]}" -ne 1 ]; then
            echo "the pack step wrote ${#bundles[@]} extension package(s) into '$INPUTS/mcp-bundle'; expected exactly one" >&2
            exit 1
          fi
          MCP_BUNDLE="${bundles[0]}"

          # The one list of what the release carries: the dry run prints it, and
          # the upload and the creation attach exactly it. attach copies a file
          # into RELEASE_DIR, this run's own directory made empty by the step
          # that makes this run's own directories, under its asset name, and
          # refuses rather than release without it when it is missing.
          ASSETS=()
          attach() { # <file> <asset name> <where it comes from>
            if [ ! -f "$1" ]; then
              echo "found no $(basename "$1") from $3 (expected at '$1'); refusing to release without it" >&2
              exit 1
            fi
            cp "$1" "$RELEASE_DIR/$2"
            ASSETS+=("$RELEASE_DIR/$2")
          }
          for variant in aggrega aggrega-debug aggrega-light; do
            asset="$(smoke_release_asset_name linux/amd64 "$BIN_VERSION" "$variant")"
            attach "$BIN/$variant" "$asset" "the linux/amd64 build steps"
          done
          names="$(smoke_target_binaries linux/arm64)"
          while IFS= read -r name; do
            asset="$(smoke_release_asset_name linux/arm64 "$BIN_VERSION" "$name")"
            attach "$BIN/$name" "$asset" "the linux/arm64 build steps"
          done <<<"$names"
          # The macOS binaries as sign-macos signed them, or, while macOS
          # signing is off, as the build wrote them; the release notes say which.
          case "$MACOS_SIGNING" in
            sign) MACOS_NOTE="macOS files are signed with the Developer ID of COGNITIO SRL and notarized by Apple" ;;
            unsigned) MACOS_NOTE="macOS files are not signed or notarized" ;;
            *) echo "sign-and-publish: the macOS signing decision is '$MACOS_SIGNING', neither sign nor unsigned" >&2; exit 1 ;;
          esac
          for target in darwin/arm64 darwin/amd64; do
            names="$(smoke_target_binaries "$target")"
            while IFS= read -r name; do
              asset="$(smoke_release_asset_name "$target" "$BIN_VERSION" "$name")"
              if [ "$MACOS_SIGNING" = sign ]; then
                attach "$MACOS_SIGNED/${target/\//-}/$name" "$asset" "sign-macos"
              else
                attach "$MACOS_UNSIGNED/$name" "$asset" "the build job's macOS steps, unsigned"
              fi
            done <<<"$names"
          done
          names="$(smoke_target_binaries windows/amd64)"
          while IFS= read -r name; do
            asset="$(smoke_release_asset_name windows/amd64 "$BIN_VERSION" "$name")"
            attach "$WINDOWS_SIGNED/$name" "$asset" "sign-windows"
          done <<<"$names"
          installer="$(smoke_target_installer windows/amd64)"
          WINDOWS_SETUP="$(smoke_release_asset_name windows/amd64 "$BIN_VERSION" "$installer")"
          attach "$WINDOWS_INSTALLER/$installer" "$WINDOWS_SETUP" "sign-windows-installer"
          attach "$MCP_BUNDLE" "$(basename "$MCP_BUNDLE")" "the pack step"
          # The install scripts and the quickstart scripts, each named once by
          # its path in this checkout, which is what the release job isolation
          # check reads them by, and attached under its own file name.
          INSTALL_SH=aggrega-cli/packaging/install/install.sh
          INSTALL_PS1=aggrega-cli/packaging/install/install.ps1
          QUICKSTART_AI_SH=aggrega-cli/packaging/install/quickstart-ai.sh
          QUICKSTART_AI_PS1=aggrega-cli/packaging/install/quickstart-ai.ps1
          QUICKSTART_WEB_SH=aggrega-cli/packaging/install/quickstart-web.sh
          QUICKSTART_WEB_PS1=aggrega-cli/packaging/install/quickstart-web.ps1
          for script in "$INSTALL_SH" "$INSTALL_PS1" \
            "$QUICKSTART_AI_SH" "$QUICKSTART_AI_PS1" "$QUICKSTART_WEB_SH" "$QUICKSTART_WEB_PS1"; do
            attach "$script" "${script##*/}" "the checkout of the commit the build job built"
          done
          # The software bill of materials of the binary and the plugins it
          # embeds: the checkout's THIRD-PARTY.spdx, copied as it is under the
          # version-named file, so the release carries the very bytes tracked at
          # this tag. A checkout without it refuses the release.
          attach aggrega-cli/THIRD-PARTY.spdx "aggrega-$BIN_VERSION.spdx" "the checkout of the commit the build job built"
          # Where this release's own files download from: the install commands
          # in the release notes fetch the scripts attached to this release and
          # set AGGREGA_VERSION, the scripts' own setting for the release to
          # install, so a release page's commands install that release and not
          # whichever is the latest when they are run.
          RELEASE_DOWNLOAD="https://github.com/$GH_REPO/releases/download/$TAG"

          # SHA256SUMS, written from the files RELEASE_DIR now holds, which are
          # exactly the ones in ASSETS, then held to ASSETS by name and digest.
          smoke_write_tree_sums "$RELEASE_DIR"
          asset_names=()
          for asset in "${ASSETS[@]}"; do
            asset_names+=("$(basename "$asset")")
          done
          smoke_check_sums "$RELEASE_DIR/SHA256SUMS" "$RELEASE_DIR" "${asset_names[@]}"
          ASSETS+=("$RELEASE_DIR/SHA256SUMS")

          # The release notes, written once as GitHub Markdown: the dry run
          # prints them, and the creation below gives them to the release. The
          # tap and the bucket they name are the ones publish-package-channels
          # commits the newest release's formula and manifest to, so the notes
          # say they install the newest release rather than this one.
          OWNER="${GH_REPO%%/*}"
          NOTES="$(cat <<EOF
          ## Install

          These commands install this release, $BIN_VERSION.

          Linux and macOS:

          \`\`\`sh
          curl -fsSL $RELEASE_DOWNLOAD/${INSTALL_SH##*/} | AGGREGA_VERSION=$BIN_VERSION sh
          \`\`\`

          Windows (PowerShell):

          \`\`\`powershell
          \$env:AGGREGA_VERSION = '$BIN_VERSION'; irm $RELEASE_DOWNLOAD/${INSTALL_PS1##*/} | iex
          \`\`\`

          Both install the default \`aggrega\` for the current user and check it against \`SHA256SUMS\`.

          **Windows installer:** run \`$WINDOWS_SETUP\`. No administrator rights; installs into \`%LOCALAPPDATA%\Programs\aggrega\` and adds it to your PATH. \`/S\` installs silently; \`uninstall.exe /S\` in that folder removes it.

          Homebrew and Scoop install the newest release: \`brew install $OWNER/${HOMEBREW_TAP_REPOSITORY#homebrew-}/aggrega\`, or \`scoop bucket add aggrega https://github.com/$OWNER/$SCOOP_BUCKET_REPOSITORY\` then \`scoop install aggrega\`.

          ## Files

          Binaries for linux/amd64, linux/arm64, darwin/arm64, darwin/amd64 and windows/amd64 (\`.exe\`):

          | File | What it is |
          |---|---|
          | \`aggrega-$BIN_VERSION-<os>-<arch>\` | The default build, with the core plugins embedded |
          | \`aggrega-debug-$BIN_VERSION-<os>-<arch>\` | The same build with debug information, for a debugger or a profiler |
          | \`aggrega-light-$BIN_VERSION-<os>-<arch>\` | No embedded plugins; resolves plugins through the cascade |
          | \`$WINDOWS_SETUP\` | Windows installer |
          | \`$(basename "$MCP_BUNDLE")\` | Claude Desktop extension: runs an installed \`aggrega\` as a local MCP server; one file for every OS |
          | \`${INSTALL_SH##*/}\`, \`${INSTALL_PS1##*/}\` | Install scripts |
          | \`${QUICKSTART_AI_SH##*/}\`, \`${QUICKSTART_AI_PS1##*/}\`, \`${QUICKSTART_WEB_SH##*/}\`, \`${QUICKSTART_WEB_PS1##*/}\` | Quickstart scripts: each runs one step of an example from the documentation |
          | \`aggrega-$BIN_VERSION.spdx\` | Software bill of materials of the binary and the plugins it embeds, in SPDX |
          | \`SHA256SUMS\` | SHA-256 of every other file; check with \`sha256sum -c SHA256SUMS\` |

          **Signing:** Windows files carry a timestamped Authenticode signature from Cognitio S.r.l.; $MACOS_NOTE.
          EOF
          )"
          # What changed in this release, above how to install it: the tag's
          # section of CHANGELOG.md in the checkout of the commit the build job
          # built, taken by release-changes.sh. A commit whose CHANGELOG.md has no
          # section for the tag gets no Changes section; nothing is written in its
          # place. A section holding an HTML comment fails this step, a dry run
          # included, before anything is published.
          CHANGES="$(aggrega-cli/.github/scripts/release-changes.sh "$TAG" aggrega-cli/CHANGELOG.md)"
          if [ -n "$CHANGES" ]; then
            NOTES="$(printf '## Changes\n\n%s\n\n%s' "$CHANGES" "$NOTES")"
          fi

          # A tag carrying a pre-release suffix (v0.9.0-rc.1) is published as a
          # pre-release and never as the latest release: the install scripts,
          # run with no version, download from the latest release, which must
          # keep naming the newest final one. This is the one place the run
          # decides whether its tag is a pre-release. The step hands that on as
          # its prerelease output, true or false, written before a dry run stops
          # so a dry run writes it too; publish-skills, publish-package-channels,
          # open-winget-pull-request, publish-downloads and
          # microsoft-store-submission, which take final releases alone, are
          # skipped by their if: when it is true, and the log says so here.
          RELEASE_KIND=()
          PRERELEASE=false
          case "$TAG" in
            v*.*.*-*) RELEASE_KIND=(--prerelease --latest=false); PRERELEASE=true ;;
          esac
          printf 'prerelease=%s\n' "$PRERELEASE" >> "$GITHUB_OUTPUT"
          if [ "$PRERELEASE" = "true" ]; then
            echo "publish-plugins: '$TAG' carries a pre-release suffix, so publish-skills, publish-package-channels, open-winget-pull-request, publish-downloads and microsoft-store-submission are skipped on this run: aggrega-skills, the Homebrew tap and the Scoop bucket, winget, the Microsoft Store download and the Microsoft Store submission take final releases alone"
          fi

          if [ "$DRY" = "true" ]; then
            if [ "${#RELEASE_KIND[@]}" -gt 0 ]; then
              echo "publish-plugins (dry-run): '$TAG' carries a pre-release suffix: the release would be a pre-release, never the latest"
            fi
            echo "publish-plugins (dry-run): would create release '$TAG' on $GH_REPO with assets:"
            for asset in "${ASSETS[@]}"; do
              echo "  $(basename "$asset")"
            done
            echo "publish-plugins (dry-run): SHA256SUMS would read:"
            cat "$RELEASE_DIR/SHA256SUMS"
            echo "publish-plugins (dry-run): the release notes would read:"
            printf '%s\n' "$NOTES"
            exit 0
          fi

          # Idempotent on re-run (a manual re-publish of a tag whose release
          # already exists): create the release the first time, otherwise
          # re-upload the assets over the existing ones — unless the release
          # already carries the Windows installer. A signed installer differs
          # from one signing to the next, and the Microsoft Store and an
          # accepted winget manifest pin its versioned address and its bytes,
          # so an installer once attached is never replaced: the re-publish is
          # refused before anything is uploaded, naming the asset, and a
          # changed installer ships under a new release version. The release's
          # assets are read with the GitHub CLI; a release whose assets cannot
          # be read is refused the same way.
          if gh release view "$TAG" >/dev/null 2>&1; then
            if ! attached="$(gh release view "$TAG" --json assets --jq '.assets[].name')"; then
              echo "publish-plugins: could not read which assets release '$TAG' on $GH_REPO carries, so whether it already carries the Windows installer $WINDOWS_SETUP is unknown; nothing was uploaded" >&2
              exit 1
            fi
            while IFS= read -r name; do
              if [ "$name" = "$WINDOWS_SETUP" ]; then
                echo "publish-plugins: release '$TAG' on $GH_REPO already carries the Windows installer $WINDOWS_SETUP, and an installer once attached is never replaced: a newly signed copy has other bytes, while the Microsoft Store and an accepted winget manifest pin that address and its bytes. Nothing was uploaded. Ship a changed installer under a new release version." >&2
                exit 1
              fi
            done <<<"$attached"
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "$TAG" \
              --notes "$NOTES" \
              "${RELEASE_KIND[@]}"
          fi

      - name: Hand SHA256SUMS on to attest
        # The SHA256SUMS the release step wrote and held to the files it
        # attached, as it attached it, uploaded alone as release-checksums: one
        # workflow artifact, read by attest of this same run, which writes the
        # build provenance of every file it lists, on a real publish. A dry run
        # uploads it too, proving the hand-over before a tag exists; attest is
        # skipped there and reads nothing. Deleted by clean-up when the run ends
        # (kept a day at most should clean-up never run).
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-checksums
          path: ${{ env.RELEASE_DIR }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

      - name: Render the Homebrew formula, the Scoop manifest and the winget manifest
        # After the release step, a dry run's included, from the files that
        # step attached, in RELEASE_DIR, and the SHA256SUMS it attached with
        # them, through scripts/render-package-channels.sh at the commit the
        # build job built. The script holds every file there to the list before
        # it reads a digest from it, so the formula and the manifests carry the
        # digests of the bytes the release attached and no other; it computes
        # none of its own, and names each file as the release step does. On a
        # real publish the release exists by now, so the addresses the files
        # name resolve by the time publish-package-channels commits them. The
        # formula and the Scoop manifest, and the version, are handed on as this
        # job's outputs, each file under a delimiter drawn at random for this
        # run. The winget manifest's three files are printed here, and handed on
        # as one more output, written by scripts/open-winget-pull-request.sh
        # --pack, the script that reads it back in open-winget-pull-request; this
        # job sends them nowhere else.
        id: package-channels
        run: |
          set -euo pipefail
          [ -n "${RELEASE_VERSION:-}" ] || { echo "sign-and-publish: the release step recorded no version" >&2; exit 1; }
          aggrega-cli/scripts/render-package-channels.sh "$RELEASE_DIR" "$RELEASE_VERSION" "$CHANNELS_DIR"
          echo "sign-and-publish: the winget manifest for aggrega $RELEASE_VERSION, three files:"
          for file in "$CHANNELS_DIR"/winget/*; do
            echo "--- ${file##*/}"
            cat "$file"
          done
          winget="$(aggrega-cli/scripts/open-winget-pull-request.sh --pack "$CHANNELS_DIR/winget")"
          delimiter="package-channels-$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          {
            printf 'version=%s\n' "$RELEASE_VERSION"
            printf 'formula<<%s\n' "$delimiter"
            awk 1 "$CHANNELS_DIR/aggrega.rb"
            printf '%s\n' "$delimiter"
            printf 'manifest<<%s\n' "$delimiter"
            awk 1 "$CHANNELS_DIR/aggrega.json"
            printf '%s\n' "$delimiter"
            printf 'winget<<%s\n' "$delimiter"
            printf '%s\n' "$winget"
            printf '%s\n' "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Remove this run's directories
        # Whatever the steps above did, so nothing this run received or
        # assembled in the runner's temporary directory is left on the persistent
        # runner for a later run to find; a directory made read-only is made
        # writable first. The hand-over folder, which INPUTS lies in, is
        # clean-up's to remove.
        if: ${{ always() && env.RELEASE_DIR != '' }}
        run: |
          chmod -R u+w -- "$WINDOWS_SIGNED" "$WINDOWS_INSTALLER" "$MACOS_SIGNED" "$MACOS_UNSIGNED" "$RELEASE_DIR" "$CHANNELS_DIR" 2>/dev/null || true
          rm -rf -- "$WINDOWS_SIGNED" "$WINDOWS_INSTALLER" "$MACOS_SIGNED" "$MACOS_UNSIGNED" "$RELEASE_DIR" "$CHANNELS_DIR"

      - name: Remove this run's configuration
        # Whatever the steps above did, so nothing written to this run's
        # configuration directory — the registry credential aggrega login stored
        # in its Docker configuration among it — is left on a persistent runner
        # for a later run to find.
        if: ${{ always() && env.RUN_CONFIG_HOME != '' }}
        run: |
          chmod -R u+w -- "$RUN_CONFIG_HOME" 2>/dev/null || true
          rm -rf -- "$RUN_CONFIG_HOME"

  attest:
    # Writes GitHub's build provenance for every file the release attaches, as
    # the release's SHA256SUMS lists them: one attestation naming each file and
    # its SHA-256, signed keyless with a Sigstore certificate issued for this
    # run's OIDC identity, recorded in the public transparency log and stored
    # with this repository's attestations, where
    # gh attestation verify <file> --repo aggrega-ai/aggrega-cli finds it.
    #
    # It runs on a real publish alone, once sign-and-publish has succeeded:
    # the release exists by then and SHA256SUMS lists exactly what it attached.
    # A dry run releases nothing, so this job is skipped there. The if: names
    # sign-and-publish as having succeeded rather than leaving it to the
    # default, since sign-and-publish may run beside a sign-macos skipped while
    # macOS signing is off.
    #
    # Everything that runs in this job can reach the OIDC token it may mint, so
    # it runs two of GitHub's own actions, each pinned by commit, and nothing
    # else: the artifact download of release-checksums and the attest action,
    # which reads the list and writes the attestation. It names no environment
    # and no secret, checks nothing out and runs on a GitHub-hosted runner, so
    # it shares nothing with the machine the build ran on.
    # check-release-job-isolation.sh admits the attest action only in a job
    # whose steps are the artifact download and the attest action alone,
    # granted exactly the four permissions below, naming no secret and no
    # environment, and running on a GitHub-hosted image it names by a literal
    # label, and refuses it in any other job that may mint the OIDC token; the
    # commit pins are held by zizmor's unpinned-uses audit, which refuses an
    # action not pinned by its full commit.
    #
    # A failed attest cannot be redone for that release: clean-up deletes
    # release-checksums when the run ends, so a re-run of the failed jobs
    # finds it gone, and a re-run of every job is refused at the release step,
    # since the release already carries the Windows installer; the release
    # stays without provenance.
    needs: [sign-and-publish]
    if: >-
      ${{ !cancelled()
      && needs.sign-and-publish.result == 'success'
      && (github.event_name == 'push'
      || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Download SHA256SUMS
        # The list sign-and-publish attached to the release, into the
        # workspace, where the next step reads it.
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-checksums

      - name: Attest every file SHA256SUMS lists
        # Each line of the list, "<SHA-256>  <file name>", is one subject of the
        # attestation, named and digested as the list gives it; the provenance
        # is GitHub's SLSA build provenance for this run.
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: SHA256SUMS

  record-published:
    # Records what sign-and-publish published on aggrega-hub's published branch,
    # the branch the publish workflows alone write and a workspace's sync commit
    # takes into aggrega-hub's main branch: each plugin's reference, version and
    # digest beside the catalog's, and the core plugin entities this run
    # generated and published, at aggrega-catalog/plugin, the path they occupy on
    # the main branch.
    #
    # It runs once sign-and-publish has succeeded, on a dry run too. A dry run
    # publishes nothing, so on it this job runs only the refusal of an App
    # setting that is not set and the mint of its token, which proves the
    # App's client ID and private key: it reads nothing from the hand-over
    # folder, writes nothing and uses the token for nothing. Every other step's
    # if: holds it to a real publish. A job of its own, so the token that
    # writes aggrega-hub shares a job with no other credential but the run's
    # own token, which here reads
    # this repository and nothing more: no registry password, no release token,
    # no permission to mint an OIDC token. It runs no action but checkout and
    # GitHub's own create-github-app-token, and no program but the shell's own
    # utilities, git, the smoke library's list check, and aggrega-hub's own
    # scripts, taken from aggrega-hub itself.
    #
    # On the runner the build ran on, because the entities it records are the
    # ones the build job left in the hand-over folder, read once the folder
    # matches its list. clean-up waits for it.
    # The if: names both jobs it needs as having succeeded rather than leaving
    # it to the default, since sign-and-publish may run beside a sign-macos
    # skipped while macOS signing is off.
    needs: [build, sign-and-publish]
    if: >-
      ${{ !cancelled()
      && needs.build.result == 'success'
      && needs.sign-and-publish.result == 'success' }}
    runs-on: ${{ vars.AGGREGA_RUNNER }}
    environment: release
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Find this run's hand-over folder and make this job's directory
        # The release inputs are read where the build job left them, in this
        # run's hand-over folder, INPUTS, once the step after the checkout has
        # held that folder to its list. The rows this job records are written in
        # a directory of this run's own, RECORD_DIR, made empty here, which the
        # last step removes.
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
        run: |
          set -euo pipefail
          [ -n "$RELEASE_HANDOVER" ] || { echo "record-published: RELEASE_HANDOVER is empty" >&2; exit 1; }
          handover="$(dirname "$RUNNER_TEMP")/$RELEASE_HANDOVER"
          record="$(mktemp -d "$RUNNER_TEMP/record.XXXXXX")"
          printf 'HANDOVER=%s\nINPUTS=%s\nRECORD_DIR=%s\n' \
            "$handover" "$handover/release-inputs" "$record" >> "$GITHUB_ENV"

      - name: Check out the CLI at the commit the build job built
        # For the smoke library's list check only.
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: aggrega-cli
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false

      - name: Hold the hand-over folder to the build job's list
        # Before anything in it is read: every file in this run's hand-over
        # folder must be one SHA256SUMS names, each once, with the SHA-256 it
        # gives, and the list must name nothing else, checked by
        # smoke_check_tree_sums from the repository's own smoke library at the
        # commit the build job built. So the entities recorded are byte for byte
        # the ones the build job generated and sign-and-publish published. A
        # folder that is not here, or anything in it that is neither a file nor
        # a directory, is refused.
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
        run: |
          set -euo pipefail
          if [ ! -d "$HANDOVER" ] || [ ! -O "$HANDOVER" ] || [ ! -f "$HANDOVER/SHA256SUMS" ]; then
            echo "record-published: this run's hand-over folder $HANDOVER, with its list, is not on this machine: the build job of this run attempt left none here. sources, build, sign-windows, sign-and-publish, record-published and clean-up run on the one machine AGGREGA_RUNNER names, in one attempt; re-run every job, not only the failed ones" >&2
            exit 1
          fi
          . aggrega-cli/scripts/lib/platform-smoke-common.sh
          smoke_require_bash
          smoke_check_tree_sums "$HANDOVER"

      - name: Refuse an App setting that is not set
        # Before the token is minted, on a dry run too: the App's client ID and
        # its private key must both be set, and each that is not is named. The
        # key reaches this step only as whether it is set, never as its value.
        env:
          HUB_PUBLISHED_APP_CLIENT_ID: ${{ vars.HUB_PUBLISHED_APP_CLIENT_ID }}
          PRIVATE_KEY_SET: ${{ secrets.HUB_PUBLISHED_APP_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$HUB_PUBLISHED_APP_CLIENT_ID" ] || missing+=("the variable HUB_PUBLISHED_APP_CLIENT_ID")
          [ "$PRIVATE_KEY_SET" = true ] || missing+=("the secret HUB_PUBLISHED_APP_PRIVATE_KEY")
          if [ "${#missing[@]}" -gt 0 ]; then
            for setting in "${missing[@]}"; do
              echo "record-published: $setting is not set" >&2
            done
            echo "record-published: the token that writes aggrega-hub cannot be minted without the ${#missing[@]} setting(s) above: the App's client ID is read as a variable of the release environment, and its private key as a secret of it" >&2
            exit 1
          fi
          echo "record-published: the App's client ID and private key are set"

      - name: Mint the token that writes aggrega-hub
        # A GitHub App installation token for aggrega-hub alone, asking for
        # write access to its contents and nothing else; the App is installed
        # on aggrega-hub alone, and a ruleset there admits only it and
        # aggrega-hub's own workflows as writers of the published branch. The
        # App's private key is handed to this action alone, the step before
        # reading only whether it is set, and the action revokes the token when
        # the job ends; an installation token expires an hour after it is
        # minted. On a dry run too, where minting it proves the App's client ID
        # and private key, and nothing uses it.
        id: hub-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.HUB_PUBLISHED_APP_CLIENT_ID }}
          private-key: ${{ secrets.HUB_PUBLISHED_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: aggrega-hub
          permission-contents: write

      - name: Check out aggrega-hub
        # For its writer, scripts/record-published.sh, and the branch library
        # that writer and this job's row reader share, at the aggrega-hub commit
        # the sources job resolved and checked out, handed on by the build job.
        # The checkout keeps no token: the write below hands it to git through
        # the environment.
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: aggrega-ai/aggrega-hub
          path: aggrega-hub
          ref: ${{ needs.build.outputs.hub_commit }}
          token: ${{ steps.hub-token.outputs.token }}
          persist-credentials: false

      - name: Record what this release published on aggrega-hub's published branch
        # The rows: each published plugin's reference, version and digest, read
        # by aggrega-hub's own row reader, published_rows_from_push, from the
        # "Push complete:" and "Already published:" lines sign-and-publish
        # handed on — the digest exactly as the push computed and published it.
        # They must be one row for each pair the release published, no two for
        # one reference and version, so a hand-over that lost or repeated any
        # refuses here, with nothing written.
        #
        # The tree: aggrega-catalog/plugin becomes exactly the entities the build
        # job generated and sign-and-publish published, and the branch owns it.
        #
        # aggrega-hub's writer makes one commit on top of the branch as the
        # remote holds it and pushes it as a fast-forward, never forcing; a
        # branch another publish moved meanwhile is read again and the commit
        # rebuilt on it. The token reaches the writer's git commands as an
        # Authorization header through git's environment configuration
        # (GIT_CONFIG_COUNT), so it is never placed on a command line or written
        # to the checkout's configuration; a git too old to read that is
        # refused, naming its version, before anything is written.
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
        env:
          HUB_TOKEN: ${{ steps.hub-token.outputs.token }}
          APP_SLUG: ${{ steps.hub-token.outputs.app-slug }}
          PUSH_OUTPUT: ${{ needs.sign-and-publish.outputs.plugin_push_output }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            TAG="$REF_NAME"
          else
            TAG="$DISPATCH_TAG"
          fi

          . aggrega-hub/scripts/lib/published-branch.sh
          printf '%s\n' "$PUSH_OUTPUT" | published_rows_from_push > "$RECORD_DIR/rows.tsv"
          pairs="$(awk 'NF { n++ } END { print n + 0 }' "$INPUTS/plugins/pairs.tsv")"
          rows="$(awk -F'\t' '!seen[$1 FS $2]++ { n++ } END { print n + 0 }' "$RECORD_DIR/rows.tsv")"
          lines="$(awk 'END { print NR }' "$RECORD_DIR/rows.tsv")"
          if [ "$pairs" -eq 0 ] || [ "$rows" -ne "$pairs" ] || [ "$lines" -ne "$rows" ]; then
            echo "record-published: sign-and-publish published $pairs plugin(s), and what it handed on carries $lines row(s) for $rows distinct reference(s) and version(s); nothing was recorded" >&2
            exit 1
          fi
          echo "record-published: $rows plugin(s) to record:"
          awk -F'\t' '{ print "  " $1 ":" $2 " (" $3 ")" }' "$RECORD_DIR/rows.tsv"

          probe="$(GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=recordpublished.probe GIT_CONFIG_VALUE_0=read git config --get recordpublished.probe || true)"
          if [ "$probe" != read ]; then
            echo "record-published: this machine's $(git --version) does not read configuration from GIT_CONFIG_COUNT, which is how the token reaches git without being written to disk; git 2.31 or later does. Nothing was recorded." >&2
            exit 1
          fi
          auth="$(printf 'x-access-token:%s' "$HUB_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          # The commit is authored in the App's name, at a no-reply address.
          author="${APP_SLUG:-aggrega-cli-release}[bot]"
          export GIT_AUTHOR_NAME="$author" GIT_COMMITTER_NAME="$author"
          export GIT_AUTHOR_EMAIL="$author@users.noreply.github.com" GIT_COMMITTER_EMAIL="$author@users.noreply.github.com"

          aggrega-hub/scripts/record-published.sh --rows "$RECORD_DIR/rows.tsv" \
            --tree "aggrega-catalog/plugin=$INPUTS/plugins/entities" \
            --remote origin \
            --message "chore(catalog): record the core plugins aggrega-cli $TAG published"

      - name: Remove this job's directory
        # Whatever the steps above did, on a real publish, so the rows this job
        # wrote are not left on the persistent runner. The hand-over folder is
        # clean-up's to remove.
        if: ${{ always() && env.RECORD_DIR != '' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)) }}
        run: |
          chmod -R u+w -- "$RECORD_DIR" 2>/dev/null || true
          rm -rf -- "$RECORD_DIR"

  publish-skills:
    # Publishes the skills built into the aggrega binary, and the plugin
    # manifests generated beside them, to the public aggrega-skills repository,
    # so an assistant's own skills tool can install the skills from there and an
    # assistant that installs plugins can install it as one, tagged with the
    # release they were generated from. What it publishes is the tree committed
    # at internal/skills/repository, at the commit the build job built, which
    # the build job has held to what the skills package's generator writes: a
    # tree that differs stopped the run there, before anything was published.
    # The tree's dot-folders, where several assistants read their manifests,
    # are published with it: git add -A takes them, as diff -r compares them.
    #
    # It runs once sign-and-publish has succeeded, on a dry run too: a dry run
    # mints the token, which proves the App's client ID and private key, and
    # uses it for nothing, the publishing step printing the tree it would
    # publish and exiting before it reads the token; nothing is read from
    # aggrega-skills and nothing is pushed. When the tag carries a pre-release
    # suffix, a dry run's included, it is skipped: aggrega-skills takes final
    # releases alone, and sign-and-publish's prerelease output, which its if:
    # reads, says the tag is a pre-release. Any other tag that is not a release
    # tag is still refused by the publishing step below. A job of its own, on a
    # GitHub-hosted runner, so the token that writes aggrega-skills shares a
    # job with no other credential but the run's own token, which here reads
    # this repository and nothing more. It runs no action but checkout and
    # GitHub's own create-github-app-token, and no program but git and the
    # shell's own utilities; it compiles nothing, which is why the comparison
    # with the generator runs in the build job. The if: names both jobs it needs as
    # having succeeded rather than leaving it to the default, since
    # sign-and-publish may run beside a sign-macos skipped while macOS signing
    # is off.
    needs: [build, sign-and-publish]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.sign-and-publish.result == 'success' && needs.sign-and-publish.outputs.prerelease != 'true' }}
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out the CLI at the commit the build job built
        # For the committed skills repository tree only.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: aggrega-cli
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false

      - name: Refuse an App setting that is not set
        # Before the token is minted, on a dry run too: the App's client ID and
        # its private key must both be set, and each that is not is named. The
        # key reaches this step only as whether it is set, never as its value.
        env:
          SKILLS_PUBLISH_APP_CLIENT_ID: ${{ vars.SKILLS_PUBLISH_APP_CLIENT_ID }}
          PRIVATE_KEY_SET: ${{ secrets.SKILLS_PUBLISH_APP_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$SKILLS_PUBLISH_APP_CLIENT_ID" ] || missing+=("the variable SKILLS_PUBLISH_APP_CLIENT_ID")
          [ "$PRIVATE_KEY_SET" = true ] || missing+=("the secret SKILLS_PUBLISH_APP_PRIVATE_KEY")
          if [ "${#missing[@]}" -gt 0 ]; then
            for setting in "${missing[@]}"; do
              echo "publish-skills: $setting is not set" >&2
            done
            echo "publish-skills: the token that writes aggrega-skills cannot be minted without the ${#missing[@]} setting(s) above: the App's client ID is read as a variable of the release environment, and its private key as a secret of it" >&2
            exit 1
          fi
          echo "publish-skills: the App's client ID and private key are set"

      - name: Mint the token that writes aggrega-skills
        # On a dry run too, where minting it proves the App's client ID and
        # private key, and the step below exits before it reads the token. A
        # GitHub App installation token for aggrega-skills alone, asking for
        # write access to its contents and nothing else; the App is installed
        # on aggrega-skills alone. The App's private key is handed to this
        # action alone, the step before reading only whether it is set, and the
        # action revokes the token when the job ends; an installation token
        # expires an hour after it is minted.
        id: skills-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.SKILLS_PUBLISH_APP_CLIENT_ID }}
          private-key: ${{ secrets.SKILLS_PUBLISH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: aggrega-skills
          permission-contents: write

      - name: Publish the skills to aggrega-skills, tagged with the release
        # The commit's tree is exactly the checked-out tree, read into a
        # repository of this job's own, so a file the tree no longer has is gone
        # from the published copy too. The commit goes on top of aggrega-skills'
        # main branch as the remote holds it; when that branch already holds
        # this tree, the tag goes on its head and no commit is made. The branch
        # and the tag are pushed in one atomic push, never forced: a branch
        # another push moved meanwhile, or a tag already there, is refused by
        # the remote and nothing is written. A tag already there is read first:
        # naming this tree it is left as it is and the step passes, naming
        # another tree it is refused, since a published tag never moves. The
        # token reaches git as an Authorization header through git's
        # environment configuration (GIT_CONFIG_COUNT), so it is never placed
        # on a command line or written to disk; a git too old to read that is
        # refused, naming its version, before anything is read or written.
        env:
          SKILLS_TOKEN: ${{ steps.skills-token.outputs.token }}
          APP_SLUG: ${{ steps.skills-token.outputs.app-slug }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_DRY_RUN: ${{ inputs.dry_run }}
          DISPATCH_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ needs.build.outputs.commit }}
          SKILLS_REMOTE: https://github.com/${{ github.repository_owner }}/aggrega-skills.git
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            DRY="$DISPATCH_DRY_RUN"
            TAG="$DISPATCH_TAG"
          else
            DRY="false"
            TAG="$REF_NAME"
          fi

          src="$PWD/aggrega-cli/internal/skills/repository"
          if [ ! -f "$src/README.md" ] || [ ! -d "$src/skills" ]; then
            echo "publish-skills: aggrega-cli at $SOURCE_COMMIT holds no skills repository tree at internal/skills/repository; nothing was published" >&2
            exit 1
          fi

          work="$(mktemp -d "$RUNNER_TEMP/skills.XXXXXX")"
          trap 'rm -rf -- "$work"' EXIT
          repo="$work/repo.git"
          git init -q --bare "$repo"
          g() { git --git-dir="$repo" "$@"; }
          (cd "$src" && GIT_INDEX_FILE="$work/index" git --git-dir="$repo" --work-tree=. add -A)
          tree="$(GIT_INDEX_FILE="$work/index" g write-tree)"

          if [ "$DRY" = "true" ]; then
            echo "publish-skills: dry run: would publish this tree from aggrega-cli $SOURCE_COMMIT to $SKILLS_REMOTE, as the main branch tagged ${TAG:-with the release tag}; nothing is pushed:"
            g ls-tree -r "$tree" | awk -F'\t' '{ print "  " $2 }'
            echo "publish-skills: tree $tree"
            exit 0
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "publish-skills: '$TAG' is not a release tag of the form vMAJOR.MINOR.PATCH; nothing was published" >&2
            exit 1
          fi
          if [ -z "$SKILLS_TOKEN" ]; then
            echo "publish-skills: no token for aggrega-skills was minted; nothing was published" >&2
            exit 1
          fi
          probe="$(GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=publishskills.probe GIT_CONFIG_VALUE_0=read git config --get publishskills.probe || true)"
          if [ "$probe" != read ]; then
            echo "publish-skills: this machine's $(git --version) does not read configuration from GIT_CONFIG_COUNT, which is how the token reaches git without being written to disk; git 2.31 or later does. Nothing was published." >&2
            exit 1
          fi
          auth="$(printf 'x-access-token:%s' "$SKILLS_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          # The commit is authored in the App's name, at a no-reply address.
          author="${APP_SLUG:-aggrega-cli-release}[bot]"
          export GIT_AUTHOR_NAME="$author" GIT_COMMITTER_NAME="$author"
          export GIT_AUTHOR_EMAIL="$author@users.noreply.github.com" GIT_COMMITTER_EMAIL="$author@users.noreply.github.com"

          if ! heads="$(g ls-remote "$SKILLS_REMOTE" refs/heads/main "refs/tags/$TAG")"; then
            echo "publish-skills: could not read $SKILLS_REMOTE; nothing was published" >&2
            exit 1
          fi
          main_on_remote=no
          tag_on_remote=no
          while IFS=$'\t' read -r _ ref; do
            case "$ref" in
              refs/heads/main) main_on_remote=yes ;;
              "refs/tags/$TAG") tag_on_remote=yes ;;
            esac
          done <<< "$heads"

          if [ "$tag_on_remote" = yes ]; then
            g fetch -q --no-tags "$SKILLS_REMOTE" "refs/tags/$TAG:refs/published/tag"
            published="$(g rev-parse "refs/published/tag^{tree}")"
            if [ "$published" = "$tree" ]; then
              echo "publish-skills: $TAG is already on aggrega-skills with this tree; nothing to push"
              exit 0
            fi
            echo "publish-skills: $TAG is already on aggrega-skills and names tree $published, not this release's $tree; a published tag is never moved, so nothing was published" >&2
            exit 1
          fi

          parent=""
          if [ "$main_on_remote" = yes ]; then
            g fetch -q --no-tags "$SKILLS_REMOTE" "refs/heads/main:refs/published/main"
            parent="$(g rev-parse refs/published/main)"
          fi
          if [ -n "$parent" ] && [ "$(g rev-parse "$parent^{tree}")" = "$tree" ]; then
            commit="$parent"
            echo "publish-skills: aggrega-skills' main branch already holds this tree; tagging its head $commit"
          else
            message="$(printf 'Publish the Aggrega skills from aggrega-cli %s\n\nGenerated from aggrega-ai/aggrega-cli at %s.\n' "$TAG" "$SOURCE_COMMIT")"
            if [ -n "$parent" ]; then
              commit="$(g commit-tree "$tree" -p "$parent" -m "$message")"
            else
              commit="$(g commit-tree "$tree" -m "$message")"
            fi
            echo "publish-skills: commit $commit on aggrega-skills' main branch, tagged $TAG"
          fi
          g ls-tree -r "$tree" | awk -F'\t' '{ print "  " $2 }'
          g push --atomic "$SKILLS_REMOTE" "$commit:refs/heads/main" "$commit:refs/tags/$TAG"
          echo "publish-skills: published $TAG to aggrega-skills"

  publish-package-channels:
    # Commits the Homebrew formula and the Scoop manifest sign-and-publish
    # rendered from this release's own files: Formula/aggrega.rb to the
    # Homebrew tap, so `brew install aggrega-ai/tap/aggrega` installs this
    # release, and bucket/aggrega.json to the Scoop bucket, so
    # `scoop install aggrega` does once the bucket is added. Each file is
    # written into its repository's main branch as the remote holds it, every
    # other file there kept, in one commit pushed as a fast-forward and never
    # forced: a branch another push moved meanwhile is refused by the remote,
    # and nothing is written there. A file already there unchanged is left as
    # it is and nothing is pushed; so is one naming a later release, so that
    # publishing an earlier tag again never takes a channel back to it.
    #
    # It runs once sign-and-publish has succeeded, on a dry run too: a dry run
    # mints the token, which proves the App's client ID and private key, and
    # uses it for nothing, the commit step printing both files and where each
    # would go and exiting before it reads the token; nothing is read from
    # either repository and nothing is pushed. When the tag carries a
    # pre-release suffix, a dry run's included, it is skipped: the tap and the
    # bucket take final releases alone, and sign-and-publish's prerelease
    # output, which its if: reads, says the tag is a pre-release. Any other tag
    # that is not a release tag is still refused by the commit step below. A
    # job of its own, on a GitHub-hosted runner, so the token that writes the
    # two repositories shares a job with no other credential. It checks
    # nothing out, since what it commits reaches it as sign-and-publish's
    # outputs, and runs no action but GitHub's own create-github-app-token and
    # no program but git and the shell's own utilities.
    #
    # The two repositories' names are written once, in the workflow's env,
    # which the token step and the commit step both read.
    #
    # The if: names the job it needs as having succeeded rather than leaving
    # it to the default, since sign-and-publish may run beside a sign-macos
    # skipped while macOS signing is off.
    needs: [sign-and-publish]
    if: ${{ !cancelled() && needs.sign-and-publish.result == 'success' && needs.sign-and-publish.outputs.prerelease != 'true' }}
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Refuse an App setting that is not set
        # Before the token is minted, on a dry run too: the App's client ID and
        # its private key must both be set, and each that is not is named. The
        # key reaches this step only as whether it is set, never as its value.
        env:
          PACKAGE_CHANNELS_APP_CLIENT_ID: ${{ vars.PACKAGE_CHANNELS_APP_CLIENT_ID }}
          PRIVATE_KEY_SET: ${{ secrets.PACKAGE_CHANNELS_APP_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$PACKAGE_CHANNELS_APP_CLIENT_ID" ] || missing+=("the variable PACKAGE_CHANNELS_APP_CLIENT_ID")
          [ "$PRIVATE_KEY_SET" = true ] || missing+=("the secret PACKAGE_CHANNELS_APP_PRIVATE_KEY")
          if [ "${#missing[@]}" -gt 0 ]; then
            for setting in "${missing[@]}"; do
              echo "publish-package-channels: $setting is not set" >&2
            done
            echo "publish-package-channels: the token that writes the tap and the bucket cannot be minted without the ${#missing[@]} setting(s) above: the App's client ID is read as a variable of the release environment, and its private key as a secret of it" >&2
            exit 1
          fi
          echo "publish-package-channels: the App's client ID and private key are set"

      - name: Mint the token that writes the tap and the bucket
        # On a dry run too, where minting it proves the App's client ID and
        # private key, and the step below exits before it reads the token. A
        # GitHub App installation token for the tap and the bucket alone,
        # asking for write access to their contents and nothing else; the App
        # is installed on those two repositories alone. The App's private key
        # is handed to this action alone, the step before reading only whether
        # it is set, and the action revokes the token when the job ends; an
        # installation token expires an hour after it is minted.
        id: channels-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.PACKAGE_CHANNELS_APP_CLIENT_ID }}
          private-key: ${{ secrets.PACKAGE_CHANNELS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ env.HOMEBREW_TAP_REPOSITORY }},${{ env.SCOOP_BUCKET_REPOSITORY }}
          permission-contents: write

      - name: Commit the formula to the tap and the manifest to the bucket
        # The formula and the manifest are written exactly as sign-and-publish
        # rendered them. On a real publish the tag must be a release tag, and
        # the version the binaries carry must be the tag's, or nothing is
        # committed. For each repository, its main branch is read as the remote
        # holds it; the one file is put into that branch's tree, every other
        # file kept, and the commit pushed on top of it. A repository with no
        # main branch yet receives a first commit holding that file alone. The
        # token reaches git as an Authorization header through git's
        # environment configuration (GIT_CONFIG_COUNT), so it is never placed
        # on a command line or written to disk; a git too old to read that is
        # refused, naming its version, before anything is read or written.
        env:
          CHANNELS_TOKEN: ${{ steps.channels-token.outputs.token }}
          APP_SLUG: ${{ steps.channels-token.outputs.app-slug }}
          FORMULA: ${{ needs.sign-and-publish.outputs.homebrew_formula }}
          MANIFEST: ${{ needs.sign-and-publish.outputs.scoop_manifest }}
          RELEASE_VERSION: ${{ needs.sign-and-publish.outputs.release_version }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_DRY_RUN: ${{ inputs.dry_run }}
          DISPATCH_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            DRY="$DISPATCH_DRY_RUN"
            TAG="$DISPATCH_TAG"
          else
            DRY="false"
            TAG="$REF_NAME"
          fi

          if [ -z "$FORMULA" ] || [ -z "$MANIFEST" ] || [ -z "$RELEASE_VERSION" ]; then
            echo "publish-package-channels: sign-and-publish handed on no formula, manifest or version; nothing was committed" >&2
            exit 1
          fi
          work="$(mktemp -d "$RUNNER_TEMP/channels.XXXXXX")"
          trap 'rm -rf -- "$work"' EXIT
          printf '%s\n' "$FORMULA" > "$work/aggrega.rb"
          printf '%s\n' "$MANIFEST" > "$work/aggrega.json"

          if [ "$DRY" = "true" ]; then
            echo "publish-package-channels: dry run: would commit Formula/aggrega.rb to https://github.com/$OWNER/$HOMEBREW_TAP_REPOSITORY and bucket/aggrega.json to https://github.com/$OWNER/$SCOOP_BUCKET_REPOSITORY, each on its main branch, for aggrega $RELEASE_VERSION; nothing is pushed."
            echo "publish-package-channels: Formula/aggrega.rb would read:"
            cat "$work/aggrega.rb"
            echo "publish-package-channels: bucket/aggrega.json would read:"
            cat "$work/aggrega.json"
            exit 0
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "publish-package-channels: '$TAG' is not a release tag of the form vMAJOR.MINOR.PATCH; nothing was committed" >&2
            exit 1
          fi
          if [ "$TAG" != "v$RELEASE_VERSION" ]; then
            echo "publish-package-channels: the release tag is $TAG, but its binaries carry the version $RELEASE_VERSION; nothing was committed" >&2
            exit 1
          fi
          if [ -z "$CHANNELS_TOKEN" ]; then
            echo "publish-package-channels: no token for the tap and the bucket was minted; nothing was committed" >&2
            exit 1
          fi
          probe="$(GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=packagechannels.probe GIT_CONFIG_VALUE_0=read git config --get packagechannels.probe || true)"
          if [ "$probe" != read ]; then
            echo "publish-package-channels: this machine's $(git --version) does not read configuration from GIT_CONFIG_COUNT, which is how the token reaches git without being written to disk; git 2.31 or later does. Nothing was committed." >&2
            exit 1
          fi
          auth="$(printf 'x-access-token:%s' "$CHANNELS_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          # The commit is authored in the App's name, at a no-reply address.
          author="${APP_SLUG:-aggrega-cli-release}[bot]"
          export GIT_AUTHOR_NAME="$author" GIT_COMMITTER_NAME="$author"
          export GIT_AUTHOR_EMAIL="$author@users.noreply.github.com" GIT_COMMITTER_EMAIL="$author@users.noreply.github.com"
          message="$(printf 'aggrega %s\n\nWritten by the release https://github.com/%s/aggrega-cli/releases/tag/%s.\n' "$RELEASE_VERSION" "$OWNER" "$TAG")"

          # commit_file <repository> <path in it> <file>
          commit_file() {
            local repo="$1" path="$2" file="$3"
            local remote="https://github.com/$OWNER/$repo.git"
            local git_dir="$work/$repo.git" index="$work/$repo.index" current="$work/$repo.current"
            local heads parent="" published="" newest blob tree commit
            local -a parents=()
            git init -q --bare "$git_dir"
            if ! heads="$(git --git-dir="$git_dir" ls-remote "$remote" refs/heads/main)"; then
              echo "publish-package-channels: could not read $remote; nothing was committed there" >&2
              return 1
            fi
            if [ -n "$heads" ]; then
              git --git-dir="$git_dir" fetch -q --no-tags "$remote" "refs/heads/main:refs/published/main"
              parent="$(git --git-dir="$git_dir" rev-parse refs/published/main)"
              parents=(-p "$parent")
              if git --git-dir="$git_dir" cat-file -e "$parent:$path" 2>/dev/null; then
                git --git-dir="$git_dir" cat-file blob "$parent:$path" > "$current"
                if cmp -s "$current" "$file"; then
                  echo "publish-package-channels: $OWNER/$repo already holds this $path; nothing to push"
                  return 0
                fi
                published="$(awk 'match($0, /\/releases\/download\/v[^\/]+\//) { print substr($0, RSTART + 20, RLENGTH - 21); exit }' "$current")"
                if [ -n "$published" ] && [ "$published" != "$RELEASE_VERSION" ]; then
                  newest="$(printf '%s\n%s\n' "$published" "$RELEASE_VERSION" | sort -V | tail -n 1)"
                  if [ "$newest" != "$RELEASE_VERSION" ]; then
                    echo "publish-package-channels: $OWNER/$repo's $path names aggrega $published, later than $RELEASE_VERSION; it is left as it is"
                    return 0
                  fi
                fi
              fi
            fi
            blob="$(git --git-dir="$git_dir" hash-object -w "$file")"
            if [ -n "$parent" ]; then
              GIT_INDEX_FILE="$index" git --git-dir="$git_dir" read-tree "$parent"
            else
              GIT_INDEX_FILE="$index" git --git-dir="$git_dir" read-tree --empty
            fi
            GIT_INDEX_FILE="$index" git --git-dir="$git_dir" update-index --add --cacheinfo "100644,$blob,$path"
            tree="$(GIT_INDEX_FILE="$index" git --git-dir="$git_dir" write-tree)"
            commit="$(git --git-dir="$git_dir" commit-tree "$tree" "${parents[@]}" -m "$message")"
            git --git-dir="$git_dir" push "$remote" "$commit:refs/heads/main"
            echo "publish-package-channels: committed $path to $OWNER/$repo as $commit, for aggrega $RELEASE_VERSION"
          }

          commit_file "$HOMEBREW_TAP_REPOSITORY" Formula/aggrega.rb "$work/aggrega.rb"
          commit_file "$SCOOP_BUCKET_REPOSITORY" bucket/aggrega.json "$work/aggrega.json"

  open-winget-pull-request:
    # Opens the pull request that adds the winget manifest sign-and-publish
    # rendered from this release's own files to the winget community
    # repository, microsoft/winget-pkgs, so that `winget install
    # Cognitio.Aggrega` installs this release once winget-pkgs accepts it. The
    # three files reach it as sign-and-publish's output and are added as they
    # are: nothing here renders them again.
    #
    # It runs once sign-and-publish has succeeded, on a dry run too, and the
    # script decides what it does: on a real publish with the repository
    # variable AGGREGA_WINGET_PULL_REQUEST exactly true it opens the pull
    # request; with the variable anything else, unset included, it opens
    # nothing and says the gate is off; on a dry run it prints the pull request
    # it would open and opens nothing, whatever the variable is, and checks the
    # token with one read-only request to GitHub's API: GitHub must accept it,
    # and it must be a personal access token (classic) carrying the public_repo
    # scope. With no token set, a dry run refuses when the variable is true and
    # otherwise says so and passes. The first path runs the same check before
    # it syncs anything; the second reads no token and reaches no network.
    # When the tag carries a pre-release suffix, a dry run's included, it is
    # skipped, whatever the variable is: winget takes final releases alone,
    # and sign-and-publish's prerelease output, which its if: reads, says the
    # tag is a pre-release.
    # On a real publish the script still refuses any other version that is not
    # MAJOR.MINOR.PATCH. A job of its own, on a GitHub-hosted runner, so the
    # token that writes the fork shares a job with no other credential but the
    # run's own token, which here reads this repository and nothing more. It
    # runs no action but checkout and no program but gh, git and the shell's
    # own utilities.
    #
    # The fork's name is written once, in this job's env. The if: names both
    # jobs it needs as having succeeded rather than leaving it to the default,
    # since sign-and-publish may run beside a sign-macos skipped while macOS
    # signing is off.
    needs: [build, sign-and-publish]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.sign-and-publish.result == 'success' && needs.sign-and-publish.outputs.prerelease != 'true' }}
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      WINGET_PKGS_FORK: ${{ github.repository_owner }}/winget-pkgs

    steps:
      - name: Check out the CLI at the commit the build job built
        # For scripts/open-winget-pull-request.sh only.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: aggrega-cli
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false

      - name: Open the winget pull request
        # The script syncs the fork with winget-pkgs, pushes a branch adding the
        # three files under the folder winget-pkgs keeps them in, never forced,
        # and opens the pull request from it; it stops, opening nothing, when
        # winget-pkgs already holds this version, and refuses a branch of that
        # name already on the fork. On a real publish the tag must be
        # v<version>, the version the files carry. The token reaches gh through
        # GH_TOKEN and git as an Authorization header through git's environment
        # configuration (GIT_CONFIG_COUNT), so it is never placed on a command
        # line or written to disk. Its --help says the rest.
        env:
          WINGET_PULL_REQUEST_TOKEN: ${{ secrets.WINGET_PULL_REQUEST_TOKEN }}
          AGGREGA_WINGET_PULL_REQUEST: ${{ vars.AGGREGA_WINGET_PULL_REQUEST }}
          WINGET_MANIFEST: ${{ needs.sign-and-publish.outputs.winget_manifest }}
          RELEASE_VERSION: ${{ needs.sign-and-publish.outputs.release_version }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_DRY_RUN: ${{ inputs.dry_run }}
          DISPATCH_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            DRY="$DISPATCH_DRY_RUN"
            TAG="$DISPATCH_TAG"
          else
            DRY="false"
            TAG="$REF_NAME"
          fi

          if [ -z "$WINGET_MANIFEST" ] || [ -z "$RELEASE_VERSION" ]; then
            echo "open-winget-pull-request: sign-and-publish handed on no winget manifest or version; nothing was opened" >&2
            exit 1
          fi
          manifest="$(mktemp "$RUNNER_TEMP/winget-manifest.XXXXXX")"
          trap 'rm -f -- "$manifest"' EXIT
          printf '%s\n' "$WINGET_MANIFEST" > "$manifest"
          aggrega-cli/scripts/open-winget-pull-request.sh --manifest "$manifest" \
            --version "$RELEASE_VERSION" --tag "$TAG" --fork "$WINGET_PKGS_FORK" --dry-run "$DRY"

  publish-downloads:
    # Publishes the Windows installer the release attached to the public
    # download bucket, aggrega-downloads, which serves it at
    # https://download.aggrega.ai/aggrega-cli/v<version>/<installer>: the
    # address the Microsoft Store listing installs from. The Store refuses a
    # package address that redirects, and a GitHub release asset always
    # redirects, to a short-lived signed address; the bucket's custom domain
    # answers the versioned address itself, with the file's length, and serves
    # byte ranges.
    #
    # It takes the installer and SHA256SUMS from the GitHub release
    # sign-and-publish created, with gh release download, so the bytes it
    # publishes are the ones the release attaches, and holds the installer to
    # the digest that SHA256SUMS gives it before anything is uploaded. The
    # upload is one PUT to the bucket through R2's S3 endpoint, signed by curl
    # with AWS Signature Version 4 and carrying If-None-Match: *, which R2
    # evaluates atomically against the bucket: the object is created when the
    # key is free, and when it is taken nothing is written and R2 answers 412.
    # So an installer once published is never replaced, as the release step
    # never replaces one once attached: the Store pins the address and its
    # bytes. A taken key passes when the object there is this installer, which
    # makes a re-run safe, and fails otherwise, naming both SHA-256 digests.
    # Last, it downloads the public address in full: it must answer 200 itself,
    # not a redirect, with a Content-Length equal to the installer's size and
    # the bytes SHA256SUMS lists.
    #
    # It runs once sign-and-publish has succeeded, for a final release tag
    # alone, like the other public channels: a pre-release is skipped by its
    # if:, which reads sign-and-publish's prerelease output. The address
    # carries the version, so each release's installer takes an address of its
    # own and leaves every other as it is. On a dry run, where no release
    # exists, it prints the address it would publish and uploads nothing. On a dry run and a real publish
    # alike its first step refuses, naming each, a setting it needs that is not
    # set — the endpoint variable and the two R2 secrets — so a release never
    # skips the Store's download.
    #
    # A job of its own, on a GitHub-hosted runner, so the R2 key pair shares a
    # job with no other credential but the run's own token, which here reads
    # this repository and its release and nothing more. It checks out this
    # repository at the commit the build job built, for the smoke library, whose
    # namer gives the installer's name, whose functions give its object key and
    # public address and hold that address to what the Store needs, and whose
    # reader of SHA-256 lists gives its digest, as in the release step and the
    # package-channel render; it runs no action but checkout and no program but
    # gh, curl and the shell's own utilities. The key pair reaches curl on its
    # standard input, as a line of curl's configuration that the library's
    # smoke_curl_config_quote writes, so it is never placed on a command line or
    # written to disk.
    #
    # The bucket and the installer's media type are written once, in this job's
    # env; the object key and the public address are the smoke library's. The
    # if: names both jobs it needs as having succeeded rather than leaving it to
    # the default, since sign-and-publish may run beside a sign-macos skipped
    # while macOS signing is off.
    needs: [build, sign-and-publish]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.sign-and-publish.result == 'success' && needs.sign-and-publish.outputs.prerelease != 'true' }}
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DOWNLOADS_BUCKET: aggrega-downloads
      INSTALLER_MEDIA_TYPE: application/vnd.microsoft.portable-executable

    steps:
      - name: Refuse a download setting that is not set
        # Before anything is read or uploaded, on a dry run too: R2's S3
        # endpoint and the key pair must be set, and each that is not is named;
        # the endpoint must be an https:// address. The two secrets reach this
        # step only as whether each is set, never as their values.
        env:
          DOWNLOADS_R2_ENDPOINT: ${{ vars.DOWNLOADS_R2_ENDPOINT }}
          ACCESS_KEY_ID_SET: ${{ secrets.DOWNLOADS_R2_ACCESS_KEY_ID != '' }}
          SECRET_ACCESS_KEY_SET: ${{ secrets.DOWNLOADS_R2_SECRET_ACCESS_KEY != '' }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$DOWNLOADS_R2_ENDPOINT" ] || missing+=("the repository variable DOWNLOADS_R2_ENDPOINT")
          [ "$ACCESS_KEY_ID_SET" = true ] || missing+=("the secret DOWNLOADS_R2_ACCESS_KEY_ID")
          [ "$SECRET_ACCESS_KEY_SET" = true ] || missing+=("the secret DOWNLOADS_R2_SECRET_ACCESS_KEY")
          if [ "${#missing[@]}" -gt 0 ]; then
            for setting in "${missing[@]}"; do
              echo "publish-downloads: $setting is not set" >&2
            done
            echo "publish-downloads: the Windows installer cannot be published to the download bucket without the ${#missing[@]} setting(s) above: the endpoint is read as a repository variable, and the key pair as secrets of the release environment" >&2
            exit 1
          fi
          case "$DOWNLOADS_R2_ENDPOINT" in
            https://*) ;;
            *)
              echo "publish-downloads: the repository variable DOWNLOADS_R2_ENDPOINT is '$DOWNLOADS_R2_ENDPOINT', not an https:// address; it names R2's S3 endpoint, https://<account ID>.r2.cloudflarestorage.com" >&2
              exit 1
              ;;
          esac
          echo "publish-downloads: the endpoint and the R2 key pair are set"

      - name: Check out the CLI at the commit the build job built
        # For the smoke library only.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: aggrega-cli
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false

      - name: Publish the Windows installer to the download bucket
        # The installer's name, its object key, aggrega-cli/v<version>/<installer>,
        # and its public address are the smoke library's, for the version the
        # release's files carry. On a dry run the step prints the
        # address it would publish and exits before it reads the release or the
        # key pair. On a real publish the tag must be v<version>; the installer
        # and SHA256SUMS are downloaded from the tag's release into a directory
        # of this step's own, and the installer must have the digest SHA256SUMS
        # gives it, or nothing is uploaded. The PUT names the installer's media
        # type and If-None-Match: *; R2 answers 200 when it created the object
        # and 412 when the key was taken, and any other answer fails the step,
        # printing it. Which of the two it was, the installer's name and
        # digest, and its public address reach the next step through the
        # job's environment.
        env:
          DOWNLOADS_R2_ENDPOINT: ${{ vars.DOWNLOADS_R2_ENDPOINT }}
          DOWNLOADS_R2_ACCESS_KEY_ID: ${{ secrets.DOWNLOADS_R2_ACCESS_KEY_ID }}
          DOWNLOADS_R2_SECRET_ACCESS_KEY: ${{ secrets.DOWNLOADS_R2_SECRET_ACCESS_KEY }}
          RELEASE_VERSION: ${{ needs.sign-and-publish.outputs.release_version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_DRY_RUN: ${{ inputs.dry_run }}
          DISPATCH_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            DRY="$DISPATCH_DRY_RUN"
            TAG="$DISPATCH_TAG"
          else
            DRY="false"
            TAG="$REF_NAME"
          fi

          if [ -z "$RELEASE_VERSION" ]; then
            echo "publish-downloads: sign-and-publish handed on no version; nothing was uploaded" >&2
            exit 1
          fi
          . aggrega-cli/scripts/lib/platform-smoke-common.sh
          smoke_require_bash
          installer="$(smoke_release_asset_name windows/amd64 "$RELEASE_VERSION" "$(smoke_target_installer windows/amd64)")"
          key="$(smoke_download_key "$RELEASE_VERSION")"
          url="$(smoke_download_url "$RELEASE_VERSION")"

          if [ "$DRY" = "true" ]; then
            echo "publish-downloads: dry run: would publish $installer from the release $TAG to the bucket $DOWNLOADS_BUCKET as $key, served at $url; nothing is uploaded."
            exit 0
          fi

          if [ "$TAG" != "v$RELEASE_VERSION" ]; then
            echo "publish-downloads: the release tag is $TAG, but its files carry the version $RELEASE_VERSION; nothing was uploaded" >&2
            exit 1
          fi
          work="$(mktemp -d "$RUNNER_TEMP/downloads.XXXXXX")"
          trap 'rm -rf -- "$work"' EXIT
          gh release download "$TAG" --repo "$GH_REPO" --dir "$work" --pattern "$installer" --pattern SHA256SUMS
          if [ ! -f "$work/$installer" ]; then
            echo "publish-downloads: the release $TAG on $GH_REPO carries no $installer; nothing was uploaded" >&2
            exit 1
          fi
          if ! digest="$(smoke_listed_digest "$work/SHA256SUMS" "$installer")"; then
            echo "publish-downloads: the release's SHA256SUMS gives no single digest for $installer; nothing was uploaded" >&2
            exit 1
          fi
          actual="$(sha256sum < "$work/$installer")"
          actual="${actual%% *}"
          if [ "$actual" != "$digest" ]; then
            echo "publish-downloads: $installer as the release $TAG serves it has SHA-256 $actual, but the release's SHA256SUMS lists $digest; nothing was uploaded" >&2
            exit 1
          fi
          size="$(wc -c < "$work/$installer")"
          size="${size//[[:space:]]/}"
          echo "publish-downloads: $installer from the release $TAG has SHA-256 $digest, as SHA256SUMS lists, and $size bytes"

          # The key pair as curl's user option, one configuration line read
          # from standard input, quoted by smoke_curl_config_quote.
          credentials="$(smoke_curl_config_quote "$DOWNLOADS_R2_ACCESS_KEY_ID:$DOWNLOADS_R2_SECRET_ACCESS_KEY")"
          status="$(printf 'user = "%s"\n' "$credentials" | curl --config - \
            --silent --show-error --proto '=https' --connect-timeout 30 --max-time 900 --retry 3 \
            --aws-sigv4 "aws:amz:auto:s3" \
            --upload-file "$work/$installer" \
            --header "Content-Type: $INSTALLER_MEDIA_TYPE" \
            --header "If-None-Match: *" \
            --output "$work/answer" --write-out '%{http_code}' \
            "${DOWNLOADS_R2_ENDPOINT%/}/$DOWNLOADS_BUCKET/$key")"
          case "$status" in
            200)
              outcome=created
              echo "publish-downloads: created $key in the bucket $DOWNLOADS_BUCKET"
              ;;
            412)
              outcome=taken
              echo "publish-downloads: the bucket $DOWNLOADS_BUCKET already holds $key, so nothing was written; the next step holds the object there to this installer"
              ;;
            *)
              echo "publish-downloads: R2 answered the upload of $key to the bucket $DOWNLOADS_BUCKET with HTTP $status, so whether it holds the installer is unknown; R2's answer:" >&2
              cat "$work/answer" >&2 2>/dev/null || true
              echo >&2
              exit 1
              ;;
          esac
          printf 'INSTALLER=%s\nINSTALLER_KEY=%s\nINSTALLER_URL=%s\nINSTALLER_SHA256=%s\nUPLOAD_OUTCOME=%s\n' \
            "$installer" "$key" "$url" "$digest" "$outcome" >> "$GITHUB_ENV"

      - name: Check the installer at its public address
        # On a real publish, the address the Microsoft Store downloads from,
        # held by the smoke library's smoke_check_download to one GET of it in
        # full, following no redirect, which must answer 200, with the bytes
        # SHA256SUMS lists and a Content-Length equal to their number. An
        # answer of 404 is asked again, every 30 seconds for up to eight
        # tries, since the bucket's domain is cached and may still hold an
        # answer given before the object existed. When the upload found the
        # key taken, the digest compared here is the object's that was already
        # there, and a failed check says the bucket already held the key and
        # nothing was replaced.
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          DRY="false"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            DRY="$DISPATCH_DRY_RUN"
          fi
          if [ "$DRY" = "true" ]; then
            echo "publish-downloads: dry run: nothing was uploaded, so no address is checked"
            exit 0
          fi
          for name in INSTALLER INSTALLER_KEY INSTALLER_URL INSTALLER_SHA256 UPLOAD_OUTCOME; do
            if [ -z "${!name:-}" ]; then
              echo "publish-downloads: the upload step recorded no $name; nothing is checked" >&2
              exit 1
            fi
          done
          . aggrega-cli/scripts/lib/platform-smoke-common.sh
          smoke_require_bash
          if ! smoke_check_download "$INSTALLER_URL" "$INSTALLER_SHA256"; then
            if [ "$UPLOAD_OUTCOME" = taken ]; then
              echo "publish-downloads: the bucket $DOWNLOADS_BUCKET already held $INSTALLER_KEY, and the address does not serve this release's $INSTALLER, whose SHA-256 is $INSTALLER_SHA256. The upload creates an object only where none is, so it replaced nothing." >&2
            fi
            exit 1
          fi

  microsoft-store-submission:
    # Submits the Windows installer of the release to Aggrega's Microsoft Store
    # listing, through the Store's submission API for MSI/EXE apps: the
    # listing's one package is pointed at the installer's public address, the
    # one publish-downloads has just checked, and the listing is submitted for
    # certification. The listing's text, images and markets stay as Partner
    # Center holds them. Whether a certified submission goes live by itself or
    # waits for Partner Center's Publish button is the listing's setting, not
    # this job's.
    #
    # It runs .github/scripts/microsoft-store-submission.sh, whose --help gives
    # the whole contract, with the release's version, as sign-and-publish
    # hands it on, and this run's dry-run decision, the one publish-downloads
    # takes. On a dry run it reads the release, the installer's address, the
    # draft's status and its packages, and prints the change it would make,
    # sending no request that writes anything. On a real publish it refuses,
    # naming what to fix, a draft that does not hold exactly one package,
    # changing nothing. A submission already in progress and a draft that holds
    # a newer version also change nothing; the script exits 3 for them, and
    # the job passes with a warning annotation naming this version and a line
    # in the run's summary saying why, and, for a submission in progress, the
    # Submit to the Microsoft Store dispatch to run once it ends. Every other
    # non-zero status fails the job.
    #
    # It runs once publish-downloads has succeeded, for a final release tag
    # alone: a pre-release is skipped by its if:, which reads sign-and-publish's
    # prerelease output, and so is a run in which publish-downloads did not
    # succeed, since the Store must find the installer at its address.
    #
    # A job of its own, on a GitHub-hosted runner, naming the environment
    # microsoft-store rather than release, so the Store credentials share a job
    # with no other credential but the run's own token, which here reads this
    # repository and its release and nothing more. It checks out this
    # repository at the commit the build job built, for the script and the
    # smoke library it reads; it runs no action but checkout and no program but
    # curl, jq, gh and the shell's own utilities, and may not mint an OIDC
    # token. The tenant ID, the client ID and the client secret reach curl on
    # its standard input and are never placed on a command line or written to
    # disk. Two submissions never run at once: the concurrency group is shared
    # with the dispatch workflow. GitHub cancels an older pending job when a
    # newer one joins its group; queue: max lets up to 100 wait in turn
    # instead, and cancel-in-progress: false never cancels one that is running.
    needs: [build, sign-and-publish, publish-downloads]
    if: ${{ !cancelled() && needs.publish-downloads.result == 'success' && needs.sign-and-publish.outputs.prerelease != 'true' }}
    runs-on: ubuntu-latest
    environment: microsoft-store
    timeout-minutes: 50
    concurrency:
      group: microsoft-store-submission
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
      - name: Check out the CLI at the commit the build job built
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false

      - name: Submit the release's installer to the Microsoft Store
        env:
          MICROSOFT_STORE_TENANT_ID: ${{ secrets.MICROSOFT_STORE_TENANT_ID }}
          MICROSOFT_STORE_CLIENT_ID: ${{ secrets.MICROSOFT_STORE_CLIENT_ID }}
          MICROSOFT_STORE_CLIENT_SECRET: ${{ secrets.MICROSOFT_STORE_CLIENT_SECRET }}
          MICROSOFT_STORE_SELLER_ID: ${{ vars.MICROSOFT_STORE_SELLER_ID }}
          MICROSOFT_STORE_PRODUCT_ID: ${{ vars.MICROSOFT_STORE_PRODUCT_ID }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.sign-and-publish.outputs.release_version }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          DRY="false"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            DRY="$DISPATCH_DRY_RUN"
          fi
          if [ -z "$RELEASE_VERSION" ]; then
            echo "microsoft-store-submission: sign-and-publish handed on no version; nothing was submitted" >&2
            exit 1
          fi
          status=0
          bash .github/scripts/microsoft-store-submission.sh --version "$RELEASE_VERSION" --dry-run "$DRY" || status=$?
          if [ "$status" -eq 3 ]; then
            message="the Microsoft Store listing was not updated to $RELEASE_VERSION; the step summary says why; when a submission is in progress, dispatch \"Submit to the Microsoft Store\" with $RELEASE_VERSION once it ends"
            echo "::warning title=Microsoft Store listing not updated::$message"
            echo "$message" >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$status"

  smoke-binaries:
    # Fetches, on a dry run naming smoke_binaries_from, that release's Windows
    # binaries and hands them to windows-smoke as an artifact, saved under the
    # names the smoke inputs give the binaries; on every other run each step is
    # skipped and the job passes at once. It runs on every run, rather than
    # being skipped, because windows-smoke waits for it and runs only once it has
    # succeeded. The download reads
    # this repository's releases with the run's own token; the job runs nothing
    # but the GitHub CLI and the artifact upload, which is why it is a job of its
    # own: windows-smoke runs code a token must not reach. It starts once the
    # credential check has passed, beside the build.
    needs: registry-credential
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download the release binaries named to run in place of this run's own
        if: ${{ inputs.smoke_binaries_from != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SUBSTITUTE_TAG: ${{ inputs.smoke_binaries_from }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/substituted-binaries"
          mkdir -p "$dir"
          version="${SUBSTITUTE_TAG#v}"
          for name in aggrega aggrega-debug aggrega-light; do
            gh release download "$SUBSTITUTE_TAG" -R "$GITHUB_REPOSITORY" \
              -p "$name-$version-windows-amd64.exe" -O "$dir/$name-windows-amd64.exe"
          done
          ls -l "$dir"

      - name: Upload them for windows-smoke
        if: ${{ inputs.smoke_binaries_from != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: substituted-windows-binaries
          path: ${{ runner.temp }}/substituted-binaries
          if-no-files-found: error
          retention-days: 1

  windows-smoke:
    # Runs the Windows binaries the build job built, as sign-windows signed them,
    # on Windows. Cross-compiling proves only that the code compiles for
    # Windows; this job proves that the
    # binaries start, answer, and build what the Linux build builds, byte for
    # byte; that they do what a Windows user does where a Unix-like shell would
    # hide it — place the global configuration with no HOME, write the entity
    # cache under names Windows accepts, work in a path with a space and an
    # accented letter, and keep escape bytes out of redirected output; that
    # the platform splits — file locks, files another process holds open,
    # forward-slash paths, a Unix-socket listen address — behave there; and
    # that Windows itself accepts each binary's signature, from Cognitio S.r.l.
    # and timestamped, on the very bytes sign-windows' SHA-256 list names; and
    # that install.ps1 installs the default binary, under Windows PowerShell and
    # PowerShell 7, from a folder laid out as the release is; and that the
    # Windows installer, as sign-windows-installer signed it, installs aggrega
    # silently for the user into %LOCALAPPDATA%\Programs\aggrega and onto the
    # user PATH, so a new shell runs it by name, installs over that install,
    # carries and installs only signed files, and uninstalls silently, leaving
    # neither the folder nor the PATH entry; and that winget accepts the winget
    # manifest the release renders, rendered here by the same script from a
    # folder laid out as the release is.
    # Everything it runs comes from the artifacts the build job staged — a
    # registry program among them, which serves on this machine's loopback
    # address alone — sign-windows signed, and sign-windows-installer signed,
    # but for the Python and the two PowerShells the runner image carries, and
    # winget: the image's own, or, where it carries none, the WinGet CLI
    # release scripts/platform-smoke.sh pins, which it fetches from GitHub,
    # holds to the SHA-256 it pins for each file, and installs for the runner's
    # user; it
    # checks out this repository so that each test executable runs from its
    # package directory, and for the install scripts the release attaches, at
    # the commit the artifact records. It holds no secret
    # and reads only this repository, and its one script stops at the first
    # failure, saying what failed. sign-and-publish waits for it, so a failure
    # here publishes nothing. On a dry run naming smoke_binaries_from it runs
    # the binaries smoke-binaries fetched instead, and fails whatever they do.
    #
    # On a decision to skip the signing, which registry-credential makes before
    # anything is built, nothing is signed and sign-windows and
    # sign-windows-installer are
    # skipped: this job then runs the unsigned binaries the build wrote, staged
    # in its inputs, and the installer windows-installer built from them, every
    # check reporting its verdict, the signature checks
    # reported not applicable rather than passed, and fails whatever the others
    # do. sign-and-publish is skipped on that decision, since it needs sign-windows
    # itself, so those binaries go no further.
    #
    # The if: takes the place of the default, which would skip this job whenever
    # sign-windows is skipped. It runs when the run was not cancelled, when
    # registry-credential, build, smoke-binaries and windows-installer
    # succeeded, and when sign-windows and sign-windows-installer each either
    # succeeded or was skipped on a decision of skip; one that failed, or was
    # skipped on any other ground, skips this job. registry-credential is named
    # because a job reads the outputs only of the jobs it names.
    needs: [registry-credential, build, smoke-binaries, sign-windows, windows-installer, sign-windows-installer]
    if: >-
      ${{ !cancelled()
      && needs.registry-credential.result == 'success'
      && needs.build.result == 'success'
      && needs.smoke-binaries.result == 'success'
      && needs.windows-installer.result == 'success'
      && (needs.sign-windows.result == 'success'
      || (needs.sign-windows.result == 'skipped' && needs.registry-credential.outputs.signing == 'skip'))
      && (needs.sign-windows-installer.result == 'success'
      || (needs.sign-windows-installer.result == 'skipped' && needs.registry-credential.outputs.signing == 'skip')) }}
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # This run's signing decision, sign or skip, as registry-credential wrote
      # it: on skip no signed binaries exist, and the unsigned ones run.
      SIGNING: ${{ needs.registry-credential.outputs.signing }}
    defaults:
      run:
        # The shell Git for Windows installs on the runner; the script it runs
        # is bash.
        shell: bash
    steps:
      - name: Keep line endings exactly as committed
        # The comparison and the tests read checked-out files, so the checkout
        # must hold the committed bytes; a Git configured to convert line
        # endings on checkout would hand them different ones.
        run: git config --global core.autocrlf false

      - name: Check out the CLI at the commit the inputs were staged from
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: aggrega-cli
          ref: ${{ needs.build.outputs.smoke_commit }}
          persist-credentials: false

      - name: Download the Windows smoke run's inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-smoke-inputs
          path: ${{ runner.temp }}/windows-smoke

      - name: Download the signed Windows binaries
        # The three binaries sign-windows signed, and SHA256SUMS, its list of
        # them: the binaries every check below runs, and the ones the release
        # attaches. Not on a run whose decision is skip, on which sign-windows
        # signed nothing and uploaded nothing.
        if: ${{ env.SIGNING != 'skip' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-binaries-signed
          path: ${{ runner.temp }}/windows-signed

      - name: Download the signed Windows installer
        # The installer sign-windows-installer signed, and SHA256SUMS, its list
        # of it: the installer the release attaches. Not on a run whose decision
        # is skip.
        if: ${{ env.SIGNING != 'skip' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-installer-signed
          path: ${{ runner.temp }}/windows-installer

      - name: Download the unsigned Windows installer
        # Only on a run whose decision is skip: the installer windows-installer
        # built from the unsigned files the build wrote, with its list.
        if: ${{ env.SIGNING == 'skip' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-installer
          path: ${{ runner.temp }}/windows-installer

      - name: Download the release binaries named to run in place of this run's own
        # Only on a dry run naming smoke_binaries_from: the binaries
        # smoke-binaries fetched from that release.
        if: ${{ inputs.smoke_binaries_from != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: substituted-windows-binaries
          path: ${{ runner.temp }}/substituted-binaries

      - name: Run the Windows binaries and tests
        # The versions, the handshake, the first example and its byte comparison
        # — with a planted one-byte difference shown turning it red — then config
        # init with no HOME, a pull from a registry on this machine into the
        # entity cache and a build from it, a catalog directory named twice, and
        # the chart-backed example compared the same way, all in a path with a
        # space and an accented letter, every command's redirected output free of
        # escape bytes, each check shown refusing a planted fault; then the named
        # tests, any of which skipping or not running fails the step; then the
        # install script, run as irm <url>/install.ps1 | iex under Windows
        # PowerShell and under PowerShell 7 against a release folder this
        # machine serves on its loopback address, each install checked and the
        # user PATH put back after it, and a planted one-byte change to the
        # served binary refused with nothing installed; and last
        # the signatures: each binary must match sign-windows' SHA-256 list, and
        # Windows' own Get-AuthenticodeSignature must report it Valid, signed by
        # Cognitio S.r.l. and timestamped, with the unsigned copy the build wrote
        # shown refused; then the installer, run with /S, run again over its own
        # install, its files' signatures checked the same way, and the
        # uninstaller run with /S, each install and the uninstall checked and
        # the user PATH put back after them; then the winget manifest, rendered
        # by scripts/render-package-channels.sh from a release folder laid out
        # on this machine, which winget validate must accept with no error and
        # no warning but the one a winget gives for a correct schema header
        # naming a manifest version newer than any it carries, and refuse with
        # a planted installer type. On a dry run naming smoke_binaries_from, the binaries
        # downloaded above run instead, the signature check among the checks
        # reporting on them, and the step fails whatever they do. On a run whose
        # decision is skip, the script is told the binaries are unsigned: it runs
        # the ones the build wrote, staged in its inputs, and the installer built
        # from them, every check reporting
        # its verdict, reports the signature checks not applicable rather than
        # passed, and fails whatever the others do.
        # aggrega-cli/scripts/platform-smoke.sh --help says what each check
        # asserts.
        env:
          SUBSTITUTE_TAG: ${{ inputs.smoke_binaries_from }}
        run: |
          set -euo pipefail
          args=(--target windows/amd64 --inputs "$RUNNER_TEMP/windows-smoke" --installer "$RUNNER_TEMP/windows-installer")
          if [ "$SIGNING" = skip ]; then
            args+=(--unsigned)
          else
            args+=(--signed "$RUNNER_TEMP/windows-signed")
          fi
          if [ -n "$SUBSTITUTE_TAG" ]; then
            args+=(--binaries "$RUNNER_TEMP/substituted-binaries")
          fi
          aggrega-cli/scripts/platform-smoke.sh "${args[@]}"

  macos-smoke:
    # Runs the macOS binaries the build job built, as sign-macos signed them and
    # submitted them to Apple for notarization, on macOS: the darwin/arm64
    # ones on an Apple silicon runner and the darwin/amd64 ones on an Intel
    # runner, through the same script and the same checks as windows-smoke but
    # the installer, which the release carries for Windows alone,
    # its configuration check holding macOS's own rule, which reads HOME. It proves
    # that the binaries start, answer, and build what the Linux build builds,
    # byte for byte, and that the platform splits — file locks, files another
    # process holds open, forward-slash paths, a Unix-socket listen address —
    # behave there. The script also refuses a machine whose
    # architecture is not the target's, because a Mac with Apple silicon runs
    # an amd64 binary too, through Rosetta 2. It also proves that install.sh
    # installs the default binary there from a folder laid out as the release
    # is, and that macOS accepts each binary's signature, from the Developer ID
    # Application certificate Apple issued to COGNITIO SRL, team N4DSTL8KLH,
    # with the hardened runtime and a secure timestamp,
    # claiming exactly the entitlements packaging/macos/aggrega.entitlements
    # declares, on the very bytes sign-macos' SHA-256 list names. Apple may not
    # have answered the submission yet when this job runs, so it does not
    # check that the binaries are notarized; notarization-check does,
    # at the end of the run, once Apple has accepted them. Everything it runs
    # comes from the artifacts the build job staged and sign-macos signed for
    # the target, but for the Python, curl and sh the runner image carries; it
    # checks out this repository so that each test executable runs from its
    # package directory, and for the install scripts the release attaches and
    # the entitlements file the signature is held to, at the commit the
    # artifact records. It holds no secret and
    # reads only this repository. sign-and-publish waits for both targets, so a
    # failure on either publishes nothing.
    #
    # On a decision to skip the signing, which registry-credential makes before
    # anything is built, nothing is signed and sign-macos is
    # skipped: this job then runs the unsigned binaries the build wrote, staged
    # in its inputs, every check reporting its verdict, the signature check
    # reported not applicable rather than passed, and fails whatever the others
    # do. sign-and-publish is skipped on that decision, since it needs sign-macos
    # itself, so those binaries go no further.
    #
    # While macOS signing is off — registry-credential's macOS decision
    # unsigned, the repository variable AGGREGA_MACOS_SIGNING not being true —
    # sign-macos is skipped and this job runs the unsigned binaries the build
    # wrote, staged in its inputs, as the ones the release attaches: it stops
    # at the first failure as a signed run does, reports the signature check
    # not applicable, and passes when every other check passed, so
    # sign-and-publish can release them unsigned.
    #
    # The if: takes the place of the default, which would skip this job whenever
    # sign-macos is skipped. It runs when the run was not cancelled, when
    # registry-credential and build succeeded, and when sign-macos either
    # succeeded or was skipped on a macOS decision of skip or unsigned; one
    # that failed, or was skipped on any other ground, skips this job.
    # registry-credential is named because a job reads the outputs only of the
    # jobs it names.
    #
    # macos-15 names GitHub's hosted Apple silicon image and macos-15-intel its
    # hosted Intel image. A label GitHub does not offer leaves its job queued,
    # waiting for a runner that never comes, and sign-and-publish waiting behind
    # it, so a job that never starts is the sign that its label needs changing
    # here.
    needs: [registry-credential, build, sign-macos]
    if: >-
      ${{ !cancelled()
      && needs.registry-credential.result == 'success'
      && needs.build.result == 'success'
      && (needs.sign-macos.result == 'success'
      || (needs.sign-macos.result == 'skipped'
      && (needs.registry-credential.outputs.macos_signing == 'skip'
      || needs.registry-credential.outputs.macos_signing == 'unsigned'))) }}
    name: macos-smoke (${{ matrix.target }})
    strategy:
      # Each target is a proof of its own: one failing does not cancel the other.
      fail-fast: false
      matrix:
        include:
          - target: darwin/arm64
            artifact: macos-smoke-inputs-darwin-arm64
            signed: macos-binaries-signed-darwin-arm64
            runner: macos-15
          - target: darwin/amd64
            artifact: macos-smoke-inputs-darwin-amd64
            signed: macos-binaries-signed-darwin-amd64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # This run's macOS decision, sign, unsigned or skip, as
      # registry-credential wrote it: on unsigned or skip no signed binaries
      # exist, and the unsigned ones run.
      MACOS_SIGNING: ${{ needs.registry-credential.outputs.macos_signing }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line endings exactly as committed
        # The comparison and the tests read checked-out files, so the checkout
        # must hold the committed bytes whatever the runner's Git is configured
        # to do with line endings.
        run: git config --global core.autocrlf false

      - name: Check out the CLI at the commit the inputs were staged from
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: aggrega-cli
          ref: ${{ needs.build.outputs.macos_smoke_commit }}
          persist-credentials: false

      - name: Download the macOS smoke run's inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/macos-smoke

      - name: Download the signed macOS binaries
        # The three binaries sign-macos signed for this target, and SHA256SUMS,
        # its list of them: the binaries every check below runs, and the ones
        # the release attaches. Only on a run whose macOS decision is sign: on
        # any other, sign-macos signed nothing and uploaded nothing.
        if: ${{ env.MACOS_SIGNING == 'sign' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ matrix.signed }}
          path: ${{ runner.temp }}/macos-signed

      - name: Provide a bash the smoke script can run under
        # The smoke script needs bash 4.3 or later, and the bash macOS ships is
        # older. The script's own check decides: when the bash on PATH passes
        # it, nothing is installed; otherwise Homebrew installs a current bash,
        # and its directory goes first on PATH for the steps after this one.
        run: |
          if bash -c '. aggrega-cli/scripts/lib/platform-smoke-common.sh && smoke_require_bash'; then
            echo "bash on PATH: $(command -v bash), $BASH_VERSION"
          else
            HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install bash
            echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          fi

      - name: Run the macOS binaries and tests
        # The machine check, the versions, the handshake, the first example and
        # its byte comparison — with a planted one-byte difference shown turning
        # it red — then config init placed by HOME alone, a pull from a registry
        # on this machine into the entity cache and a build from it, a catalog
        # directory named twice, and the chart-backed example compared the same
        # way, all in a path with a space and an accented letter, every command's
        # redirected output free of escape bytes, each check shown refusing a
        # planted fault; then the named tests, any of which skipping or not
        # running fails the step; then the install script, run as
        # curl -fsSL <url>/install.sh | sh against a release folder this machine
        # serves on its loopback address, and a planted one-byte change to the
        # served binary refused with nothing installed; and last the
        # signatures: each binary must match sign-macos' SHA-256 list, macOS's
        # own codesign must accept it and report it signed with the Developer ID
        # Application certificate of COGNITIO SRL, team N4DSTL8KLH, as the smoke
        # library states it, hardened and timestamped, claiming exactly the
        # entitlements the checkout's entitlements file declares, with the
        # unsigned copy the build wrote shown refused. On a run whose macOS
        # decision is sign, the script is told the notarization is pending,
        # so the signed binaries' notarization is not checked here, since Apple
        # may not have accepted them yet: notarization-check does, once it
        # has. On a run whose
        # macOS decision is skip, the script is told the binaries are unsigned:
        # it runs the ones the build wrote, staged in its inputs, every check
        # reporting its verdict, reports the signature check not applicable
        # rather than passed, and fails whatever the others do. On a run whose
        # macOS decision is unsigned, it is told the release ships them so: it
        # runs the same ones, stops at the first failure, reports the signature
        # check not applicable, and passes when every other check passed.
        # aggrega-cli/scripts/platform-smoke.sh --help says what each check
        # asserts.
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          args=(--target "$TARGET" --inputs "$RUNNER_TEMP/macos-smoke")
          case "$MACOS_SIGNING" in
            sign) args+=(--signed "$RUNNER_TEMP/macos-signed" --notarization-pending) ;;
            unsigned) args+=(--ships-unsigned) ;;
            skip) args+=(--unsigned) ;;
            *) echo "macos-smoke: the macOS signing decision is '$MACOS_SIGNING', not sign, unsigned or skip" >&2; exit 1 ;;
          esac
          aggrega-cli/scripts/platform-smoke.sh "${args[@]}"

  linux-smoke:
    # Runs the ARM Linux binaries the build job built, on an ARM Linux machine,
    # through the same script and the same checks as macos-smoke: the machine
    # check, the versions, the handshake, both examples compared byte for byte
    # with the build machine's, config init placed by HOME alone, the entity
    # cache, the catalog named twice, the escape check, and the named tests, its
    # configuration check holding the Linux rule, which reads HOME and places the
    # caches under its .cache. It proves that the binaries start, answer, and
    # build what the x86-64 Linux build builds, byte for byte, on the other
    # architecture. The script refuses a machine whose architecture is not the
    # target's, because a Linux machine with an emulator registered runs a
    # binary of another architecture too. It also proves that install.sh
    # installs the default binary there from a folder laid out as the release
    # is. Everything it runs comes from the artifact the build job staged, but
    # for the Python, curl and sh the runner image carries; it checks out this
    # repository so that each test executable runs from its package directory,
    # and for the install scripts the release attaches, at the commit the
    # artifact records. It holds no secret and reads only this repository.
    # sign-and-publish waits for it, so a failure here publishes nothing.
    #
    # ubuntu-24.04-arm names GitHub's hosted ARM Linux image. A label GitHub does
    # not offer leaves the job queued, waiting for a runner that never comes, and
    # sign-and-publish waiting behind it, so a job that never starts is the sign
    # that its label needs changing here. The smoke script checks for every tool
    # it runs and names one the image does not carry.
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line endings exactly as committed
        # The comparison and the tests read checked-out files, so the checkout
        # must hold the committed bytes whatever the runner's Git is configured
        # to do with line endings.
        run: git config --global core.autocrlf false

      - name: Check out the CLI at the commit the inputs were staged from
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: aggrega-cli
          ref: ${{ needs.build.outputs.linux_smoke_commit }}
          persist-credentials: false

      - name: Download the ARM Linux smoke run's inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-smoke-inputs-linux-arm64
          path: ${{ runner.temp }}/linux-smoke

      - name: Run the ARM Linux binaries and tests
        # The machine check, the versions, the handshake, the first example and
        # its byte comparison — with a planted one-byte difference shown turning
        # it red — then config init placed by HOME alone, a pull from a registry
        # on this machine into the entity cache and a build from it, a catalog
        # directory named twice, and the chart-backed example compared the same
        # way, all in a path with a space and an accented letter, every command's
        # redirected output free of escape bytes, each check shown refusing a
        # planted fault; then the named tests, any of which skipping or not
        # running fails the step; then the install script, run as
        # curl -fsSL <url>/install.sh | sh against a release folder this machine
        # serves on its loopback address, and a planted one-byte change to the
        # served binary refused with nothing installed.
        # aggrega-cli/scripts/platform-smoke.sh --help says what each check
        # asserts.
        run: |
          set -euo pipefail
          aggrega-cli/scripts/platform-smoke.sh --target linux/arm64 --inputs "$RUNNER_TEMP/linux-smoke"

  notarization-check:
    # Reads Apple's answer to the notarization submission sign-macos made, at
    # the end of the run, once the publish jobs its needs: names have ended:
    # sign-macos submits the signed binaries without waiting, so the release
    # does not sit on a macOS machine while Apple works, and a bare executable
    # carries no stapled ticket, so the binaries may be published before Apple
    # answers — macOS fetches each one's ticket online once Apple accepts the
    # submission.
    #
    # It asks once, with Apple's own notarytool info, and polls nothing:
    #   Accepted     it prints Apple's log of the submission, then holds each
    #                signed binary, as sign-macos handed them on and held to
    #                its SHA-256 lists, to Apple's codesign: its first authority
    #                and its team must be exactly the release's Developer ID,
    #                and `codesign --verify --strict -vvvv -R=notarized
    #                --check-notarization` must exit 0 and report the explicit
    #                requirement satisfied, codesign looking the ticket up
    #                online; a copy with its signature removed must be refused
    #                by the same check, so its passes prove something. Any
    #                failure fails the job. This is the check macos-smoke
    #                leaves to it. Gatekeeper's spctl --assess is not asked: it
    #                judges apps, disk images and installer packages, and
    #                refuses a bare executable as not an app whatever its
    #                notarization.
    #   In Progress  it writes a warning, in the log and the run's summary,
    #                naming the submission and the notarytool info command that
    #                reads it later, and passes: the binaries are published
    #                signed, and macOS fetches the ticket once Apple accepts.
    #   Invalid or Rejected
    #                it prints Apple's log and fails, saying the published macOS
    #                binaries are not notarized.
    # Any other answer, or none, fails it, naming the submission.
    #
    # It runs on a real publish and a dry run alike — a dry run submits the
    # binaries too — whenever sign-macos succeeded and gave a submission ID,
    # whatever the jobs after sign-macos did; it is skipped with sign-macos.
    # It is a job of its own so that it runs after those publish jobs, and so
    # that the notary key shares a job with nothing but Apple's own programs:
    # it holds the key, written as sign-macos writes it, readable by the
    # runner's user alone, into the runner's temporary directory and removed
    # when the step that reads Apple's answer ends, and the key's two
    # identifiers, given as arguments; no other secret, not the run's token,
    # and no permission. It checks nothing out and runs no repository script,
    # so the expected identity is stated in its env:, in step with the smoke
    # library's smoke_macos_developer_id and smoke_macos_team, and the
    # notarization report is held to the lines the library's
    # smoke_check_notarization_report holds it to, in a copy written here;
    # scripts/check-release-job-isolation.sh refuses the workflow should this
    # job name another Apple secret or run anything but Apple's programs, the
    # shell's own utilities and the artifact download pinned by commit.
    # clean-up waits for it, so the artifacts it reads are still there.
    needs: [sign-macos, sign-and-publish, record-published, publish-skills, publish-package-channels, open-winget-pull-request, publish-downloads, microsoft-store-submission]
    if: >-
      ${{ !cancelled()
      && needs.sign-macos.result == 'success'
      && needs.sign-macos.outputs.notary_submission_id != '' }}
    # macos-15 names GitHub's hosted Apple silicon image, the one sign-macos
    # runs on.
    runs-on: macos-15
    environment: release
    timeout-minutes: 10
    permissions: {}
    env:
      # The certificate name and the team every macOS binary must be signed
      # with, as Apple issues them, to the registered legal name. The one
      # statement of them is the smoke library's smoke_macos_developer_id and
      # smoke_macos_team; this job may run no repository script, so it states
      # them here too, and a change there is made here.
      MACOS_DEVELOPER_ID: "Developer ID Application: COGNITIO SRL (N4DSTL8KLH)"
      MACOS_TEAM: N4DSTL8KLH
    defaults:
      run:
        # The bash macOS ships, as in sign-macos.
        shell: /bin/bash --noprofile --norc -eo pipefail {0}
    steps:
      - name: Refuse a notary setting that is not set
        # The three settings notarytool reads must be set, and each that is not
        # is named. The key reaches this step only as whether it is set.
        env:
          NOTARY_KEY_SET: ${{ secrets.APPLE_NOTARY_API_KEY != '' }}
          APPLE_NOTARY_API_KEY_ID: ${{ vars.APPLE_NOTARY_API_KEY_ID }}
          APPLE_NOTARY_API_ISSUER_ID: ${{ vars.APPLE_NOTARY_API_ISSUER_ID }}
        run: |
          missing=()
          [ "$NOTARY_KEY_SET" = true ] || missing+=("the secret APPLE_NOTARY_API_KEY")
          [ -n "$APPLE_NOTARY_API_KEY_ID" ] || missing+=("the variable APPLE_NOTARY_API_KEY_ID")
          [ -n "$APPLE_NOTARY_API_ISSUER_ID" ] || missing+=("the variable APPLE_NOTARY_API_ISSUER_ID")
          if [ "${#missing[@]}" -gt 0 ]; then
            for setting in "${missing[@]}"; do
              echo "notarization-check: $setting is not set" >&2
            done
            echo "notarization-check: Apple's answer to the notarization cannot be read without the ${#missing[@]} setting(s) above" >&2
            exit 1
          fi
          echo "notarization-check: the notary key and its two identifiers are set"

      - name: Ask Apple how the notarization submission stands
        # One notarytool info call for the submission sign-macos made, and,
        # on Accepted, Invalid or Rejected, one notarytool log call for Apple's
        # log of it, printed. The key is written and removed as in sign-macos.
        id: outcome
        env:
          SUBMISSION_ID: ${{ needs.sign-macos.outputs.notary_submission_id }}
          APPLE_NOTARY_API_KEY: ${{ secrets.APPLE_NOTARY_API_KEY }}
          APPLE_NOTARY_API_KEY_ID: ${{ vars.APPLE_NOTARY_API_KEY_ID }}
          APPLE_NOTARY_API_ISSUER_ID: ${{ vars.APPLE_NOTARY_API_ISSUER_ID }}
        run: |
          re_id='^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'
          if ! [[ $SUBMISSION_ID =~ $re_id ]]; then
            echo "notarization-check: sign-macos gave '$SUBMISSION_ID' as the submission ID, which is no notary submission ID" >&2
            exit 1
          fi
          notary="$RUNNER_TEMP/notarization-check"
          key="$notary/key/AuthKey.p8"
          umask 077
          /bin/mkdir -p "$notary/key"
          trap '/bin/rm -rf -- "$notary/key"' EXIT
          printf '%s\n' "$APPLE_NOTARY_API_KEY" > "$key"
          credentials=(--key "$key" --key-id "$APPLE_NOTARY_API_KEY_ID" --issuer "$APPLE_NOTARY_API_ISSUER_ID")
          later="xcrun notarytool info $SUBMISSION_ID --key <the key's .p8 file> --key-id $APPLE_NOTARY_API_KEY_ID --issuer $APPLE_NOTARY_API_ISSUER_ID"
          print_log() {
            if /usr/bin/xcrun notarytool log "$SUBMISSION_ID" "${credentials[@]}" "$notary/log.json"; then
              echo "Apple's log of submission $SUBMISSION_ID:"
              /bin/cat "$notary/log.json"
              echo
            else
              echo "notarization-check: Apple's log of submission $SUBMISSION_ID could not be fetched" >&2
            fi
          }
          rc=0
          /usr/bin/xcrun notarytool info "$SUBMISSION_ID" "${credentials[@]}" \
            --output-format json > "$notary/info.json" || rc=$?
          /bin/cat "$notary/info.json"
          echo
          status="$(/usr/bin/plutil -extract status raw -o - "$notary/info.json" 2>/dev/null || true)"
          if [ "$rc" != 0 ] || [ -z "$status" ]; then
            echo "notarization-check: Apple's answer to submission $SUBMISSION_ID could not be read (notarytool exited $rc); read it with: $later" >&2
            printf -- '- macOS notarization: the outcome of submission `%s` could not be read; read it with `%s`\n' "$SUBMISSION_ID" "$later" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          case "$status" in
            Accepted)
              print_log
              echo "notarization-check: Apple accepted submission $SUBMISSION_ID; codesign checks each binary's notarization next"
              printf -- '- macOS notarization: Apple accepted submission `%s`\n' "$SUBMISSION_ID" >> "$GITHUB_STEP_SUMMARY"
              ;;
            "In Progress")
              echo "::warning title=macOS notarization pending::Apple has not yet answered submission $SUBMISSION_ID. The macOS binaries are published signed, and macOS fetches each one's ticket online once Apple accepts it. Read the outcome later with: $later"
              printf -- '- macOS notarization: Apple has not yet answered submission `%s`; the binaries are published signed, and macOS fetches the ticket once Apple accepts it. Read the outcome later with `%s`\n' "$SUBMISSION_ID" "$later" >> "$GITHUB_STEP_SUMMARY"
              ;;
            Invalid|Rejected)
              print_log
              echo "::error title=macOS binaries not notarized::Apple answered submission $SUBMISSION_ID with $status: the macOS binaries this run published, or on a dry run would publish, are not notarized, and Gatekeeper refuses them once downloaded. Apple's log is printed above."
              printf -- '- macOS notarization: Apple answered submission `%s` with %s; the published macOS binaries are NOT notarized\n' "$SUBMISSION_ID" "$status" >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
            *)
              echo "notarization-check: Apple answered submission $SUBMISSION_ID with the status '$status', which is not Accepted, In Progress, Invalid or Rejected; read it with: $later" >&2
              exit 1
              ;;
          esac

      - name: Download the signed darwin/arm64 binaries
        # Only once Apple has accepted the submission: the artifact sign-macos
        # uploaded for darwin/arm64, the binaries it submitted and their list.
        if: ${{ steps.outcome.outputs.status == 'Accepted' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-binaries-signed-darwin-arm64
          path: ${{ runner.temp }}/notarization-check/signed/darwin-arm64

      - name: Download the signed darwin/amd64 binaries
        if: ${{ steps.outcome.outputs.status == 'Accepted' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-binaries-signed-darwin-amd64
          path: ${{ runner.temp }}/notarization-check/signed/darwin-amd64

      - name: Have codesign confirm each binary's signer and notarization
        # Each target's binaries must match sign-macos' SHA-256 list for it.
        # Then, for each, `codesign --display --verbose=2` must report as its
        # first authority exactly MACOS_DEVELOPER_ID and as its team exactly
        # MACOS_TEAM; and `codesign --verify --strict -vvvv -R=notarized
        # --check-notarization`, which looks the ticket up online, must exit 0
        # with a line ending ": explicit requirement satisfied" and no line
        # saying the code failed to satisfy it: the lines the smoke library's
        # smoke_check_notarization_report requires, written here because this
        # job runs no repository script. Last, a copy of one binary with its
        # signature removed must be refused by that same check, so its passes
        # above prove something. Every report is printed.
        if: ${{ steps.outcome.outputs.status == 'Accepted' }}
        run: |
          signed="$RUNNER_TEMP/notarization-check/signed"
          reports="$RUNNER_TEMP/notarization-check/reports"
          /bin/mkdir -p "$reports"
          # notarized <file> <report>: 0 when codesign reports <file> notarized.
          notarized() {
            local rc=0 line satisfied=0 failed=0
            /usr/bin/codesign --verify --strict -vvvv -R=notarized --check-notarization "$1" > "$2" 2>&1 || rc=$?
            /bin/cat "$2"
            while IFS= read -r line || [ -n "$line" ]; do
              line="${line%$'\r'}"
              case "$line" in
                *": explicit requirement satisfied") satisfied=1 ;;
                *"failed to satisfy"*) failed=1 ;;
              esac
            done < "$2"
            [ "$rc" = 0 ] && [ "$satisfied" = 1 ] && [ "$failed" = 0 ]
          }
          bad=0
          count=0
          first=""
          for dir in "$signed"/darwin-*; do
            if ! (cd "$dir" && /usr/bin/shasum -a 256 -c SHA256SUMS); then
              echo "notarization-check: the binaries in ${dir##*/} do not match sign-macos' list of them" >&2
              bad=1
              continue
            fi
            for path in "$dir"/*; do
              name="${path##*/}"
              [ "$name" != SHA256SUMS ] || continue
              [ -n "$first" ] || first="$path"
              printf -- '--- %s: codesign --display\n' "$name"
              /usr/bin/codesign --display --verbose=2 "$path" > "$reports/$name.codesign.txt" 2>&1 || true
              /bin/cat "$reports/$name.codesign.txt"
              authority=""
              team=""
              while IFS= read -r line || [ -n "$line" ]; do
                case "$line" in
                  Authority=*) [ -n "$authority" ] || authority="${line#Authority=}" ;;
                  TeamIdentifier=*) team="${line#TeamIdentifier=}" ;;
                esac
              done < "$reports/$name.codesign.txt"
              if [ "$authority" != "$MACOS_DEVELOPER_ID" ] || [ "$team" != "$MACOS_TEAM" ]; then
                echo "notarization-check: $name is signed by ${authority:-nobody}, team ${team:-none}, not $MACOS_DEVELOPER_ID, team $MACOS_TEAM" >&2
                bad=1
                continue
              fi
              printf -- '--- %s: codesign -R=notarized --check-notarization\n' "$name"
              if ! notarized "$path" "$reports/$name.notarization.txt"; then
                echo "notarization-check: codesign does not report $name notarized" >&2
                bad=1
                continue
              fi
              echo "ok: $name is signed by $MACOS_DEVELOPER_ID and notarized"
              count=$((count + 1))
            done
          done
          if [ -n "$first" ]; then
            stripped="$reports/stripped-${first##*/}"
            /bin/cp "$first" "$stripped"
            /usr/bin/codesign --remove-signature "$stripped"
            echo "The same notarization check over a copy of ${first##*/} with its signature removed must refuse it:"
            if notarized "$stripped" "$reports/stripped.notarization.txt"; then
              echo "notarization-check: the notarization check accepted an unsigned copy, so its passes above prove nothing" >&2
              bad=1
            else
              echo "ok: the notarization check refuses an unsigned copy"
            fi
          fi
          if [ "$bad" != 0 ] || [ "$count" = 0 ]; then
            echo "::error title=macOS binaries not confirmed notarized::Apple accepted the submission, but codesign does not confirm every published macOS binary signed by $MACOS_DEVELOPER_ID and notarized; the reports are printed above"
            exit 1
          fi
          echo "ok: all $count macOS binaries are signed by $MACOS_DEVELOPER_ID and notarized"

      - name: Remove this job's directory
        # Whatever the steps above did: the binaries, codesign's reports,
        # Apple's answers and the notary key's directory.
        if: ${{ always() }}
        run: |
          work="$RUNNER_TEMP/notarization-check"
          /bin/rm -rf -- "$work"
          if [ -e "$work" ]; then
            echo "notarization-check: $work is still there after its removal" >&2
            exit 1
          fi
          echo "ok: no key or binary of this job is left in the runner's temporary directory"

  clean-up:
    # Runs last, once every other job has ended, whatever each did — passed,
    # failed, was skipped or was cancelled — so a run leaves nothing behind it:
    # no artifact on GitHub, whose storage every artifact counts against until
    # it is deleted, and nothing on the runner AGGREGA_RUNNER names, whose disk
    # the build fills. The release's own assets are attached to the GitHub
    # release, not to the run, and nothing here touches them. With
    # AGGREGA_RUNNER unset the run stopped in its first job, before anything was
    # built or uploaded, so this job is skipped then.
    #
    # It may list and delete this run's artifacts (actions: write) and holds
    # nothing else: it cannot read the repository, checks out nothing, runs no
    # action, names no secret, and its token reaches curl on standard input.
    # It touches no container image and no Docker configuration: the run leaves
    # no image in the machine's image store — the build job writes the tooling
    # image to one archive per platform, loads nothing, and removes the
    # emulation's installer image once the image is built, and
    # sign-and-publish's publish script removes every image and reference it
    # loads when it exits, a refusal included.
    needs: [registry-credential, sources, build, sign-windows, windows-installer, sign-windows-installer, sign-macos, sign-and-publish, attest, record-published, publish-skills, publish-package-channels, open-winget-pull-request, publish-downloads, microsoft-store-submission, notarization-check, smoke-binaries, windows-smoke, macos-smoke, linux-smoke]
    if: ${{ always() && vars.AGGREGA_RUNNER != '' }}
    runs-on: ${{ vars.AGGREGA_RUNNER }}
    timeout-minutes: 15
    permissions:
      actions: write
    steps:
      - name: Delete every artifact this run uploaded
        # Lists this run's artifacts through the REST API, a hundred at a time,
        # prints each one's name and size, deletes each, and lists them again
        # until none is left, so the run ends keeping none. The run's token
        # reaches curl on its standard input as a header line, never on its
        # command line. Only an artifact carries a url ending in
        # /actions/artifacts/<id>, a name and a size, so each is read from those,
        # with the whitespace of the answer set aside and no jq. An artifact
        # already gone is reported and passes; any other refusal fails the step,
        # naming the HTTP status.
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ARTIFACTS_URL: ${{ github.api_url }}/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts
          ARTIFACTS_URL: ${{ github.api_url }}/repos/${{ github.repository }}/actions/artifacts
        run: |
          set -euo pipefail
          response="$(mktemp "$RUNNER_TEMP/artifacts.XXXXXX")"
          trap 'rm -f -- "$response"' EXIT
          api() {
            printf 'Authorization: Bearer %s\nAccept: application/vnd.github+json\n' "$GH_TOKEN" |
              curl -sS --retry 3 -X "$1" -H @- -o "$response" -w '%{http_code}' "$2"
          }
          list() {
            local page=1 status body rest n
            local re_url='"url":"[^"]*/actions/artifacts/([0-9]+)"' re_name='"name":"([^"]*)"' re_size='"size_in_bytes":([0-9]+)'
            ids=() names=() sizes=()
            while :; do
              status="$(api GET "$RUN_ARTIFACTS_URL?per_page=100&page=$page")"
              if [ "$status" != 200 ]; then
                echo "clean-up: listing this run's artifacts answered HTTP $status" >&2
                return 1
              fi
              body="$(tr -d '[:space:]' < "$response")"
              n=0
              rest="$body"
              while [[ $rest =~ $re_url ]]; do
                ids+=("${BASH_REMATCH[1]}")
                rest="${rest#*"${BASH_REMATCH[0]}"}"
                n=$((n + 1))
              done
              rest="$body"
              while [[ $rest =~ $re_name ]]; do
                names+=("${BASH_REMATCH[1]}")
                rest="${rest#*"${BASH_REMATCH[0]}"}"
              done
              rest="$body"
              while [[ $rest =~ $re_size ]]; do
                sizes+=("${BASH_REMATCH[1]}")
                rest="${rest#*"${BASH_REMATCH[0]}"}"
              done
              [ "$n" -eq 100 ] || return 0
              page=$((page + 1))
            done
          }

          list || exit 1
          echo "this run uploaded ${#ids[@]} artifact(s):"
          for i in "${!ids[@]}"; do
            if [ "${#names[@]}" -eq "${#ids[@]}" ] && [ "${#sizes[@]}" -eq "${#ids[@]}" ]; then
              echo "  ${names[$i]}, ${sizes[$i]} bytes (id ${ids[$i]})"
            else
              echo "  id ${ids[$i]}"
            fi
          done
          failed=0
          for id in "${ids[@]}"; do
            status="$(api DELETE "$ARTIFACTS_URL/$id")"
            case "$status" in
              204) echo "deleted artifact $id" ;;
              404) echo "artifact $id was already gone" ;;
              *)
                echo "clean-up: deleting artifact $id answered HTTP $status" >&2
                failed=1
                ;;
            esac
          done
          [ "$failed" = 0 ] || exit 1
          for attempt in 1 2 3 4 5; do
            list || exit 1
            if [ "${#ids[@]}" -eq 0 ]; then
              echo "ok: this run keeps no artifact"
              exit 0
            fi
            echo "listed again ($attempt): ${#ids[@]} artifact(s) still shown"
            sleep 3
          done
          echo "clean-up: ${#ids[@]} artifact(s) of this run are still listed after their deletion: ${names[*]:-${ids[*]}}" >&2
          exit 1

      - name: Remove this run's hand-over folder
        # Whatever the steps and jobs before did: the folder the sources job made
        # for this run attempt, made writable first, so no directory made
        # read-only survives. The root that holds every run's folder goes too
        # once it is empty; a folder of another run is left to that run's own
        # clean-up, which may still be to come, and named in the log.
        if: ${{ always() }}
        run: |
          set -euo pipefail
          [ -n "$RELEASE_HANDOVER" ] || { echo "clean-up: RELEASE_HANDOVER is empty" >&2; exit 1; }
          handover="$(dirname "$RUNNER_TEMP")/$RELEASE_HANDOVER"
          root="$(dirname "$handover")"
          if [ -e "$handover" ]; then
            chmod -R u+w -- "$handover"
            rm -rf -- "$handover"
            echo "removed this run's hand-over folder $handover"
          else
            echo "this run attempt left no hand-over folder at $handover"
          fi
          if [ -e "$handover" ]; then
            echo "clean-up: $handover is still there after its removal" >&2
            exit 1
          fi
          [ ! -d "$root" ] || rmdir -- "$root" 2>/dev/null || true
          if [ -d "$root" ]; then
            echo "other runs' hand-over folders remain in $root, each left to its own run's clean-up:"
            ls -la -- "$root"
          fi

      - name: Empty the runner's temporary directory of what the run left there
        # The runner empties its temporary directory itself when every job starts
        # and ends, of everything its user may delete, so what is found here is
        # what it could not remove — a directory made read-only, most often.
        # Each such entry is named, made writable and removed. Entries whose
        # names begin with an underscore are the runner's own, the files it reads
        # this job's step commands from among them, and stay, as does this step's
        # own script. What the runner's user may still not remove is named in a
        # warning.
        if: ${{ always() }}
        run: |
          set -euo pipefail
          shopt -s nullglob dotglob
          left=()
          for entry in "$RUNNER_TEMP"/*; do
            case "${entry##*/}" in _*) continue ;; esac
            [ "$entry" -ef "$0" ] && continue
            left+=("$entry")
          done
          if [ "${#left[@]}" -eq 0 ]; then
            echo "ok: the runner's temporary directory $RUNNER_TEMP holds nothing the run left"
            exit 0
          fi
          echo "left in the runner's temporary directory $RUNNER_TEMP, now removed:"
          remaining=()
          for entry in "${left[@]}"; do
            echo "  ${entry##*/}"
            chmod -R u+w -- "$entry" 2>/dev/null || true
            rm -rf -- "$entry" 2>/dev/null || true
            [ ! -e "$entry" ] || remaining+=("${entry##*/}")
          done
          if [ "${#remaining[@]}" -gt 0 ]; then
            echo "::warning::the runner's user may not remove ${remaining[*]} from $RUNNER_TEMP"
          fi
