apiVersion: aggrega.ai/v1alpha1
kind: Aggregate
metadata:
  name: param-app
  version: "1.0.0"
spec:
  parameters:
    api_port: "3000"
    db:
      type: object
      properties:
        host:
          type: string
        port:
          type: integer
    extra_key:
      type: string
  components:
    api:
      type: core/server:1.0.0
      values:
        port: {{ .parameters.api_port | default "3000" }}
        host: {{ .parameters.db.host }}
