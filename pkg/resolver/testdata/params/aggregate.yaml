#
# Field choice exercises parameter resolution + Sprig template mechanics;
# the specific parameter names are placeholders for any parameter, not
# exemplary authoring of those specific concepts.

apiVersion: aggrega.ai/v1alpha1
kind: Aggregate
metadata:
  name: param-app
  version: "1.0.0"
spec:
  parameters:
    cache_ttl_seconds: "3000"
    db:
      type: object
      properties:
        display_name:
          type: string
        cache_ttl_seconds:
          type: integer
    extra_key:
      type: string
  components:
    api:
      type: core/server:1.0.0
      values:
        cache_ttl_seconds: {{ .parameters.cache_ttl_seconds | default "3000" }}
        display_name: {{ .parameters.db.display_name }}
