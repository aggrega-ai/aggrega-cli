apiVersion: aggrega.ai/v1beta1
kind: Release
metadata:
  name: param-release
  environment: staging
  version: "1.0.0"
spec:
  aggregate: param-app
  manifest: param-manifest
  parameters:
    cache_ttl_seconds: "8080"
    db:
      display_name: staging-db.internal
  boundaries:
    staging:
      directory: ./output
      components:
        api:
          infra:
            replicas: 2
