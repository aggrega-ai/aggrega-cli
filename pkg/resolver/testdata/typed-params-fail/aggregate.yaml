apiVersion: aggrega.ai/v1alpha1
kind: Aggregate
metadata:
  name: typed-params-fail
  version: "1.0.0"
spec:
  parameters:
    api_port:
      type: integer
      min: 1024
      max: 65535
    env:
      type: string
      enum:
        - dev
        - staging
        - prod
  components:
    api:
      type: core/server:1.0.0
      values:
        port: "{{ .parameters.api_port }}"
