#
# Field choice exercises typed-parameter resolution mechanics; the specific
# parameter names (cache_ttl_seconds, display_name) are placeholders for any
# typed parameter, not exemplary authoring of those specific concepts.

apiVersion: aggrega.ai/v1alpha1
kind: Aggregate
metadata:
  name: typed-params-fail
  version: "1.0.0"
spec:
  parameters:
    cache_ttl_seconds:
      type: integer
      min: 1024
      max: 65535
    env:
      type: string
      enum:
        - dev
        - staging
        - prod
  components:
    api:
      type: core/server:1.0.0
      values:
        cache_ttl_seconds: "{{ .parameters.cache_ttl_seconds }}"
