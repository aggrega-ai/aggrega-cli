apiVersion: aggrega.ai/v1alpha1
kind: Recipe
metadata:
  name: helm-api-server
  version: "1.0.0"
spec:
  target: helm
  implements: "core/compute/api-server"
  source: ./test-chart
  provides:
    host: "{{ .context.instance_id }}.svc.cluster.local"
    service_port: "8080"
  locals:
    primary_compute: api
  valuesMapping: '{"image": "api-server:latest", "ports": ["8080:8080"]}'
